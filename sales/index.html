<style>
/* Delardi UI kit. Palette only, radius 0, no shadows, no dark mode. */
:root {
  --navy: #082966; --navy-deep: #001A4A; --slate: #5B6478; --sky: #8FA8CC;
  --mist: #D3DCE9; --card: #EEF1F7; --white: #FFFFFF; --alert: #8C2F2F;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, serif;
  --sans: "Evolventa", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --tap: 44px; --radius: 0;
  /* legacy aliases, literal hex on purpose (qa/ui-foundations.cjs reads them) */
  --page: #FFFFFF; --surface: #FFFFFF; --surface-2: #EEF1F7;
  --ink: #001A4A; --ink-2: #5B6478; --muted: #5B6478;
  --line: #D3DCE9; --grid: #D3DCE9; --border: #D3DCE9;
  --focus: #082966; --critical: #8C2F2F;
}
* { box-sizing: border-box; border-radius: 0; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #FFFFFF; color: var(--navy-deep); font: 15px/1.5 var(--sans); }
:focus-visible { outline: 2px solid #082966; outline-offset: 2px; }
.kit-head :focus-visible { outline-color: #8FA8CC; }
.kit-head .kit-menu :focus-visible { outline-color: #082966; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Header bar */
.kit-head { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 24px; background: var(--navy-deep); color: var(--white); position: relative; z-index: 50; }
.kit-brand { display: inline-flex; align-items: center; min-height: var(--tap); color: var(--white); text-decoration: none; font: 13px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; }
.kit-brand img, .kit-brand svg { display: block; height: 18px; width: auto; }
.kit-rule { width: 1px; align-self: stretch; margin: 12px 0; background: var(--sky); }
.kit-staff { min-width: 0; max-width: 200px; overflow: hidden; text-overflow: ellipsis; color: var(--white); font: 14px/1.2 var(--sans); white-space: nowrap; }
.kit-tool { font: normal 19px/1.2 var(--serif); color: var(--white); }
.kit-spacer { flex: 1 1 auto; }
.kit-head a { color: var(--white); }
.kit-hbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); min-width: var(--tap); padding: 0 16px; background: transparent; color: var(--white); border: 1px solid rgba(143, 168, 204, .45); font: 15px/1 var(--sans); cursor: pointer; text-decoration: none; }
.kit-hbtn:hover { border-color: var(--sky); }
.kit-lang { display: inline-flex; }
.kit-lang .kit-hbtn { padding: 0 12px; min-width: var(--tap); }
.kit-lang .kit-hbtn + .kit-hbtn { border-left-width: 0; }
.kit-lang .kit-hbtn[aria-pressed="true"], .kit-lang .kit-hbtn.on { background: var(--navy); border-color: var(--sky); font-weight: 700; }
.kit-tool-wrap, [data-kit-menu] { position: relative; }
.kit-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 60; min-width: 200px; margin: 0; padding: 0; list-style: none; background: var(--white); color: var(--navy-deep); border: 1px solid var(--mist); border-top: 2px solid var(--navy); }
.kit-menu a, .kit-menu span { display: flex; align-items: center; min-height: var(--tap); padding: 0 16px; color: var(--navy-deep); text-decoration: none; font: 15px/1.5 var(--sans); }
.kit-menu a:hover { background: var(--card); }
.kit-menu [aria-current="page"] { font-weight: 700; color: var(--navy); background: var(--card); }

/* Tabs */
.kit-tabs { display: flex; gap: 28px; padding: 0 24px; background: var(--white); border-bottom: 1px solid var(--mist); }
.kit-tab { display: inline-flex; align-items: center; min-height: 48px; padding: 0; background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--slate); font: 15px/1.5 var(--sans); cursor: pointer; text-decoration: none; }
.kit-tab:hover { color: var(--navy); }
.kit-tab[aria-current="page"] { color: var(--navy); font-weight: 700; border-bottom-color: var(--navy); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; background: var(--white); color: var(--navy); border: 1px solid var(--navy); font: 700 15px/1.2 var(--sans); cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--card); }
.btn.primary { background: var(--navy); color: var(--white); border-color: var(--navy); }
.btn.primary:hover { background: var(--navy-deep); border-color: var(--navy-deep); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--navy); font-weight: 400; text-decoration: underline; }
.btn.quiet:hover { background: var(--card); }
.btn.danger { background: var(--white); color: var(--alert); border-color: var(--alert); }
.btn.danger:hover { background: var(--alert); color: var(--white); }
.btn.big { min-height: 52px; padding: 0 24px; font-size: 17px; }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--card); color: var(--slate); border-color: var(--mist); cursor: not-allowed; text-decoration: none; }

/* Fields */
input, select, textarea { width: 100%; min-height: var(--tap); padding: 8px 12px; background: var(--white); color: var(--navy-deep); border: 1px solid var(--sky); font: 15px/1.5 var(--sans); }
textarea { min-height: 96px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--slate); }
input:disabled, select:disabled, textarea:disabled { background: var(--card); color: var(--slate); border-color: var(--mist); }
input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--alert); border-width: 2px; }
input[type="checkbox"], input[type="radio"] { width: 20px; min-height: 20px; padding: 0; accent-color: var(--navy); }
.lbl { display: block; margin: 0 0 4px; color: var(--slate); font: 700 12px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; }

/* Type */
.title { margin: 0 0 16px; font: normal 28px/1.25 var(--serif); color: var(--navy-deep); }
.h2 { margin: 0 0 12px; font: normal 21px/1.3 var(--serif); color: var(--navy-deep); }
.item { font: normal 17px/1.35 var(--serif); color: var(--navy-deep); overflow-wrap: anywhere; }
.keynum { font: normal 32px/1.1 var(--serif); color: var(--navy-deep); font-variant-numeric: tabular-nums; }
.small { font: 13px/1.45 var(--sans); color: var(--slate); }

/* Table */
.tbl { width: 100%; border-collapse: collapse; font: 15px/1.5 var(--sans); }
.tbl thead th { padding: 12px; background: var(--card); color: var(--slate); text-align: left; font: 700 12px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid var(--mist); }
.tbl tbody tr { height: 48px; }   /* a row height is a minimum in a table; td min-height does nothing */
.tbl td { padding: 12px; border-bottom: 1px solid var(--mist); vertical-align: middle; }
.tbl th.r, .tbl td.r, .tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tbody tr:hover { background: var(--card); }

/* Tags */
.tag { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border: 1px solid var(--navy); color: var(--navy); background: var(--white); font: 700 12px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.tag.act { background: var(--navy); color: var(--white); border-color: var(--navy); }
.tag.info { background: var(--card); color: var(--navy); border-color: var(--card); }
.tag.done { background: var(--white); color: var(--slate); border-color: var(--mist); }
.tag.line { background: var(--white); color: var(--navy); border-color: var(--navy); }
.tag.alert { background: var(--white); color: var(--alert); border-color: var(--alert); }

/* Band and notice */
.band { padding: 12px 24px; background: var(--card); color: var(--navy); font: 13px/1.45 var(--sans); }
.band .lbl { display: inline; margin: 0 12px 0 0; color: var(--navy); }
.notice { padding: 12px 16px; background: var(--card); color: var(--navy); border: 1px solid var(--mist); font: 15px/1.5 var(--sans); }

/* Detail panel (right) */
.panel-wrap { position: fixed; inset: 0; z-index: 100; display: flex; justify-content: flex-end; }
.panel-scrim { position: absolute; inset: 0; background: rgba(0, 26, 74, .4); }
.panel { position: relative; width: 560px; max-width: 100%; height: 100%; overflow-y: auto; padding: 24px; background: var(--white); color: var(--navy-deep); border-top: 2px solid var(--navy); }
@media (max-width: 599px) { .panel { width: 100%; } }

/* Modal (centred) */
.modal-wrap { position: fixed; inset: 0; z-index: 110; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-scrim { position: absolute; inset: 0; background: rgba(0, 26, 74, .4); }
.modal { position: relative; width: 640px; max-width: 100%; max-height: 100%; overflow-y: auto; padding: 24px; background: var(--white); color: var(--navy-deep); border: 1px solid var(--mist); border-top: 2px solid var(--navy); }
.modal.confirm { width: 480px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 120; max-width: calc(100% - 32px); padding: 12px 16px; background: var(--navy-deep); color: var(--white); font: 15px/1.5 var(--sans); }
.toast.err { background: var(--white); color: var(--alert); border: 1px solid var(--alert); }

/* Lock card */
.gate { position: fixed; inset: 0; overflow-y: auto; z-index: 115; min-height: 100vh; display: flex; padding: 24px; background: var(--card); }
.gate-card { margin: auto; width: 100%; max-width: 400px; background: var(--white); border: 1px solid var(--mist); }
.gate-mast { padding: 24px; background: var(--navy-deep); color: var(--white); font: 13px/1.4 var(--sans); letter-spacing: .18em; text-transform: uppercase; }
.gate-card > :not(.gate-mast) { margin-left: 24px; margin-right: 24px; }
.gate-card > :last-child { margin-bottom: 24px; }
.gate-card > .gate-mast + * { margin-top: 24px; }


/* ===========================================================================
   Delardi Sales — the till. The look is the shared UI kit above (ui/kit.css,
   inlined by build.py); what follows is Sales layout only, written with kit
   tokens: palette colours, square corners, no shadows, no dark mode.
   iPad first: every button is a 44 px target, nothing scrolls sideways at
   768 or 1024 wide.
   ========================================================================= */
body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
html { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
.num, .money { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ------------------------------------------------------------------ header */
.top { position: sticky; top: 0; z-index: 40; background: var(--white); }
.top .kit-head { flex-wrap: wrap; }
.top .kit-tabs { overflow-x: auto; }
.top .kit-tab { white-space: nowrap; }
.top .kit-tab:focus-visible { outline-offset: -2px; }
@media (max-width: 900px) {                       /* portrait iPad, RU labels: still one 56 px row */
  .top .kit-head { gap: 8px; padding: 0 16px; }
  .top .kit-head .kit-hbtn { padding: 0 12px; }
  .top .kit-staff { max-width: 120px; }
}
/* training: on every screen, impossible to miss, never alarming */
.band.training-band { border-bottom: 1px solid var(--mist); }

/* ----------------------------------------------------------------- buttons */
.btn { min-width: var(--tap); white-space: nowrap; }
.btn.subtle { background: transparent; color: var(--slate); border-color: transparent; font-weight: 400; }
.btn.subtle:hover { background: var(--card); color: var(--navy); }
.btn.sm { font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--navy); color: var(--white); border-color: var(--navy); }
.linkish {
  background: none; border: 0; padding: 0 4px; margin: 0; font: inherit; color: var(--navy);
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  min-height: var(--tap); min-width: var(--tap); display: inline-flex; align-items: center;
}
.linkish:hover { color: var(--navy-deep); }

/* ------------------------------------------------------------------ screens */
main { padding: 24px 24px 120px; }
.sheet { max-width: 1040px; margin: 0 auto; background: var(--white); border: 1px solid var(--mist); }
.sheet-head {
  display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px;
  padding: 16px 24px; border-bottom: 1px solid var(--mist);
}
.sheet-head h1 { margin: 0; font: normal 28px/1.25 var(--serif); color: var(--navy-deep); }
.sale-head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px 12px; padding: 20px 24px 0; }
.sale-head .title { margin: 0; flex: 1 1 auto; color: var(--navy); }
.sale-head .aside { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.field-stack { display: flex; flex-direction: column; gap: 4px; }
.field-stack .lbl { margin: 0; }
.field-stack select { width: 210px; }
.sheet-head .aside { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
select { padding-right: 28px; }
select.unset { color: var(--slate); }
.needs { border-color: var(--navy); border-width: 2px; }

/* search */
.search { position: relative; padding: 16px 24px 8px; }
.search input { width: 100%; min-height: 52px; font-size: 16px; padding: 0 16px 0 44px; background: var(--white); border-color: var(--navy); }
.search .glass { position: absolute; left: 40px; top: 34px; width: 18px; height: 18px; color: var(--slate); pointer-events: none; }
.search .hint { font-size: 13px; color: var(--slate); margin: 4px 0 0; }
.sugg {
  position: absolute; left: 24px; right: 24px; top: calc(100% - 8px); z-index: 30;
  background: var(--white); border: 1px solid var(--mist); border-top: 2px solid var(--navy);
  padding: 0; max-height: min(480px, 70vh); overflow-y: auto;
}
.sugg .sg-note { padding: 10px 16px; border-top: 1px solid var(--mist); font-size: 13px; color: var(--slate); }
.sg-head, .sg {
  display: grid; grid-template-columns: minmax(0, 1fr) 190px 130px; gap: 16px; align-items: center;
  width: 100%; padding: 12px 16px;
}
.sg-head { padding: 10px 16px; background: var(--card); font: 700 12px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--slate); }
.sg-head .r, .lines-head .r { text-align: right; }
.sg .sg-st { min-width: 0; }
.sg-st .tag { white-space: normal; line-height: 1.3; padding: 4px 8px; max-width: 100%; overflow-wrap: anywhere; }
.sg { text-align: left; border: 0; border-top: 1px solid var(--mist); border-left: 3px solid transparent; background: none; font: inherit; color: inherit; min-height: 56px; }
button.sg:hover, button.sg:focus-visible { background: var(--card); border-left-color: var(--navy); }
.sg .sg-n { display: flex; flex-direction: column; min-width: 0; }
.sg .sg-t { font: normal 17px/1.35 var(--serif); color: var(--navy); overflow-wrap: anywhere; }
.sg .sg-s { font-size: 13px; color: var(--slate); overflow-wrap: anywhere; }
.sg .sg-p { text-align: right; font-variant-numeric: tabular-nums; color: var(--navy-deep); }
.sg.off { cursor: default; }
.sg.off .sg-t, .sg.off .sg-p { color: var(--slate); }

/* lines */
.lines-head {
  display: grid; align-items: end; gap: 16px; margin: 8px 24px 0; padding: 0 0 8px; border-bottom: 1px solid var(--mist);
  grid-template-columns: minmax(0, 1fr) 160px 100px 150px var(--tap);
  font: 700 12px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--slate);
}
@media (min-width: 901px) {
  .l-cell > span:first-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
.lines { list-style: none; margin: 0; padding: 4px 24px 8px; }
.lines .empty { padding: 32px 12px; text-align: center; color: var(--slate); font-size: 15px; }
.lines > .line {
  display: grid; align-items: center; gap: 4px 16px; padding: 16px 0; border-top: 1px solid var(--mist);
  grid-template-columns: minmax(0, 1fr) 160px 100px 150px var(--tap);
  grid-template-areas: "info price disc net x";
}
.lines > .line:first-child { border-top: 0; }
.l-info { grid-area: info; min-width: 0; }
.l-title { font: normal 17px/1.35 var(--serif); color: var(--navy); overflow-wrap: anywhere; }
.l-title .dot { color: var(--slate); font-weight: 400; margin: 0 4px; }
.l-spec { font-size: 13px; color: var(--slate); margin-top: 4px; overflow-wrap: anywhere; }
.l-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 0 12px; font-size: 13px; color: var(--slate); }
.l-serial { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.l-seller-box { display: inline-flex; align-items: center; gap: 8px; }
.l-seller-box select { width: auto; min-height: var(--tap); font-size: 13px; }
.l-price { grid-area: price; }
.l-disc { grid-area: disc; }
.l-cell { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.l-cell > span { font: 700 12px/1.4 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--slate); }
.l-cell input { width: 100%; text-align: right; font-variant-numeric: tabular-nums; }
.l-cell .was { font-size: 12px; color: var(--slate); text-align: right; white-space: nowrap; }
.pct { position: relative; }
.pct input { padding-right: 28px; }
.pct::after { content: "%"; position: absolute; right: 12px; bottom: 12px; color: var(--slate); font-size: 15px; pointer-events: none; }
.l-net { grid-area: net; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 17px; font-weight: 700; color: var(--navy-deep); }
.l-net .eq { color: var(--slate); font-weight: 400; margin-right: 4px; }
.l-x { grid-area: x; }
.l-x, .p-x { font-size: 19px; line-height: 1; color: var(--slate); padding: 0; }
.l-x:hover, .p-x:hover { color: var(--alert); }
.lines-tools { display: flex; justify-content: flex-end; padding: 0 24px 12px; gap: 8px; }

/* foot: client, total, next step */
.foot {
  position: sticky; bottom: 0; z-index: 20;
  display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px;
  padding: 16px 24px; border-top: 1px solid var(--mist); background: var(--white);
}
.client-slot { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; }
.client-slot .lbl { margin: 0; }
.total { margin-left: auto; text-align: right; }
.total .t-l { font: 700 12px/1.4 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--slate); }
.total .keynum { white-space: nowrap; }
.total .keynum small { font: 13px/1.45 var(--sans); color: var(--slate); margin-left: 4px; }

/* payment */
.pay-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.pay-main { padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; border-right: 1px solid var(--mist); }
.pay-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; }
.pay-title .title { margin: 0; color: var(--navy); }
.pay-who { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 16px; background: var(--card); }
.pay-block { display: flex; flex-direction: column; gap: 8px; }
.pay-rows { list-style: none; margin: 0; padding: 0; }
.pay-rows:empty { display: none; }
.pay-row {
  display: grid; grid-template-columns: 160px minmax(0, 1fr) var(--tap); gap: 12px; align-items: center;
  padding: 12px 0; border-top: 1px solid var(--mist);
}
.pay-row:last-child { border-bottom: 1px solid var(--mist); }
.pay-row .p-m { font-weight: 700; font-size: 15px; color: var(--navy-deep); }
.pay-row .p-m small { color: var(--slate); font-weight: 400; margin-left: 8px; font-size: 13px; }
.pay-row input { text-align: right; width: 100%; font-variant-numeric: tabular-nums; font-size: 17px; }
.pay-add { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.card-menu { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 8px; border: 1px solid var(--mist); background: var(--white); }
.cash-notice b { margin-right: 4px; }
.fiscal { display: flex; flex-direction: column; gap: 4px; max-width: 320px; }
.fiscal .lbl { margin: 0; }
.pay-side { background: var(--card); padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ps-lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.ps-line, .ps-row { display: flex; justify-content: space-between; gap: 12px; }
.ps-line > span:first-child, .ps-row > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.ps-line .money, .ps-row b { color: var(--navy-deep); font-variant-numeric: tabular-nums; text-align: right; }
.ps-line .money { white-space: nowrap; }
.ps-block { border-top: 1px solid var(--mist); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.ps-block .lbl { margin: 0; }
.pay-side .keynum { font-size: 34px; color: var(--navy); white-space: nowrap; }
.pay-side .keynum small { font: 13px/1.45 var(--sans); color: var(--slate); margin-left: 4px; }
.ps-sum { display: flex; flex-direction: column; gap: 4px; }
.ps-ok { color: var(--navy); font-weight: 700; }
.ps-ok.short { color: var(--slate); font-weight: 400; }   /* Overpaid by …: a plain fact, not an alarm */
.pay-side .why { font-size: 13px; color: var(--slate); margin-top: auto; min-height: 0; }
.pay-side .btn.big { width: 100%; }
.pay-side #back { width: 100%; }

/* receipt */
.receipt-wrap { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 340px; background: var(--white); border: 1px solid var(--mist); }
.receipt-wrap > .loading { grid-column: 1 / -1; }
.receipt-stage { background: var(--card); padding: 24px; display: flex; justify-content: center; align-items: flex-start; min-width: 0; }
.receipt { width: 100%; max-width: 360px; margin: 0 auto; background: var(--white); color: var(--navy-deep); border: 1px solid var(--mist); overflow: hidden; }
.receipt .rc-mast { background: var(--navy-deep); padding: 16px; display: flex; justify-content: center; }
.receipt .rc-mast img { height: 18px; width: auto; display: block; }
.receipt .rc-body { padding: 16px; font-size: 13px; line-height: 1.5; }
.receipt .rc-line { white-space: pre-wrap; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.receipt .rc-train {
  margin: 0 0 12px; padding: 4px 8px; text-align: center; font: 700 12px/1.4 var(--sans); letter-spacing: .1em;
  background: var(--navy-deep); color: var(--white);
}
.receipt .rc-brand { display: none; }           /* the logo above says it */
.receipt .rc-addr { color: var(--slate); text-align: center; margin-bottom: 12px; }
.receipt .rc-ticket { color: var(--navy-deep); font-weight: 700; }
.receipt .rc-who { color: var(--slate); }
.receipt .rc-who:last-of-type { margin-bottom: 12px; }
.receipt .rc-item { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--sky); font-weight: 700; }
.receipt .rc-detail { font-size: 12px; color: var(--slate); }
.receipt .rc-amt { text-align: right; color: var(--navy-deep); }
.receipt .rc-total {
  margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--sky);
  font: 700 15px/1.4 var(--sans); display: flex; justify-content: space-between;
}
.receipt .rc-pay { display: flex; justify-content: space-between; color: var(--slate); }
.receipt .rc-mono { display: block; width: 26px; margin: 16px auto 0; opacity: .5; }
.saved-panel { padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.saved-panel .lbl { margin: 0; }
.saved-panel .title { margin: 0; color: var(--navy); }
.saved-panel .saved-line { margin: 0; }
.saved-actions { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
.saved-actions .btn { width: 100%; }

.rc-lang { display: flex; align-items: center; gap: 8px; }
.rc-lang .lbl { margin-right: auto; }
.rc-lang-btn { min-width: 56px; }
.rc-lang-btn[aria-pressed="true"] { background: var(--navy); color: var(--white); border-color: var(--navy); }
@media print { .rc-lang { display: none !important; } }
.receipt-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; justify-content: flex-end; }
main > .notice { max-width: 640px; margin: 24px auto; }

/* ----------------------------------------------------------------- dialogs */
.modal-wrap { padding: 24px; }                  /* stacking is the kit's: panel 100, modal 110, gate 115, toast 120 */
.modal-scrim { position: fixed; }
.modal { padding: 0; width: 640px; max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
.modal.confirm, .confirm .modal { width: 480px; }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 24px; border-bottom: 1px solid var(--mist); }
.modal-head h3 { flex: 1; min-width: 0; margin: 0; font: normal 21px/1.3 var(--serif); color: var(--navy-deep); }
.close { font-size: 21px; line-height: 1; }
.modal-body { padding: 16px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-body p { margin: 0; line-height: 1.5; }
.modal-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--mist); }

/* ---------------------------------------------- the client on a sale */
.client-chip { display: inline-flex; align-items: baseline; gap: 4px; padding: 0 4px; font-size: 15px; max-width: 100%; overflow-wrap: anywhere; }
.client-chip .cid, .cc-name .cid { color: var(--slate); font: 13px/1.45 var(--sans); }
.no-crm { font-size: 13px; color: var(--slate); padding: 4px 12px; border: 1px dashed var(--mist); }
/* the client detail panel (kit .panel-wrap / .panel / .panel-scrim, 560 wide from the right) */
.panel.cpbox { display: flex; flex-direction: column; gap: 16px; padding: 0; }
.cp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 8px 4px 24px; border-bottom: 1px solid var(--mist); }
.cp-head .close { width: var(--tap); min-width: var(--tap); padding: 0; font-size: 21px; line-height: 1; }
.cp-body { padding: 0 24px; display: flex; flex-direction: column; gap: 16px; flex: 1 1 auto; }
.cp-body p { margin: 0; }
.cp-foot { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 24px; background: var(--white); border-top: 1px solid var(--mist); }
.cp-foot .cp-use { margin-left: auto; }
.cp-search input { width: 100%; min-height: var(--tap); }
.cl-list { display: flex; flex-direction: column; }
.cl-list:not(:empty) { border: 1px solid var(--mist); }
.cl-row {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; width: 100%;
  border: 0; border-top: 1px solid var(--mist); background: var(--white); padding: 8px 12px; min-height: 52px; font: 15px/1.5 var(--sans); color: var(--navy-deep); cursor: pointer;
}
.cl-row:first-child { border-top: 0; }
.cl-row:hover, .cl-row.on { background: var(--card); }
.cl-name { font-weight: 700; font-size: 15px; }
.cl-meta { font-size: 13px; color: var(--slate); text-align: right; overflow-wrap: anywhere; }
.client-card { display: flex; flex-direction: column; gap: 12px; }
.cc-head { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.cc-name { margin: 0; font: normal 24px/1.3 var(--serif); color: var(--navy); min-width: 0; overflow-wrap: anywhere; }
.cc-crm { display: inline-flex; align-items: center; min-height: var(--tap); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; color: var(--navy); }
.cc-owner { font-size: 13px; color: var(--slate); }
.cc-owner b { font-weight: 400; color: var(--slate); }
.cc-facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--slate); }
.cc-sec h5 { display: block; margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--mist); }
.purchases { display: flex; flex-direction: column; }
.purchase {
  display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%;
  min-height: 48px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--mist); background: none; text-align: left; font: 13px/1.45 var(--sans); color: var(--slate);
}
.purchase.link { cursor: pointer; }
.purchase.link .pu-item { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--sky); }
.purchase.link:hover { background: var(--card); }
.pu-date { color: var(--slate); font-variant-numeric: tabular-nums; }
.pu-item { overflow-wrap: anywhere; color: var(--navy-deep); }
.pu-net { text-align: right; color: var(--navy-deep); font-variant-numeric: tabular-nums; }
.cc-note { margin: 8px 0 0; font-size: 15px; line-height: 1.5; }
.cc-note .when { color: var(--slate); font-size: 13px; }
.cc-dates { list-style: none; margin: 0; padding: 0; font-size: 15px; }
.cc-dates li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--mist); }
/* the CRM's add-client form (crm/src/addclient.js, inlined unchanged), in the kit look */
.addwrap { position: fixed; inset: 0; z-index: 105; display: flex; align-items: center; justify-content: center; padding: 24px; }
.add-scrim { position: fixed; inset: 0; background: rgba(0, 26, 74, .4); }
.addbox { position: relative; width: min(560px, 100%); max-height: calc(100vh - 48px); overflow-y: auto;
  background: var(--white); border: 1px solid var(--mist); border-top: 2px solid var(--navy); }
.addbox .sheet-head { position: sticky; top: 0; background: var(--white); z-index: 1; padding: 8px 8px 8px 24px; }
.addbox .sheet-head h3 { flex: 1; min-width: 0; margin: 0; font: normal 21px/1.3 var(--serif); }
.editor { padding: 12px 24px 24px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.editor fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.editor legend, .editor .lbl { display: block; font: 700 12px/1.4 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--slate); padding: 0; margin: 4px 0; }
.editor input[type=text], .editor input[type=tel], .editor select, .editor textarea { width: 100%; }
.editor fieldset.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.editor .opt { display: flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 4px 12px; border: 1px solid var(--mist); cursor: pointer; }
.editor .opt input { width: 20px; height: 20px; min-height: 20px; margin: 0; accent-color: var(--navy); }
.editor .hint { font-size: 13px; color: var(--slate); margin: 0; line-height: 1.45; }
.form-err { margin: 0; color: var(--alert); font-size: 13px; font-weight: 700; }
.form-actions, .editor .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.add-dup { font-size: 13px; background: var(--card); color: var(--navy); border: 1px solid var(--mist); padding: 8px 12px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }

/* ------------------------------------------------------- suspended sales */
.resumed { margin: 12px 24px 0; padding: 8px 12px; font-size: 13px; background: var(--card); color: var(--navy); }
.draft { border: 1px solid var(--mist); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.draft + .draft { margin-top: 12px; }
.draft-lines { list-style: none; margin: 0; padding: 0; font-size: 15px; }
.draft-lines li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; overflow-wrap: anywhere; }
.draft-m { font-size: 13px; }
.draft-act { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------------------------------------------------------------- tickets */
.tk-pad { padding: 12px 24px; margin: 0; }
.tk-filters { display: grid; grid-template-columns: 165px 165px repeat(3, minmax(0, 1fr)); gap: 12px; padding: 16px 24px 8px; align-items: end; }
.tk-filters .tk-q { grid-column: 1 / -1; }
.tk-filters .tk-q input { width: 100%; }
.tk-filters select { width: 100%; }
.tk-date-f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tk-date-f span { font: 700 12px/1.4 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--slate); }
.tk-date-f input { width: 100%; }
.tk-train-note { margin: 8px 24px 0; padding: 8px 12px; font-size: 13px; background: var(--card); color: var(--navy); }
.tk-sum { display: block; padding: 12px 24px; font-size: 15px; border-bottom: 1px solid var(--mist); }
.tk-scroll { overflow-x: auto; }
.tk-list { table-layout: auto; }
.tk-list th, .tk-list td { padding-left: 8px; padding-right: 8px; }
.tk-list th:first-child, .tk-list td:first-child { padding-left: 24px; }
.tk-list th { white-space: nowrap; }
.tk-list th:last-child, .tk-list td:last-child { padding-right: 24px; }
.tk-list tbody tr { cursor: pointer; }
.tk-list td { color: var(--navy-deep); font-size: 14px; }
a.tk-no { white-space: nowrap; color: var(--navy); font-weight: 700; text-decoration: none; font-variant-numeric: tabular-nums; }
a.tk-no:hover { text-decoration: underline; text-underline-offset: 3px; }
.tk-date, .tk-seller, .tk-src { color: var(--slate); white-space: nowrap; }
.tk-list td.tk-items, .tk-list td.tk-client { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk-net { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tk-row.is-void .tk-net { text-decoration: line-through; color: var(--slate); }
.tk-status { display: inline-flex; }
.tk-pager { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 8px 24px 16px; }
@media (max-width: 900px) {
  .tk-filters { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .tk-filters > .tk-date-f { grid-column: span 3; }
  .tk-filters > select { grid-column: span 2; }
  .tk-list thead { display: none; }
  .tk-list, .tk-list tbody { display: block; }
  .tk-list tbody tr { display: grid; height: auto; padding: 8px 16px; gap: 0 12px; border-bottom: 1px solid var(--mist);
    grid-template-columns: auto auto minmax(0, 1fr) auto; grid-template-areas: "no no no net" "client client client st" "date src seller seller" "items items items items"; }
  .tk-list td, .tk-list td:first-child, .tk-list td:last-child { padding: 0; border: 0; min-height: 0; }
  .tk-list td.tk-items, .tk-list td.tk-client { max-width: none; }
  .tk-numcell { grid-area: no; } .tk-net { grid-area: net; } .tk-client { grid-area: client; } .tk-list td.tk-st { grid-area: st; justify-self: end; }
  .tk-date { grid-area: date; } .tk-src { grid-area: src; } .tk-seller { grid-area: seller; } .tk-items { grid-area: items; }
  .tk-date, .tk-src, .tk-seller, .tk-items { font-size: 13px; }
}
/* one ticket (#/ticket/<id>) */
.tk-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 24px; margin: 0; padding: 16px 24px; }
.tk-meta .kv { min-width: 0; }
.tk-meta dt { font: 700 12px/1.4 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--slate); }
.tk-meta dd { margin: 0; font-size: 15px; color: var(--navy-deep); overflow-wrap: anywhere; }
.ro-note { margin: 0 24px 8px; font-size: 13px; color: var(--slate); }
.notice.era-reminder { margin: 8px 24px 12px; font-weight: 700; }
.tl-lines { list-style: none; margin: 0; padding: 4px 24px; border-top: 1px solid var(--mist); }
.tl-row { display: grid; grid-template-columns: minmax(0, 1fr) 160px 150px; gap: 4px 16px; align-items: center; padding: 16px 0; border-top: 1px solid var(--mist); }
.tl-row:first-child { border-top: 0; }
.tl-info { min-width: 0; }
.tl-title { font: normal 17px/1.35 var(--serif); color: var(--navy); overflow-wrap: anywhere; }
.tl-title .tag { margin-left: 8px; vertical-align: middle; }
.tl-meta { margin-top: 4px; font-size: 13px; color: var(--slate); overflow-wrap: anywhere; }
.tl-price, .tl-net { text-align: right; font-variant-numeric: tabular-nums; }
.tl-price { color: var(--slate); }
.tl-price small { font-size: 13px; color: var(--slate); }
.tl-net { font-size: 17px; font-weight: 700; color: var(--navy-deep); }
.tl-row.refund .tl-net { color: var(--navy); }
.tl-foot { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; padding: 16px 24px; border-top: 1px solid var(--mist); }
.tl-pays { flex: 1 1 260px; min-width: 0; }
.tl-pays h5 { margin: 0 0 8px; font: 700 12px/1.4 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--slate); }
.tl-pay { display: flex; justify-content: space-between; gap: 12px; max-width: 360px; padding: 4px 0; font-size: 15px; color: var(--navy-deep); }
.tk-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 24px 24px; }
.void-form { margin: 0 24px 16px; padding: 12px 16px; border: 1px solid var(--alert); background: var(--white); display: flex; flex-direction: column; gap: 8px; }
.void-form .lbl { margin: 0; }
.void-form textarea { width: 100%; resize: vertical; }
.tk-receipt { max-width: 560px; margin: 0 auto 24px; padding: 0 24px; }
@media (max-width: 720px) {
  .tk-filters, .tk-sum, .tk-meta, .tl-lines, .tl-foot, .tk-actions { padding-left: 16px; padding-right: 16px; }
  .tk-filters { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .tk-filters > .tk-date-f, .tk-filters > select { grid-column: auto; }
  .tl-row { grid-template-columns: minmax(0, 1fr) auto; } .tl-price { grid-column: 1; text-align: left; }
}

/* ------------------------------------------------------------------ admin */
.admin-body { padding: 8px 24px 24px; display: flex; flex-direction: column; }
.admin-sec { padding: 16px 0; border-top: 1px solid var(--mist); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.admin-sec:first-child { border-top: 0; }
.admin-sec .h2 { margin: 0; }
.admin-sec p { margin: 0; max-width: 640px; }
.seg { display: inline-flex; border: 1px solid var(--navy); }
.seg .btn { border: 0; min-width: 120px; }
.seg .btn + .btn { border-left: 1px solid var(--navy); }
.ok-line { color: var(--navy); font-weight: 700; }

/* ---------------------------------------------------------- lock card */
#app.gated { pointer-events: none; user-select: none; }
#gate.gate { min-height: 0; }
.gate-mast { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 16px 24px; margin-bottom: 24px; }
.gate-card > .gate-mast + * { margin-top: 0; }
.gate-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.gate-mast img { height: 22px; width: auto; display: block; }
.gate-mast .kit-hbtn { letter-spacing: .06em; }
.gate-card label { display: block; margin-bottom: 16px; }
.gate-card label .lbl { margin-bottom: 4px; }
.gate-card input { width: 100%; }
.gate-card .err { margin-bottom: 12px; color: var(--alert); font-size: 13px; font-weight: 700; }
.gate-card > .btn { display: flex; width: calc(100% - 48px); }
.gate-card .gate-foot { margin-top: 12px; text-align: center; }
.gate-card .kept { margin-bottom: 12px; padding: 8px 12px; font-size: 13px; color: var(--navy); background: var(--card); }

/* ------------------------------------------------------------------- toast */
.toast { opacity: 0; pointer-events: none; transition: opacity .18s; }
.toast.show { opacity: 1; }
.loading { padding: 48px 24px; text-align: center; color: var(--slate); }

/* ---------------------------------------------------- narrower: portrait iPad */
@media (max-width: 900px) {
  .pay-layout, .receipt-wrap { grid-template-columns: minmax(0, 1fr); }
  .pay-main { border-right: 0; }
  .saved-actions { margin-top: 0; }
  .lines-head { display: none; }
  .sg-head, .sg { grid-template-columns: minmax(0, 1fr) 130px 120px; gap: 12px; }
  .lines > .line {
    grid-template-columns: minmax(0, 1fr) 92px minmax(120px, auto) var(--tap);
    grid-template-areas: "info info info x" "price disc net net";
    gap: 8px 12px;
  }
  .l-net { align-self: end; padding-bottom: 12px; }
}
@media (max-width: 720px) {
  .modal-wrap { padding: 0; align-items: flex-end; }
  .modal, .modal.confirm, .confirm .modal { width: 100%; max-height: 92vh; }
  .addwrap { padding: 0; align-items: flex-end; }
  .addbox { width: 100%; max-height: 100vh; height: 100%; border: 0; }
  main { padding: 12px 12px 120px; }
  .top .kit-head { padding: 0 12px; gap: 8px; }
  .top .kit-rule { display: none; }
  .top .kit-tabs { padding: 0 12px; gap: 24px; }
  .sheet-head, .search, .lines, .foot, .lines-tools { padding-left: 16px; padding-right: 16px; }
  .pay-main, .pay-side, .saved-panel, .receipt-stage { padding: 16px; }
  .lines-head { margin-left: 16px; margin-right: 16px; }
  .sugg { left: 16px; right: 16px; }
  .search .glass { left: 32px; }
  .pay-row { grid-template-columns: 96px minmax(0, 1fr) var(--tap); }
  .total .keynum { font-size: 28px; }
  .sale-head { padding: 16px 16px 0; }
  .sg-head, .sg { grid-template-columns: minmax(0, 1fr) auto; }
  .sg-head span:nth-child(2) { display: none; }
  .sg .sg-st { grid-column: 1; grid-row: 2; }
  .sg .sg-p { grid-column: 2; grid-row: 1 / 3; }
  .hide-sm { display: none !important; }
}
@media (max-width: 480px) {
  .lines > .line { grid-template-columns: minmax(0, 1fr) 80px var(--tap); grid-template-areas: "info info x" "price disc disc" "net net net"; }
  .pay-row { grid-template-columns: minmax(0, 1fr) var(--tap); }
  .pay-row input { grid-column: 1 / 2; }
  .pay-add, .card-menu { grid-template-columns: minmax(0, 1fr); }
}

@media print {
  .top, .training-band, .saved-panel, .receipt-actions, .toast { display: none !important; }
  .receipt-wrap { display: block; border: 0; }
  .receipt-stage { background: none; padding: 0; }
  #screen-ticket > :not(.tk-receipt) { display: none !important; }
  #screen-ticket { border: 0; }
  main { padding: 0; }
  .receipt { border: 0; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

// el(tag, attrs, ...children): children may be strings, nodes or arrays of them.

  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") { if (v) n.className = v; }
    else if (k === "text") n.textContent = v;
    else if (k === "value") n.value = v;
    else if (k === "html") n.innerHTML = v;        // fixed markup from this file only, never data
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? "" : v);
  }

}
function blank(v) { return v === null || v === undefined || String(v).trim() === ""; }
// Whole so'm, grouped by thousands with a plain space — as the receipt prints them.
function fmtUZS(n) {
  if (n === null || n === undefined || n === "" || isNaN(Number(n))) return "—";
  const x = Math.round(Number(n));
  return (x < 0 ? "-" : "") + String(Math.abs(x)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}
// Typed text → whole so'm. Grouping by spaces, no-break spaces, dots or commas is
// fine ("31 500 000", "31.500.000"); a trailing decimal part (".00", ",5") is
// dropped, since amounts are whole so'm; a minus sign makes it invalid.
// → { value: number | null (empty), invalid: boolean }
function readAmount(s) {
  const t = String(s === null || s === undefined ? "" : s).trim();
  if (!t) return { value: null, invalid: false };
  if (/[-−–]/.test(t)) return { value: null, invalid: true };
  const d = t.replace(/[.,]\d{1,2}$/, "").replace(/\D/g, "").replace(/^0+(?=\d)/, "");
  if (!d) return { value: null, invalid: true };
  return { value: Number(d.length > 14 ? d.slice(0, 14) : d), invalid: false };   // numeric(14,0)
}
// The amount, or null when empty or invalid.
function parseAmount(s) { const r = readAmount(s); return r.invalid ? null : r.value; }

// Dates on screens: "16 Nov 2026" / "16 ноя 2026"; on receipts and exports: "16.11.2026".
// Always the boutique's day (Tashkent). Month names come from fixed lists, not from
// Intl, whose Russian short months carry a trailing dot.
const MONTHS = {
  en: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
  ru: ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"],
};
const TZ = "Asia/Tashkent";
function tashkentDay(iso) {

  return { y: Number(parts.year), m: Number(parts.month), d: Number(parts.day) };
}
function fmtDate(iso) {
  const t = tashkentDay(iso);

}
function fmtDateNum(iso) {

}
// "14:05" in Tashkent time, so it agrees with fmtDate around midnight
function fmtTime(iso) {

/* ------------------------------------------------------------------- money
   Line net = round(price × (1 − discount/100)), half away from zero, whole
   so'm — exactly as the database rounds numeric. Worked in integers: the
   discount has at most four decimals (numeric(6,4)), so it is a whole number
   of millionths of the price; BigInt keeps 14-digit prices exact. */
function pctMillionths(pct) {
  const p = Math.min(Math.max(Number(pct) || 0, 0), MAX_DISCOUNT);
  return BigInt(Math.round(p * 10000));                    // ten-thousandths of a percent

function lineNet(line) {
  if (line.price_uzs === null || line.price_uzs === undefined) return null;

  const neg = num < 0n, a = neg ? -num : num;

}

/* --------------------------------------------------------------------- api */
async function api(action, body) {
  const payload = Object.assign({ action }, body || {});
  if (S.token && action !== "unlock") payload.token = S.token;
  let res;
  try {
    res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  } catch (e) {
    const err = new Error(tr("No connection. Check the Wi-Fi and try again."));
    err.status = 0;
    throw err;
  }
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) {
    // A lost session locks the page; the sale on screen is kept.
    if (res.status === 401 && action !== "unlock") lockDown(data.error);
    // The till was switched on another device: show the mode it is in now, and read the settings again.
    const sw = res.status === 409 && /^the till was switched to (training|live) — reload$/.exec(data.error || "");
    if (sw) {
      syncMode(sw[1]);
      try { await loadReference(); } catch (e) { /* the message still shows */ }
    }
    const err = new Error(data.error ? tr(data.error) : tr("Request failed ({n})", { n: res.status }));
    err.status = res.status;
    err.raw = data.error || "";            // the server's sentence as sent, before any translation
    throw err;
  }
  if (data && (data.mode === "training" || data.mode === "live")) syncMode(data.mode);
  return data;
}
// Every answer that says which mode the till is in keeps the page (and the TRAINING banner) in step.
function syncMode(mode) {
  if (S.mode === mode) return;
  S.mode = mode;
  if (S.locked) return;
  if (route().name === "admin") { renderAll(); return; }
  const h = document.querySelector("#app > header.top");
  if (h) { kitCloseMenus(); h.replaceWith(renderHeader()); }
}

/* ----------------------------------------------------------------- dialogs

function modal(id, title, body, foot, cls) {

  if (old) old.remove();
  const close = () => { const h = document.getElementById(id); if (h) h.remove(); };
  const host = el("div", { id, class: "modal-wrap" + (cls ? " " + cls : "") },
    el("div", { class: "modal-scrim", onclick: close }),
    el("section", { class: "modal" + (cls ? " " + cls : ""), role: "dialog", "aria-modal": "true", "aria-labelledby": id + "-title" },
      el("div", { class: "modal-head" },
        el("h3", { id: id + "-title", text: title }),
        el("button", { class: "btn subtle close", type: "button", id: id + "-close", "aria-label": tr("Close"), onclick: close, text: "×" })),
      el("div", { class: "modal-body" }, body),

}

    const m = modal("confirm-dialog", title, [].concat(body).map((t) => typeof t === "string" ? el("p", { text: t }) : t), [
      el("button", { type: "button", class: "btn " + (danger ? "danger" : "primary"), id: "confirm-ok", onclick: () => finish(true) }, ok || tr("Yes")),
      el("button", { type: "button", class: "btn", id: "confirm-cancel", onclick: () => finish(false) }, cancel || tr("Cancel")),
    ], "confirm");

}

/* --------------------------------------------------------------- idle lock

   passcode again. The sale on screen is kept. */
let lastActive = Date.now(), lastSaved = 0;
function markActive() {
  lastActive = Date.now();
  if (!S.locked && lastActive - lastSaved > 20000) { lastSaved = lastActive; sstore(ACTIVE_KEY, lastActive); }
}
function activeNow() { lastActive = lastSaved = Date.now(); sstore(ACTIVE_KEY, lastActive); }
["pointerdown", "keydown", "touchstart", "wheel", "input"].forEach((ev) =>
  window.addEventListener(ev, markActive, { passive: true, capture: true }));
function idleCheck() {

}
setInterval(idleCheck, 30000);

  idleCheck();
});

async function loadReference() {

const KIT_TOOLS = [

// Close functions of the menus that are open right now.
const kitOpenMenus = [];

// A tool calls this on lock: closes every open kit menu and detaches its listeners.
function kitCloseMenus() {
  for (const close of kitOpenMenus.slice()) close();
}

// A link that leaves the page can ask first. beforeLeave(href) returns a Promise:
// true follows the link, false stays. A modified click (new tab) is left alone.
function kitGuardLink(a, beforeLeave) {
  if (typeof beforeLeave !== 'function') return a;
  a.addEventListener('click', e => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    const href = a.href;
    Promise.resolve(beforeLeave(href)).then(go => { if (go) window.location.assign(href); });
  });
  return a;
}

// opts.beforeLeave: see kitGuardLink; asked before any tool link is followed.
function kitToolsMenu(currentId, lang, opts) {
  const beforeLeave = opts && opts.beforeLeave;
  const ru = lang === 'ru';
  const wrap = document.createElement('span');
  wrap.className = 'kit-tool-wrap';
  wrap.setAttribute('data-kit-menu', '');
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'kit-hbtn';
  btn.textContent = ru ? 'Инструменты' : 'Tools';
  btn.setAttribute('aria-expanded', 'false');
  const list = document.createElement('ul');
  list.className = 'kit-menu';
  list.hidden = true;
  for (const t of KIT_TOOLS) {
    const li = document.createElement('li');
    let item;
    if (t.id === currentId) {
      item = document.createElement('span');
      item.setAttribute('aria-current', 'page');
    } else {
      item = document.createElement('a');
      item.setAttribute('href', t.href);
      kitGuardLink(item, beforeLeave);
    }
    item.textContent = ru ? t.ru : t.en;
    li.appendChild(item);
    list.appendChild(li);
  }
  function close(refocus) {
    list.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('click', onDoc);
    const i = kitOpenMenus.indexOf(close);
    if (i >= 0) kitOpenMenus.splice(i, 1);
    if (refocus === true && btn.isConnected) btn.focus();
  }
  function open() {
    list.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    document.addEventListener('keydown', onKey);
    document.addEventListener('click', onDoc);
    kitOpenMenus.push(close);
  }
  function onKey(e) { if (e.key === 'Escape') close(true); }
  function onDoc(e) { if (!wrap.contains(e.target)) close(); }
  btn.addEventListener('click', e => { e.stopPropagation(); if (list.hidden) open(); else close(); });
  list.addEventListener('click', e => { if (e.target.closest && e.target.closest('a')) close(); });
  wrap.addEventListener('focusout', e => {
    if (!list.hidden && e.relatedTarget && !wrap.contains(e.relatedTarget)) close();
  });
  wrap.appendChild(btn);
  wrap.appendChild(list);
  return wrap;
}

function keyName(dict, k) {

function pieceName(p) {
  const c = (p.collection || "").trim(), m = (p.model_name || "").trim();
  if (m && c && m.toLowerCase().includes(c.toLowerCase())) return m;

// Typed text → a discount the database can hold: 0 … 99.9999, at most four decimals,
// one decimal separator (dot or comma). Anything else is invalid and not taken.
function parsePct(s) {
  const t = String(s === null || s === undefined ? "" : s).trim();
  if (!t) return { pct: 0, capped: false, invalid: false };
  if (!/^(\d+([.,]\d{0,4})?|[.,]\d{1,4})$/.test(t)) return { pct: null, capped: false, invalid: true };

let searchTimer = null, searchSeq = 0;
async function runSearch(q) {
  const seq = ++searchSeq;
  S.search.busy = true;
  try {
    const r = await api("search", { q });
    if (seq !== searchSeq) return null;          // a newer search has started
    S.search = { q, pieces: r.pieces || [], open: true, busy: false };
    renderSugg();
    return S.search.pieces;
  } catch (e) {
    if (seq === searchSeq) { S.search.busy = false; if (e.status !== 401) toast(e.message); }
    return null;
  }
}
function onSearchInput(ev) {
  const q = ev.target.value.trim();
  clearTimeout(searchTimer);
  if (q.length < 2) { searchSeq++; S.search = { q: "", pieces: null, open: false, busy: false }; renderSugg(); return; }
  searchTimer = setTimeout(() => runSearch(q), 250);
}
async function onSearchKey(ev) {
  if (ev.key === "Escape") { closeSugg(); return; }
  if (ev.key !== "Enter") return;
  ev.preventDefault();
  clearTimeout(searchTimer);
  const q = ev.target.value.trim();
  if (!q) return;
  const pieces = (S.search.q === q && S.search.pieces && !S.search.busy) ? S.search.pieces : await runSearch(q);
  if (!pieces) return;
  // Spec §5.1: Enter adds only when exactly one sellable piece matches (as the
  // API reports it, whatever is already on the sale). Several sellable pieces
  // on one barcode always open the list, so the seller taps the serial — a
  // second scan never silently picks the other copy.
  const sellable = pieces.filter((p) => p.sellable);
  if (sellable.length === 1) {
    if (!inSale(sellable[0])) { addPiece(sellable[0], true); return; }
    toast(tr("Already in this sale."));
    ev.target.select();
    closeSugg();
    return;
  }
  // otherwise the list stays open to pick from (or says nothing was found)
}
function closeSugg() {
  S.search.open = false;
  renderSugg();
}
function addPiece(p, fromScan) {
  if (inSale(p)) { toast(tr("Already in this sale.")); return; }
  if (S.sale.lines.length >= MAX_LINES) { toast(tr("A sale can hold at most {n} pieces.", { n: MAX_LINES })); return; }
  S.sale.lines.push({
    piece_id: p.piece_id, serial: p.serial, barcode: p.barcode, brand: p.brand, article: p.article,
    collection: p.collection, model_name: p.model_name, colour: p.colour, size: p.size,
    metal_keys: p.metal_keys || [], stone_keys: p.stone_keys || [],
    list_price: p.price_uzs, price_uzs: p.price_uzs, discount_pct: 0, seller: null, sellerOpen: false,
  });
  searchSeq++;
  S.search = { q: "", pieces: null, open: false, busy: false };
  renderAll();
  // After a scan the box is ready for the next one; after a tap, no keyboard pops up.
  if (fromScan) { const q = $("#q"); if (q) q.focus(); }
}

  try {
    const r = await api("drafts");
    S.drafts = r.drafts || [];
  } catch (e) { if (S.drafts === null) S.drafts = []; }
  refreshSuspended();
  return S.drafts;

    el("button", { type: "button", class: "btn", id: "suspend", disabled: S.sale.lines.length ? null : true,

/* ----------------------------------------------------------------- receipt
   receipt_text is what the database stored with the ticket (pos_receipt_text);
   it is shown as written, each kind of line given its own style. */
function receiptLines(text) {
  const rows = String(text || "").split("\n");
  const out = [];
  let stage = "head", afterBrand = false;
  rows.forEach((t, i) => {
    let cls = "rc-line", node = null;
    const amount = /^(.*?)\s+(-?\d{1,3}(?: \d{3})*)$/.exec(t);
    if (i === 0 && /^(TRAINING|УЧЕБНЫЙ)/.test(t)) cls += " rc-train";
    else if (t === "DELARDI") { cls += " rc-brand"; afterBrand = true; }
    else if (afterBrand) { cls += " rc-addr"; afterBrand = false; }

/* -------------------------------------------------------------- the session */
function crmStore(v) {
  try {
    if (v === undefined) return JSON.parse(sessionStorage.getItem(CRM_KEY) || "null");
    if (v === null) sessionStorage.removeItem(CRM_KEY);
    else sessionStorage.setItem(CRM_KEY, JSON.stringify({ token: v.token, can_edit: v.can_edit, name: v.name, expires_at: v.expires_at }));
  } catch (e) { /* storage blocked: the CRM session lives in memory only */ }
  return null;
}
// At login: the same passcode, to crm-api. 401 or 403 (or no answer) → no CRM.
async function crmUnlock(passcode) {
  S.crm = null;
  crmStore(null);
  try {
    const res = await fetch(CRM_API, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "unlock", passcode }) });
    if (!res.ok) return false;
    const r = await res.json();
    if (!r || !r.token) return false;
    S.crm = { token: r.token, can_edit: !!r.can_edit, name: r.name, expires_at: r.expires_at, ref: null };
    crmStore(S.crm);
    await crmLoadRef();
    return true;
  } catch (e) {
    S.crm = null;
    return false;
  }
}
// The owner choice of the add-client form reads S.ref.my_rep and S.ref.sales_reps.
async function crmLoadRef() {
  if (!S.crm) return;
  try {
    const r = await call("reference");
    if (S.crm) S.crm.ref = { my_rep: r.my_rep || null, sales_reps: r.sales_reps || [] };
    if (S.ref) Object.assign(S.ref, crmRefFields());
  } catch (e) { /* the form still offers the shared list */ }
}
const crmRefFields = () => (S.crm && S.crm.ref) ? { my_rep: S.crm.ref.my_rep, sales_reps: S.crm.ref.sales_reps } : { my_rep: null, sales_reps: [] };
function crmRestore() {
  const s = crmStore();
  if (s && s.token && new Date(s.expires_at).getTime() > Date.now()) { S.crm = Object.assign({ ref: null }, s); crmLoadRef(); }
  else S.crm = null;
}
function crmDrop() { S.crm = null; crmStore(null); }

/* ------------------------------------------------- what addclient.js needs */
// crm-api with the CRM token. A dead CRM session leaves the till as it is,
// Walk-in only, and says so once.
async function call(action, payload = {}) {
  if (!S.crm) throw new Error(tr("No CRM access — Walk-in only"));
  const body = Object.assign({ action }, payload, { token: S.crm.token });
  let res;
  try {
    res = await fetch(CRM_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  } catch (e) {
    throw new Error(tr("No connection. Check the Wi-Fi and try again."));
  }
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) {
    if (res.status === 401) {
      crmDrop();
      toast(tr("The CRM session has ended. Lock and unlock the till to search clients again."));
      if (typeof closeClientPanel === "function") closeClientPanel();
      renderAll();
    }
    const err = new Error(data.error ? tr(data.error) : tr("Request failed ({n})", { n: res.status }));
    err.status = res.status;
    throw err;
  }

}

      sel("tk-seller", tr("Seller"), f.seller, [opt("", tr("All sellers"), f.seller), ...((S.ref && S.ref.sellers) || []).map((x) => opt(x, x, f.seller))], "seller"),
      sel("tk-source", tr("Source"), f.source, [opt("", tr("All sources")), opt("colibri", tr("Colibri")), opt("delardi", tr("This till")),
        S.mode === "training" ? opt("training", tr("Test sales (training)")) : null].filter(Boolean), "source"),
      sel("tk-status", tr("Status"), f.status, [opt("", tr("Any status")), opt("posted", tr("Posted")), opt("void", tr("Void"))], "status")),
    f.source === "training" ? el("p", { class: "tk-train-note", text: tr("Test sales are listed apart: nothing in them is real.") }) : null,
    el("div", { id: "tk-body" })));

// Status tag: void alert, a test sale card-filled, otherwise navy (the till's "Posted" is the mockup's "Sold").
function tkStatus(status, source) {
  if (status === "void") return el("span", { class: "tag alert", text: tr("VOIDED") });
  if (source === "training") return el("span", { class: "tag info", text: tr("Training") });
  return el("span", { class: "tag act", text: tr("Posted") });
}
// Colibri tickets carry a date only (stored as midnight UTC), so their "time" would be a fake 05:00.
const tkWhen = (iso, source) => source === "colibri" ? fmtDate(iso) : fmtDate(iso) + " " + fmtTime(iso);
function renderTkList() {
  const box = $("#tk-body");

  box.innerHTML = "";

  const sumParts = [el("b", { text: pl(d.count, "ticket") })];
  if (d.void_count) sumParts.push(" · ", el("span", { text: tr("{n} void", { n: d.void_count }) }));
  sumParts.push(" · ", el("span", { class: "money", text: tr("net {x} so'm", { x: fmtUZS(d.net_total) }) }));
  if (tk.busy) sumParts.push(" · ", el("span", { class: "small", text: tr("Searching…") }));
  box.append(el("div", { class: "tk-sum", id: "tk-sum", "aria-live": "polite" }, ...sumParts));
  if (!d.rows.length) { box.append(el("p", { class: "small tk-pad", text: tr("No ticket matches.") })); return; }
  const cols = [["Ticket", "tk-numcell"], ["Date", "tk-date"], ["Items", "tk-items"], ["Client", "tk-client"], ["Seller", "tk-seller"],
    ["Source", "tk-src"], ["Status", "tk-st"], ["Net", "tk-net r"]];
  box.append(el("div", { class: "tk-scroll" }, el("table", { class: "tbl tk-list", id: "tk-list", "aria-label": tr("Tickets") },
    el("thead", {}, el("tr", {}, cols.map(([h, c]) => el("th", { scope: "col", class: "tk-h " + c, text: tr(h) })))),
    el("tbody", {}, d.rows.map((r) => {
      const href = "#/ticket/" + encodeURIComponent(r.ticket_id);
      return el("tr", { class: "tk-row" + (r.status === "void" ? " is-void" : ""), onclick: (ev) => { if (!ev.target.closest("a")) location.hash = href; } },
        el("td", { class: "tk-numcell" }, el("a", { class: "tk-no", href, text: r.ticket_no })),
        el("td", { class: "tk-date", text: tkWhen(r.sold_at, r.source) }),
        el("td", { class: "tk-items", text: r.items || "—" }),
        el("td", { class: "tk-client", text: r.client_name || (r.walk_in ? walkInText() : r.client_id || "—") }),
        el("td", { class: "tk-seller", text: r.seller || "—" }),
        el("td", { class: "tk-src", text: tr(SOURCE_LABEL[r.source] || r.source) }),
        el("td", { class: "tk-st" }, tkStatus(r.status, r.source)),
        el("td", { class: "tk-net r money", text: fmtUZS(r.net) }));
    })))));
  if (pages > 1) {
    const pg = (p) => { tk.page = p; loadTickets(); };
    box.append(el("div", { class: "tk-pager" },
      el("button", { type: "button", class: "btn", disabled: tk.page <= 1 ? true : null, onclick: () => pg(tk.page - 1) }, tr("← Newer")),
      el("span", { class: "small", text: tr("Page {p} of {n}", { p: tk.page, n: pages }) }),
      el("button", { type: "button", class: "btn", disabled: tk.page >= pages ? true : null, onclick: () => pg(tk.page + 1) }, tr("Older →"))));
  }
}

/* ------------------------------------------------------------- one ticket */
async function renderTicket(main, id) {
  if (!S.rights.view) { main.append(el("div", { class: "notice", text: tr("Your account cannot look up sales.") })); return; }
  const wrap = el("section", { class: "sheet", id: "screen-ticket" }, el("p", { class: "loading", text: tr("Loading…") }));
  main.append(wrap);
  S.rcLang = null;                                // a reprint starts in the screen language
  let doc;
  try { doc = await api("ticket", { ticket_id: id, lang: rcLangFor(id) }); }
  catch (e) {
    if (!wrap.isConnected) return;
    wrap.innerHTML = "";
    wrap.append(el("div", { class: "sheet-head" }, el("h1", { text: tr("Ticket") }),
      el("div", { class: "aside" }, el("a", { class: "btn", href: "#/tickets", text: tr("← Tickets") }))),
      el("p", { class: "form-err tk-pad", role: "alert", text: e.status === 404 ? tr("No ticket with that reference.") : e.message }));
    return;
  }
  if (!wrap.isConnected) return;
  wrap.innerHTML = "";                            // the "Loading…" line goes
  drawTicket(wrap, doc, { receipt: false, voidOpen: false, reason: "", err: null });
}
function drawTicket(wrap, doc, ui) {
  const t = doc.ticket, lines = doc.lines || [], pays = doc.payments || [];
  const mine = ours(t), voided = t.status === "void";
  const canVoid = mine && !voided && S.rights.void;
  const total = docTotal(lines);
  const redraw = () => { wrap.innerHTML = ""; drawTicket(wrap, doc, ui); };
  const kv = (k, v) => blank(v) ? null : el("div", { class: "kv" }, el("dt", { text: tr(k) }), el("dd", {}, v));
  const client = doc.client_name ? doc.client_name + (t.client_id ? " · " + t.client_id : "") : t.walk_in ? walkInText() : (t.client_id || t.client_raw || null);
  const lineRow = (l) => {
    const refund = l.kind === "refund";
    const sign = (n) => (n === null || n === undefined || n === "") ? null : (refund ? -Math.abs(Number(n)) : Number(n));
    return el("li", { class: "tl-row" + (refund ? " refund" : "") },
      el("div", { class: "tl-info" },
        el("div", { class: "tl-title" }, [l.brand_raw, l.item_name].filter(Boolean).join(" · ") || l.article || "—",
          refund ? el("span", { class: "tag line", text: tr("Refund") }) : null),
        el("div", { class: "tl-meta" }, [l.serial_raw, l.article, l.size ? tr("size {s}", { s: l.size }) : null, l.seller ? tr("Seller: {s}", { s: l.seller }) : null]
          .filter(Boolean).join(" · "))),
      el("div", { class: "tl-price money" }, fmtUZS(sign(l.price_current)),
        Number(l.discount_pct) ? el("small", { text: " −" + pctText(l.discount_pct) + "%" }) : null),
      el("div", { class: "tl-net money", text: fmtUZS(sign(l.net)) }));
  };
  const payText = (p) => tr(METHOD_LABEL[p.method] || p.method || "") + (p.card_type ? " · " + (CARD_LABEL[p.card_type] || p.card_type) : "");
  const actions = [];
  if (mine && t.receipt_text) actions.push(el("button", { type: "button", class: "btn", id: "show-receipt", "aria-expanded": ui.receipt ? "true" : "false",
    onclick: () => { ui.receipt = !ui.receipt; redraw(); } }, tr(ui.receipt ? "Hide the receipt" : "Receipt")));
  if (canVoid && !ui.voidOpen) actions.push(el("button", { type: "button", class: "btn danger", id: "void",
    onclick: () => { ui.voidOpen = true; ui.err = null; redraw(); const r = $("#void-reason"); if (r) r.focus(); } }, tr("Void")));
  const submitVoid = async () => {
    const reason = ui.reason.trim();
    if (!reason) { ui.err = tr("Write the reason for the void."); redraw(); return; }
    const yes = await confirmBox({ title: tr("Void {no}?", { no: t.ticket_no }),
      body: [tr(t.source === "training" ? "A test sale: nothing real changes." : "Its pieces go back in stock and the client's purchase is taken off the CRM record."),
        tr("Reason: {r}", { r: reason })],
      ok: tr("Void this sale"), danger: true });
    if (!yes) return;
    try {
      await api("void", { ticket_id: t.ticket_id, reason });
      toast(tr("{no} voided.", { no: t.ticket_no }));
      const fresh = await api("ticket", { ticket_id: t.ticket_id, lang: rcLangFor(t.ticket_id) });
      if (!wrap.isConnected) return;
      Object.assign(doc, fresh);
      ui.voidOpen = false; ui.err = null;
      redraw();
    } catch (e) {
      if (e.status === 401) return;
      ui.err = e.message; redraw();
    }
  };
  // Node.append would print a null as "null": the optional parts go through filter(Boolean)
  wrap.append(...[
    el("div", { class: "sheet-head" },
      el("h1", { text: t.ticket_no }),
      el("span", { class: "tk-status" }, tkStatus(t.status, t.source)),
      el("div", { class: "aside" }, el("a", { class: "btn", href: "#/tickets", text: tr("← Tickets") }))),
    t.source === "training" ? el("p", { class: "tk-train-note", text: tr("Test sales are listed apart: nothing in them is real.") }) : null,
    el("dl", { class: "tk-meta" },
      kv("Date", tkWhen(t.sold_at, t.source)),
      kv("Source", tr(SOURCE_LABEL[t.source] || t.source)),
      kv("Seller", t.seller),
      kv("Client", client),
      kv("Entered by", t.entered_by ? who(t.entered_by) : null),
      kv("Era receipt no.", t.fiscal_ref),
      voided ? kv("Void reason", t.void_reason) : null,
      voided ? kv("Voided by", [t.voided_by ? who(t.voided_by) : null, t.voided_at ? tkWhen(t.voided_at) : null].filter(Boolean).join(", ")) : null),
    !mine ? el("p", { class: "ro-note", text: tr("From Colibri — read-only.") }) : null,
    voided && mine ? el("p", { class: "notice era-reminder", id: "era-reminder", role: "note", text: tr("Cancel the fiscal receipt in Era as well.") }) : null,
    el("ol", { class: "tl-lines" }, lines.map(lineRow)),
    el("div", { class: "tl-foot" },
      el("div", { class: "tl-pays" }, el("h5", { text: tr("Payments") }),
        pays.length ? pays.map((p) => el("div", { class: "tl-pay" }, el("span", { text: payText(p) }), el("span", { class: "money", text: fmtUZS(p.amount) })))
          : el("p", { class: "small", text: "—" })),
      el("div", { class: "total" }, el("div", { class: "t-l", text: tr("Total") }),
        el("div", { class: "keynum" }, fmtUZS(total), el("small", { text: tr("so'm") })))),
    ui.voidOpen ? el("form", { class: "void-form", id: "void-form", onsubmit: (ev) => { ev.preventDefault(); submitVoid(); } },
      el("label", { for: "void-reason", class: "lbl", text: tr("Why is this sale being voided?") }),
      el("textarea", { id: "void-reason", rows: "3", maxlength: "500", value: ui.reason, oninput: (ev) => { ui.reason = ev.target.value; if (ui.err && ui.reason.trim()) { ui.err = null; const x = $("#void-form .form-err"); if (x) x.remove(); } } }),
      ui.err ? el("p", { class: "form-err", role: "alert", text: ui.err }) : null,
      el("p", { class: "small", text: tr("Cancel the fiscal receipt in Era as well.") }),
      el("div", { class: "form-actions" },
        el("button", { type: "submit", class: "btn danger", id: "void-go" }, tr("Void this sale")),
        el("button", { type: "button", class: "btn subtle", onclick: () => { ui.voidOpen = false; ui.err = null; redraw(); } }, tr("Cancel")))) : null,
    actions.length ? el("div", { class: "tk-actions" }, actions) : null,
    ui.receipt && t.receipt_text ? el("div", { class: "tk-receipt" },
      el("article", { class: "receipt", "aria-label": t.ticket_no },
        el("div", { class: "rc-mast" }, el("img", { src: LOGO_WORDMARK, alt: "Delardi" })),
        el("div", { class: "rc-body" }, receiptLines(t.receipt_text), el("img", { class: "rc-mono", src: LOGO_MONO, alt: "" }))),
      el("div", { class: "receipt-actions" },
        rcLangSwitch(t.ticket_id, async (code) => {
          try {
            const fresh = await api("ticket", { ticket_id: t.ticket_id, lang: code });
            if (!wrap.isConnected) return;
            Object.assign(doc, fresh); redraw();
          } catch (e) { if (e.status !== 401) toast(e.message); }
        }),
        el("button", { type: "button", class: "btn", onclick: () => window.print() }, tr("Print")))) : null,
  ].filter(Boolean));
}

PL.testTicket = { en: ["test ticket", "test tickets"], ru: ["тестовый чек", "тестовых чека", "тестовых чеков"] };
PL.testDraft = { en: ["suspended test sale", "suspended test sales"], ru: ["отложенная тестовая продажа", "отложенные тестовые продажи", "отложенных тестовых продаж"] };
S.adminCleared = null;

function renderAdmin(main) {
  if (!S.rights.manage) { main.append(el("div", { class: "notice", text: tr("Your account cannot manage the till.") })); return; }
  const live = S.mode === "live";
  const goLive = S.ref && S.ref.go_live_date;
  main.append(el("section", { class: "sheet", id: "screen-admin" },
    el("div", { class: "sheet-head" }, el("h1", { text: tr("Admin") })),
    el("div", { class: "admin-body" },
      el("div", { class: "admin-sec" },
        el("h2", { class: "h2", text: tr("Till mode") }),
        el("div", { class: "seg", role: "group", "aria-label": tr("Till mode") },
          el("button", { type: "button", class: "btn", id: "mode-training", "aria-pressed": live ? "false" : "true", onclick: () => switchMode("training") }, tr("Training")),
          el("button", { type: "button", class: "btn", id: "mode-live", "aria-pressed": live ? "true" : "false", onclick: () => switchMode("live") }, tr("Live"))),
        el("p", { class: "small", text: tr(live ? "The till is Live: every sale posted here is real (D-…)."
          : "The till is in training: sales posted now are test sales (T-…). Pieces stay in stock and nothing reaches the CRM or the monthly figures.") })),
      el("div", { class: "admin-sec" },
        el("h2", { class: "h2", text: tr("Go-live date") }),
        el("p", { id: "go-live", class: goLive ? "h2" : "small", text: goLive ? fmtDate(goLive) : tr("Not yet — the till has not been Live.") })),
      el("div", { class: "admin-sec" },
        el("h2", { class: "h2", text: tr("Test sales") }),
        el("p", { class: "small", text: tr("Deletes every test ticket and every suspended test sale. Real (Live) sales are never touched.") }),
        el("button", { type: "button", class: "btn", id: "clear-training", onclick: clearTraining }, tr("Clear test sales")),
        S.adminCleared ? el("p", { class: "ok-line", id: "clear-result", role: "status", text: tr("Cleared: {t} and {d}.",
          { t: pl(S.adminCleared.tickets, "testTicket"), d: pl(S.adminCleared.drafts, "testDraft") }) }) : null))));
}
async function switchMode(mode) {
  if (mode === S.mode) return;
  const toLive = mode === "live";
  const yes = await confirmBox(toLive
    ? { title: tr("Switch the till to Live?"), ok: tr("Go Live"), danger: true,
        body: [tr("Live means every sale posted here is real: its pieces are marked sold, the purchase goes on the client's CRM record, and the ticket counts in the monthly figures."),
          tr("Test sales stay apart and are never counted. Do this once the team has practised.")] }
    : { title: tr("Switch the till back to Training?"), ok: tr("Switch to Training"),
        body: tr("From now on, sales posted here are test sales: pieces stay in stock and nothing reaches the CRM or the figures. Real sales already posted stay as they are.") });
  if (!yes) return;
  try {
    await api("set_mode", { mode });
    await loadReference();
    S.adminCleared = null;
    S.tk = null;                       // the ticket filters belong to the old mode
    await loadDrafts();                // suspended sales are per mode
    renderAll();
    toast(tr(toLive ? "The till is Live." : "The till is in training."));
  } catch (e) { if (e.status !== 401) toast(e.message); }
}
async function clearTraining() {
  const yes = await confirmBox({ title: tr("Clear every test sale?"), ok: tr("Clear them"), danger: true,
    body: [tr("Deletes every test ticket and every suspended test sale. Real (Live) sales are never touched."), tr("This cannot be undone.")] });
  if (!yes) return;
  try {
    S.adminCleared = await api("clear_training");
    await loadDrafts();
    renderAll();
  } catch (e) { if (e.status !== 401) toast(e.message); }
}

/* -------------------------------------------------------------------- init */
function renderAll() {
  const app = $("#app");
  document.documentElement.lang = LANG;
  document.title = "Delardi " + tr("Sales");
  if (S.locked && !S.ref) return;                  // nothing behind the gate before a passcode
  const r = route();
  kitCloseMenus();                                 // the header is redrawn: no open menu is left listening
  app.innerHTML = "";
  if (!S.locked) { app.classList.remove("gated"); app.setAttribute("aria-hidden", "false"); app.inert = false; }
  const main = el("main", { id: "main" });
  app.append(renderHeader(), main);
  ROUTES[r.name](main, r.arg);
}
function restoreSession() {
  try {
    const s = JSON.parse(sstore(SESSION_KEY) || "null");
    if (!s || !s.token || new Date(s.expires_at).getTime() <= Date.now()) return false;
    const last = Number(sstore(ACTIVE_KEY) || 0);
    if (touchDevice() && last && Date.now() - last >= IDLE_MIN * 60000) { sstore(SESSION_KEY, null); return false; }
    S.token = s.token; S.name = s.name; S.expires_at = s.expires_at; S.rights = s.rights || S.rights;
    crmRestore();
    return true;
  } catch (e) { return false; }
}

(async function boot() {
  document.documentElement.lang = LANG;
  if (restoreSession()) {
    try { await loadReference(); S.locked = false; activeNow(); loadDrafts(); }
    catch (e) { if (e.status !== 401) { S.token = null; sstore(SESSION_KEY, null); } }
  }
  if (S.locked) $("#app").innerHTML = "";          // nothing behind the gate
  renderAll();
  renderGate();
})();
