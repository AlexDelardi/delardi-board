<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<title>Delardi Sales</title>
<link rel="icon" type="image/png" href="__FAVICON__">
<meta name="theme-color" content="#001A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Delardi Sales">
<style>
/* ===========================================================================
   Delardi Sales — the till
   Sister page to the Client Instrument and the Catalogue, same brand system:
   the two official navies #001A4A / #082966, Palatino Linotype as the accent
   face, Evolventa as the text face. iPad first: every button is a 44 px
   target, and nothing scrolls sideways at 768 or 1024 wide.
   ========================================================================= */
:root {
  --navy:        #001A4A;
  --navy-2:      #082966;
  --page:        #EEF1F7;
  --surface:     #FFFFFF;
  --surface-2:   #F5F7FB;
  --ink:         #001A4A;
  --ink-2:       #5B6478;
  --muted:       #5B6478;
  --grid:        #DCE3EF;
  --line:        #C6D0E2;
  --border:      rgba(0,26,74,0.12);
  --shadow:      0 1px 2px rgba(0,26,74,.05), 0 10px 28px rgba(0,26,74,.08);
  --header-bg:   #001A4A;
  --header-ink:  #FFFFFF;
  --header-ink-2:#B9C6DE;
  --header-line: rgba(255,255,255,0.16);
  --row-hover:   #F2F5FB;
  --focus:       #2E5490;

  --good:        #2F6F4F;
  --warning:     #B07A1E;
  --serious:     #C2612F;
  --critical:    #9B3B3B;
  --good-ink:    #2F6F4F;

  --sans:  "Evolventa","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --serif: "Palatino Linotype","Book Antiqua",Palatino,"Times New Roman",Georgia,serif;
  --radius: 4px;
  --tap: 44px;
  color-scheme: light;
}
:root[data-theme="dark"], html[data-theme="auto"].sysdark {
  --page:        #000D22;
  --surface:     #00112F;
  --surface-2:   #041B3F;
  --ink:         #F2F5FA;
  --ink-2:       #B9C6DE;
  --muted:       #8892A6;
  --grid:        #0C2650;
  --line:        #1B3A69;
  --border:      rgba(255,255,255,0.13);
  --shadow:      0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.55);
  --header-bg:   #000B1C;
  --header-line: rgba(255,255,255,0.13);
  --row-hover:   #07224B;
  --focus:       #8FA8CC;

  --good:        #4E9E72;
  --warning:     #D9A23C;
  --serious:     #E08B5C;
  --critical:    #E07C7C;
  --good-ink:    #4E9E72;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num, .money { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ------------------------------------------------------------------ header */
.top { position: sticky; top: 0; z-index: 40; background: var(--surface); border-bottom: 1px solid var(--border); }
.top-row {
  display: flex; align-items: center; gap: 12px 14px; flex-wrap: wrap;
  padding: 10px 22px; background: var(--header-bg); color: var(--header-ink);
}
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand .mark { height: 34px; width: auto; display: block; }
.brand .home { display: flex; align-items: center; flex: none; border-radius: 3px; min-height: var(--tap); }
.brand .rule { width: 1px; height: 34px; background: var(--header-line); flex: none; }
.brand .title { font-family: var(--serif); font-size: 17px; line-height: 1.25; letter-spacing: .015em; }
.brand .sub { font-size: 11px; letter-spacing: .11em; text-transform: uppercase; color: var(--header-ink-2); margin-top: 3px; }
.spacer { flex: 1 1 auto; }
.top-row .btn {
  background: rgba(255,255,255,0.07); color: var(--header-ink); border-color: var(--header-line);
}
.top-row .btn:hover { background: rgba(255,255,255,0.14); }
.top-row .btn.subtle { background: transparent; color: var(--header-ink-2); border-color: transparent; }
.top-row .btn.subtle:hover { background: rgba(255,255,255,0.12); color: var(--header-ink); }
.lock-state {
  display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
  padding: 0 0 0 11px; border-radius: 8px;
  background: rgba(255,255,255,0.08); border: 1px solid var(--header-line); color: var(--header-ink);
}
.lock-state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }

.btn {
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 0 14px; min-height: var(--tap); min-width: var(--tap); font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.primary:hover:not(:disabled) { opacity: .88; }
.btn.subtle { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.subtle:hover { background: var(--surface-2); }
.btn.big { min-height: 52px; padding: 0 22px; font-size: 15.5px; font-weight: 600; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.linkish {
  background: none; border: 0; padding: 0 4px; margin: 0; font: inherit; color: var(--ink-2);
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  min-height: var(--tap); min-width: var(--tap); display: inline-flex; align-items: center;
}
.linkish:hover { color: var(--ink); }

/* language switch (as in the CRM) */
.lang { display: inline-flex; border: 1px solid var(--header-line); border-radius: 8px; overflow: hidden; flex: none; }
.lang button {
  background: transparent; border: 0; color: var(--header-ink-2); cursor: pointer;
  min-height: var(--tap); min-width: var(--tap); padding: 0 10px; font-size: 12px; letter-spacing: .06em; font-weight: 600;
}
.lang button + button { border-left: 1px solid var(--header-line); }
.lang button[aria-pressed="true"] { background: rgba(255,255,255,0.14); color: var(--header-ink); }
.lang button:hover { color: var(--header-ink); }

/* view tabs */
.views { display: flex; gap: 4px; padding: 0 22px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
.view-tab {
  background: transparent; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px;
  min-height: var(--tap); padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--ink-2); letter-spacing: .01em;
  text-decoration: none; display: inline-flex; align-items: center; white-space: nowrap;
}
.view-tab:hover { color: var(--ink); background: var(--surface-2); }
.view-tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.view-tab:focus-visible { outline-offset: -3px; }

/* training: on every screen, impossible to miss, never alarming */
.training-band {
  display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 22px; font-size: 13px; letter-spacing: .02em; text-align: center;
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--warning) 22%, var(--surface)) 0 14px,
    color-mix(in srgb, var(--warning) 14%, var(--surface)) 14px 28px);
  color: var(--ink); border-bottom: 1px solid color-mix(in srgb, var(--warning) 50%, transparent);
}
.training-band b { letter-spacing: .14em; font-weight: 700; }

/* ------------------------------------------------------------------ screens */
main { padding: 20px 22px 120px; }
.sheet {
  max-width: 1040px; margin: 0 auto; background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow);
}
.sheet-head {
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px;
  padding: 16px 20px 14px; border-bottom: 1px solid var(--border);
}
.sheet-head h1 { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: .005em; }
.sheet-head .aside { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field-inline { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.field-inline select { min-width: 180px; }
input[type=text], input[type=search], input[type=password], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 0 12px; min-height: var(--tap); font-size: 15px; min-width: 0; color: var(--ink);
}
select { padding-right: 28px; }
select.unset { color: var(--muted); }
.needs { box-shadow: 0 0 0 2px color-mix(in srgb, var(--warning) 60%, transparent); }

/* search */
.search { position: relative; padding: 16px 20px 6px; }
.search input {
  width: 100%; min-height: 54px; font-size: 17px; padding: 0 16px 0 44px; border-radius: 10px;
  background: var(--surface-2);
}
.search input:focus { background: var(--surface); }
.search .glass { position: absolute; left: 36px; top: 33px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search .hint { font-size: 12.5px; color: var(--muted); margin: 6px 2px 0; }
.sugg {
  position: absolute; left: 20px; right: 20px; top: calc(100% - 26px); z-index: 30;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
  padding: 6px; max-height: min(420px, 60vh); overflow-y: auto;
}
.sugg .sg-note { padding: 10px 12px; font-size: 13.5px; color: var(--ink-2); }
.sg {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: center;
  width: 100%; text-align: left; border: 0; background: none; font: inherit; color: inherit;
  padding: 9px 12px; border-radius: 8px; min-height: 56px;
}
button.sg:hover, button.sg:focus-visible { background: var(--row-hover); }
.sg .sg-t { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg .sg-s { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg .sg-p { grid-row: 1 / 3; grid-column: 2; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
.sg.off { opacity: .55; cursor: default; }
.sg.off .sg-p { font-size: 12.5px; }
.sg-state {
  display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  border: 1px dashed var(--line); color: var(--ink-2); white-space: nowrap;
}

/* lines */
.lines { list-style: none; margin: 0; padding: 4px 20px 6px; }
.lines .empty { padding: 34px 10px 30px; text-align: center; color: var(--muted); font-size: 14px; }
.line {
  display: grid; align-items: center; gap: 4px 14px; padding: 14px 0; border-top: 1px solid var(--grid);
  grid-template-columns: minmax(0, 1fr) 150px 92px 130px var(--tap);
  grid-template-areas: "info price disc net x";
}
.line:first-child { border-top: 0; }
.l-info { grid-area: info; min-width: 0; }
.l-title { font-weight: 600; font-size: 15.5px; line-height: 1.3; overflow-wrap: anywhere; }
.l-title .dot { color: var(--muted); font-weight: 400; margin: 0 4px; }
.l-spec { font-size: 13px; color: var(--ink-2); margin-top: 2px; overflow-wrap: anywhere; }
.l-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 0 12px; font-size: 12.5px; color: var(--muted); }
.l-serial { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.l-seller-box { display: inline-flex; align-items: center; gap: 8px; }
.l-seller-box select { min-height: var(--tap); font-size: 13px; }
.l-price { grid-area: price; }
.l-disc { grid-area: disc; }
.l-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.l-cell > span { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.l-cell input { width: 100%; text-align: right; font-variant-numeric: tabular-nums; }
.l-cell .was { font-size: 11.5px; color: var(--muted); text-align: right; white-space: nowrap; }
.pct { position: relative; }
.pct input { padding-right: 26px; }
.pct::after { content: "%"; position: absolute; right: 10px; bottom: 11px; color: var(--muted); font-size: 14px; pointer-events: none; }
.l-net { grid-area: net; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 15.5px; font-weight: 600; }
.l-net .eq { color: var(--muted); font-weight: 400; margin-right: 4px; }
.l-x { grid-area: x; }
.l-x, .p-x { font-size: 18px; line-height: 1; color: var(--ink-2); padding: 0; }
.l-x:hover, .p-x:hover { color: var(--critical); }

.lines-tools { display: flex; justify-content: flex-end; padding: 0 20px 12px; gap: 8px; }

/* foot: client, total, next step */
.foot {
  position: sticky; bottom: 0; z-index: 20;
  display: flex; align-items: center; flex-wrap: wrap; gap: 12px 18px;
  padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface);
  border-radius: 0 0 6px 6px; box-shadow: 0 -8px 20px -14px rgba(0,26,74,.25);
}
.client-slot { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; }
.client-slot .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.total { margin-left: auto; text-align: right; }
.total .t-l { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.total .t-v { font-family: var(--serif); font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.total .t-v small { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }

/* payment */
.pay-body { padding: 16px 20px 6px; display: grid; gap: 18px; }
.pay-who { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 12px 14px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; }
.pay-rows { list-style: none; margin: 0; padding: 0; }
.pay-row {
  display: grid; grid-template-columns: minmax(0, 1fr) 220px var(--tap); gap: 12px; align-items: center;
  padding: 10px 0; border-top: 1px solid var(--grid);
}
.pay-row:first-child { border-top: 0; }
.pay-row .p-m { font-weight: 600; font-size: 15px; }
.pay-row .p-m small { color: var(--ink-2); font-weight: 500; margin-left: 6px; font-size: 13.5px; }
.pay-row input { text-align: right; width: 100%; font-variant-numeric: tabular-nums; font-size: 16px; }
.pay-add { display: flex; flex-wrap: wrap; gap: 8px; position: relative; }
.card-menu {
  display: inline-flex; gap: 6px; padding: 6px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); box-shadow: var(--shadow);
}
.pay-sum {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; font-size: 15px;
  padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2);
}
.pay-sum b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pay-sum .ok { color: var(--good-ink); font-weight: 600; margin-left: auto; }
.pay-sum .short { color: var(--ink); font-weight: 600; margin-left: auto; }
.cash-notice {
  padding: 11px 14px; border-radius: 8px; font-size: 14px; line-height: 1.45;
  border: 1px solid color-mix(in srgb, var(--warning) 55%, transparent);
  background: color-mix(in srgb, var(--warning) 12%, var(--surface));
}
.cash-notice b { margin-right: 4px; }
.fiscal { display: flex; flex-direction: column; gap: 4px; max-width: 320px; }
.fiscal span { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.why { font-size: 13px; color: var(--ink-2); margin-right: auto; }

/* receipt */
.receipt-wrap { max-width: 560px; margin: 0 auto; }
.receipt-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 14px; }
.receipt-head h1 { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 600; }
.receipt-head .ok { color: var(--good-ink); font-weight: 600; font-size: 14px; }
.receipt {
  background: #FFFFFF; color: #001A4A; border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow);
  overflow: hidden;
}
.receipt .rc-mast { background: #001A4A; padding: 18px 22px; display: flex; justify-content: center; }
.receipt .rc-mast img { height: 38px; width: auto; display: block; }
.receipt .rc-body { padding: 18px 26px 22px; font-size: 14px; line-height: 1.55; }
.receipt .rc-line { white-space: pre-wrap; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.receipt .rc-train {
  margin: -18px -26px 14px; padding: 8px 26px; text-align: center; font-weight: 700; letter-spacing: .14em; font-size: 12.5px;
  background: repeating-linear-gradient(135deg, #F3E6CD 0 14px, #F8EFDD 14px 28px); border-bottom: 1px solid #E2C99A;
}
.receipt .rc-brand { display: none; }           /* the logo above says it */
.receipt .rc-addr { color: #5B6478; text-align: center; margin-bottom: 10px; }
.receipt .rc-ticket { font-family: var(--serif); font-size: 17px; font-weight: 600; text-align: center; }
.receipt .rc-who { color: #5B6478; text-align: center; }
.receipt .rc-who:last-of-type { margin-bottom: 12px; }
.receipt .rc-item { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #C6D0E2; font-weight: 600; }
.receipt .rc-amt { text-align: right; color: #5B6478; }
.receipt .rc-total {
  margin-top: 12px; padding-top: 10px; border-top: 1px solid #001A4A;
  font-family: var(--serif); font-size: 19px; font-weight: 600; display: flex; justify-content: space-between;
}
.receipt .rc-pay { display: flex; justify-content: space-between; color: #5B6478; }
.receipt .rc-mono { display: block; width: 26px; margin: 16px auto 0; opacity: .5; }
.receipt-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; justify-content: flex-end; }

.muted { color: var(--muted); font-size: 13.5px; }
.notice-box { max-width: 640px; margin: 20px auto; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }

/* -------------------------------------------------------- Task 8: dialogs */
.btn.danger { background: var(--critical); color: #FFFFFF; border-color: var(--critical); }
.btn.danger:hover:not(:disabled) { opacity: .9; background: var(--critical); }
.modal-wrap { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal-wrap.confirm { z-index: 80; }
.modal-scrim { position: fixed; inset: 0; background: rgba(0,8,24,.45); }
.modal {
  position: relative; width: min(620px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.28);
}
.confirm .modal { width: min(460px, 100%); }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 18px; border-bottom: 1px solid var(--grid); }
.modal-head h3 { flex: 1; min-width: 0; margin: 0; font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.3; }
.close { font-size: 22px; line-height: 1; }
.modal-body { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-body p { margin: 0; line-height: 1.5; }
.modal-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--grid); }

/* ---------------------------------------------- the client on a sale */
.client-chip { display: inline-flex; align-items: baseline; gap: 2px; padding: 0 4px; font-size: 14px; max-width: 100%; overflow-wrap: anywhere; }
.client-chip .cid, .cc-name .cid { color: var(--muted); font-weight: 500; font-size: 13px; font-family: var(--sans); }
.no-crm { font-size: 13px; color: var(--ink-2); padding: 4px 10px; border: 1px dashed var(--line); border-radius: 8px; }
.cpbox { width: min(700px, 100%); }
.cp-search input { width: 100%; min-height: 50px; font-size: 16px; background: var(--surface-2); }
.cl-list { display: flex; flex-direction: column; gap: 2px; }
.cl-row {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; width: 100%;
  border: 0; background: none; border-radius: 8px; padding: 8px 12px; min-height: 52px;
}
.cl-row:hover, .cl-row.on { background: var(--row-hover); }
.cl-name { font-weight: 600; font-size: 15px; }
.cl-meta { font-size: 12.5px; color: var(--ink-2); }
.client-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.cc-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; }
.cc-name { margin: 0; font-family: var(--serif); font-size: 19px; font-weight: 600; flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
.cc-crm { text-decoration: none; }
.cc-owner { font-size: 14px; }
.cc-owner .k { color: var(--ink-2); }

/* ---------------------------------------------------------------- tickets */
.tk-pad { padding: 12px 20px; margin: 0; }

  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--warning) 16%, var(--surface)) 0 14px, color-mix(in srgb, var(--warning) 9%, var(--surface)) 14px 28px); }
.tk-sum { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 10px 20px; font-size: 14.5px; border-bottom: 1px solid var(--grid); }

.tk-row {
  display: grid; align-items: center; gap: 2px 12px; padding: 10px 8px; min-height: 52px;
  grid-template-columns: 88px 92px 80px 100px minmax(0, 1.2fr) minmax(0, 1.4fr) 112px 92px;

.tk-status { display: inline-flex; }
.tk-pager { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 6px 20px 16px; }
@media (max-width: 900px) {
  .tk-filters { grid-template-columns: repeat(6, minmax(0, 1fr)); }

  .tk-headrow { display: none; }
  .tk-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "no net" "client st" "meta meta"; }
  .tk-no { grid-area: no; } .tk-net { grid-area: net; } .tk-client { grid-area: client; } .tk-row > .tk-st { grid-area: st; justify-self: end; }

  .tk-row { grid-template-columns: auto auto minmax(0, 1fr) auto; grid-template-areas: "no no no net" "client client client st" "date src seller seller" "items items items items"; }
  .tk-date { grid-area: date; } .tk-src { grid-area: src; } .tk-seller { grid-area: seller; } .tk-items { grid-area: items; font-size: 12.5px; color: var(--ink-2); }
}

.tk-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 20px 16px; }

/* ------------------------------------------------------------------- toast */
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--page); padding: 11px 20px; border-radius: 999px;

}

:root[data-theme="dark"] .watermark.light, html[data-theme="auto"].sysdark .watermark.light { display: none; }
:root[data-theme="dark"] .watermark.dark, html[data-theme="auto"].sysdark .watermark.dark { display: block; }
