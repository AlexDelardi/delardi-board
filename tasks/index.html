<style>
/* Delardi UI kit. Palette only, radius 0, no shadows, no dark mode. */
:root {
  --navy: #082966; --navy-deep: #001A4A; --slate: #5B6478; --sky: #8FA8CC;
  --mist: #D3DCE9; --card: #EEF1F7; --white: #FFFFFF; --alert: #8C2F2F;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, serif;
  --sans: "Evolventa", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --tap: 44px; --radius: 0;
  /* legacy aliases, literal hex on purpose (qa/ui-foundations.cjs reads them) */
  --page: #FFFFFF; --surface: #FFFFFF; --surface-2: #EEF1F7;
  --ink: #001A4A; --ink-2: #5B6478; --muted: #5B6478;
  --line: #D3DCE9; --grid: #D3DCE9; --border: #D3DCE9;
  --focus: #082966; --critical: #8C2F2F;
}
* { box-sizing: border-box; border-radius: 0; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #FFFFFF; color: var(--navy-deep); font: 15px/1.5 var(--sans); }
:focus-visible { outline: 2px solid #082966; outline-offset: 2px; }
.kit-head :focus-visible { outline-color: #8FA8CC; }
.kit-head .kit-menu :focus-visible { outline-color: #082966; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Header bar */
.kit-head { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 24px; background: var(--navy-deep); color: var(--white); position: relative; z-index: 50; }
.kit-brand { display: inline-flex; align-items: center; min-height: var(--tap); color: var(--white); text-decoration: none; font: 13px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; }
.kit-brand img, .kit-brand svg { display: block; height: 18px; width: auto; }
.kit-rule { width: 1px; align-self: stretch; margin: 12px 0; background: var(--sky); }
.kit-staff { min-width: 0; max-width: 200px; overflow: hidden; text-overflow: ellipsis; color: var(--white); font: 14px/1.2 var(--sans); white-space: nowrap; }
.kit-tool { font: normal 19px/1.2 var(--serif); color: var(--white); }
.kit-spacer { flex: 1 1 auto; }
.kit-head a { color: var(--white); }
.kit-hbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); min-width: var(--tap); padding: 0 16px; background: transparent; color: var(--white); border: 1px solid rgba(143, 168, 204, .45); font: 15px/1 var(--sans); cursor: pointer; text-decoration: none; }
.kit-hbtn:hover { border-color: var(--sky); }
.kit-lang { display: inline-flex; }
.kit-lang .kit-hbtn { padding: 0 12px; min-width: var(--tap); }
.kit-lang .kit-hbtn + .kit-hbtn { border-left-width: 0; }
.kit-lang .kit-hbtn[aria-pressed="true"], .kit-lang .kit-hbtn.on { background: var(--navy); border-color: var(--sky); font-weight: 700; }
.kit-tool-wrap, [data-kit-menu] { position: relative; }
.kit-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 60; min-width: 200px; margin: 0; padding: 0; list-style: none; background: var(--white); color: var(--navy-deep); border: 1px solid var(--mist); border-top: 2px solid var(--navy); }
.kit-menu a, .kit-menu span { display: flex; align-items: center; min-height: var(--tap); padding: 0 16px; color: var(--navy-deep); text-decoration: none; font: 15px/1.5 var(--sans); }
.kit-menu a:hover { background: var(--card); }
.kit-menu [aria-current="page"] { font-weight: 700; color: var(--navy); background: var(--card); }
.kit-menu [aria-disabled="true"] { color: var(--navy-deep); opacity: .45; cursor: not-allowed; }

/* Tabs */
.kit-tabs { display: flex; gap: 28px; padding: 0 24px; background: var(--white); border-bottom: 1px solid var(--mist); }
.kit-tab { display: inline-flex; align-items: center; min-height: 48px; padding: 0; background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--slate); font: 15px/1.5 var(--sans); cursor: pointer; text-decoration: none; }
.kit-tab:hover { color: var(--navy); }
.kit-tab[aria-current="page"] { color: var(--navy); font-weight: 700; border-bottom-color: var(--navy); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; background: var(--white); color: var(--navy); border: 1px solid var(--navy); font: 700 15px/1.2 var(--sans); cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--card); }
.btn.primary { background: var(--navy); color: var(--white); border-color: var(--navy); }
.btn.primary:hover { background: var(--navy-deep); border-color: var(--navy-deep); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--navy); font-weight: 400; text-decoration: underline; }
.btn.quiet:hover { background: var(--card); }
.btn.danger { background: var(--white); color: var(--alert); border-color: var(--alert); }
.btn.danger:hover { background: var(--alert); color: var(--white); }
.btn.big { min-height: 52px; padding: 0 24px; font-size: 17px; }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--card); color: var(--slate); border-color: var(--mist); cursor: not-allowed; text-decoration: none; }

/* Fields */
input, select, textarea { width: 100%; min-height: var(--tap); padding: 8px 12px; background: var(--white); color: var(--navy-deep); border: 1px solid var(--sky); font: 15px/1.5 var(--sans); }
textarea { min-height: 96px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--slate); }
input:disabled, select:disabled, textarea:disabled { background: var(--card); color: var(--slate); border-color: var(--mist); }
input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--alert); border-width: 2px; }
input[type="checkbox"], input[type="radio"] { width: 20px; min-height: 20px; padding: 0; accent-color: var(--navy); }
.lbl { display: block; margin: 0 0 4px; color: var(--slate); font: 700 12px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; }

/* Type */
.title { margin: 0 0 16px; font: normal 28px/1.25 var(--serif); color: var(--navy-deep); }
.h2 { margin: 0 0 12px; font: normal 21px/1.3 var(--serif); color: var(--navy-deep); }
.item { font: normal 17px/1.35 var(--serif); color: var(--navy-deep); overflow-wrap: anywhere; }
.keynum { font: normal 32px/1.1 var(--serif); color: var(--navy-deep); font-variant-numeric: tabular-nums; }
.small { font: 13px/1.45 var(--sans); color: var(--slate); }

/* Table */
.tbl { width: 100%; border-collapse: collapse; font: 15px/1.5 var(--sans); }
.tbl thead th { padding: 12px; background: var(--card); color: var(--slate); text-align: left; font: 700 12px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid var(--mist); }
.tbl tbody tr { height: 48px; }   /* a row height is a minimum in a table; td min-height does nothing */
.tbl td { padding: 12px; border-bottom: 1px solid var(--mist); vertical-align: middle; }
.tbl th.r, .tbl td.r, .tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tbody tr:hover { background: var(--card); }

/* Tags */
.tag { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border: 1px solid var(--navy); color: var(--navy); background: var(--white); font: 700 12px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.tag.act { background: var(--navy); color: var(--white); border-color: var(--navy); }
.tag.info { background: var(--card); color: var(--navy); border-color: var(--card); }
.tag.done { background: var(--white); color: var(--slate); border-color: var(--mist); }
.tag.line { background: var(--white); color: var(--navy); border-color: var(--navy); }
.tag.alert { background: var(--white); color: var(--alert); border-color: var(--alert); }

/* Band and notice */
.band { padding: 12px 24px; background: var(--card); color: var(--navy); font: 13px/1.45 var(--sans); }
.band .lbl { display: inline; margin: 0 12px 0 0; color: var(--navy); }
.notice { padding: 12px 16px; background: var(--card); color: var(--navy); border: 1px solid var(--mist); font: 15px/1.5 var(--sans); }

/* Detail panel (right) */
.panel-wrap { position: fixed; inset: 0; z-index: 100; display: flex; justify-content: flex-end; }
.panel-scrim { position: absolute; inset: 0; background: rgba(0, 26, 74, .4); }
.panel { position: relative; width: 560px; max-width: 100%; height: 100%; overflow-y: auto; padding: 24px; background: var(--white); color: var(--navy-deep); border-top: 2px solid var(--navy); }
@media (max-width: 599px) { .panel { width: 100%; } }

/* Modal (centred) */
.modal-wrap { position: fixed; inset: 0; z-index: 110; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-scrim { position: absolute; inset: 0; background: rgba(0, 26, 74, .4); }
.modal { position: relative; width: 640px; max-width: 100%; max-height: 100%; overflow-y: auto; padding: 24px; background: var(--white); color: var(--navy-deep); border: 1px solid var(--mist); border-top: 2px solid var(--navy); }
.modal.confirm { width: 480px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 120; max-width: calc(100% - 32px); padding: 12px 16px; background: var(--navy-deep); color: var(--white); font: 15px/1.5 var(--sans); }
.toast.err { background: var(--white); color: var(--alert); border: 1px solid var(--alert); }

/* Lock card */
.gate { position: fixed; inset: 0; overflow-y: auto; z-index: 115; min-height: 100vh; display: flex; padding: 24px; background: var(--card); }
.gate-card { margin: auto; width: 100%; max-width: 400px; background: var(--white); border: 1px solid var(--mist); }
.gate-mast { padding: 24px; background: var(--navy-deep); color: var(--white); font: 13px/1.4 var(--sans); letter-spacing: .18em; text-transform: uppercase; }
.gate-card > :not(.gate-mast) { margin-left: 24px; margin-right: 24px; }
.gate-card > :last-child { margin-bottom: 24px; }
.gate-card > .gate-mast + * { margin-top: 24px; }

/* ---- phone header (up to 599 px; guideline v2 section 4) ----
   A tool adds .phone to its header.top and draws a .menu-btn in place of the bar's controls; kitPhoneMenu() (ui/tools.js)
   builds .head-menu, the navy panel that slides in from the right over a scrim. The navy row scrolls away and the tabs stay pinned on one row that swipes sideways. */
.menu-btn { padding: 0; }
.menu-bars, .menu-bars::before, .menu-bars::after { display: block; width: 20px; height: 2px; background: var(--white); }
.menu-bars { position: relative; }
.menu-bars::before, .menu-bars::after { content: ""; position: absolute; left: 0; }
.menu-bars::before { top: -6px; } .menu-bars::after { top: 6px; }
.head-menu { position: fixed; inset: 0; z-index: 90; }
.head-scrim { position: absolute; inset: 0; background: rgba(0, 26, 74, .4); }
.head-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(320px, 86vw); display: flex; flex-direction: column; align-items: stretch; gap: 16px; padding: 76px 16px 24px; overflow-y: auto; background: #001A4A; color: #FFFFFF; border-left: 1px solid rgba(143, 168, 204, .45); animation: head-panel-in .16s ease-out; }
@keyframes head-panel-in { from { transform: translateX(100%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .head-panel { animation: none; } }
.head-panel :focus-visible { outline: 2px solid #8FA8CC; outline-offset: 2px; }
.head-panel .head-close { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; min-height: 44px; padding: 0; font-size: 24px; line-height: 1; }
.head-panel .kit-staff { position: absolute; top: 16px; left: 16px; right: 72px; max-width: none; min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 700; white-space: normal; }
/* the tools are a plain list here: no second tap */
.head-panel .kit-tool-wrap { display: block; position: static; }
.head-panel .kit-tool-wrap > button { display: none; }
.head-panel .kit-menu, .head-panel .kit-menu[hidden] { display: block; position: static; min-width: 0; margin: 0; background: transparent; color: #FFFFFF; border: 0; border-top: 1px solid rgba(143, 168, 204, .45); }
.head-panel .kit-menu li { border-bottom: 1px solid rgba(143, 168, 204, .45); }
.head-panel .kit-menu a, .head-panel .kit-menu span { min-height: 48px; padding: 0 4px; color: #FFFFFF; background: transparent; }
.head-panel .kit-menu a:hover { background: #082966; }
.head-panel .kit-menu [aria-current="page"] { color: #8FA8CC; background: transparent; font-weight: 700; }
.head-panel .kit-menu [aria-disabled="true"] { color: #FFFFFF; opacity: .45; }
.head-panel .kit-menu :focus-visible { outline-color: #8FA8CC; }
.head-panel > .kit-hbtn:not(.head-close), .head-panel > .hbtn { width: 100%; justify-content: center; }
.head-panel .kit-lang { display: flex; }
.head-panel .kit-lang .kit-hbtn { flex: 1 1 0; }
.top.phone { top: -56px; }
.top.phone .kit-head { flex-wrap: nowrap; height: 56px; min-height: 56px; padding: 0 8px 0 16px; gap: 10px; }
.top.phone .kit-tool { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.top.phone .kit-tabs { flex-wrap: nowrap; gap: 0; padding: 0 6px; overflow-x: auto; scrollbar-width: none; }
.top.phone .kit-tabs::-webkit-scrollbar { display: none; }
.top.phone .kit-tab { padding: 0 10px; min-width: var(--tap); justify-content: center; flex: 0 0 auto; }
.top.phone .band { padding: 6px 16px; line-height: 1.35; }
.top.phone .band .lbl { margin-right: 8px; }


/* ===========================================================================
   Delardi task tracker. The look is the shared UI kit above (ui/kit.css, inlined by
   build.py); what follows is the tracker's layout only, written with kit tokens:
   palette colours, square corners, no shadows, no dark mode. iPad first:
   every control is a 44 px target, nothing scrolls sideways at 768 or 1024.
   ========================================================================= */
body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
html { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ------------------------------------------------------------------ header */
.top { position: sticky; top: 0; z-index: 40; background: var(--white); }
.top .kit-head { flex-wrap: wrap; }
.top .kit-tabs { overflow-x: auto; }
.top .kit-tab { white-space: nowrap; }
.top .kit-tab:focus-visible { outline-offset: -2px; }
@media (max-width: 900px) {                       /* portrait iPad, RU labels: still one row */
  .top .kit-head { gap: 8px; padding: 0 16px; }
  .top .kit-head .kit-hbtn { padding: 0 12px; }
  .top .kit-staff { max-width: 120px; }
}

/* ----------------------------------------------------------------- buttons */
.btn { min-width: var(--tap); white-space: nowrap; }
.btn.subtle { background: transparent; color: var(--slate); border-color: transparent; font-weight: 400; }
.btn.subtle:hover { background: var(--card); color: var(--navy); }

/* ------------------------------------------------------------------ screens */
main { padding: 24px 24px 96px; }
.screen { max-width: 1200px; margin: 0 auto; }
.screen-head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 16px; }
.screen-head .title { margin: 0; flex: 1 1 auto; color: var(--navy); }
.screen-head { justify-content: flex-end; margin-bottom: 8px; }
.screen-head .aside { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* -------------------------------------------------------------------- tasks */
/* The page is tinted and each task is a white card on it, so a task reads as one thing and the lists do not melt into
   the page. A card's left edge says what matters most about it: late, high priority, or neither. */
body { background: var(--card); }
.kit-tabs { background: var(--white); }
.top .kit-tab { min-width: var(--tap); justify-content: center; }
/* the seasonal mark keeps to its corner: the head's button stops short of it */
.screen.in-season > .screen-head { padding-right: 150px; min-height: 48px; }
@media (max-width: 599px) { .screen.in-season > .screen-head { padding-right: 0; } .screen.in-season > .screen-head .title { padding-right: 56px; } }
.screen.wide { max-width: 1500px; }
.link { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; }
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 6px; border: 1px solid var(--mist); color: var(--slate); font: 700 12px/1 var(--sans); }
.kit-tab .count { margin-left: 8px; border-color: currentColor; color: inherit; }
.sec-title { display: flex; align-items: center; gap: 10px; margin: 28px 0 8px; color: var(--navy); font: 400 21px/1.3 var(--serif); }
.sec-title.late { color: var(--alert); }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.task { display: flex; align-items: stretch; gap: 8px; padding: 0 12px 0 14px; background: var(--white); border: 1px solid var(--mist); border-left: 4px solid var(--sky); }
.task.is-high { border-left-color: var(--navy); }
.task.is-late { border-left-color: var(--alert); }
.task.is-done { border-left-color: var(--mist); background: transparent; }
.task-open { flex: 1 1 auto; min-width: 0; min-height: var(--tap); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 8px 12px 0; background: none; border: 0; text-align: left; }
.task-open:hover .task-title, .task-open:focus-visible .task-title { text-decoration: underline; text-underline-offset: 3px; }
.task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.meta-bit { color: var(--slate); font: 13px/1.4 var(--sans); }
.meta-bit.late { color: var(--alert); font-weight: 700; }
.task.is-done .task-title { color: var(--slate); text-decoration: line-through; }
.task .quick { flex: 0 0 auto; align-self: center; min-height: var(--tap); padding: 0 14px; font-size: 13px; }
.client-tag { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13px; }
/* two or more buttons side by side, the one in use filled */
.seg { display: inline-flex; flex-wrap: wrap; }
.seg .btn { min-height: var(--tap); padding: 0 14px; font-size: 13px; font-weight: 700; }
.seg .btn + .btn { margin-left: -1px; }
.seg .btn[aria-pressed="true"] { position: relative; background: var(--navy); border-color: var(--navy); color: #fff; }
.kit-tabs .kit-spacer { flex: 1 1 auto; }
.ribbon-switch { padding: 4px 0; }
/* the Team screen */
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin: 0 0 16px; }
.filter { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
.filter.grow { flex: 1 1 220px; }
.cols { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 20px; align-items: start; }
.col { min-width: 0; }
.col-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0; padding: 10px 0; border-bottom: 2px solid var(--navy); color: var(--navy); font: 700 13px/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; }
.col .tasks { margin-top: 10px; }
.col .task { flex-direction: column; gap: 0; padding-bottom: 12px; }
.col .task .quick { align-self: flex-start; }
.col .empty { padding: 12px 0; }
.col { padding: 0 6px 12px; margin: 0 -6px; border-radius: 4px; min-height: 120px; }
.col.is-over { background: var(--mist); outline: 2px dashed var(--navy); outline-offset: 2px; }
.col .task[draggable="true"] { cursor: grab; }
.col .task.is-dragging { opacity: .45; }
#drag-hint { margin: 12px 0 0; }
.col-title .count, .sec-title .count { background: var(--white); }
@media (max-width: 1099px) {                      /* iPad and below: the scopes stack, each a plain list */
  .cols { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .col { min-height: 0; }
  #drag-hint { display: none; }
  .col .task { flex-direction: row; gap: 8px; padding-bottom: 0; }
  .col .task .quick { align-self: center; }
}
/* the inbox */
.sugs { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.sug { padding: 16px; background: var(--white); border: 1px solid var(--mist); border-left: 4px solid var(--sky); display: flex; flex-direction: column; gap: 6px; }
.sug p { margin: 0; }
.sug-note { white-space: pre-wrap; overflow-wrap: anywhere; }
.sug-target { color: var(--navy); font-weight: 700; }
.sug-act { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; margin-top: 8px; }
/* the task panel */
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -8px -8px 8px 0; }
.panel-head .h2 { margin: 0; }
.panel-head .close { font-size: 22px; line-height: 1; }
.task-form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
textarea { resize: vertical; }
.steps, .chips, .found, .comment-list, .history ul { list-style: none; margin: 0; padding: 0; }
.step { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--mist); }
.step-l { flex: 1 1 auto; min-width: 0; min-height: var(--tap); display: flex; align-items: center; gap: 10px; overflow-wrap: anywhere; }
.step.ticked .step-l span { color: var(--slate); text-decoration: line-through; }
.step-x, .chip-x { flex: 0 0 auto; min-width: var(--tap); min-height: var(--tap); padding: 0; font-size: 20px; line-height: 1; }
.add-row { display: flex; gap: 8px; margin-top: 6px; }
.add-row.top { align-items: flex-start; }
.add-row input, .add-row textarea { flex: 1 1 auto; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 2px; padding-left: 12px; background: var(--card); min-height: var(--tap); }
.screen .notice { background: var(--white); }
.filters { padding: 12px 14px; background: var(--white); border: 1px solid var(--mist); }
.chip a { color: var(--navy); }
.found { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.found-pick { width: 100%; justify-content: space-between; gap: 12px; font-weight: 400; text-align: left; }
.check { display: flex; align-items: center; gap: 10px; min-height: var(--tap); }
.form-err { margin: 0; color: var(--alert); font-weight: 700; }
.form-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding-top: 4px; }
.from-board { margin: 16px 0 0; }
.comments { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--mist); }
.comments .lbl { margin: 0 0 8px; }
.comment { padding: 8px 0; border-bottom: 1px solid var(--mist); }
.comment p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.history { margin-top: 20px; }
.history summary { min-height: var(--tap); display: flex; align-items: center; cursor: pointer; color: var(--navy); font-weight: 700; }
.history li { padding: 3px 0; overflow-wrap: anywhere; }
input[aria-invalid="true"] { border-color: var(--alert); outline: 1px solid var(--alert); }

/* ----------------------------------------------------------------- dialogs */
.modal-wrap { padding: 24px; }                  /* stacking is the kit's: panel 100, modal 110, gate 115, toast 120 */
.modal-scrim { position: fixed; }
.modal { padding: 0; width: 640px; max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
.modal.confirm, .confirm .modal { width: 480px; }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 24px; border-bottom: 1px solid var(--mist); }
.modal-head h3 { flex: 1; min-width: 0; margin: 0; font: normal 21px/1.3 var(--serif); color: var(--navy-deep); }
.modal-head .close { font-size: 22px; line-height: 1; }
.modal-body { padding: 16px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-body p { margin: 0; line-height: 1.5; }
.modal-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--mist); }

/* ---------------------------------------------------------- lock card */
#app.gated { pointer-events: none; user-select: none; }
#gate.gate { min-height: 0; }
.gate-mast { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 16px 24px; margin-bottom: 24px; }
.gate-card > .gate-mast + * { margin-top: 0; }
.gate-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.gate-mast img { height: 22px; width: auto; display: block; }
.gate-mast .kit-hbtn { letter-spacing: .06em; }
.gate-card label { display: block; margin-bottom: 16px; }
.gate-card label .lbl { margin-bottom: 4px; }
.gate-card input { width: 100%; }
.gate-card .err { margin-bottom: 12px; color: var(--alert); font-size: 13px; font-weight: 700; }
.gate-card > .btn { display: flex; width: calc(100% - 48px); }
.gate-card .gate-foot { margin-top: 12px; text-align: center; }

/* ------------------------------------------------------------------- toast */
.toast { opacity: 0; pointer-events: none; transition: opacity .18s; }
.toast.show { opacity: 1; }

/* ---------------------------------------------------- narrower: portrait iPad */
@media (max-width: 900px) {
  main { padding: 16px 16px 96px; }
}
@media (max-width: 720px) {
  .modal-wrap { padding: 0; align-items: flex-end; }
  .modal, .modal.confirm, .confirm .modal { width: 100%; max-height: 92vh; }
  .hide-sm { display: none !important; }
}
/* ---------------------------------------------------------------- seasonal mark
   One decoration in the top right corner of a screen, on the title's line and never over it. */
.screen.in-season { position: relative; }
.screen.in-season > .title { padding-right: 144px; min-height: 48px; }
.season-mark { position: absolute; top: -6px; right: 0; display: inline-flex; align-items: flex-start; gap: 4px; pointer-events: none; user-select: none; }
.season-mark img { display: block; pointer-events: none; }
.season-mark img[data-k="mini"] { margin-top: 12px; }
@media (max-width: 599px) { .screen.in-season > .title { padding-right: 48px; min-height: 0; } .season-mark { top: 0; } }
@media print { .season-mark { display: none; } }
/* ------------------------------------------------------------ phone (up to 599 px)
   One slim navy row with a menu button; the tabs on one row that swipes sideways and stays pinned; the period picker
   under them, scrolling away with the page; tables keep their first column; charts are drawn at the phone's width. */
.head-panel .cur-switch { margin: 0; padding: 0; display: flex; }
.head-panel .cur-switch .btn { flex: 1 1 0; }
.head-panel .cur-switch .btn { background: transparent; color: var(--white); border-color: rgba(143, 168, 204, .45); }
.head-panel .cur-switch .btn[aria-pressed="true"] { background: var(--navy); border-color: var(--sky); }
.period-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 4px 16px; border-bottom: 1px solid var(--mist); background: var(--white); }
.period-bar .cur-switch { margin-right: 0; flex: 0 0 auto; }
.period-bar .cur-switch .btn { padding: 0 10px; }
.period-bar .month-picker { flex: 1 1 212px; min-width: 0; }   /* beside the period switch when there is room for the month, under it when not */
.period-bar .month-picker select { flex: 1 1 0; min-width: 0; width: 100%; max-width: 220px; padding-left: 8px; padding-right: 4px; }
@media (max-width: 599px) {
  main { padding: 12px 16px 96px; }
  main, .screen, .screen > * { min-width: 0; }
  .screen { max-width: 100%; }
  .title { font-size: 24px; }
  .facts, .in-grid { grid-template-columns: minmax(0, 1fr); }
  .tbl.tickets .btn { min-height: var(--tap); }
  /* a wide table scrolls inside its own box and its first column stays put */
  .table-wrap { max-width: 100%; }
  .table-wrap .tbl th:first-child, .table-wrap .tbl td:first-child { position: sticky; left: 0; z-index: 1; background: var(--white); min-width: 104px; max-width: 132px; white-space: normal; overflow-wrap: break-word; }
  .table-wrap .tbl thead th:first-child { background: var(--card); }
  .chart { padding: 10px 8px 4px; }
  .chart-tip { width: 180px; }
}
@media (max-width: 599px) {
  .screen-head { align-items: stretch; flex-direction: column; gap: 8px; }
  .screen-head .aside .btn { flex: 1 1 auto; }
  .filter { flex: 1 1 140px; min-width: 0; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .panel { padding: 16px; }
  .seg .btn { padding: 0 10px; }
  #ribbon-bar .ribbon-switch { display: flex; width: 100%; }
  #ribbon-bar .ribbon-switch .btn { flex: 1 1 0; }
  .task .quick { padding: 0 10px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<body>
<div id="app"></div>

function renderGate() {

/* --------------------------------------------------------------- idle lock
   Touch devices only: an iPad left on the counter for 15 minutes asks for the
   passcode again. The filters on screen are kept. */
let lastActive = Date.now(), lastSaved = 0;
function markActive() {
  lastActive = Date.now();
  if (!S.locked && lastActive - lastSaved > 20000) { lastSaved = lastActive; sstore(ACTIVE_KEY, lastActive); }
}
function activeNow() { lastActive = lastSaved = Date.now(); sstore(ACTIVE_KEY, lastActive); }
["pointerdown", "keydown", "touchstart", "wheel", "input"].forEach((ev) =>
  window.addEventListener(ev, markActive, { passive: true, capture: true }));
function idleCheck() {
  if (S.locked || !S.token || !touchDevice()) return;
  if (Date.now() - lastActive >= IDLE_MIN * 60000) lockDown(tr("Locked after {n} minutes without use.", { n: IDLE_MIN }));
}
setInterval(idleCheck, 30000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { if (!S.locked) sstore(ACTIVE_KEY, lastActive); return; }
  idleCheck();
});
window.addEventListener("pageshow", (e) => { if (e.persisted) idleCheck(); });

/* Delardi tools — the single sign-in, shared by the home page and every tool (ui/hub.js).
   One passcode on the home page gives one session (hub-api) that every tool's API accepts. It is kept in localStorage,
   so every tab on the device shares it; Lock, 8 hours, or 15 idle minutes on a touch device end it everywhere.
   A tool calls two things:
     kitHubAdopt(tool, key, opts)  at start: take the shared session as the tool's own, or go to the home page to sign in;
     kitHubGate(tool)              where it would draw its own passcode card: go to the home page instead.
   window.__HUB_OFF = true (tests only) switches both off, and the tool falls back to its own passcode card. */
const KIT_HUB_API = 'https://hugduzqwyqwryicfzipu.supabase.co/functions/v1/hub-api';
const KIT_HUB_KEY = 'delardi_session';        // localStorage: { token, name, expires_at, tools }
const KIT_HUB_ACTIVE = 'delardi_last_active'; // localStorage: last touch on any page, for the idle lock
const KIT_HUB_IDLE_MIN = 15;                  // touch devices only, as in every tool
let kitHubLeaving = false;

function kitHubOn() { return window.__HUB_OFF !== true; }
function kitHubTouch() { return window.matchMedia('(pointer: coarse)').matches; }
function kitHubGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function kitHubSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
function kitHubClear() { kitHubSet(KIT_HUB_KEY, null); kitHubSet(KIT_HUB_ACTIVE, null); }
function kitHubWrite(s) {
  kitHubSet(KIT_HUB_KEY, JSON.stringify({ token: s.token, name: s.name, expires_at: s.expires_at, tools: s.tools || {} }));
}
function kitHubIdle() {
  const last = Number(kitHubGet(KIT_HUB_ACTIVE) || 0);
  return kitHubTouch() && last > 0 && Date.now() - last >= KIT_HUB_IDLE_MIN * 60000;
}
// The shared session, or null: none, past its 8 hours, or left idle on a touch device (then it is dropped here).
function kitHubRead() {
  let s = null;
  try { s = JSON.parse(kitHubGet(KIT_HUB_KEY) || 'null'); } catch (e) { s = null; }
  if (!s || !s.token || !(new Date(s.expires_at).getTime() > Date.now())) return null;
  if (kitHubIdle()) { kitHubCall('lock', { token: s.token }); kitHubClear(); return null; }
  return s;
}
// May the signed-in person open this tool? Unknown (no shared session) counts as yes: the tool's API decides anyway.
function kitHubAllowed(tool) {
  if (!kitHubOn()) return true;
  let s = null;
  try { s = JSON.parse(kitHubGet(KIT_HUB_KEY) || 'null'); } catch (e) { s = null; }
  return !s || !s.tools || s.tools[tool] !== false;
}
// → { status, data }; status 0 when there was no answer. Never throws.
async function kitHubCall(action, body) {
  try {
    const res = await fetch(KIT_HUB_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
      body: JSON.stringify(Object.assign({ action: action }, body || {})) });
    let data = {};
    try { data = await res.json(); } catch (e) { /* empty body */ }
    return { status: res.status, data: data };
  } catch (e) { return { status: 0, data: {} }; }
}
let kitHubTick = 0;
function kitHubActive() {
  const now = Date.now();
  if (now - kitHubTick < 10000) return;
  kitHubTick = now;
  if (kitHubGet(KIT_HUB_KEY)) kitHubSet(KIT_HUB_ACTIVE, String(now));
}
// A tool sits one folder under the home page.
function kitHubHome(query) {
  if (kitHubLeaving) return;
  kitHubLeaving = true;
  location.replace('../' + (query ? '?' + query : ''));
}
// Nothing of the tool stays readable or usable while the page is on its way to the home page.
function kitHubCover() {
  if (document.getElementById('hub-cover')) return;
  const c = document.createElement('div');
  c.id = 'hub-cover';
  c.setAttribute('style', 'position:fixed;inset:0;z-index:2147483000;background:var(--bg,#EEF1F7);');
  (document.body || document.documentElement).appendChild(c);
  const app = document.getElementById('app');
  if (app) app.inert = true;
}
// Take the shared session as this tool's own. → true when the tool may start with it. With none, the page goes to
// the home page to sign in and comes back. opts.local: the tool keeps its session in localStorage, not sessionStorage.
// opts.crmKey: the tool also keeps a CRM session under this sessionStorage key (the till's client panel).
// opts.idleKey: where the tool keeps its own last-touch time for its idle lock (opts.local says which storage). The
//   shared session was just read as not idle, so arriving here is a touch: an old time left in the tab must not lock a
//   session signed in a moment ago.
// opts.active(): the tool's own "touched now". Called when another tab is being used, so a tool left open beside it
//   does not lock everyone out for being idle itself.
// opts.leaving(): called before this tab is sent to the home page because another tab locked or signed in afresh.
function kitHubAdopt(tool, key, opts) {
  if (!kitHubOn()) return false;
  const h = kitHubRead();
  if (!h) { kitHubCover(); kitHubHome('next=' + tool); return false; }
  const tools = h.tools || {};
  try {
    const st = opts && opts.local ? localStorage : sessionStorage;
    let cur = null;
    try { cur = JSON.parse(st.getItem(key) || 'null'); } catch (e) { cur = null; }
    if (!cur || cur.token !== h.token) {
      st.setItem(key, JSON.stringify({ token: h.token, name: h.name, expires_at: h.expires_at, can_edit: !!tools.crm_edit, can_manage: !!tools.catalogue_manage }));
    }
    if (opts && opts.idleKey) st.setItem(opts.idleKey, String(Date.now()));
    if (opts && opts.crmKey) {
      if (tools.crm) sessionStorage.setItem(opts.crmKey, JSON.stringify({ token: h.token, can_edit: !!tools.crm_edit, name: h.name, expires_at: h.expires_at }));
      else sessionStorage.removeItem(opts.crmKey);
    }
  } catch (e) { /* storage refused: the tool will ask the home page again */ }
  kitHubActive();
  kitHubCall('open', { token: h.token, tool: tool });            // the login log's line
  // Locked or signed in as someone else in another tab: this tab follows.
  window.addEventListener('storage', function (e) {
    if (e.key === KIT_HUB_ACTIVE) { if (e.newValue && opts && opts.active) { try { opts.active(); } catch (err) { /* the tool's own business */ } } return; }
    if (e.key !== KIT_HUB_KEY) return;
    const now = kitHubRead();
    if (!now || now.token !== h.token) {
      if (opts && opts.leaving) { try { opts.leaving(); } catch (err) { /* leave anyway */ } }
      kitHubCover(); kitHubHome(now ? '' : 'next=' + tool);
    }
  });
  return true;
}
// The tool has locked itself and would draw its passcode card. → true: the home page takes over (the tool draws
// nothing). The home page's API says which case it is: the person has no access to this tool (they stay signed in and
// are told so), or the session is over or was locked (signed out everywhere, sign in again and come back).
function kitHubGate(tool) {
  if (!kitHubOn()) return false;
  kitHubCover();
  if (kitHubLeaving) return true;
  const h = kitHubRead();
  if (!h) { kitHubClear(); kitHubHome('next=' + tool); return true; }
  kitHubCall('me', { token: h.token }).then(function (r) {
    if (r.status === 0) { kitHubHome(''); return; }              // no connection: the home page says so
    if (r.status === 200 && r.data.tools && !r.data.tools[tool]) {
      kitHubWrite({ token: h.token, name: r.data.name, expires_at: r.data.expires_at, tools: r.data.tools });
      kitHubHome('denied=' + tool);
      return;
    }
    const done = function () { kitHubClear(); kitHubHome('next=' + tool); };
    if (r.status === 200) kitHubCall('lock', { token: h.token }).then(done); else done();
  });
  return true;
}
if (kitHubOn()) {
  document.addEventListener('pointerdown', kitHubActive, true);
  document.addEventListener('keydown', kitHubActive, true);
}

// Delardi UI kit: tool switcher. No dependencies. Inlined ahead of each tool's own modules.
const KIT_TOOLS = [
  { id: 'sales', href: '../sales/', en: 'Sales', ru: 'Продажи' },
  { id: 'stock', href: '../stock/', en: 'Stock', ru: 'Склад' },
  { id: 'crm', href: '../crm/', en: 'Clients', ru: 'Клиенты' },
  { id: 'catalogue', href: '../catalogue/', en: 'Catalogue', ru: 'Каталог' },
  { id: 'tasks', href: '../tasks/', en: 'Tasks', ru: 'Задачи' },
  { id: 'perf', href: '../perf/', en: 'Performance', ru: 'Показатели' },
];

// Close functions of the menus that are open right now.
const kitOpenMenus = [];

// A tool calls this on lock: closes every open kit menu and detaches its listeners.
function kitCloseMenus() {
  for (const close of kitOpenMenus.slice()) close();
}

// A link that leaves the page can ask first. beforeLeave(href) returns a Promise:
// true follows the link, false stays. A modified click (new tab) is left alone.
function kitGuardLink(a, beforeLeave) {
  if (typeof beforeLeave !== 'function') return a;
  a.addEventListener('click', e => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    const href = a.href;
    Promise.resolve(beforeLeave(href)).then(go => { if (go) window.location.assign(href); });
  });
  return a;
}

// opts.beforeLeave: see kitGuardLink; asked before any tool link is followed.
function kitToolsMenu(currentId, lang, opts) {
  const beforeLeave = opts && opts.beforeLeave;
  const ru = lang === 'ru';
  const wrap = document.createElement('span');
  wrap.className = 'kit-tool-wrap';
  wrap.setAttribute('data-kit-menu', '');
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'kit-hbtn';
  btn.textContent = ru ? 'Инструменты' : 'Tools';
  btn.setAttribute('aria-expanded', 'false');
  const list = document.createElement('ul');
  list.className = 'kit-menu';
  list.hidden = true;
  for (const t of KIT_TOOLS) {
    const li = document.createElement('li');
    let item;
    if (t.id === currentId) {
      item = document.createElement('span');
      item.setAttribute('aria-current', 'page');
    } else if (typeof kitHubAllowed === 'function' && !kitHubAllowed(t.id)) {
      // signed in on the home page without access to this tool (ui/hub.js): listed, greyed, not a link
      item = document.createElement('span');
      item.setAttribute('aria-disabled', 'true');
      item.title = ru ? 'Нет доступа' : 'No access';
    } else {
      item = document.createElement('a');
      item.setAttribute('href', t.href);
      kitGuardLink(item, beforeLeave);
    }
    item.textContent = ru ? t.ru : t.en;
    li.appendChild(item);
    list.appendChild(li);
  }
  function close(refocus) {
    list.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('click', onDoc);
    const i = kitOpenMenus.indexOf(close);
    if (i >= 0) kitOpenMenus.splice(i, 1);
    if (refocus === true && btn.isConnected) btn.focus();
  }
  function open() {
    list.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    document.addEventListener('keydown', onKey);
    document.addEventListener('click', onDoc);
    kitOpenMenus.push(close);
  }
  function onKey(e) { if (e.key === 'Escape') close(true); }
  function onDoc(e) { if (!wrap.contains(e.target)) close(); }
  btn.addEventListener('click', e => { e.stopPropagation(); if (list.hidden) open(); else close(); });
  list.addEventListener('click', e => { if (e.target.closest && e.target.closest('a')) close(); });
  wrap.addEventListener('focusout', e => {
    if (!list.hidden && e.relatedTarget && !wrap.contains(e.relatedTarget)) close();
  });
  wrap.appendChild(btn);
  wrap.appendChild(list);
  return wrap;
}

// The phone menu: a panel that slides in from the right over a dimmed page, so the header and the tabs under it do not
// move. items: the tool's own controls, in order (the person, kitToolsMenu(...), the language switch, Lock ...).
// onClose: called for the close button and for a tap beside the panel; the tool closes the menu and redraws its header.
function kitPhoneMenu(items, lang, onClose) {
  const ru = lang === 'ru';
  const wrap = document.createElement('div');
  wrap.className = 'head-menu';
  wrap.id = 'head-menu';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', ru ? 'Меню' : 'Menu');
  const scrim = document.createElement('div');
  scrim.className = 'head-scrim';
  scrim.addEventListener('click', () => onClose());
  const panel = document.createElement('div');
  panel.className = 'head-panel';
  const close = document.createElement('button');
  close.type = 'button';
  close.className = 'kit-hbtn head-close';
  close.id = 'head-close';
  close.setAttribute('aria-label', ru ? 'Закрыть меню' : 'Close the menu');
  close.textContent = '\u00D7';
  close.addEventListener('click', e => { e.stopPropagation(); onClose(); });
  panel.appendChild(close);
  const add = kid => {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(add); return; }
    panel.appendChild(kid);
  };
  add(items);
  wrap.appendChild(scrim);
  wrap.appendChild(panel);
  // once it is in the page, focus goes into it
  requestAnimationFrame(() => { if (close.isConnected) close.focus(); });
  return wrap;
}

/* Delardi tools — the Christmas season, shared by every tool (see brand/christmas/README.md).
   From 20 November to 14 January, by itself:
     · a band of snowflakes across the top of every page of every tool;
     · the tree beside the passcode card on a lock screen, and on the tools hub;
     · where a tool asks for one, a mark beside a screen's title (seasonMarkEl): a fir sprig on a dashboard, a
       snowflake pair on a working screen, nothing on a form.
   All of it is decoration only: drawn in CSS or with empty alt text, hidden from screen readers, never clickable,
   never printed. The address can force it for a preview (?season=christmas) or switch it off (?season=off).

    if (!s || !s.token || new Date(s.expires_at).getTime() <= Date.now()) return false;
    const last = Number(sstore(ACTIVE_KEY) || 0);
    if (touchDevice() && last && Date.now() - last >= IDLE_MIN * 60000) { sstore(SESSION_KEY, null); return false; }
    S.token = s.token; S.name = s.name; S.expires_at = s.expires_at;
    return true;
  } catch (e) { return false; }
}

(async function boot() {
  document.documentElement.lang = LANG;
  if (restoreSession()) {
    S.locked = false; activeNow();
    await loadTasks();                             // a session that is no longer good locks the page from inside api()
    if (!S.locked && S.doc && S.doc.me) S.name = S.doc.me.name;
  }
  if (S.locked) $("#app").innerHTML = "";
  renderAll();
  renderGate();
})();
</script>
</body>
