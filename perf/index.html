<style>
/* Delardi UI kit. Palette only, radius 0, no shadows, no dark mode. */
:root {
  --navy: #082966; --navy-deep: #001A4A; --slate: #5B6478; --sky: #8FA8CC;
  --mist: #D3DCE9; --card: #EEF1F7; --white: #FFFFFF; --alert: #8C2F2F;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, serif;
  --sans: "Evolventa", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --tap: 44px; --radius: 0;
  /* legacy aliases, literal hex on purpose (qa/ui-foundations.cjs reads them) */
  --page: #FFFFFF; --surface: #FFFFFF; --surface-2: #EEF1F7;
  --ink: #001A4A; --ink-2: #5B6478; --muted: #5B6478;
  --line: #D3DCE9; --grid: #D3DCE9; --border: #D3DCE9;
  --focus: #082966; --critical: #8C2F2F;
}
* { box-sizing: border-box; border-radius: 0; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #FFFFFF; color: var(--navy-deep); font: 15px/1.5 var(--sans); }
:focus-visible { outline: 2px solid #082966; outline-offset: 2px; }
.kit-head :focus-visible { outline-color: #8FA8CC; }
.kit-head .kit-menu :focus-visible { outline-color: #082966; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Header bar */
.kit-head { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 24px; background: var(--navy-deep); color: var(--white); position: relative; z-index: 50; }
.kit-brand { display: inline-flex; align-items: center; min-height: var(--tap); color: var(--white); text-decoration: none; font: 13px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; }
.kit-brand img, .kit-brand svg { display: block; height: 18px; width: auto; }
.kit-rule { width: 1px; align-self: stretch; margin: 12px 0; background: var(--sky); }
.kit-staff { min-width: 0; max-width: 200px; overflow: hidden; text-overflow: ellipsis; color: var(--white); font: 14px/1.2 var(--sans); white-space: nowrap; }
.kit-tool { font: normal 19px/1.2 var(--serif); color: var(--white); }
.kit-spacer { flex: 1 1 auto; }
.kit-head a { color: var(--white); }
.kit-hbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); min-width: var(--tap); padding: 0 16px; background: transparent; color: var(--white); border: 1px solid rgba(143, 168, 204, .45); font: 15px/1 var(--sans); cursor: pointer; text-decoration: none; }
.kit-hbtn:hover { border-color: var(--sky); }
.kit-lang { display: inline-flex; }
.kit-lang .kit-hbtn { padding: 0 12px; min-width: var(--tap); }
.kit-lang .kit-hbtn + .kit-hbtn { border-left-width: 0; }
.kit-lang .kit-hbtn[aria-pressed="true"], .kit-lang .kit-hbtn.on { background: var(--navy); border-color: var(--sky); font-weight: 700; }
.kit-tool-wrap, [data-kit-menu] { position: relative; }
.kit-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 60; min-width: 200px; margin: 0; padding: 0; list-style: none; background: var(--white); color: var(--navy-deep); border: 1px solid var(--mist); border-top: 2px solid var(--navy); }
.kit-menu a, .kit-menu span { display: flex; align-items: center; min-height: var(--tap); padding: 0 16px; color: var(--navy-deep); text-decoration: none; font: 15px/1.5 var(--sans); }
.kit-menu a:hover { background: var(--card); }
.kit-menu [aria-current="page"] { font-weight: 700; color: var(--navy); background: var(--card); }

/* Tabs */
.kit-tabs { display: flex; gap: 28px; padding: 0 24px; background: var(--white); border-bottom: 1px solid var(--mist); }
.kit-tab { display: inline-flex; align-items: center; min-height: 48px; padding: 0; background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--slate); font: 15px/1.5 var(--sans); cursor: pointer; text-decoration: none; }
.kit-tab:hover { color: var(--navy); }
.kit-tab[aria-current="page"] { color: var(--navy); font-weight: 700; border-bottom-color: var(--navy); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; background: var(--white); color: var(--navy); border: 1px solid var(--navy); font: 700 15px/1.2 var(--sans); cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--card); }
.btn.primary { background: var(--navy); color: var(--white); border-color: var(--navy); }
.btn.primary:hover { background: var(--navy-deep); border-color: var(--navy-deep); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--navy); font-weight: 400; text-decoration: underline; }
.btn.quiet:hover { background: var(--card); }
.btn.danger { background: var(--white); color: var(--alert); border-color: var(--alert); }
.btn.danger:hover { background: var(--alert); color: var(--white); }
.btn.big { min-height: 52px; padding: 0 24px; font-size: 17px; }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--card); color: var(--slate); border-color: var(--mist); cursor: not-allowed; text-decoration: none; }

/* Fields */
input, select, textarea { width: 100%; min-height: var(--tap); padding: 8px 12px; background: var(--white); color: var(--navy-deep); border: 1px solid var(--sky); font: 15px/1.5 var(--sans); }
textarea { min-height: 96px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--slate); }
input:disabled, select:disabled, textarea:disabled { background: var(--card); color: var(--slate); border-color: var(--mist); }
input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--alert); border-width: 2px; }
input[type="checkbox"], input[type="radio"] { width: 20px; min-height: 20px; padding: 0; accent-color: var(--navy); }
.lbl { display: block; margin: 0 0 4px; color: var(--slate); font: 700 12px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; }

/* Type */
.title { margin: 0 0 16px; font: normal 28px/1.25 var(--serif); color: var(--navy-deep); }
.h2 { margin: 0 0 12px; font: normal 21px/1.3 var(--serif); color: var(--navy-deep); }
.item { font: normal 17px/1.35 var(--serif); color: var(--navy-deep); overflow-wrap: anywhere; }
.keynum { font: normal 32px/1.1 var(--serif); color: var(--navy-deep); font-variant-numeric: tabular-nums; }

  main { padding: 12px 16px 96px; }
  main, .screen, .screen > * { min-width: 0; }
  .screen { max-width: 100%; }
  .title { font-size: 24px; }
  .facts, .in-grid { grid-template-columns: minmax(0, 1fr); }
  .tbl.tickets .btn { min-height: var(--tap); }
  /* a wide table scrolls inside its own box and its first column stays put */
  .table-wrap { max-width: 100%; }
  .table-wrap .tbl th:first-child, .table-wrap .tbl td:first-child { position: sticky; left: 0; z-index: 1; background: var(--white); min-width: 104px; max-width: 132px; white-space: normal; overflow-wrap: break-word; }
  .table-wrap .tbl thead th:first-child { background: var(--card); }
  .chart { padding: 10px 8px 4px; }
  .chart-tip { width: 180px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

    else if (k === "text") n.textContent = v;
    else if (k === "value") n.value = v;
    else if (k === "html") n.innerHTML = v;        // fixed markup from this file only, never data
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);

/* --------------------------------------------------------------------- api */
// 20 s; window.__API_TIMEOUT_MS is a test-only override that can only shorten it.
function apiLimit() {
  const ms = Number(window.__API_TIMEOUT_MS);
  return ms > 0 && ms < 20000 ? ms : 20000;
}

async function api(action, body) {
  const payload = Object.assign({ action }, body || {});
  if (S.token && action !== "unlock") payload.token = S.token;
  // A request that hangs is cut after 20 s (window.__API_TIMEOUT_MS: test-only override),
  // so a busy panel can always be released.
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), apiLimit());
  let res, data = {};
  try {
    res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal: ctl.signal });
    // the timer stays on while the body is read
    try { data = await res.json(); } catch (e) { if (ctl.signal.aborted) throw e; /* empty body */ }
  } catch (e) {
    const err = new Error(ctl.signal.aborted ? tr("The server did not answer. Try again.") : tr("No connection. Check the Wi-Fi and try again."));
    err.status = 0;
    throw err;
  } finally {
    clearTimeout(timer);
  }
  if (!res.ok) {
    // A lost session locks the page; the filters on screen are kept.
    if (res.status === 401 && action !== "unlock") lockDown(data.error);
    const err = new Error(data.error ? tr(data.error) : tr("Request failed ({n})", { n: res.status }));
    err.status = res.status;
    err.raw = data.error || "";            // the server's sentence as sent, before any translation
    throw err;

}

/* ----------------------------------------------------------------- dialogs
   modal(id, title, body, foot): a sheet over the page (not inside #app, so a
   redraw of the page leaves it open). confirmBox() asks yes / no and resolves
   to true or false. */
function modal(id, title, body, foot, cls) {
  const old = document.getElementById(id);
  if (old) old.remove();
  const close = () => { const h = document.getElementById(id); if (h) h.remove(); };
  const host = el("div", { id, class: "modal-wrap" + (cls ? " " + cls : "") },
    el("div", { class: "modal-scrim", onclick: close }),
    el("section", { class: "modal" + (cls ? " " + cls : ""), role: "dialog", "aria-modal": "true", "aria-labelledby": id + "-title" },
      el("div", { class: "modal-head" },
        el("h3", { id: id + "-title", text: title }),
        el("button", { class: "btn subtle close", type: "button", id: id + "-close", "aria-label": tr("Close"), onclick: close, text: "×" })),
      el("div", { class: "modal-body" }, body),
      foot ? el("div", { class: "modal-foot" }, foot) : null));
  document.body.appendChild(host);
  return { host, close };
}
function confirmBox({ title, body, ok, cancel, danger }) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (done) return; done = true; m.close(); resolve(v); };
    const m = modal("confirm-dialog", title, [].concat(body).map((t) => typeof t === "string" ? el("p", { text: t }) : t), [
      el("button", { type: "button", class: "btn " + (danger ? "danger" : "primary"), id: "confirm-ok", onclick: () => finish(true) }, ok || tr("Yes")),
      el("button", { type: "button", class: "btn", id: "confirm-cancel", onclick: () => finish(false) }, cancel || tr("Cancel")),
    ], "confirm");
    // closing it any other way (×, the scrim, the lock) is a no
    new MutationObserver((_, obs) => { if (!m.host.isConnected) { obs.disconnect(); finish(false); } })
      .observe(document.body, { childList: true });
    setTimeout(() => { const b = $("#confirm-cancel"); if (b && !touchDevice()) b.focus(); }, 30);
  });
}

}, true);

/* ------------------------------------------------- one document per screen

   when the key on screen changes, the document is asked for again and an answer for an old key is dropped. */
function need(slot, action, params, key) {
  const cur = S[slot];
  if (cur && cur.key === key) return cur;
  const st = S[slot] = { key, doc: null, err: null };
  api(action, params).then((d) => { if (S[slot] === st && !S.locked) { st.doc = d; renderAll(); } },
    (e) => { if (S[slot] === st && !S.locked) { st.err = e.message; renderAll(); } });

  const pass = el("input", { type: "password", id: "gate-pass", autocomplete: "current-password" });
  const msg = S.gateMessage;
  const err = el("p", { class: "err", role: "alert", hidden: msg ? null : true, text: msg ? tr(msg) : "" });
  const btn = el("button", { class: "btn primary", type: "submit", text: tr("Unlock") });
  const submit = async (ev) => {
    ev.preventDefault();
    err.hidden = true;
    if (!pass.value.trim()) { err.textContent = tr("Enter your passcode."); err.hidden = false; return; }
    btn.disabled = true; btn.textContent = tr("Checking…");
    try {
      const r = await api("unlock", { passcode: pass.value });
      S.token = r.token; S.name = r.name; S.expires_at = r.expires_at;
      sstore(SESSION_KEY, JSON.stringify({ token: r.token, name: r.name, expires_at: r.expires_at }));
      S.locked = false; S.gateMessage = null;
      activeNow();
      await afterUnlock();
      renderAll();
      renderGate();
      toast(tr("Welcome, {name}", { name: r.name }));
    } catch (e) {
      if (S.token && e.status !== 401) { S.locked = false; S.err = e.message; renderAll(); renderGate(); return; }
      err.textContent = e.message; err.hidden = false;
      btn.disabled = false; btn.textContent = tr("Unlock");
      pass.value = ""; pass.focus();
    }
  };
  const card = el("form", { class: "gate-card", onsubmit: submit },
    el("div", { class: "gate-mast" },
      el("div", { class: "gate-brand" }, el("img", { src: LOGO_WORDMARK, alt: "Delardi" }), el("span", { text: tr("Boutique tools") })),
      langSwitch()),
    err,
    el("label", { for: "gate-pass" }, el("span", { class: "lbl", text: tr("Passcode") }), pass),
    btn,
    el("p", { class: "gate-foot small", text: tr("Opens Performance") }));
  document.body.appendChild(el("div", { class: "gate", id: "gate", role: "dialog", "aria-modal": "true", "aria-label": tr("Unlock") }, card));
  const app = $("#app");
  app.classList.add("gated");
  app.setAttribute("aria-hidden", "true");
  app.inert = true;
  setTimeout(() => pass.focus(), 60);
}
// Drop the token and ask for the passcode again. Nothing of the month stays in memory or on screen behind the card.
function lockDown(message) {
  S.token = null;
  sstore(SESSION_KEY, null);
  sstore(ACTIVE_KEY, null);
  S.locked = true;
  S.gateMessage = message || null;
  monthSeq++;
  S.doc = null; S.span = null; S.form = null; S.busy = false; S.err = null;
  S.yearDoc = null; S.brandDoc = null; S.inDoc = null;
  kitCloseMenus();
  document.querySelectorAll(".modal-wrap, .chart-tip").forEach((n) => n.remove());
  $("#app").innerHTML = "";
  renderGate();
}
function lockNow() { lockDown(); toast(tr("Locked.")); }

/* --------------------------------------------------------------- idle lock
   Touch devices only: an iPad left on the counter for 15 minutes asks for the
   passcode again. The filters on screen are kept. */
let lastActive = Date.now(), lastSaved = 0;
function markActive() {
  lastActive = Date.now();
  if (!S.locked && lastActive - lastSaved > 20000) { lastSaved = lastActive; sstore(ACTIVE_KEY, lastActive); }
}
function activeNow() { lastActive = lastSaved = Date.now(); sstore(ACTIVE_KEY, lastActive); }
["pointerdown", "keydown", "touchstart", "wheel", "input"].forEach((ev) =>
  window.addEventListener(ev, markActive, { passive: true, capture: true }));
function idleCheck() {
  if (S.locked || !S.token || !touchDevice()) return;
  if (Date.now() - lastActive >= IDLE_MIN * 60000) lockDown(tr("Locked after {n} minutes without use.", { n: IDLE_MIN }));
}
setInterval(idleCheck, 30000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { if (!S.locked) sstore(ACTIVE_KEY, lastActive); return; }
  idleCheck();
});
window.addEventListener("pageshow", (e) => { if (e.persisted) idleCheck(); });

// Delardi UI kit: tool switcher. No dependencies. Inlined ahead of each tool's own modules.
const KIT_TOOLS = [
  { id: 'sales', href: '../sales/', en: 'Sales', ru: 'Продажи' },
  { id: 'stock', href: '../stock/', en: 'Stock', ru: 'Склад' },
  { id: 'crm', href: '../crm/', en: 'Clients', ru: 'Клиенты' },
  { id: 'catalogue', href: '../catalogue/', en: 'Catalogue', ru: 'Каталог' },
  { id: 'tasks', href: '../tasks/', en: 'Tasks', ru: 'Задачи' },
  { id: 'perf', href: '../perf/', en: 'Performance', ru: 'Показатели' },
];

// Close functions of the menus that are open right now.
const kitOpenMenus = [];

// A tool calls this on lock: closes every open kit menu and detaches its listeners.
function kitCloseMenus() {
  for (const close of kitOpenMenus.slice()) close();
}

// A link that leaves the page can ask first. beforeLeave(href) returns a Promise:
// true follows the link, false stays. A modified click (new tab) is left alone.
function kitGuardLink(a, beforeLeave) {
  if (typeof beforeLeave !== 'function') return a;
  a.addEventListener('click', e => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    const href = a.href;
    Promise.resolve(beforeLeave(href)).then(go => { if (go) window.location.assign(href); });
  });
  return a;
}

// opts.beforeLeave: see kitGuardLink; asked before any tool link is followed.
function kitToolsMenu(currentId, lang, opts) {
  const beforeLeave = opts && opts.beforeLeave;
  const ru = lang === 'ru';
  const wrap = document.createElement('span');
  wrap.className = 'kit-tool-wrap';
  wrap.setAttribute('data-kit-menu', '');
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'kit-hbtn';
  btn.textContent = ru ? 'Инструменты' : 'Tools';
  btn.setAttribute('aria-expanded', 'false');
  const list = document.createElement('ul');
  list.className = 'kit-menu';
  list.hidden = true;
  for (const t of KIT_TOOLS) {
    const li = document.createElement('li');
    let item;
    if (t.id === currentId) {
      item = document.createElement('span');
      item.setAttribute('aria-current', 'page');
    } else {
      item = document.createElement('a');
      item.setAttribute('href', t.href);
      kitGuardLink(item, beforeLeave);
    }
    item.textContent = ru ? t.ru : t.en;
    li.appendChild(item);
    list.appendChild(li);
  }
  function close(refocus) {
    list.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('click', onDoc);
    const i = kitOpenMenus.indexOf(close);
    if (i >= 0) kitOpenMenus.splice(i, 1);
    if (refocus === true && btn.isConnected) btn.focus();
  }
  function open() {
    list.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    document.addEventListener('keydown', onKey);
    document.addEventListener('click', onDoc);
    kitOpenMenus.push(close);
  }
  function onKey(e) { if (e.key === 'Escape') close(true); }
  function onDoc(e) { if (!wrap.contains(e.target)) close(); }
  btn.addEventListener('click', e => { e.stopPropagation(); if (list.hidden) open(); else close(); });
  list.addEventListener('click', e => { if (e.target.closest && e.target.closest('a')) close(); });
  wrap.addEventListener('focusout', e => {
    if (!list.hidden && e.relatedTarget && !wrap.contains(e.relatedTarget)) close();
  });
  wrap.appendChild(btn);
  wrap.appendChild(list);
  return wrap;
}

/* ------------------------------------------------------------------- trend

      num(t.plan) !== null ? el("span", { text: tr("Plan") + ": " + fmtMoney(t.plan) }) : null,

    n.style.top = (window.scrollY + r.top - 8) + "px";

    [svgEl("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, class: "axis" })].concat(trend.map((t, i) => {

        svgEl("text", { x: cx, y: H - 12, class: "tick", "text-anchor": "middle" }, [!isPhone() && (/-01/.test(String(t.month).slice(4, 7)) || i === 0) ? monthName(t.month, true) : monthName(t.month, true).split(" ")[0]]),
      ]);

/* ------------------------------------------------------------------ bridge
   From the reference to the actual in three parts. Each part is a bar from a shared zero line: to the right when it
   adds, to the left when it takes away; the sign is written too, so direction never rests on the fill alone. */
function bridgeBlock(id, title, fromLabel, b, emptyText) {
  const box = el("div", { class: "bridge", id }, el("h3", { class: "lbl", text: tr(title) }));
  if (!b) { box.append(el("p", { class: "small", text: emptyText })); return box; }
  const parts = [["tickets", "More or fewer tickets"], ["mix", "Share of large tickets"], ["size", "Ticket size"]];
  const max = Math.max(1, ...parts.map(([k]) => Math.abs(num(b[k]) || 0)));

function inputsForm() {
  const d = S.inDoc.doc, i = d.inputs, txt = (v) => (num(v) === null ? "" : String(Math.round(num(v))));
  const progs = d.incentive ? d.incentive.scheme.rules.programmes || [] : [];
  // every seller with a plan row or with sales this month
  const names = new Set(i.sellers.map((s) => s.seller));
  if (d.incentive) d.incentive.sellers.forEach((s) => names.add(s.seller));
  d.tickets.forEach((t) => { if (t.basis === "retail" && !blank(t.seller)) names.add(t.seller); });
  return {
    month: S.inMonth, busy: false, err: null,
    v: { plan_uzs: txt(i.plan_uzs), plan_tickets: txt(i.plan_tickets), plan_large_tickets: txt(i.plan_large_tickets), plan_large_uzs: txt(i.plan_large_uzs),
      visits: txt(i.visits), visits_appointment: txt(i.visits_appointment), fx: num(i.fx) === null ? "" : String(num(i.fx)), note: i.note || "" },
    sellers: [...names].sort().map((n) => {
      const s = i.sellers.find((x) => x.seller === n) || {};
      const counts = {};
      progs.forEach((p) => { const c = (s.programme_counts || {})[p.key]; counts[p.key] = c === undefined || c === null ? "" : String(c); });
      return { seller: n, plan_uzs: txt(s.plan_uzs), commission: s.commission !== false, paid_uzs: txt(s.paid_uzs), counts };
    }),
  };
}

function renderInputs(main) {
  const sec = el("section", { class: "screen", id: "screen-inputs" }, el("h1", { class: "title", text: S.inMonth ? tr("Inputs for {m}", { m: monthName(S.inMonth) }) : tr("Inputs") }));
  main.append(sec);
  if (!S.inMonth) return;
  const st = need("inDoc", "month", { month: S.inMonth }, S.inMonth);
  if (pending(sec, st, "Loading the month…")) return;
  sec.append(el("p", { class: "small", id: "inputs-cur", text: tr("Inputs are always typed in so'm.") }));
  if (!S.form || S.form.month !== S.inMonth) S.form = inputsForm();
  const f = S.form, d = st.doc;
  const progs = d.incentive ? d.incentive.scheme.rules.programmes || [] : [];
  const ru = LANG === "ru";
  const keep = (obj, key) => (e) => { obj[key] = e.target.type === "checkbox" ? e.target.checked : e.target.value; };
  const input = (id, obj, key, attrs) => el("input", Object.assign({ type: "text", inputmode: "numeric", id, autocomplete: "off", value: obj[key], oninput: keep(obj, key) }, attrs || {}));
  const field = (id, label, node, hint) => el("label", { class: "field", for: id }, el("span", { class: "lbl", text: tr(label) }), node, hint ? el("span", { class: "small", text: tr(hint) }) : null);
  const form = el("form", { id: "inputs-form", novalidate: true, onsubmit: (ev) => { ev.preventDefault(); saveInputs(); } },
    el("p", { class: "small", id: "inputs-saved", text: d.inputs.updated_by ? tr("Last saved by {who}, {when}.", { who: d.inputs.updated_by, when: fmtDate(d.inputs.updated_at) + " " + fmtTime(d.inputs.updated_at) })
      : tr("Nothing typed in for this month yet.") }),
    el("div", { class: "in-grid" },
      field("in-plan", "Plan, so'm", input("in-plan", f.v, "plan_uzs")),
      field("in-plan-tickets", "Planned tickets", input("in-plan-tickets", f.v, "plan_tickets"), "Planned tickets are needed for the bridge from plan."),
      field("in-plan-large", "of which large tickets", input("in-plan-large", f.v, "plan_large_tickets")),
      field("in-plan-large-uzs", "Planned value of large tickets, so'm", input("in-plan-large-uzs", f.v, "plan_large_uzs")),
      field("in-visits", "Visits to the boutique", input("in-visits", f.v, "visits")),
      field("in-appt", "of which by appointment", input("in-appt", f.v, "visits_appointment")),
      field("in-fx", "USD rate for the month", input("in-fx", f.v, "fx", { inputmode: "decimal", placeholder: tr("empty = 12 000") })),
      field("in-note", "Note", el("input", { type: "text", id: "in-note", maxlength: "500", autocomplete: "off", value: f.v.note, oninput: keep(f.v, "note") }))),
    el("h2", { class: "sec-title", text: tr("Sellers") }),
    progs.length ? el("p", { class: "small", text: tr("Programme counts typed here replace the count from tickets. Leave empty to use the tickets.") }) : null,
    el("div", { class: "table-wrap" }, el("table", { class: "tbl in-sellers", id: "in-sellers" },
      el("thead", {}, el("tr", {}, el("th", { scope: "col", text: tr("Seller") }), el("th", { scope: "col", text: tr("Plan, so'm") }), el("th", { scope: "col", text: tr("Commission applies") }),
        progs.map((p) => el("th", { scope: "col", text: (ru && p.label_ru) || p.label || p.key })), el("th", { scope: "col", text: tr("Paid, so'm") }),
        el("th", { scope: "col" }, el("span", { class: "sr-only", text: tr("Remove") })))),
      el("tbody", {}, f.sellers.map((s, k) => el("tr", { "data-row": String(k) },
        el("td", { class: "c-seller", "data-label": tr("Seller") }, el("input", { type: "text", class: "in-seller", maxlength: "80", autocomplete: "off", "aria-label": tr("Seller"), value: s.seller, oninput: keep(s, "seller") })),
        el("td", { class: "c-money", "data-label": tr("Plan, so'm") }, input(null, s, "plan_uzs", { class: "in-s-plan", "aria-label": tr("Plan, so'm") })),
        el("td", { class: "c-comm", "data-label": tr("Commission applies") }, el("input", { type: "checkbox", class: "in-s-comm", "aria-label": tr("Commission applies"), checked: s.commission ? true : null, onchange: keep(s, "commission") })),
        progs.map((p) => el("td", { "data-label": (ru && p.label_ru) || p.label || p.key }, input(null, s.counts, p.key, { class: "in-s-count", "data-key": p.key, "aria-label": (ru && p.label_ru) || p.label || p.key, maxlength: "4" }))),
        el("td", { class: "c-money", "data-label": tr("Paid, so'm") }, input(null, s, "paid_uzs", { class: "in-s-paid", "aria-label": tr("Paid, so'm") })),
        el("td", { class: "r c-remove" }, el("button", { type: "button", class: "btn in-s-remove", onclick: () => { f.sellers.splice(k, 1); renderAll(); }, text: tr("Remove") }))))))),
    el("p", {}, el("button", { type: "button", class: "btn", id: "in-add", onclick: () => {
      const counts = {}; progs.forEach((p) => { counts[p.key] = ""; });
      f.sellers.push({ seller: "", plan_uzs: "", commission: true, paid_uzs: "", counts }); renderAll();
      const rows = document.querySelectorAll("#in-sellers .in-seller"); if (rows.length) rows[rows.length - 1].focus();
    }, text: tr("Add a seller") })),
    el("p", { class: "form-err", id: "in-err", role: "alert", hidden: f.err ? null : true, text: f.err || "" }),
    el("p", {}, el("button", { type: "submit", class: "btn primary", id: "in-save", disabled: f.busy ? true : null, text: f.busy ? tr("Saving…") : tr("Save") })));
  sec.append(form);
}

async function saveInputs() {
  const f = S.form;
  if (!f || f.busy || S.locked) return;
  // every figure is read the same way as in the other tools: spaces, dots and commas group; letters or a minus are refused
  let bad = false;
  const amount = (sel, raw) => { const r = readAmount(raw); markInvalid(typeof sel === "string" ? $(sel) : sel, r.invalid); if (r.invalid) bad = true; return r.value; };
  const v = f.v;
  const inputs = {
    plan_uzs: amount("#in-plan", v.plan_uzs), plan_tickets: amount("#in-plan-tickets", v.plan_tickets), plan_large_tickets: amount("#in-plan-large", v.plan_large_tickets),
    plan_large_uzs: amount("#in-plan-large-uzs", v.plan_large_uzs), visits: amount("#in-visits", v.visits), visits_appointment: amount("#in-appt", v.visits_appointment),
    note: v.note.trim() || null, fx: null, sellers: [],
  };
  const fxText = String(v.fx).trim().replace(/\s/g, "").replace(",", ".");
  if (fxText) {
    const n = Number(fxText);
    if (!/^\d+(\.\d{1,2})?$/.test(fxText) || !(n > 0)) { markInvalid($("#in-fx"), true); bad = true; } else { markInvalid($("#in-fx"), false); inputs.fx = n; }
  } else markInvalid($("#in-fx"), false);
  const rows = document.querySelectorAll("#in-sellers tbody tr");
  f.sellers.forEach((s, k) => {
    const row = rows[k];
    if (!s.seller.trim()) return;
    const counts = {};
    for (const [key, raw] of Object.entries(s.counts)) { const c = amount(row && row.querySelector('.in-s-count[data-key="' + key + '"]'), raw); if (c !== null) counts[key] = c; }
    inputs.sellers.push({ seller: s.seller.trim(), plan_uzs: amount(row && row.querySelector(".in-s-plan"), s.plan_uzs), commission: !!s.commission,
      programme_counts: counts, paid_uzs: amount(row && row.querySelector(".in-s-paid"), s.paid_uzs) });
  });
  if (bad) { f.err = tr("Check the figures marked."); const e = $("#in-err"); e.textContent = f.err; e.hidden = false; return; }
  const month = f.month;
  f.busy = true; f.err = null;
  renderAll();
  try {
    const d = await api("save_month", { month, inputs });
    if (S.locked || S.inMonth !== month) return;
    S.inDoc = { key: month, doc: d, err: null };
    // the plan feeds the month, the year and the incentive: what is on those screens is asked for again
    S.yearDoc = null; S.brandDoc = null;
    S.form = null;
    if (S.month === month) takeDoc(d); else { loadMonth(); return; }   // the month on the other screens carries plans in its trend                                 // rebuilt from what the server now holds
    renderAll();
    toast(tr("Saved."));
  } catch (e) {
    if (S.locked || S.form !== f) return;
    f.busy = false; f.err = e.message;
    renderAll();
  }
}

/* -------------------------------------------------------------------- init */
function renderAll() {
  const app = $("#app");
  document.documentElement.lang = LANG;
  document.title = "Delardi " + tr("Performance");
  if (S.locked) return;                            // nothing behind the gate
  const r = route();
  kitCloseMenus();
  document.querySelectorAll(".chart-tip").forEach((n) => n.remove());
  app.innerHTML = "";
  app.classList.remove("gated"); app.setAttribute("aria-hidden", "false"); app.inert = false;
  const main = el("main", { id: "main" });
  app.append(...renderHeader(), main);
  ROUTES[r.name](main);
  const sec = main.querySelector(".screen"), mark = sec && seasonMark(r.name);
  if (mark) { sec.classList.add("in-season"); sec.prepend(mark); }
}
function restoreSession() {
  try {
    const s = JSON.parse(sstore(SESSION_KEY) || "null");
    if (!s || !s.token || new Date(s.expires_at).getTime() <= Date.now()) return false;
    const last = Number(sstore(ACTIVE_KEY) || 0);
    if (touchDevice() && last && Date.now() - last >= IDLE_MIN * 60000) { sstore(SESSION_KEY, null); return false; }
    S.token = s.token; S.name = s.name; S.expires_at = s.expires_at;
    return true;
  } catch (e) { return false; }
}

(async function boot() {
  document.documentElement.lang = LANG;
  if (restoreSession()) {
    try {
      const p = await api("ping");
      S.name = p.name; S.locked = false; activeNow();
      await afterUnlock();
    } catch (e) {
      S.locked = true;
      if (e.status !== 401) { S.token = null; sstore(SESSION_KEY, null); S.gateMessage = e.raw || null; }
    }
  }
  if (S.locked) $("#app").innerHTML = "";
  renderAll();
  renderGate();
})();
</script>
