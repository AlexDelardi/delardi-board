<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="google" content="notranslate">
<title>Delardi Performance</title>
<link rel="icon" type="image/png" href="__FAVICON__">
<meta name="theme-color" content="#001A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Delardi Performance">
<style>
/*__KIT_CSS__*/

/* ===========================================================================
   Delardi Performance. The look is the shared UI kit above (ui/kit.css, inlined by
   build.py); what follows is Performance layout only, written with kit tokens:
   palette colours, square corners, no shadows, no dark mode. iPad first:
   every control is a 44 px target, nothing scrolls sideways at 768 or 1024.
   ========================================================================= */
body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
html { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ------------------------------------------------------------------ header */
.top { position: sticky; top: 0; z-index: 40; background: var(--white); }
.top .kit-head { flex-wrap: wrap; }
.top .kit-tabs { overflow-x: auto; }
.top .kit-tab { white-space: nowrap; }
.top .kit-tab:focus-visible { outline-offset: -2px; }
@media (max-width: 900px) {                       /* portrait iPad, RU labels: still one row */
  .top .kit-head { gap: 8px; padding: 0 16px; }
  .top .kit-head .kit-hbtn { padding: 0 12px; }
  .top .kit-staff { max-width: 120px; }
}

/* ----------------------------------------------------------------- buttons */
.btn { min-width: var(--tap); white-space: nowrap; }
.btn.subtle { background: transparent; color: var(--slate); border-color: transparent; font-weight: 400; }
.btn.subtle:hover { background: var(--card); color: var(--navy); }

/* ------------------------------------------------------------------ screens */
main { padding: 24px 24px 96px; }
.screen { max-width: 1200px; margin: 0 auto; }
.screen-head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 16px; }
.screen-head .title { margin: 0; flex: 1 1 auto; color: var(--navy); }
.screen-head { justify-content: flex-end; margin-bottom: 8px; }
.screen-head .aside { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- performance */
.screen > .title { margin: 0 0 16px; color: var(--navy); }
.sec-title { margin: 32px 0 12px; color: var(--navy); font: 400 22px/1.3 var(--serif); }
.table-wrap { overflow-x: auto; position: relative; }   /* relative: a screen-reader-only label inside a scrolled table must not widen the page */
.tbl th[scope="row"] { text-align: left; font-weight: 400; padding: 12px; border-bottom: 1px solid var(--mist); color: var(--ink); }
.tbl tfoot th, .tbl tfoot td { padding: 12px; font-weight: 700; border-top: 2px solid var(--navy); }
.tbl td.r, .tbl th.r { white-space: nowrap; }
/* so'm or dollars: two buttons side by side, the one in use filled */
.cur-switch { display: inline-flex; align-items: center; padding: 4px 0; margin-right: 12px; }
.cur-switch .btn { min-height: var(--tap); min-width: var(--tap); padding: 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
.cur-switch .btn + .btn { border-left-width: 0; }
.cur-switch .btn[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.month-picker { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
.month-picker .btn { min-height: var(--tap); min-width: var(--tap); padding: 0; font-size: 20px; line-height: 1; }
.month-picker select { min-height: var(--tap); }
.kit-tabs .kit-spacer { flex: 1 1 auto; }
/* headline: three figures */
.hl-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.hl { display: flex; flex-direction: column; gap: 2px; padding: 16px; background: var(--card); min-width: 0; }
.hl .lbl { margin: 0 0 4px; }
.hl-big { font: 400 30px/1.2 var(--serif); color: var(--navy); white-space: normal; overflow-wrap: anywhere; }
/* trend: one series, one axis from zero; the plan is a tick across its month */
.chart { margin: 0 0 12px; border: 1px solid var(--mist); padding: 12px 12px 4px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart-title { display: flex; justify-content: space-between; gap: 12px; margin: 0 0 4px; }
.chart .axis { stroke: var(--mist); stroke-width: 1; }
.chart .bar .mark { fill: var(--sky); }
.chart .bar.cur .mark { fill: var(--navy); }
.chart .bar .hit { fill: transparent; }
.chart .bar:hover .mark, .chart .bar:focus .mark { fill: var(--navy-deep); }
.chart .bar:focus { outline: none; }
.chart .bar:focus .hit { stroke: var(--navy); stroke-width: 2; }
.chart .plan { stroke: var(--ink); stroke-width: 2; }
.chart .tick { fill: var(--slate); font: 11px var(--sans); }
/* year and brand charts: last year as an outline beside this year; lines for the cumulative view */
.chart .bar .mark2 { fill: var(--white); stroke: var(--slate); stroke-width: 1.5; }
.chart .bar.off .mark { fill: var(--mist); }
.chart .line { stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.s-cur { stroke: var(--navy); } .chart .dot.s-cur { fill: var(--navy); }
.chart .line.s-ly { stroke: var(--slate); } .chart .dot.s-ly { fill: var(--slate); }
.chart .line.s-plan { stroke: var(--ink); stroke-dasharray: 6 5; } .chart .dot.s-plan { fill: var(--ink); }
.chart-legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 4px 0 8px; }
.chart-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.lg-key { display: inline-block; width: 14px; height: 12px; }
.lg-key.k-mark { background: var(--sky); } .lg-key.k-mark2 { border: 1.5px solid var(--slate); background: var(--white); }
.lg-key.k-line { height: 0; width: 20px; border-top: 2px solid var(--navy); }
.lg-key.k-line.s-ly { border-top-color: var(--slate); } .lg-key.k-line.s-plan { border-top: 2px dashed var(--ink); }
.chart-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tbl.trend tr.off td, .tbl.trend tr.off th { color: var(--slate); }
#brand-mode { margin-right: 12px; }
/* the wide tables of the Year and Brands screens: headers wrap and cells are tight, so ten columns fit an iPad */
#yr-months th, #yr-months td, #br-table th, #br-table td, #arr-table th, #arr-table td { padding-left: 6px; padding-right: 6px; font-size: 13px; }
#yr-months thead th, #br-table thead th, #arr-table thead th { white-space: normal; vertical-align: bottom; }
#yr-months td, #br-table td, #arr-table td { white-space: nowrap; }
@media (max-width: 900px) {
  .chart-pair { grid-template-columns: 1fr; }
  /* portrait: the tab row may take two lines, and the least-used columns step aside */
  .kit-tabs { flex-wrap: wrap; row-gap: 0; }
  #yr-months th:nth-child(8), #yr-months td:nth-child(8), #yr-months th:nth-child(9), #yr-months td:nth-child(9), #yr-months th:nth-child(10), #yr-months td:nth-child(10),
  #br-table th:nth-child(7), #br-table td:nth-child(7), #br-table th:nth-child(8), #br-table td:nth-child(8), #br-table th:nth-child(10), #br-table td:nth-child(10) { display: none; }
  #yr-months th, #yr-months td, #br-table th, #br-table td, #arr-table th, #arr-table td { padding-left: 4px; padding-right: 4px; font-size: 12px; }
}
.plan-key { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.plan-mark { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--ink); }
.chart-tip { position: absolute; z-index: 60; width: 200px; transform: translateY(-100%); background: var(--navy-deep); color: var(--white); padding: 8px 10px; font: 13px/1.45 var(--sans);
  display: flex; flex-direction: column; pointer-events: none; }
/* bridge: the parts as bars from a shared zero line */
.bridges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.bridge { border: 1px solid var(--mist); padding: 16px; min-width: 0; }
.br-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(60px, 1fr) auto; align-items: center; gap: 10px; min-height: 36px; }
.br-row.end { font-weight: 700; color: var(--navy); }
.br-bar { position: relative; height: 14px; background: linear-gradient(var(--mist), var(--mist)) 50% 0 / 1px 100% no-repeat; }
.br-row.end .br-bar { background: none; }
.br-fill { position: absolute; top: 0; bottom: 0; min-width: 2px; }
.br-fill.pos { background: var(--navy); }
.br-fill.neg { background: var(--white); border: 2px solid var(--navy); }
.br-v { text-align: right; }
/* tickets */
.tbl.tickets tr.off td { color: var(--slate); }
.tbl.tickets .tag { margin-left: 6px; }
.tbl.usage td.unused { color: var(--slate); font-style: italic; }
.tbl.usage td.none { color: var(--mist); }
.tbl.usage tr.quiet th, .tbl.usage tr.off th, .tbl.usage tr.off td { color: var(--slate); }
.tbl.usage .tag { margin-left: 6px; }
.tbl.tickets td:nth-child(5) .tag { margin-left: 0; }
.tbl.tickets .btn { min-height: 36px; padding: 0 12px; font-size: 13px; }
/* incentive */
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
.fact { padding: 12px 16px; background: var(--card); display: flex; flex-direction: column; min-width: 0; }
.fact .num { font: 400 20px/1.3 var(--serif); color: var(--navy); white-space: normal; overflow-wrap: anywhere; }
/* inputs */
.in-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field input, .field select, .in-sellers input[type=text] { min-height: var(--tap); width: 100%; min-width: 0; }
.in-sellers input.in-s-count { width: 64px; }
.in-sellers input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--navy); }
.in-sellers td { vertical-align: middle; }
.in-sellers .in-seller { min-width: 140px; }
.in-sellers .in-s-plan, .in-sellers .in-s-paid { min-width: 130px; }
input[aria-invalid="true"] { border-color: var(--alert); outline: 1px solid var(--alert); }
.form-err { color: var(--alert); margin: 8px 0; }
#tk-form { display: flex; flex-direction: column; gap: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 900px) {
  .hl-row, .bridges { grid-template-columns: minmax(0, 1fr); }
  .facts, .in-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hl-big { font-size: 26px; }
  /* six figure columns and long Russian headers: let the headers wrap and tighten the cells, so nothing scrolls sideways */
  .tbl.kpi th.r, .tbl.trend th.r, .tbl.inc th.r, .in-sellers th { white-space: normal; }
  .tbl.kpi th, .tbl.kpi td, .tbl.trend th, .tbl.trend td, .tbl.inc th, .tbl.inc td, .tbl.tickets th, .tbl.tickets td { padding-left: 6px; padding-right: 6px; font-size: 13px; }
  .tbl.tickets th, .tbl.tickets td { padding-left: 4px; padding-right: 4px; }
  .tbl.tickets .btn { padding: 0 8px; }
  .tbl.tickets .tag { padding-left: 4px; padding-right: 4px; }
  .tbl.tickets th, .tbl.tickets td { font-size: 12px; }
  /* names give way first: they break where they must, so the figures and the button always fit */
  .tbl.tickets td:nth-child(3), .tbl.tickets td:nth-child(4) { overflow-wrap: anywhere; }
  /* incentive, ten columns: one block per seller, each figure beside its name */
  #inc-sellers, #inc-sellers tbody, #inc-sellers tfoot, #inc-sellers tr { display: block; }
  #inc-sellers thead { display: none; }
  #inc-sellers tr { height: auto; padding: 10px 0; border-bottom: 1px solid var(--mist); }
  #inc-sellers tfoot tr { border-top: 2px solid var(--navy); border-bottom: 0; }
  #inc-sellers th[scope="row"] { display: block; border: 0; padding: 4px 6px; font-weight: 700; }
  #inc-sellers td { display: flex; justify-content: space-between; gap: 16px; border: 0; padding: 4px 6px; }
  #inc-sellers td::before { content: attr(data-label); color: var(--slate); font-weight: 400; }
  #inc-sellers td:empty { display: none; }
}
/* an iPad in either position: the seller rows and the ten-column incentive table do not fit as plain rows */
@media (max-width: 1100px) {
  /* sellers: one block per seller, each field under its own label, instead of a nine-column row */
  .in-sellers, .in-sellers tbody { display: block; }
  .in-sellers thead { display: none; }
  .in-sellers tbody tr { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; height: auto; padding: 12px 0; border-bottom: 1px solid var(--mist); align-items: end; }
  .in-sellers tbody tr:hover { background: none; }
  .in-sellers td { display: flex; flex-direction: column; gap: 4px; padding: 0; border: 0; min-width: 0; }
  .in-sellers td::before { content: attr(data-label); font-size: 12px; color: var(--slate); }
  .in-sellers td.c-seller, .in-sellers td.c-money { grid-column: span 2; }
  .in-sellers td.c-remove { grid-column: 4; align-items: flex-end; }
  .in-sellers td.c-remove::before { content: none; }
  .in-sellers input.in-s-count, .in-sellers .in-seller, .in-sellers .in-s-plan, .in-sellers .in-s-paid { width: 100%; min-width: 0; }
  .tbl.inc th, .tbl.inc td { padding-left: 6px; padding-right: 6px; font-size: 13px; }
  .tbl.inc th.r { white-space: normal; }
}

/* ----------------------------------------------------------------- dialogs */
.modal-wrap { padding: 24px; }                  /* stacking is the kit's: panel 100, modal 110, gate 115, toast 120 */
.modal-scrim { position: fixed; }
.modal { padding: 0; width: 640px; max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
.modal.confirm, .confirm .modal { width: 480px; }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 24px; border-bottom: 1px solid var(--mist); }
.modal-head h3 { flex: 1; min-width: 0; margin: 0; font: normal 21px/1.3 var(--serif); color: var(--navy-deep); }
.modal-head .close { font-size: 22px; line-height: 1; }
.modal-body { padding: 16px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-body p { margin: 0; line-height: 1.5; }
.modal-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--mist); }

/* ---------------------------------------------------------- lock card */
#app.gated { pointer-events: none; user-select: none; }
#gate.gate { min-height: 0; }
.gate-mast { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 16px 24px; margin-bottom: 24px; }
.gate-card > .gate-mast + * { margin-top: 0; }
.gate-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.gate-mast img { height: 22px; width: auto; display: block; }
.gate-mast .kit-hbtn { letter-spacing: .06em; }
.gate-card label { display: block; margin-bottom: 16px; }
.gate-card label .lbl { margin-bottom: 4px; }
.gate-card input { width: 100%; }
.gate-card .err { margin-bottom: 12px; color: var(--alert); font-size: 13px; font-weight: 700; }
.gate-card > .btn { display: flex; width: calc(100% - 48px); }
.gate-card .gate-foot { margin-top: 12px; text-align: center; }

/* ------------------------------------------------------------------- toast */
.toast { opacity: 0; pointer-events: none; transition: opacity .18s; }
.toast.show { opacity: 1; }

/* ---------------------------------------------------- narrower: portrait iPad */
@media (max-width: 900px) {
  main { padding: 16px 16px 96px; }
}
@media (max-width: 720px) {
  .modal-wrap { padding: 0; align-items: flex-end; }
  .modal, .modal.confirm, .confirm .modal { width: 100%; max-height: 92vh; }
  .hide-sm { display: none !important; }
}
/* ---------------------------------------------------------------- seasonal mark
   One decoration in the top right corner of a screen, on the title's line and never over it. */
.screen.in-season { position: relative; }
.screen.in-season > .title { padding-right: 144px; min-height: 48px; }
.season-mark { position: absolute; top: -6px; right: 0; display: inline-flex; align-items: flex-start; gap: 4px; pointer-events: none; user-select: none; }
.season-mark img { display: block; pointer-events: none; }
.season-mark img[data-k="mini"] { margin-top: 12px; }
@media (max-width: 599px) { .screen.in-season > .title { padding-right: 48px; min-height: 0; } .season-mark { top: 0; } }
@media print { .season-mark { display: none; } }
/* ------------------------------------------------------------ phone (up to 599 px)
   One slim navy row with a menu button; the tabs on one row that swipes sideways and stays pinned; the period picker
   under them, scrolling away with the page; tables keep their first column; charts are drawn at the phone's width. */
.menu-btn { padding: 0; }
.menu-bars, .menu-bars::before, .menu-bars::after { display: block; width: 20px; height: 2px; background: var(--white); }
.menu-bars { position: relative; }
.menu-bars::before, .menu-bars::after { content: ""; position: absolute; left: 0; }
.menu-bars::before { top: -6px; } .menu-bars::after { top: 6px; }
.head-menu { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px 16px; background: var(--navy-deep); color: var(--white); }
.head-menu .kit-staff { flex: 1 0 100%; max-width: none; }
.head-menu .cur-switch { margin: 0; padding: 0; }
.head-menu .cur-switch .btn { background: transparent; color: var(--white); border-color: rgba(143, 168, 204, .45); }
.head-menu .cur-switch .btn[aria-pressed="true"] { background: var(--navy); border-color: var(--sky); }
.head-menu :focus-visible { outline-color: #8FA8CC; }
.head-menu .kit-menu { left: 0; right: auto; }
.head-menu .kit-menu :focus-visible { outline-color: #082966; }
.period-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 4px 16px; border-bottom: 1px solid var(--mist); background: var(--white); }
.period-bar .cur-switch { margin-right: 0; flex: 0 0 auto; }
.period-bar .cur-switch .btn { padding: 0 10px; }
.period-bar .month-picker { flex: 1 1 212px; min-width: 0; }   /* beside the period switch when there is room for the month, under it when not */
.period-bar .month-picker select { flex: 1 1 0; min-width: 0; width: 100%; max-width: 220px; padding-left: 8px; padding-right: 4px; }
.top.phone { top: -56px; }                       /* the navy row scrolls away; the tabs stay */
.top.phone.open { top: 0; }
.top.phone .kit-head { flex-wrap: nowrap; height: 56px; min-height: 56px; padding: 0 8px 0 16px; gap: 10px; }
.top.phone .kit-tool { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.top.phone .kit-tabs { flex-wrap: nowrap; gap: 0; padding: 0 6px; overflow-x: auto; scrollbar-width: none; }
.top.phone .kit-tabs::-webkit-scrollbar { display: none; }
.top.phone .kit-tab { padding: 0 10px; min-width: var(--tap); justify-content: center; flex: 0 0 auto; }
@media (max-width: 599px) {
  main { padding: 12px 16px 96px; }
  main, .screen, .screen > * { min-width: 0; }
  .screen { max-width: 100%; }
  .title { font-size: 24px; }
  .facts, .in-grid { grid-template-columns: minmax(0, 1fr); }
  .tbl.tickets .btn { min-height: var(--tap); }
  /* a wide table scrolls inside its own box and its first column stays put */
  .table-wrap { max-width: 100%; }
  .table-wrap .tbl th:first-child, .table-wrap .tbl td:first-child { position: sticky; left: 0; z-index: 1; background: var(--white); min-width: 104px; max-width: 132px; white-space: normal; overflow-wrap: break-word; }
  .table-wrap .tbl thead th:first-child { background: var(--card); }
  .chart { padding: 10px 8px 4px; }
  .chart-tip { width: 180px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>__SCRIPT__</script>
</body>
</html>
