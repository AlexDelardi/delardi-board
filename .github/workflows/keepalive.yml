# Free Supabase projects pause after roughly 7 days of low database activity.
# A weekly-only meeting rhythm sits right on that boundary, so this pings the
# board once a day to keep it awake.
#
# It calls the API's health action rather than reading a table directly:
# anonymous read access to the database was removed, so there is no longer any
# key that could read board content, and none is needed here.
name: Keep the board database awake

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:        # and a manual "Run workflow" button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database through the API
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "https://hugduzqwyqwryicfzipu.supabase.co/functions/v1/board-api" \
            -H "Content-Type: application/json" \
            -d '{"action":"health"}')
          echo "board-api responded $code"
          if [ "$code" != "200" ]; then
            echo "::warning::The board did not answer with 200. The database may have paused — resume it in the Supabase dashboard."
            exit 1
          fi
