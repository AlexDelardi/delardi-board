/* ===========================================================================
   Delardi Catalogue
   Third of the Delardi tools, beside the Weekly Board and the Client
   Instrument, and in the same brand system: the navies #001A4A / #082966,
   Palatino Linotype as the accent face, Evolventa as the text face. A little
   more of a showroom than the other two: larger type for names, a quiet
   champagne hairline, generous tiles for a finger on an iPad.
   ========================================================================= */
:root {
  --navy:        #001A4A;
  --navy-2:      #082966;
  --page:        #F3F1EC;
  --surface:     #FFFFFF;
  --surface-2:   #F7F5F0;
  --ink:         #001A4A;
  --ink-2:       #5B6478;
  --muted:       #8892A6;
  --line:        #D8D3C7;
  --border:      rgba(0,26,74,0.11);
  --shadow:      0 1px 2px rgba(0,26,74,.05), 0 8px 24px rgba(0,26,74,.07);
  --shadow-hi:   0 2px 4px rgba(0,26,74,.07), 0 16px 36px rgba(0,26,74,.13);
  --header-bg:   #001A4A;
  --header-ink:  #FFFFFF;
  --header-ink-2:#B9C6DE;
  --header-line: rgba(255,255,255,0.16);
  --gold:        #A8894F;
  --gold-soft:   rgba(168,137,79,.35);
  --tile:        linear-gradient(160deg, #F9F7F2 0%, #EEEAE0 100%);
  --focus:       #2E5490;
  --good:        #2F6F4F;
  --warning:     #A0701A;
  --sans:  "Evolventa","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --serif: "Palatino Linotype","Book Antiqua",Palatino,"Times New Roman",Georgia,serif;
  color-scheme: light;
}
:root[data-theme="dark"], html[data-theme="auto"].sysdark {
  --page:        #000D22;
  --surface:     #00112F;
  --surface-2:   #041B3F;
  --ink:         #F2F5FA;
  --ink-2:       #B9C6DE;
  --muted:       #8892A6;
  --line:        #1B3A69;
  --border:      rgba(255,255,255,0.12);
  --shadow:      0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.5);
  --shadow-hi:   0 2px 4px rgba(0,0,0,.55), 0 16px 36px rgba(0,0,0,.6);
  --header-bg:   #000B1C;
  --header-line: rgba(255,255,255,0.13);
  --gold:        #C9AE78;
  --gold-soft:   rgba(201,174,120,.35);
  --tile:        linear-gradient(160deg, #06204A 0%, #021431 100%);
  --focus:       #8FA8CC;
  --good:        #4E9E72;
  --warning:     #D9A23C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.serif { font-family: var(--serif); }

/* ------------------------------------------------------------------ header */
.top { position: sticky; top: 0; z-index: 40; background: var(--header-bg); color: var(--header-ink);
  padding-top: env(safe-area-inset-top); box-shadow: 0 1px 0 var(--gold-soft); }
.top-row { display: flex; align-items: center; gap: 14px; padding: 13px 22px; max-width: 1320px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 15px; min-width: 0; min-height: 40px; text-decoration: none; color: inherit; }
.brand .mark { height: 32px; width: auto; display: block; }
.brand .rule { width: 1px; height: 30px; background: var(--header-line); flex: none; }
.brand .title { font-family: var(--serif); font-size: 18px; letter-spacing: .02em; white-space: nowrap; }
.brand .sub { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--header-ink-2); margin-top: 1px; white-space: nowrap; }
.spacer { flex: 1 1 auto; }
.hbtn {
  background: rgba(255,255,255,0.07); color: var(--header-ink); border: 1px solid var(--header-line);
  border-radius: 8px; min-height: 38px; min-width: 38px; padding: 6px 11px; font-size: 13.5px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; white-space: nowrap;
}
.hbtn:hover { background: rgba(255,255,255,0.14); }
.hbtn svg { width: 17px; height: 17px; flex: none; }
.hbtn .lbl-wide { display: none; }
@media (min-width: 1100px) { .hbtn .lbl-wide { display: inline; } }
.lang { display: inline-flex; border: 1px solid var(--header-line); border-radius: 8px; overflow: hidden; }
.lang button { background: transparent; border: 0; color: var(--header-ink-2); padding: 6px 10px; min-height: 36px; font-size: 12.5px; letter-spacing: .06em; }
.lang button[aria-pressed="true"] { color: var(--header-ink); background: rgba(255,255,255,0.12); }

/* ---------------------------------------------------------------- layout */
main { max-width: 1320px; margin: 0 auto; padding: 18px 22px 80px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); margin: 2px 0 12px; }
.crumbs a { text-decoration: none; color: var(--ink-2); }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }
.crumbs .sep { opacity: .5; }
h1.page { font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1.15; margin: 0 0 4px; letter-spacing: .005em; }
.page-sub { color: var(--ink-2); font-size: 14px; margin: 0 0 18px; }
.hair { height: 1px; background: linear-gradient(90deg, var(--gold-soft), transparent 70%); border: 0; margin: 0 0 20px; }

/* ----------------------------------------------------------------- start */
.hero { text-align: center; padding: 34px 0 20px; }
.hero .mono { width: 46px; opacity: .9; margin: 0 auto 12px; display: block; }
.hero h1 { font-family: var(--serif); font-weight: 500; font-size: 34px; margin: 0; letter-spacing: .01em; }
.hero p { color: var(--ink-2); margin: 6px 0 0; font-size: 14.5px; }
.bigsearch { position: relative; max-width: 680px; margin: 22px auto 30px; }
.bigsearch input {
  width: 100%; height: 56px; border-radius: 28px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 58px 0 52px; font-size: 17px; color: var(--ink); box-shadow: var(--shadow); -webkit-appearance: none;
}
.bigsearch input::placeholder { color: var(--muted); }
.bigsearch .ico { position: absolute; left: 19px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 20px; height: 20px; pointer-events: none; }
.bigsearch .go { position: absolute; right: 7px; top: 7px; height: 42px; min-width: 42px; border-radius: 21px; border: 0; background: var(--navy); color: #fff; padding: 0 14px; font-size: 14px; }
:root[data-theme="dark"] .bigsearch .go, html[data-theme="auto"].sysdark .bigsearch .go { background: var(--gold); color: #000B1C; }
.entry { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-bottom: 30px; }
.entry a {
  display: block; text-decoration: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 22px 20px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; min-height: 132px;
  transition: box-shadow .15s, transform .15s;
}
.entry a:hover { box-shadow: var(--shadow-hi); transform: translateY(-1px); }
.entry a::before { content: ""; position: absolute; left: 20px; right: 20px; top: 0; height: 2px; background: var(--gold); opacity: .7; }
.entry .k { font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
.entry .n { font-family: var(--serif); font-size: 22px; margin-top: 8px; }
.entry .c { color: var(--ink-2); font-size: 13px; margin-top: 6px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 6px 0 12px; }
.section-h h2 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0; }
.section-h a, .linkbtn { font-size: 13px; color: var(--ink-2); background: none; border: 0; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.foot-note { color: var(--muted); font-size: 12px; text-align: center; margin-top: 34px; }

/* ----------------------------------------------------------------- tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.tile {
  display: flex; flex-direction: column; text-decoration: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); transition: box-shadow .15s, transform .15s; min-height: 100%;
}
.tile:hover { box-shadow: var(--shadow-hi); transform: translateY(-1px); }
.tile .art { aspect-ratio: 16 / 10; background: var(--tile); display: flex; align-items: center; justify-content: center; position: relative; }
.tile .art img { width: 34px; opacity: .22; }
.tile .art .word { font-family: var(--serif); font-size: 24px; letter-spacing: .04em; color: var(--ink); opacity: .78; text-align: center; padding: 0 12px; line-height: 1.15; }
.tile .body { padding: 12px 14px 14px; }
.tile .name { font-family: var(--serif); font-size: 17px; line-height: 1.25; }
.tile .meta { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
.tile.dim .name, .tile.dim .art .word { opacity: .5; }
.group-h { font-family: var(--serif); font-size: 18px; margin: 26px 0 10px; display: flex; align-items: baseline; gap: 10px; }
.group-h:first-child { margin-top: 4px; }
.group-h .c { font-family: var(--sans); font-size: 12.5px; color: var(--muted); }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 6px 13px; min-height: 36px;
  font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none;
}
.chip[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
:root[data-theme="dark"] .chip[aria-pressed="true"], html[data-theme="auto"].sysdark .chip[aria-pressed="true"] { background: var(--gold); color: #000B1C; border-color: var(--gold); }
.chip .x { opacity: .7; font-size: 15px; line-height: 1; }
.chip .cnt { color: var(--muted); font-size: 12px; }
.chip[aria-pressed="true"] .cnt { color: inherit; opacity: .75; }

/* ------------------------------------------------------------------ list */
.listbar { position: sticky; top: var(--top-h, 64px); z-index: 30; background: var(--page);
  padding: 10px 0 10px; margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.listbar .search { position: relative; flex: 1 1 260px; max-width: 420px; }
.listbar .search input { width: 100%; height: 40px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px 0 38px; color: var(--ink); -webkit-appearance: none; }
.listbar .search svg { position: absolute; left: 13px; top: 11px; width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 0 14px; height: 38px; font-size: 13.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"], html[data-theme="auto"].sysdark .seg button[aria-pressed="true"] { background: var(--gold); color: #000B1C; }
.btn {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 20px;
  height: 40px; padding: 0 15px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn .badge { background: var(--navy); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; line-height: 17px; }
.btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
select.btn { padding-right: 30px; -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
.count-line { font-size: 13px; color: var(--ink-2); margin: 4px 0 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills .chip { min-height: 30px; padding: 3px 10px; font-size: 12.5px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card {
  display: flex; flex-direction: column; text-decoration: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); transition: box-shadow .15s, transform .15s; position: relative;
}
.card:hover { box-shadow: var(--shadow-hi); transform: translateY(-1px); }
.card .ph { aspect-ratio: 4 / 3; background: var(--tile); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.card .ph img { width: 38px; opacity: .25; }
.card .ph span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.card .ph.photo { background: #FFFFFF; padding: 0; }
.card .ph.photo img { width: 100%; height: 100%; object-fit: contain; opacity: 1; }
.card.out .ph.photo img { opacity: .55; }
.mp-gallery { position: sticky; top: calc(var(--top-h, 64px) + 12px); }
.g-strip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 12px; border: 1px solid var(--border); background: #FFFFFF;
  aspect-ratio: 1 / 1; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.g-strip::-webkit-scrollbar { display: none; }
.g-strip img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; }
.g-thumbs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.g-thumb { width: 56px; height: 56px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: #FFFFFF; overflow: hidden; }
.g-thumb img { width: 100%; height: 100%; object-fit: contain; }
.g-thumb[aria-current="true"] { border: 2px solid var(--gold); }
.g-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
@media (max-width: 720px) { .mp-gallery { position: static; } .g-strip { aspect-ratio: 4 / 3; } .g-thumb { width: 48px; height: 48px; } }
.card .b { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.card .brandname { font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.card .nm { font-family: var(--serif); font-size: 17px; line-height: 1.25; }
.card .ref { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .mat { font-size: 13px; color: var(--ink-2); }
.card .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; margin-top: auto; padding-top: 8px; }
.card .price { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; }
.stock { font-size: 11.5px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.stock.in { color: var(--good); background: color-mix(in srgb, var(--good) 11%, transparent); }
.stock.in::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.stock.out { color: var(--muted); border: 1px solid var(--line); }
.stock.transit { color: var(--warning); background: color-mix(in srgb, var(--warning) 12%, transparent); }
.stock.transit::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; box-sizing: border-box; }
.mp-transit { color: var(--warning); }
.card.out .ph, .card.out .nm, .card.out .mat, .card.out .price { opacity: .5; }
.card.out { box-shadow: none; }
.dots { display: flex; gap: 4px; margin-top: 4px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); }
.dot.out { opacity: .35; }
.dot.WG { background: linear-gradient(135deg,#f4f4f4,#c9ccd1); }
.dot.YG { background: linear-gradient(135deg,#f3dc8e,#c99a3a); }
.dot.PG, .dot.RG { background: linear-gradient(135deg,#f1c2b0,#c17d66); }
.dot.other { background: var(--surface-2); }
.flagmark { position: absolute; top: 10px; right: 10px; padding: 1px 8px; border-radius: 10px; background: var(--surface);
  border: 1px solid var(--line); color: var(--warning); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.phone-only { display: none; }
.more { display: flex; justify-content: center; margin: 26px 0 0; }
.empty { text-align: center; padding: 50px 10px; color: var(--ink-2); }
.empty .serif { font-size: 20px; color: var(--ink); margin-bottom: 6px; }
.skel { background: var(--surface); border-radius: 10px; border: 1px solid var(--border); height: 340px; position: relative; overflow: hidden; }
.skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(127,127,127,.08), transparent); animation: sh 1.2s infinite; }
@keyframes sh { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ---------------------------------------------------------------- filters */
.sheet-scrim { position: fixed; inset: 0; background: rgba(0,13,34,.38); z-index: 60; }
.sheet {
  position: fixed; z-index: 61; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--surface);
  box-shadow: var(--shadow-hi); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top);
}
.sheet header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.sheet header h2 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0; }
.sheet .scroll { overflow-y: auto; padding: 6px 20px 20px; flex: 1; -webkit-overflow-scrolling: touch; }
.sheet .grp { margin-top: 16px; }
.sheet .grp > .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
.sheet .grp .chiprow { margin: 0; }
.sheet .range { display: flex; gap: 8px; align-items: center; }
.sheet .range input { width: 100%; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; color: var(--ink); }
.sheet footer { display: flex; gap: 10px; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
.sheet footer .btn { flex: 1; justify-content: center; height: 46px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px; }
.check input { width: 20px; height: 20px; }

.tbc { color: var(--muted); font-style: italic; }

/* -------------------------------------------------------------- model page */
.mp-top { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr); gap: 28px; align-items: start; margin-bottom: 22px; }
.mp-photo { aspect-ratio: 1 / 1; background: var(--tile); border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: sticky; top: calc(var(--top-h, 64px) + 12px); }
.mp-photo img { width: 64px; opacity: .25; }
.mp-photo span { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mp-info .brandname { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.mp-title { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.12; margin: 6px 0 6px; }
.mp-sub { color: var(--ink-2); font-size: 14px; }
.mp-sub .ref { color: var(--muted); font-variant-numeric: tabular-nums; }
.mp-colours { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 4px; }
.mp-colour .dot { width: 14px; height: 14px; }
.mp-colour.out { border-style: dashed; }
.mp-price { font-family: var(--serif); font-size: 26px; margin: 16px 0 4px; font-variant-numeric: tabular-nums; }
.mp-price.out { color: var(--muted); }
.mp-stock { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13.5px; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; margin: 20px 0 0; border-top: 1px solid var(--gold-soft); }
.fact { padding: 10px 0; border-bottom: 1px solid var(--border); min-width: 0; }
.fact dt { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fact dd { margin: 3px 0 0; font-size: 14.5px; overflow-wrap: anywhere; }
.fact-link { color: inherit; text-decoration: underline; text-decoration-color: var(--gold-soft); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.fact-link:hover { text-decoration-color: var(--gold); color: var(--ink); }
@media (pointer: coarse) { .fact-link { padding: 4px 0; } }
.unv { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; font-size: 10.5px; font-weight: 700;
  color: var(--warning); border: 1px solid currentColor; margin-left: 6px; vertical-align: 1px; cursor: help; }
.unv.conflict { color: #B4532A; }
.val.inh { border-bottom: 1px dotted var(--line); }
.mp-body { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr); gap: 22px; align-items: start; margin-bottom: 22px; }
.mp-body .col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; box-shadow: var(--shadow); }
.panel h2 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0 0 10px; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 12.5px; }
.advisor { border-top: 2px solid var(--gold); }
.advisor .story { font-family: var(--serif); font-size: 17px; line-height: 1.5; margin: 0 0 14px; }
.advisor .chiprow { margin: 0 0 12px; }
.chip.static { cursor: default; background: var(--surface-2); }
.adv { padding: 9px 0; border-top: 1px solid var(--border); font-size: 14px; }
.adv .lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.desc { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink); }
.spec-grid { display: grid; grid-template-columns: 1fr; gap: 4px; }
.spec-sec h3 { font-size: 11.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--gold); margin: 14px 0 4px; font-weight: 600; }
.spec-sec dl, .owner dl { margin: 0; }
.spec { display: grid; grid-template-columns: minmax(120px, 2fr) 3fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.spec dt { color: var(--ink-2); }
.spec dd { margin: 0; overflow-wrap: anywhere; }
.owner { margin-top: 22px; }
.owner summary { display: flex; align-items: baseline; gap: 12px; cursor: pointer; list-style: none; }
.owner summary::-webkit-details-marker { display: none; }
.owner summary h2 { margin: 0; font-size: 17px; }
.owner summary::after { content: "▾"; margin-left: auto; color: var(--muted); }
.owner[open] summary::after { content: "▴"; }
.owner dl { margin-top: 10px; }
.owner a { color: var(--ink-2); }
.mp-skel { display: grid; grid-template-columns: 5fr 6fr; gap: 28px; }
@media (max-width: 1024px) {
  .mp-top { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
  .mp-body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .mp-top { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .mp-photo { position: static; aspect-ratio: 4 / 3; }
  .mp-title { font-size: 26px; }
  .mp-price { font-size: 23px; }
  .facts { grid-template-columns: 1fr; }
  .panel { padding: 16px; }
  .spec { grid-template-columns: 1fr 1.3fr; }
  .mp-skel { grid-template-columns: 1fr; }
}

/* ------------------------------------------------------------- the floor */
.hbtn.on { background: var(--gold); color: #000B1C; border-color: var(--gold); }
.client-band { background: var(--gold); color: #1B1406;
  display: flex; align-items: center; justify-content: center; gap: 14px; padding: 7px 16px; font-size: 13px; text-align: center; }
.client-band .btn { height: 30px; background: rgba(255,255,255,.55); border-color: transparent; color: #1B1406; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.mp-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
.report-btn { color: var(--ink-2); }
.report-btn svg { width: 15px; height: 15px; }
.sheet.report .grp { display: block; }
.sheet.report select, .sheet.report textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 10px 12px; font-size: 15px; }
.sheet.report select { height: 44px; }
.sheet.report textarea { resize: vertical; min-height: 120px; line-height: 1.45; }
.sheet.report .err { color: #9B3B3B; font-size: 13px; margin-top: 10px; }
.reports-link { margin-top: 10px; }
.seg a.segbtn { display: inline-flex; align-items: center; padding: 0 16px; height: 38px; font-size: 13.5px; color: var(--ink-2); text-decoration: none; }
.seg a.segbtn[aria-pressed="true"] { background: var(--navy); color: #fff; }
:root[data-theme="dark"] .seg a.segbtn[aria-pressed="true"], html[data-theme="auto"].sysdark .seg a.segbtn[aria-pressed="true"] { background: var(--gold); color: #000B1C; }
.reports { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; max-width: 900px; }
.rep { padding: 16px 18px; }
.rep-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.rep-model { text-decoration: none; font-family: var(--serif); font-size: 17px; }
.rep-model .brandname { font-family: var(--sans); font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.rep-model .ref { font-family: var(--sans); font-size: 12.5px; color: var(--muted); }
.rep-msg { margin: 10px 0; font-size: 14.5px; white-space: pre-wrap; }
.rep-f { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rep-actions { display: inline-flex; gap: 8px; }
.empty.offline p { max-width: 420px; margin: 8px auto 18px; }
@media (max-width: 720px) {
  .client-band { font-size: 12px; gap: 8px; }
}
/* ------------------------------------------------------------------ gate */
.gate { position: fixed; inset: 0; z-index: 85; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(0,26,74,.34); }
.gate-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; width: min(400px, 100%); box-shadow: var(--shadow-hi); overflow: hidden; }
.gate-mast { background: var(--navy); padding: 17px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: inset 0 -1px 0 var(--gold-soft); }
.gate-mast img { height: 32px; width: auto; display: block; }
.gate-tools { display: flex; align-items: center; gap: 12px; }
.gate-home { color: #B9C6DE; font-size: 12.5px; text-decoration: none; white-space: nowrap; }
.gate-home:hover { color: #FFFFFF; text-decoration: underline; }
.gate-card h2 { font-family: var(--serif); font-size: 22px; font-weight: 500; margin: 20px 22px 5px; }
.gate-card p.lead { margin: 0 22px 18px; font-size: 13.5px; color: var(--ink-2); }
.gate-card label { display: block; margin: 0 22px 13px; }
.gate-card label span { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; font-weight: 600; }
.gate-card input { width: 100%; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; color: var(--ink); }
.gate-card .err { margin: 0 22px 12px; color: #9B3B3B; font-size: 13px; }
.gate-card .go { margin: 4px 22px 0; width: calc(100% - 44px); justify-content: center; height: 46px; border-radius: 8px; }
.gate-card .gate-foot { margin: 15px 22px 18px; font-size: 11.5px; color: var(--muted); }
#app.gated { filter: blur(3px); pointer-events: none; user-select: none; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13.5px; opacity: 0; transition: .2s; z-index: 90; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.netbar { background: #9B3B3B; color: #fff; text-align: center; font-size: 13px; padding: 6px 10px; }
.watermark { position: fixed; right: 22px; bottom: 16px; width: 30px; opacity: .08; pointer-events: none; z-index: 1; }
.watermark.dark { display: none; }
:root[data-theme="dark"] .watermark.light, html[data-theme="auto"].sysdark .watermark.light { display: none; }
:root[data-theme="dark"] .watermark.dark, html[data-theme="auto"].sysdark .watermark.dark { display: block; }

}
