<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="google" content="notranslate">
<title>Delardi Stock</title>
<link rel="icon" type="image/png" href="__FAVICON__">
<meta name="theme-color" content="#001A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Delardi Stock">
<style>
/*__KIT_CSS__*/

/* ===========================================================================
   Delardi Stock. The look is the shared UI kit above (ui/kit.css, inlined by
   build.py); what follows is Stock layout only, written with kit tokens:
   palette colours, square corners, no shadows, no dark mode. iPad first:
   every control is a 44 px target, nothing scrolls sideways at 768 or 1024.
   ========================================================================= */
body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
html { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ------------------------------------------------------------------ header */
.top { position: sticky; top: 0; z-index: 40; background: var(--white); }
.top .kit-head { flex-wrap: wrap; }
.top .kit-tabs { overflow-x: auto; }
.top .kit-tab { white-space: nowrap; }
.top .kit-tab:focus-visible { outline-offset: -2px; }
@media (max-width: 900px) {                       /* portrait iPad, RU labels: still one row */
  .top .kit-head { gap: 8px; padding: 0 16px; }
  .top .kit-head .kit-hbtn { padding: 0 12px; }
  .top .kit-staff { max-width: 120px; }
}

/* ----------------------------------------------------------------- buttons */
.btn { min-width: var(--tap); white-space: nowrap; }
.btn.subtle { background: transparent; color: var(--slate); border-color: transparent; font-weight: 400; }
.btn.subtle:hover { background: var(--card); color: var(--navy); }

/* ------------------------------------------------------------------ screens */
main { padding: 24px 24px 96px; }
.screen { max-width: 1200px; margin: 0 auto; }
.screen-head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 16px; }
.screen-head .title { margin: 0; flex: 1 1 auto; color: var(--navy); }
.screen-head { justify-content: flex-end; margin-bottom: 8px; }
.screen-head .aside { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* filters: one row on a wide screen, two on portrait iPad */
.filters { display: grid; gap: 12px 12px; grid-template-columns: minmax(180px, 2fr) repeat(3, minmax(120px, 1fr)) repeat(2, minmax(100px, 0.8fr)); align-items: end; margin-bottom: 16px; }
.filters label { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.filters .lbl { margin: 0; }
.filters input, .filters select { width: 100%; min-width: 0; }
.filters select { padding-right: 28px; text-overflow: ellipsis; }
.filters input.price { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 1100px) {                      /* landscape iPad: search on its own row, then five fields */
  .filters { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .filters .f-q { grid-column: 1 / -1; }
}
@media (max-width: 900px) {                       /* portrait iPad: three selects, then the two prices */
  .filters { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .filters .f-state, .filters .f-brand, .filters .f-cat { grid-column: span 2; }
  .filters .f-min, .filters .f-max { grid-column: span 3; }
}

/* totals strip: one card per state */
.totals { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; margin-bottom: 16px; }
.tot {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; align-self: stretch; gap: 4px; min-height: var(--tap); min-width: 0;
  padding: 12px 14px; background: var(--card); color: var(--navy); border: 1px solid var(--card); text-align: left;
  outline: 2px solid transparent; outline-offset: -2px;
}
.tot:hover { border-color: var(--mist); }
.tot[aria-pressed="true"] { outline: 2px solid var(--navy); outline-offset: -2px; background: var(--white); }
.tot:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.tot .lbl { margin: 0; color: var(--slate); }
.tot .t-n { font-size: 15px; color: var(--navy-deep); }
.tot .t-v { font-size: 15px; font-weight: 700; color: var(--navy-deep); font-variant-numeric: tabular-nums; }
.tot .t-amt { white-space: nowrap; }          /* the number never breaks; "so'm" may drop to the next line */
.tot .small { color: var(--slate); }

/* the pieces table */
.tbl-wrap { border: 1px solid var(--mist); border-bottom: 0; background: var(--white); }
.tbl.pieces { table-layout: auto; }
.tbl.pieces th, .tbl.pieces td { padding: 10px 10px; }
.tbl.pieces .serial, .tbl.pieces .since, .tbl.pieces td.r { white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl.pieces td.ref { min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
.tbl.pieces .ref-a { color: var(--navy-deep); }
.tbl.pieces .ref-m { display: block; color: var(--slate); margin-top: 2px; }
.tbl.pieces td.brand { overflow-wrap: break-word; }   /* whole words: a brand never splits mid-word */
.tbl.pieces td.st { white-space: nowrap; }
.tbl.pieces td.st .tag { white-space: nowrap; }   /* a state tag is always one line; the Reference column gives way */
.tbl.pieces tbody tr.prow { cursor: pointer; }
.tbl.pieces tbody tr.prow:focus-visible { outline: 2px solid var(--navy); outline-offset: -2px; }
.tbl.pieces .empty td { padding: 32px 12px; text-align: center; color: var(--slate); }
@media (max-width: 900px) {
  .tbl.pieces th, .tbl.pieces td { padding: 10px 6px; font-size: 14px; }
  .tbl.pieces thead th { font-size: 11px; letter-spacing: .06em; }
}

/* the review table */
.tbl.reviews th, .tbl.reviews td { padding: 8px 10px; vertical-align: top; }
.tbl.reviews td.rk { min-width: 0; overflow-wrap: break-word; }
.tbl.reviews td.rk .rv-note { display: block; margin-top: 4px; color: var(--slate); font-weight: 400; }
.tbl.reviews td.since { white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl.reviews td.st { white-space: nowrap; }
.tbl.reviews td.st .tag { white-space: nowrap; }
.tbl.reviews .rv-piece { display: block; width: 100%; height: auto; padding: 4px 0; text-align: left; text-decoration: none; font-weight: 400; }
.tbl.reviews .rv-piece .serial { display: block; font-weight: 700; text-decoration: underline; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl.reviews .rv-piece .ref-m { display: block; color: var(--slate); margin-top: 2px; overflow-wrap: anywhere; }
.rv-answers { display: flex; flex-wrap: wrap; gap: 6px; }
.rv-answers .btn { padding: 0 10px; font-size: 13px; white-space: normal; line-height: 1.2; flex: 0 1 auto; }
.rv-answers .btn[aria-pressed="true"] { background: var(--navy); color: var(--white); }
.tbl.reviews tr.rrow.open td { border-bottom-color: transparent; }
.tbl.reviews tr.rv-formrow { height: auto; }
.tbl.reviews tr.rv-formrow:hover { background: transparent; }
.tbl.reviews tr.rv-formrow td { padding: 0 10px 12px; }
.rv-form { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--card); border: 1px solid var(--mist); }
.rv-field { display: block; }
.rv-field textarea { width: 100%; }
.rv-empty { margin: 48px 0; text-align: center; color: var(--slate); font: normal 21px/1.4 var(--serif); }
@media (max-width: 900px) {
  .tbl.reviews th, .tbl.reviews td { padding: 8px 6px; font-size: 14px; }
  .tbl.reviews thead th { font-size: 11px; letter-spacing: .06em; }
}

/* pager */
.pager { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--mist); }
.pager .pg-count { color: var(--slate); font-size: 13px; flex: 1 1 auto; }
.pager .pg-n { color: var(--navy); font-variant-numeric: tabular-nums; }

.loading-line { padding: 24px 0; color: var(--slate); }

/* ----------------------------------------------------------------- dialogs */
.modal-wrap { padding: 24px; }                  /* stacking is the kit's: panel 100, modal 110, gate 115, toast 120 */
.modal-scrim { position: fixed; }
.modal { padding: 0; width: 640px; max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
.modal.confirm, .confirm .modal { width: 480px; }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 24px; border-bottom: 1px solid var(--mist); }
.modal-head h3 { flex: 1; min-width: 0; margin: 0; font: normal 21px/1.3 var(--serif); color: var(--navy-deep); }
.modal-head .close { font-size: 22px; line-height: 1; }
.modal-body { padding: 16px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-body p { margin: 0; line-height: 1.5; }
.modal-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--mist); }

/* ---------------------------------------------------------- piece panel
   kit .panel-wrap / .panel / .panel-scrim: 560 wide from the right, full width under 600. */
.panel.pcbox { display: flex; flex-direction: column; gap: 16px; padding: 0; overflow-x: hidden; }
.pc-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 8px 4px 24px; border-bottom: 1px solid var(--mist); }
.pc-head .lbl { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pc-head .close { width: var(--tap); min-width: var(--tap); padding: 0; font-size: 21px; line-height: 1; }
.pc-body { padding: 0 24px 32px; display: flex; flex-direction: column; gap: 16px; flex: 1 1 auto; min-width: 0; }
.pc-body > * { min-width: 0; }
.pc-body .h2 { margin: 0; overflow-wrap: anywhere; }
.pc-state { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: -8px; }
.pc-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 0; padding: 12px 0; border-top: 1px solid var(--mist); border-bottom: 1px solid var(--mist); }
/* import */
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
label.btn { display: inline-flex; align-items: center; cursor: pointer; }
#imp-file:focus-visible + *, #imp-pick-label:focus-within { outline: 2px solid var(--navy); outline-offset: 2px; }
.imp-card { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: var(--card); border: 1px solid var(--card); }
.imp-card .lbl { margin: 0; color: var(--slate); }
.imp-card .tc-n { font-size: 20px; font-weight: 700; color: var(--navy-deep); font-variant-numeric: tabular-nums; }
.imp-card.bad { background: var(--white); border-color: var(--alert); }
.imp-card.bad .tc-n { color: var(--alert); }
.imp-actions { margin: 12px 0; }
.tbl.imp td { vertical-align: top; padding: 8px 10px; }
.tbl.imp .imp-res .imp-msg { display: block; margin-top: 4px; color: var(--slate); overflow-wrap: anywhere; }
.tbl.imp tr.imp-error .imp-msg { color: var(--ink); }
.linklike { background: none; border: 0; padding: 0; font: inherit; color: var(--navy); text-decoration: underline; cursor: pointer; }
.pc-tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--mist); }
.pc-tab { min-height: var(--tap); padding: 0 14px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--slate); font: 700 14px/1.2 var(--sans); cursor: pointer; }
.pc-tab[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--navy); }
.pc-tab:focus-visible { outline: 2px solid var(--navy); outline-offset: -2px; }
#pc-colibri dd, #pc-origin dd, #pc-cost dd { overflow-wrap: anywhere; }
.pc-facts.one { grid-template-columns: minmax(0, 1fr); border: 0; padding: 0; }
.pc-fact { min-width: 0; }
.pc-fact dt { margin: 0 0 2px; }
.pc-fact dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.pc-sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pc-sec > .lbl { margin: 0; }
.pc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.pc-actions .btn { flex: 1 1 auto; }
.pc-form { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--card); border: 1px solid var(--mist); }
.pc-form > .lbl { margin: 0; color: var(--navy); }
.pc-form .pf-field { display: block; }
.pc-form-foot { display: flex; flex-wrap: wrap; gap: 8px; }
.form-err { margin: 0; color: var(--alert); font-size: 13px; font-weight: 700; }
.form-err[hidden] { display: none; }
.pc-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--mist); }
.pc-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--mist); min-width: 0; }
.pc-ev .ev-when { color: var(--slate); font-size: 13px; flex: 0 0 100%; }
.pc-ev .ev-move { color: var(--navy-deep); }
.pc-ev .ev-note { flex: 0 0 100%; overflow-wrap: anywhere; }
.pc-list a { color: var(--navy); font-weight: 700; overflow-wrap: anywhere; }
@media (max-width: 599px) { .pc-head { padding-left: 16px; } .pc-body { padding: 0 16px 32px; } .pc-facts { grid-template-columns: minmax(0, 1fr); } }

/* ---------------------------------------------------------- lock card */
#app.gated { pointer-events: none; user-select: none; }
#gate.gate { min-height: 0; }
.gate-mast { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 16px 24px; margin-bottom: 24px; }
.gate-card > .gate-mast + * { margin-top: 0; }
.gate-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.gate-mast img { height: 22px; width: auto; display: block; }
.gate-mast .kit-hbtn { letter-spacing: .06em; }
.gate-card label { display: block; margin-bottom: 16px; }
.gate-card label .lbl { margin-bottom: 4px; }
.gate-card input { width: 100%; }
.gate-card .err { margin-bottom: 12px; color: var(--alert); font-size: 13px; font-weight: 700; }
.gate-card > .btn { display: flex; width: calc(100% - 48px); }
.gate-card .gate-foot { margin-top: 12px; text-align: center; }

/* ------------------------------------------------------------------- toast */
.toast { opacity: 0; pointer-events: none; transition: opacity .18s; }
.toast.show { opacity: 1; }

/* ---------------------------------------------------- narrower: portrait iPad */
@media (max-width: 900px) {
  main { padding: 16px 16px 96px; }
}
@media (max-width: 720px) {
  .modal-wrap { padding: 0; align-items: flex-end; }
  .modal, .modal.confirm, .confirm .modal { width: 100%; max-height: 92vh; }
  .hide-sm { display: none !important; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>__SCRIPT__</script>
</body>
</html>
