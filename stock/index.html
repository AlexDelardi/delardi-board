<style>
/* Delardi UI kit. Palette only, radius 0, no shadows, no dark mode. */
:root {
  --navy: #082966; --navy-deep: #001A4A; --slate: #5B6478; --sky: #8FA8CC;
  --mist: #D3DCE9; --card: #EEF1F7; --white: #FFFFFF; --alert: #8C2F2F;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, serif;
  --sans: "Evolventa", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --tap: 44px; --radius: 0;
  /* legacy aliases, literal hex on purpose (qa/ui-foundations.cjs reads them) */
  --page: #FFFFFF; --surface: #FFFFFF; --surface-2: #EEF1F7;
  --ink: #001A4A; --ink-2: #5B6478; --muted: #5B6478;
  --line: #D3DCE9; --grid: #D3DCE9; --border: #D3DCE9;
  --focus: #082966; --critical: #8C2F2F;
}
* { box-sizing: border-box; border-radius: 0; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #FFFFFF; color: var(--navy-deep); font: 15px/1.5 var(--sans); }
:focus-visible { outline: 2px solid #082966; outline-offset: 2px; }
.kit-head :focus-visible { outline-color: #8FA8CC; }
.kit-head .kit-menu :focus-visible { outline-color: #082966; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Header bar */
.kit-head { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 24px; background: var(--navy-deep); color: var(--white); position: relative; z-index: 50; }
.kit-brand { display: inline-flex; align-items: center; min-height: var(--tap); color: var(--white); text-decoration: none; font: 13px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; }
.kit-brand img, .kit-brand svg { display: block; height: 18px; width: auto; }
.kit-rule { width: 1px; align-self: stretch; margin: 12px 0; background: var(--sky); }
.kit-staff { min-width: 0; max-width: 200px; overflow: hidden; text-overflow: ellipsis; color: var(--white); font: 14px/1.2 var(--sans); white-space: nowrap; }
.kit-tool { font: normal 19px/1.2 var(--serif); color: var(--white); }
.kit-spacer { flex: 1 1 auto; }
.kit-head a { color: var(--white); }
.kit-hbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); min-width: var(--tap); padding: 0 16px; background: transparent; color: var(--white); border: 1px solid rgba(143, 168, 204, .45); font: 15px/1 var(--sans); cursor: pointer; text-decoration: none; }
.kit-hbtn:hover { border-color: var(--sky); }
.kit-lang { display: inline-flex; }
.kit-lang .kit-hbtn { padding: 0 12px; min-width: var(--tap); }
.kit-lang .kit-hbtn + .kit-hbtn { border-left-width: 0; }
.kit-lang .kit-hbtn[aria-pressed="true"], .kit-lang .kit-hbtn.on { background: var(--navy); border-color: var(--sky); font-weight: 700; }
.kit-tool-wrap, [data-kit-menu] { position: relative; }
.kit-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 60; min-width: 200px; margin: 0; padding: 0; list-style: none; background: var(--white); color: var(--navy-deep); border: 1px solid var(--mist); border-top: 2px solid var(--navy); }
.kit-menu a, .kit-menu span { display: flex; align-items: center; min-height: var(--tap); padding: 0 16px; color: var(--navy-deep); text-decoration: none; font: 15px/1.5 var(--sans); }
.kit-menu a:hover { background: var(--card); }
.kit-menu [aria-current="page"] { font-weight: 700; color: var(--navy); background: var(--card); }

/* Tabs */
.kit-tabs { display: flex; gap: 28px; padding: 0 24px; background: var(--white); border-bottom: 1px solid var(--mist); }
.kit-tab { display: inline-flex; align-items: center; min-height: 48px; padding: 0; background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--slate); font: 15px/1.5 var(--sans); cursor: pointer; text-decoration: none; }
.kit-tab:hover { color: var(--navy); }
.kit-tab[aria-current="page"] { color: var(--navy); font-weight: 700; border-bottom-color: var(--navy); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; background: var(--white); color: var(--navy); border: 1px solid var(--navy); font: 700 15px/1.2 var(--sans); cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--card); }
.btn.primary { background: var(--navy); color: var(--white); border-color: var(--navy); }
.btn.primary:hover { background: var(--navy-deep); border-color: var(--navy-deep); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--navy); font-weight: 400; text-decoration: underline; }
.btn.quiet:hover { background: var(--card); }
.btn.danger { background: var(--white); color: var(--alert); border-color: var(--alert); }
.btn.danger:hover { background: var(--alert); color: var(--white); }
.btn.big { min-height: 52px; padding: 0 24px; font-size: 17px; }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--card); color: var(--slate); border-color: var(--mist); cursor: not-allowed; text-decoration: none; }

/* Fields */
input, select, textarea { width: 100%; min-height: var(--tap); padding: 8px 12px; background: var(--white); color: var(--navy-deep); border: 1px solid var(--sky); font: 15px/1.5 var(--sans); }
textarea { min-height: 96px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--slate); }
input:disabled, select:disabled, textarea:disabled { background: var(--card); color: var(--slate); border-color: var(--mist); }
input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--alert); border-width: 2px; }
input[type="checkbox"], input[type="radio"] { width: 20px; min-height: 20px; padding: 0; accent-color: var(--navy); }
.lbl { display: block; margin: 0 0 4px; color: var(--slate); font: 700 12px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; }

/* Type */
.title { margin: 0 0 16px; font: normal 28px/1.25 var(--serif); color: var(--navy-deep); }
.h2 { margin: 0 0 12px; font: normal 21px/1.3 var(--serif); color: var(--navy-deep); }
.item { font: normal 17px/1.35 var(--serif); color: var(--navy-deep); overflow-wrap: anywhere; }
.keynum { font: normal 32px/1.1 var(--serif); color: var(--navy-deep); font-variant-numeric: tabular-nums; }
.small { font: 13px/1.45 var(--sans); color: var(--slate); }

/* Table */
.tbl { width: 100%; border-collapse: collapse; font: 15px/1.5 var(--sans); }
.tbl thead th { padding: 12px; background: var(--card); color: var(--slate); text-align: left; font: 700 12px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid var(--mist); }
.tbl tbody tr { height: 48px; }   /* a row height is a minimum in a table; td min-height does nothing */
.tbl td { padding: 12px; border-bottom: 1px solid var(--mist); vertical-align: middle; }
.tbl th.r, .tbl td.r, .tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tbody tr:hover { background: var(--card); }

/* Tags */
.tag { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border: 1px solid var(--navy); color: var(--navy); background: var(--white); font: 700 12px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.tag.act { background: var(--navy); color: var(--white); border-color: var(--navy); }
.tag.info { background: var(--card); color: var(--navy); border-color: var(--card); }
.tag.done { background: var(--white); color: var(--slate); border-color: var(--mist); }
.tag.line { background: var(--white); color: var(--navy); border-color: var(--navy); }
.tag.alert { background: var(--white); color: var(--alert); border-color: var(--alert); }

/* Band and notice */
.band { padding: 12px 24px; background: var(--card); color: var(--navy); font: 13px/1.45 var(--sans); }
.band .lbl { display: inline; margin: 0 12px 0 0; color: var(--navy); }
.notice { padding: 12px 16px; background: var(--card); color: var(--navy); border: 1px solid var(--mist); font: 15px/1.5 var(--sans); }

/* Detail panel (right) */
.panel-wrap { position: fixed; inset: 0; z-index: 100; display: flex; justify-content: flex-end; }
.panel-scrim { position: absolute; inset: 0; background: rgba(0, 26, 74, .4); }
.panel { position: relative; width: 560px; max-width: 100%; height: 100%; overflow-y: auto; padding: 24px; background: var(--white); color: var(--navy-deep); border-top: 2px solid var(--navy); }
@media (max-width: 599px) { .panel { width: 100%; } }

/* Modal (centred) */
.modal-wrap { position: fixed; inset: 0; z-index: 110; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-scrim { position: absolute; inset: 0; background: rgba(0, 26, 74, .4); }
.modal { position: relative; width: 640px; max-width: 100%; max-height: 100%; overflow-y: auto; padding: 24px; background: var(--white); color: var(--navy-deep); border: 1px solid var(--mist); border-top: 2px solid var(--navy); }
.modal.confirm { width: 480px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 120; max-width: calc(100% - 32px); padding: 12px 16px; background: var(--navy-deep); color: var(--white); font: 15px/1.5 var(--sans); }
.toast.err { background: var(--white); color: var(--alert); border: 1px solid var(--alert); }

/* Lock card */
.gate { position: fixed; inset: 0; overflow-y: auto; z-index: 115; min-height: 100vh; display: flex; padding: 24px; background: var(--card); }
.gate-card { margin: auto; width: 100%; max-width: 400px; background: var(--white); border: 1px solid var(--mist); }
.gate-mast { padding: 24px; background: var(--navy-deep); color: var(--white); font: 13px/1.4 var(--sans); letter-spacing: .18em; text-transform: uppercase; }
.gate-card > :not(.gate-mast) { margin-left: 24px; margin-right: 24px; }
.gate-card > :last-child { margin-bottom: 24px; }
.gate-card > .gate-mast + * { margin-top: 24px; }


/* ===========================================================================
   Delardi Stock. The look is the shared UI kit above (ui/kit.css, inlined by
   build.py); what follows is Stock layout only, written with kit tokens:
   palette colours, square corners, no shadows, no dark mode. iPad first:
   every control is a 44 px target, nothing scrolls sideways at 768 or 1024.
   ========================================================================= */
body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
html { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ------------------------------------------------------------------ header */
.top { position: sticky; top: 0; z-index: 40; background: var(--white); }
.top .kit-head { flex-wrap: wrap; }
.top .kit-tabs { overflow-x: auto; }
.top .kit-tab { white-space: nowrap; }
.top .kit-tab:focus-visible { outline-offset: -2px; }
@media (max-width: 900px) {                       /* portrait iPad, RU labels: still one row */
  .top .kit-head { gap: 8px; padding: 0 16px; }

}

/* ----------------------------------------------------------------- buttons */
.btn { min-width: var(--tap); white-space: nowrap; }
.btn.subtle { background: transparent; color: var(--slate); border-color: transparent; font-weight: 400; }
.btn.subtle:hover { background: var(--card); color: var(--navy); }

/* ------------------------------------------------------------------ screens */
main { padding: 24px 24px 96px; }
.screen { max-width: 1200px; margin: 0 auto; }
.screen-head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 16px; }
.screen-head .title { margin: 0; flex: 1 1 auto; color: var(--navy); }
.screen-head { justify-content: flex-end; margin-bottom: 8px; }
.screen-head .aside { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* filters: one row on a wide screen, two on portrait iPad */
.filters { display: grid; gap: 12px 12px; grid-template-columns: minmax(180px, 2fr) repeat(3, minmax(120px, 1fr)) repeat(2, minmax(100px, 0.8fr)); align-items: end; margin-bottom: 16px; }
.filters label { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.filters .lbl { margin: 0; }
.filters input, .filters select { width: 100%; min-width: 0; }

.filters input.price { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 1100px) {                      /* landscape iPad: search on its own row, then five fields */
  .filters { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .filters .f-q { grid-column: 1 / -1; }
}
@media (max-width: 900px) {                       /* portrait iPad: three selects, then the two prices */
  .filters { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .filters .f-state, .filters .f-brand, .filters .f-cat { grid-column: span 2; }
  .filters .f-min, .filters .f-max { grid-column: span 3; }
}

/* totals strip: one card per state */
.totals { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; margin-bottom: 16px; }
.tot {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; align-self: stretch; gap: 4px; min-height: var(--tap); min-width: 0;
  padding: 12px 14px; background: var(--card); color: var(--navy); border: 1px solid var(--card); text-align: left;
  outline: 2px solid transparent; outline-offset: -2px;
}
.tot:hover { border-color: var(--mist); }
.tot[aria-pressed="true"] { outline: 2px solid var(--navy); outline-offset: -2px; background: var(--white); }
.tot:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.tot .lbl { margin: 0; color: var(--slate); }
.tot .t-n { font-size: 15px; color: var(--navy-deep); }
.tot .t-v { font-size: 15px; font-weight: 700; color: var(--navy-deep); font-variant-numeric: tabular-nums; }
.tot .t-amt { white-space: nowrap; }          /* the number never breaks; "so'm" may drop to the next line */
.tot .small { color: var(--slate); }

/* the pieces table */
.tbl-wrap { border: 1px solid var(--mist); border-bottom: 0; background: var(--white); }
.tbl.pieces { table-layout: auto; }
.tbl.pieces th, .tbl.pieces td { padding: 10px 10px; }
.tbl.pieces .serial, .tbl.pieces .since, .tbl.pieces td.r { white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl.pieces td.ref { min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
.tbl.pieces .ref-a { color: var(--navy-deep); }
.tbl.pieces .ref-m { display: block; color: var(--slate); margin-top: 2px; }
.tbl.pieces td.brand { overflow-wrap: break-word; }   /* whole words: a brand never splits mid-word */
.tbl.pieces td.st { white-space: nowrap; }
.tbl.pieces td.st .tag { white-space: nowrap; }   /* a state tag is always one line; the Reference column gives way */
.tbl.pieces tbody tr.prow { cursor: pointer; }
.tbl.pieces tbody tr.prow:focus-visible { outline: 2px solid var(--navy); outline-offset: -2px; }
.tbl.pieces .empty td { padding: 32px 12px; text-align: center; color: var(--slate); }
@media (max-width: 900px) {
  .tbl.pieces th, .tbl.pieces td { padding: 10px 6px; font-size: 14px; }
  .tbl.pieces thead th { font-size: 11px; letter-spacing: .06em; }
}

/* the review table */
.tbl.reviews th, .tbl.reviews td { padding: 8px 10px; vertical-align: top; }
.tbl.reviews td.rk { min-width: 0; overflow-wrap: break-word; }
.tbl.reviews td.since { white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl.reviews td.st { white-space: nowrap; }
.tbl.reviews td.st .tag { white-space: nowrap; }
.tbl.reviews .rv-piece { display: block; width: 100%; height: auto; padding: 4px 0; text-align: left; text-decoration: none; font-weight: 400; }
.tbl.reviews .rv-piece .serial { display: block; font-weight: 700; text-decoration: underline; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl.reviews .rv-piece .ref-m { display: block; color: var(--slate); margin-top: 2px; overflow-wrap: anywhere; }
.rv-answers { display: flex; flex-wrap: wrap; gap: 6px; }
.rv-answers .btn { padding: 0 10px; font-size: 13px; white-space: normal; line-height: 1.2; flex: 0 1 auto; }
.rv-answers .btn[aria-pressed="true"] { background: var(--navy); color: var(--white); }
.tbl.reviews tr.rrow.open td { border-bottom-color: transparent; }
.tbl.reviews tr.rv-formrow { height: auto; }
.tbl.reviews tr.rv-formrow:hover { background: transparent; }
.tbl.reviews tr.rv-formrow td { padding: 0 10px 12px; }
.rv-form { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--card); border: 1px solid var(--mist); }
.rv-field { display: block; }
.rv-field textarea { width: 100%; }
.rv-empty { margin: 48px 0; text-align: center; color: var(--slate); font: normal 21px/1.4 var(--serif); }
@media (max-width: 900px) {
  .tbl.reviews th, .tbl.reviews td { padding: 8px 6px; font-size: 14px; }
  .tbl.reviews thead th { font-size: 11px; letter-spacing: .06em; }
}

/* pager */
.pager { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--mist); }
.pager .pg-count { color: var(--slate); font-size: 13px; flex: 1 1 auto; }
.pager .pg-n { color: var(--navy); font-variant-numeric: tabular-nums; }

.loading-line { padding: 24px 0; color: var(--slate); }

/* ----------------------------------------------------------------- dialogs */
.modal-wrap { padding: 24px; }                  /* stacking is the kit's: panel 100, modal 110, gate 115, toast 120 */
.modal-scrim { position: fixed; }
.modal { padding: 0; width: 640px; max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
.modal.confirm, .confirm .modal { width: 480px; }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 24px; border-bottom: 1px solid var(--mist); }
.modal-head h3 { flex: 1; min-width: 0; margin: 0; font: normal 21px/1.3 var(--serif); color: var(--navy-deep); }
.modal-head .close { font-size: 22px; line-height: 1; }
.modal-body { padding: 16px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

.pc-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 8px 4px 24px; border-bottom: 1px solid var(--mist); }
.pc-head .lbl { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.pc-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 0; padding: 12px 0; border-top: 1px solid var(--mist); border-bottom: 1px solid var(--mist); }
.pc-facts.one { grid-template-columns: minmax(0, 1fr); border: 0; padding: 0; }
.pc-fact { min-width: 0; }
.pc-fact dt { margin: 0 0 2px; }
.pc-fact dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.pc-sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pc-sec > .lbl { margin: 0; }
.pc-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.pc-form { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--card); border: 1px solid var(--mist); }
.pc-form > .lbl { margin: 0; color: var(--navy); }
.pc-form .pf-field { display: block; }
.pc-form-foot { display: flex; flex-wrap: wrap; gap: 8px; }
.form-err { margin: 0; color: var(--alert); font-size: 13px; font-weight: 700; }

.pc-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--mist); }

/* ------------------------------------------------------------------- toast */
.toast { opacity: 0; pointer-events: none; transition: opacity .18s; }

/* ---------------------------------------------------- narrower: portrait iPad */
@media (max-width: 900px) {

}
@media (max-width: 720px) {
  .modal-wrap { padding: 0; align-items: flex-end; }

}

// Counted nouns: English one/many; Russian one/few/many.
const PL = {
  piece: { en: ["piece", "pieces"], ru: ["изделие", "изделия", "изделий"] },
};
function initialLang() {
  try {
    const v = localStorage.getItem(LANG_KEY);
    if (v === "en" || v === "ru") return v;
  } catch (e) { /* storage blocked */ }
  return /^ru\b/i.test(navigator.language || "") ? "ru" : "en";
}
let LANG = initialLang();
function tr(s, vars) {
  let out = (LANG === "ru" && Object.prototype.hasOwnProperty.call(RU, s)) ? RU[s] : s;
  if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
  return out;
}
function pl(n, key) {
  const f = PL[key][LANG];
  if (LANG === "ru") {
    const a = Math.abs(n) % 10, b = Math.abs(n) % 100;
    const i = a === 1 && b !== 11 ? 0 : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 1 : 2;
    return n + " " + f[i];
  }
  return n + " " + (n === 1 ? f[0] : f[1]);
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* ignore */ }
  document.documentElement.lang = l;
  renderAll();
  if (S.locked) renderGate();
}

function stateWord(state) {
  const w = STATE_WORDS[state];

/* ----------------------------------------------------------------- helpers */
function $(sel, root) { return (root || document).querySelector(sel); }
// el(tag, attrs, ...children): children may be strings, nodes or arrays of them.
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") { if (v) n.className = v; }
    else if (k === "text") n.textContent = v;
    else if (k === "value") n.value = v;
    else if (k === "html") n.innerHTML = v;        // fixed markup from this file only, never data
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? "" : v);
  }
  const add = (kid) => {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(add); return; }
    n.appendChild(typeof kid === "string" || typeof kid === "number" ? document.createTextNode(String(kid)) : kid);
  };
  kids.forEach(add);
  return n;
}

/* --------------------------------------------------------------------- api */
// 20 s; window.__API_TIMEOUT_MS is a test-only override that can only shorten it.
function apiLimit() {
  const ms = Number(window.__API_TIMEOUT_MS);
  return ms > 0 && ms < 20000 ? ms : 20000;
}

async function api(action, body) {
  const payload = Object.assign({ action }, body || {});
  if (S.token && action !== "unlock") payload.token = S.token;
  // A request that hangs is cut after 20 s (window.__API_TIMEOUT_MS: test-only override),
  // so a busy panel can always be released.
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), apiLimit());
  let res, data = {};
  try {
    res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal: ctl.signal });
    // the timer stays on while the body is read
    try { data = await res.json(); } catch (e) { if (ctl.signal.aborted) throw e; /* empty body */ }
  } catch (e) {
    const err = new Error(ctl.signal.aborted ? tr("The server did not answer. Try again.") : tr("No connection. Check the Wi-Fi and try again."));
    err.status = 0;
    throw err;
  } finally {
    clearTimeout(timer);
  }
  if (!res.ok) {
    // A lost session locks the page; the filters on screen are kept.
    if (res.status === 401 && action !== "unlock") lockDown(data.error);
    const err = new Error(data.error ? tr(data.error) : tr("Request failed ({n})", { n: res.status }));
    err.status = res.status;
    err.raw = data.error || "";            // the server's sentence as sent, before any translation
    throw err;
  }
  return data;
}

/* ----------------------------------------------------------------- dialogs

   redraw of the page leaves it open). confirmBox() asks yes / no and resolves
   to true or false. */
function modal(id, title, body, foot, cls) {
  const old = document.getElementById(id);
  if (old) old.remove();
  const close = () => { const h = document.getElementById(id); if (h) h.remove(); };
  const host = el("div", { id, class: "modal-wrap" + (cls ? " " + cls : "") },
    el("div", { class: "modal-scrim", onclick: close }),
    el("section", { class: "modal" + (cls ? " " + cls : ""), role: "dialog", "aria-modal": "true", "aria-labelledby": id + "-title" },
      el("div", { class: "modal-head" },
        el("h3", { id: id + "-title", text: title }),
        el("button", { class: "btn subtle close", type: "button", id: id + "-close", "aria-label": tr("Close"), onclick: close, text: "×" })),
      el("div", { class: "modal-body" }, body),
      foot ? el("div", { class: "modal-foot" }, foot) : null));
  document.body.appendChild(host);
  return { host, close };
}
function confirmBox({ title, body, ok, cancel, danger }) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (done) return; done = true; m.close(); resolve(v); };
    const m = modal("confirm-dialog", title, [].concat(body).map((t) => typeof t === "string" ? el("p", { text: t }) : t), [
      el("button", { type: "button", class: "btn " + (danger ? "danger" : "primary"), id: "confirm-ok", onclick: () => finish(true) }, ok || tr("Yes")),
      el("button", { type: "button", class: "btn", id: "confirm-cancel", onclick: () => finish(false) }, cancel || tr("Cancel")),
    ], "confirm");
    // closing it any other way (×, the scrim, the lock) is a no
    new MutationObserver((_, obs) => { if (!m.host.isConnected) { obs.disconnect(); finish(false); } })
      .observe(document.body, { childList: true });
    setTimeout(() => { const b = $("#confirm-cancel"); if (b && !touchDevice()) b.focus(); }, 30);
  });
}

const KIT_TOOLS = [

// Close functions of the menus that are open right now.
const kitOpenMenus = [];

// A tool calls this on lock: closes every open kit menu and detaches its listeners.
function kitCloseMenus() {

// A link that leaves the page can ask first. beforeLeave(href) returns a Promise:
// true follows the link, false stays. A modified click (new tab) is left alone.
function kitGuardLink(a, beforeLeave) {
  if (typeof beforeLeave !== 'function') return a;
  a.addEventListener('click', e => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    const href = a.href;
    Promise.resolve(beforeLeave(href)).then(go => { if (go) window.location.assign(href); });
  });
  return a;
}

// opts.beforeLeave: see kitGuardLink; asked before any tool link is followed.
function kitToolsMenu(currentId, lang, opts) {
  const beforeLeave = opts && opts.beforeLeave;
  const ru = lang === 'ru';
  const wrap = document.createElement('span');
  wrap.className = 'kit-tool-wrap';
  wrap.setAttribute('data-kit-menu', '');
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'kit-hbtn';
  btn.textContent = ru ? 'Инструменты' : 'Tools';
  btn.setAttribute('aria-expanded', 'false');
  const list = document.createElement('ul');
  list.className = 'kit-menu';
  list.hidden = true;
  for (const t of KIT_TOOLS) {
    const li = document.createElement('li');
    let item;
    if (t.id === currentId) {
      item = document.createElement('span');
      item.setAttribute('aria-current', 'page');
    } else {
      item = document.createElement('a');
      item.setAttribute('href', t.href);
      kitGuardLink(item, beforeLeave);

    li.appendChild(item);

  function close(refocus) {
    list.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('click', onDoc);
    const i = kitOpenMenus.indexOf(close);
    if (i >= 0) kitOpenMenus.splice(i, 1);
    if (refocus === true && btn.isConnected) btn.focus();
  }
  function open() {
    list.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    document.addEventListener('keydown', onKey);
    document.addEventListener('click', onDoc);
    kitOpenMenus.push(close);

  function onDoc(e) { if (!wrap.contains(e.target)) close(); }
  btn.addEventListener('click', e => { e.stopPropagation(); if (list.hidden) open(); else close(); });
  list.addEventListener('click', e => { if (e.target.closest && e.target.closest('a')) close(); });
  wrap.addEventListener('focusout', e => {
    if (!list.hidden && e.relatedTarget && !wrap.contains(e.relatedTarget)) close();
  });
  wrap.appendChild(btn);
  wrap.appendChild(list);
  return wrap;
}

async function loadList(clamped) {
  const seq = ++listSeq;

    const r = await api("list", { filters: listFilters() });
    if (seq !== listSeq) return;                   // a newer request is on its way
    if (S.locked) { S.listBusy = false; return; }  // locked meanwhile: nothing is kept or drawn
    // A change moved the last row of the last page away: the page is past the end.
    // Clamp to the last page and ask once more (never twice).
    const size = Number(r.page_size) || 50, count = Number(r.count);
    if (!clamped && S.page > 1 && count > 0 && !(r.rows && r.rows.length)) {
      S.page = Math.max(1, Math.ceil(count / size));
      return loadList(true);
    }
    S.list = r; S.listError = null;
  } catch (e) {
    if (seq !== listSeq) return;
    if (S.locked) { S.listBusy = false; return; }
    S.listError = e.message;

}

let pcSeq = 0;

function stillHere(pc) { return !S.locked && S.pc === pc; }

// Ask for the piece (first open, or again after a refusal). A form stays on screen only while the
// new state still allows it.
async function loadPiece(id) {
  const pc = S.pc;
  const seq = ++pcSeq;
  try {
    const d = await api("piece", { piece_id: id });
    if (!stillHere(pc) || seq !== pcSeq) return;
    pc.d = d; pc.err = null;
    if (pc.form && !actionsFor(d.piece.state).includes(pc.form.state)) pc.form = null;   // it moved meanwhile: the notice says why
    else pc.notice = null;
  } catch (e) {
    if (!stillHere(pc) || seq !== pcSeq) return;

  if (f.err && noteReq && blank(f.v.note)) form.querySelector("#pf-note").setAttribute("aria-invalid", "true");
  return form;
}

const CONFIRM_TITLE = { reserved: "Reserve {s}?", booked_out: "Book out {s}?", damaged: "Mark {s} as damaged?", in_stock: "Return {s} to stock?" };
const DONE_TOAST = { reserved: "Reserved {s}.", booked_out: "Booked out {s}.", damaged: "Marked {s} as damaged.", in_stock: "{s} is back in stock." };

async function submitForm() {
  const pc = S.pc;
  if (!pc || !pc.form || pc.form.busy || pc.form.confirming || S.locked) return;
  const f = pc.form, st = f.state, p = pc.d.piece;
  const note = f.v.note.trim();
  const hold = st === "reserved" || st === "booked_out";
  if (blank(note) && (st === "booked_out" || st === "damaged")) {
    f.err = tr(st === "booked_out" ? "Write who has it and why." : "Write what is wrong.");
    renderPiece();
    const n = $("#pf-note");
    if (n) n.focus();
    return;
  }
  f.err = null;
  const client = st === "reserved" ? f.v.client.trim() : "";
  const body = [];
  if (client) body.push(tr("Client: {c}", { c: client }));
  if (hold && f.v.until) body.push(tr("Until: {d}", { d: fmtDate(f.v.until) }));
  if (note) body.push(note);
  f.confirming = true;
  const ok = await confirmBox({ title: tr(CONFIRM_TITLE[st], { s: p.serial }), body, ok: tr(ACTION_LABEL[st]), cancel: tr("Cancel") });
  f.confirming = false;
  if (!ok || !stillHere(pc) || pc.form !== f) return;
  f.busy = true;
  renderPiece();
  const req = { piece_id: p.piece_id, state: st };
  if (note) req.note = note;
  if (client) req.client_id = client;
  if (hold && f.v.until) req.until = f.v.until;
  try {
    const d = await api("set_state", req);
    if (S.locked) return;                            // locked meanwhile: nothing is drawn
    refreshList();                                   // the change happened, whether or not the panel is still open
    toast(tr(DONE_TOAST[st], { s: p.serial }));
    if (stillHere(pc)) {
      pc.d = d; pc.form = null; pc.notice = null; pc.err = null;
      renderPiece();
    }
  } catch (e) {
    if (S.locked) return;
    if (!stillHere(pc)) { toast(e.message, true); refreshList(); return; }
    f.busy = false; f.err = e.message;
    if (e.status === 409) { pc.notice = e.message; loadPiece(pc.id); refreshList(); }   // it may have moved meanwhile (sold, …)
    renderPiece();
    const er = $("#pf-err");
    if (er && !er.hidden) er.scrollIntoView({ block: "nearest" });
  }
}

document.addEventListener("keydown", (e) => {

});

/* ===========================================================================
   Stock — the review queue (spec 2026-11-16, Goal 4 / Screens → Review).
   Open items raised by the database (a piece missing from the export, a serial
   used twice, a sale that contradicts the stock, a late or dropped arrival).
   Anyone with the view right sees the list; with the manage right each row
   offers the answers its kind allows, then a note and Confirm, and `resolve`
   closes it. The tab label carries the open count (loadReviews on login and
   after every resolve). Every late answer checks S.locked and that S.rv is
   still the object it started with, as piece.js does.
   S.rv = { items | null, err, ans: { id, resolution, note, err, busy, confirming } | null }
   ========================================================================= */
Object.assign(RU, {
  "Kind": "Вид",
  "Raised": "Поднято",
  "Answer": "Ответ",
  "Sold": "Продано",
  "Booked out": "Выдано",
  "Still in stock": "Есть в наличии",
  "Still in transit": "Всё ещё в пути",
  "Not delivered": "Не поставлено",
  "Close this review?": "Закрыть проверку?",
  "Confirm": "Подтвердить",
  "Review closed.": "Проверка закрыта.",
  "No open reviews.": "Открытых проверок нет.",
  "Could not load the reviews.": "Не удалось загрузить проверки.",
  "Answer: {a}": "Ответ: {a}",
});

// kind → the answers ops_resolve_review allows for it
const REVIEW_ANSWERS = {
  missing_from_export: ["sold", "damaged", "booked_out", "still_in_stock"],
  serial_reused: ["sold", "damaged", "booked_out", "still_in_stock"],
  ticket_conflict: ["sold", "damaged", "booked_out", "still_in_stock"],
  overdue_in_transit: ["still_in_transit", "not_delivered"],
  dropped_from_incoming: ["still_in_transit", "not_delivered"],
};
const ANSWER_WORD = { sold: "Sold", damaged: "Damaged", booked_out: "Booked out", still_in_stock: "Still in stock", still_in_transit: "Still in transit", not_delivered: "Not delivered" };
const kindWord = (k) => tr(REVIEW_KIND[k] || humanKey(k));          // REVIEW_KIND, humanKey: piece.js
const answerWord = (a) => tr(ANSWER_WORD[a] || humanKey(a));

let rvSeq = 0, rvDraws = 0;
function rvState() { return S.rv || (S.rv = { items: null, err: null, ans: null }); }
function setReviewTab() {
  const t = $("#tab-review");
  if (t) t.textContent = tr("Review") + (S.reviewCount > 0 ? " (" + S.reviewCount + ")" : "");
}

// Ask for the open items: on login, when the tab opens, after a resolve or a refusal.
async function loadReviews() {
  if (S.locked) return;
  const rv = rvState();
  const seq = ++rvSeq;
  try {
    const items = await api("reviews");
    if (S.locked || S.rv !== rv || seq !== rvSeq) return;
    rv.items = items; rv.err = null; S.reviewCount = items.length;
    const a = rv.ans;
    if (a && !items.some((r) => r.review_id === a.id)) {          // closed elsewhere meanwhile
      rv.ans = null;
      if (a.err) toast(a.err, true);
    }
  } catch (e) {
    if (S.locked || S.rv !== rv || seq !== rvSeq) return;
    if (!rv.items) rv.err = e.message;
  }
  setReviewTab();
  drawReviews();
}

function renderReview(main) {
  main.append(el("section", { class: "screen", id: "screen-review" },
    el("h1", { class: "sr-only", text: tr("Review") }),
    el("div", { id: "rv-host" })));
  drawReviews();
  loadReviews();
}

function drawReviews() {
  const host = $("#rv-host");
  if (!host || S.locked) return;
  const rv = rvState();
  const focus = focusMark(host);
  host.innerHTML = "";
  host.setAttribute("data-draws", ++rvDraws);                    // lets the tests wait for a redraw
  if (rv.err && !rv.items) {
    host.append(el("p", { class: "notice", role: "alert", text: tr("Could not load the reviews.") + " " + rv.err }),
      el("button", { type: "button", class: "btn", onclick: loadReviews, text: tr("Try again") }));
    return;
  }
  if (!rv.items) { host.append(el("p", { class: "loading-line", text: tr("Loading…") })); return; }
  if (!rv.items.length) { host.append(el("p", { class: "rv-empty", id: "rv-empty", text: tr("No open reviews.") })); return; }
  const manage = !!S.rights.manage;
  const body = el("tbody", { id: "rv-rows" });
  for (const r of rv.items) {
    body.append(reviewRow(r, manage, rv));
    if (manage && rv.ans && rv.ans.id === r.review_id) body.append(answerForm(r, rv.ans));
  }
  host.append(el("div", { class: "tbl-wrap" }, el("table", { class: "tbl reviews", id: "rv-table" },
    el("thead", {}, el("tr", {},
      el("th", { scope: "col", text: tr("Kind") }), el("th", { scope: "col", text: tr("Piece") }),
      el("th", { scope: "col", text: tr("State") }), el("th", { scope: "col", text: tr("Raised") }),
      manage ? el("th", { scope: "col", text: tr("Answer") }) : null)),
    body)));
  restoreFocus(host, focus);
}

// A redraw (a reload of the queue, a refusal) rebuilds every node: whatever held keyboard focus
// inside the queue gets it back. Marked by row and answer, or by id (the form's own controls).
// Not on a touch device, and not while the piece panel is open (focus belongs to the panel then).
const keepsFocus = () => !touchDevice() && !$("#piece-panel");
function focusMark(host) {
  if (!keepsFocus()) return null;
  const a = document.activeElement;
  if (!a || !host.contains(a)) return null;
  const row = a.closest("tr.rrow");
  const m = { id: a.id || null, review: row ? row.getAttribute("data-review") : null, answer: a.getAttribute("data-answer"), piece: a.classList.contains("rv-piece") };
  if (a.id === "rv-note") m.pos = a.selectionStart;
  return m;
}
function restoreFocus(host, m) {
  if (!m || !keepsFocus()) return;
  let n = null;
  if (m.id) n = $("#" + m.id, host);
  else if (m.review) {
    const row = host.querySelector('tr.rrow[data-review="' + m.review + '"]');
    n = row && (m.answer ? row.querySelector('button[data-answer="' + m.answer + '"]') : m.piece ? row.querySelector(".rv-piece") : null);
  }
  if (!n) return;
  n.focus();
  if (m.pos !== undefined) { try { n.setSelectionRange(m.pos, m.pos); } catch (e) { /* ignore */ } }
}

function reviewRow(r, manage, rv) {
  const p = r.piece || {};
  const a = rv.ans && rv.ans.id === r.review_id ? rv.ans : null;
  const model = [p.brand, p.model_name].filter((x) => !blank(x)).join(" · ");
  return el("tr", { class: "rrow" + (a ? " open" : ""), "data-review": r.review_id },
    el("td", { class: "rk", text: kindWord(r.kind) }),
    el("td", { class: "rp" }, el("button", { type: "button", class: "btn quiet rv-piece", onclick: () => openPiece(p.piece_id) },
      el("span", { class: "serial", text: p.serial || "—" }), model ? el("span", { class: "ref-m small", text: model }) : null)),
    el("td", { class: "st" }, stateTag(p.state)),
    el("td", { class: "since", text: fmtDate(r.raised_at) }),
    manage ? el("td", { class: "ra" }, el("div", { class: "rv-answers", role: "group" }, (REVIEW_ANSWERS[r.kind] || []).map((x) =>
      el("button", { type: "button", class: "btn rv-ans", "data-answer": x, "aria-pressed": a && a.resolution === x ? "true" : "false",
        disabled: a && a.busy ? true : null, onclick: () => pickAnswer(r.review_id, x), text: answerWord(x) })))) : null);
}

function answerForm(r, a) {
  const keep = (ev) => { a.note = ev.target.value; };
  return el("tr", { class: "rv-formrow" }, el("td", { colspan: "5" },
    el("form", { class: "rv-form", id: "rv-form", novalidate: true, onsubmit: (ev) => { ev.preventDefault(); confirmAnswer(); } },
      el("label", { class: "rv-field", for: "rv-note" },
        el("span", { class: "lbl", text: tr("Answer: {a}", { a: answerWord(a.resolution) }) + " · " + tr("Note") + " · " + tr("Optional") }),
        el("textarea", { id: "rv-note", maxlength: "500", rows: "2", value: a.note, oninput: keep })),
      el("p", { class: "form-err rv-err", role: "alert", hidden: a.err ? null : true, text: a.err || "" }),
      el("div", { class: "pc-form-foot" },
        el("button", { type: "submit", class: "btn primary", id: "rv-confirm", disabled: a.busy ? true : null, text: tr("Confirm") }),
        el("button", { type: "button", class: "btn", id: "rv-cancel", disabled: a.busy ? true : null,
          onclick: () => { const x = rvState().ans; rvState().ans = null; drawReviews(); focusAfter(x.id, x.resolution); }, text: tr("Cancel") })))));
}

// Keyboard focus after a form closes or a row goes: that row's answer button, else the next
// row's first one, else the tab (never body).
function focusAfter(id, resolution, removed) {
  if (touchDevice()) return;
  const rows = [...document.querySelectorAll("#rv-rows tr.rrow")];
  let target = null;
  if (!removed) {
    const r = rows.find((n) => n.getAttribute("data-review") === String(id));
    target = r && (r.querySelector('button[data-answer="' + resolution + '"]') || r.querySelector("button[data-answer]"));
  } else if (rows.length) {
    const next = removed.next !== null && rows.find((n) => n.getAttribute("data-review") === String(removed.next));
    const r = next || rows[rows.length - 1];
    target = r.querySelector("button[data-answer]") || r.querySelector(".rv-piece");
  }
  (target || $("#tab-review")).focus();
}
function pickAnswer(id, resolution) {
  const rv = rvState();
  if (rv.ans && (rv.ans.busy || rv.ans.confirming)) return;
  const same = rv.ans && rv.ans.id === id;
  rv.ans = { id, resolution, note: same ? rv.ans.note : "", err: null, busy: false, confirming: false };
  drawReviews();
  const n = $("#rv-note");
  if (n && !touchDevice()) n.focus();
}

async function confirmAnswer() {
  const rv = S.rv;
  const a = rv && rv.ans;
  if (!a || a.busy || a.confirming || S.locked) return;
  const item = rv.items.find((r) => r.review_id === a.id);
  if (!item) return;
  const note = a.note.trim();
  const piece = item.piece || {};
  const body = [kindWord(item.kind) + " · " + (piece.serial || ""), tr("Answer: {a}", { a: answerWord(a.resolution) })];
  if (note) body.push(note);
  a.confirming = true;
  const ok = await confirmBox({ title: tr("Close this review?"), body, ok: tr("Confirm"), cancel: tr("Cancel") });
  a.confirming = false;
  if (!ok && !S.locked && S.rv === rv && rv.ans === a) { const n = $("#rv-note"); if (n && !touchDevice()) n.focus(); }   // back to the form
  if (!ok || S.locked || S.rv !== rv || rv.ans !== a) return;
  a.busy = true; a.err = null;
  drawReviews();
  const req = { review_id: a.id, resolution: a.resolution };
  if (note) req.note = note;
  try {
    await api("resolve", req);
    if (S.locked || S.rv !== rv) return;             // locked meanwhile: nothing is drawn
    const idx = rv.items.findIndex((r) => r.review_id === a.id);
    const nextItem = rv.items[idx + 1] || rv.items[idx - 1];
    rv.items = rv.items.filter((r) => r.review_id !== a.id);
    S.reviewCount = rv.items.length;
    rv.ans = null;
    setReviewTab(); drawReviews();
    if (!$("#piece-panel")) focusAfter(a.id, a.resolution, { next: nextItem ? nextItem.review_id : null });
    toast(tr("Review closed."));
    loadReviews();
    if (typeof loadList === "function") loadList();                      // an answer such as Damaged moves a piece
    if (S.pc && S.pc.id === piece.piece_id && typeof loadPiece === "function") loadPiece(S.pc.id);
  } catch (e) {
    if (S.locked || S.rv !== rv) return;
    a.busy = false; a.err = e.message;
    if (e.status === 409) loadReviews();             // it may have been closed elsewhere
    drawReviews();
  }
}

/* ===========================================================================
   Delardi UI kit — kitXlsx(sheetName, columns, rows) → Blob

   A real .xlsx written by hand, so a tool page can hand a list to Excel without
   loading anything (a page that loads nothing from anywhere is the security
   model; a CSV has its own troubles with Cyrillic, ";" against "," and a
   leading "+" read as a formula). It is a stored (uncompressed) ZIP holding
   six small XML parts; at a few thousand rows that is well under a megabyte.

     columns  [{ title, key, type }]  type: "text" (default) | "number" | "date"
     rows     [{ [key]: value, … }]   plain objects
     returns  a Blob (MIME application/vnd.openxmlformats-officedocument.spreadsheetml.sheet)

   Cells: a number column holds numbers (null, "" or a non-finite value leaves
   the cell empty; a plain decimal string such as "31500000" is read as a number); a date column takes "YYYY-MM-DD" (anything after the tenth
   character is ignored; the caller decides which day that is) and writes a real
   date shown dd.mm.yyyy; text is written as is. The first row is the bold
   heading row, frozen, with a filter. The sheet name is cut to 31 characters
   and loses the characters Excel forbids.

   Generic by design: no words of any tool, no translation, no logging. Saving
   the file (a Blob URL and a temporary <a download>) is the caller's business.
   Everything lives inside the function, so inlining this file adds one global.
   ========================================================================= */
const kitXlsx = (() => {
  // ---- a zip, STORE only: no compression, so no deflate to write or to get wrong
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[i] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }
  function dosTime(d) {
    const t = ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() / 2) & 31);
    const dt = (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);
    return { t, dt };
  }
  // files: [{ name, text }], in the order they go in.
  function zipStore(files) {
    const enc = new TextEncoder();
    const { t, dt } = dosTime(new Date());
    const parts = files.map((f) => {
      const name = enc.encode(f.name);
      const data = enc.encode(f.text);
      return { name, data, crc: crc32(data) };
    });
    let size = 22;
    for (const p of parts) size += 30 + p.name.length + p.data.length + 46 + p.name.length;
    const out = new Uint8Array(size);
    const view = new DataView(out.buffer);
    let off = 0;
    const offsets = [];
    for (const p of parts) {
      offsets.push(off);
      view.setUint32(off, 0x04034b50, true);
      view.setUint16(off + 4, 20, true);
      view.setUint16(off + 6, 0x0800, true);       // names are UTF-8
      view.setUint16(off + 8, 0, true);            // stored
      view.setUint16(off + 10, t, true);
      view.setUint16(off + 12, dt, true);
      view.setUint32(off + 14, p.crc, true);
      view.setUint32(off + 18, p.data.length, true);
      view.setUint32(off + 22, p.data.length, true);
      view.setUint16(off + 26, p.name.length, true);
      view.setUint16(off + 28, 0, true);
      out.set(p.name, off + 30);
      out.set(p.data, off + 30 + p.name.length);
      off += 30 + p.name.length + p.data.length;
    }
    const dirStart = off;
    parts.forEach((p, i) => {
      view.setUint32(off, 0x02014b50, true);
      view.setUint16(off + 4, 20, true);
      view.setUint16(off + 6, 20, true);
      view.setUint16(off + 8, 0x0800, true);
      view.setUint16(off + 10, 0, true);
      view.setUint16(off + 12, t, true);
      view.setUint16(off + 14, dt, true);
      view.setUint32(off + 16, p.crc, true);
      view.setUint32(off + 20, p.data.length, true);
      view.setUint32(off + 24, p.data.length, true);
      view.setUint16(off + 28, p.name.length, true);
      view.setUint32(off + 42, offsets[i], true);
      out.set(p.name, off + 46);
      off += 46 + p.name.length;
    });
    view.setUint32(off, 0x06054b50, true);
    view.setUint16(off + 8, parts.length, true);
    view.setUint16(off + 10, parts.length, true);
    view.setUint32(off + 12, off - dirStart, true);
    view.setUint32(off + 16, dirStart, true);
    return out;
  }

  // ---- the workbook
  const xmlEsc = (v) => String(v == null ? "" : v)
    .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  // 1 → A, 27 → AA
  function colRef(n) {
    let s = "";
    while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; }
    return s;
  }
  // Excel counts days from 30 December 1899.
  const XL_EPOCH = Date.UTC(1899, 11, 30);
  function xlDate(v) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v || ""));
    return m ? (Date.UTC(+m[1], +m[2] - 1, +m[3]) - XL_EPOCH) / 86400000 : null;
  }
  const textCell = (ref, v, style) =>
    `<c r="${ref}" t="inlineStr"${style ? ` s="${style}"` : ""}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;

  function sheetXml(columns, rows) {
    const last = colRef(columns.length);
    const out = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">',
      `<dimension ref="A1:${last}${rows.length + 1}"/>`,
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>',
      '<sheetFormatPr defaultRowHeight="15"/>',
      "<cols>" + columns.map((c, i) => {
        const w = Math.max(12, Math.min(40, String(c.title).length + 4));
        return `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`;
      }).join("") + "</cols>",
      "<sheetData>",
      '<row r="1">' + columns.map((c, i) => textCell(colRef(i + 1) + "1", c.title, 1)).join("") + "</row>"];
    rows.forEach((row, ri) => {
      const r = ri + 2;
      const cells = [];
      columns.forEach((c, ci) => {
        const v = row[c.key];
        if (v === null || v === undefined || v === "") return;
        const ref = colRef(ci + 1) + r;
        if (c.type === "number") {
          // a plain decimal written as a string ("31500000", "-4", "12.5") counts as a number
          const n = typeof v === "string" && /^-?\d+(\.\d+)?$/.test(v) ? Number(v) : v;
          if (typeof n === "number" && isFinite(n)) cells.push(`<c r="${ref}" s="3"><v>${n}</v></c>`);
        } else if (c.type === "date") {
          const d = xlDate(v);
          cells.push(d === null ? textCell(ref, v) : `<c r="${ref}" s="2"><v>${d}</v></c>`);
        } else cells.push(textCell(ref, v));
      });
      out.push(`<row r="${r}">` + cells.join("") + "</row>");
    });
    out.push("</sheetData>");
    if (rows.length) out.push(`<autoFilter ref="A1:${last}${rows.length + 1}"/>`);
    out.push("</worksheet>");
    return out.join("");
  }
  const HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const STYLES_XML = HEAD +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<numFmts count="2"><numFmt numFmtId="164" formatCode="dd\\.mm\\.yyyy"/><numFmt numFmtId="165" formatCode="#,##0"/></numFmts>' +
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
    '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="4">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    "</cellXfs>" +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    "</styleSheet>";
  const REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";

  return function kitXlsx(sheetName, columns, rows) {
    const name = xmlEsc(String(sheetName || "Sheet1").replace(/[\\/?*\[\]:]/g, " ").slice(0, 31));
    const files = [
      { name: "[Content_Types].xml", text: HEAD +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        "</Types>" },
      { name: "_rels/.rels", text: HEAD +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        `<Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: "xl/workbook.xml", text: HEAD +
        `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${REL}">` +
        `<sheets><sheet name="${name}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
      { name: "xl/_rels/workbook.xml.rels", text: HEAD +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        `<Relationship Id="rId1" Type="${REL}/worksheet" Target="worksheets/sheet1.xml"/>` +
        `<Relationship Id="rId2" Type="${REL}/styles" Target="styles.xml"/></Relationships>` },
      { name: "xl/styles.xml", text: STYLES_XML },
      { name: "xl/worksheets/sheet1.xml", text: sheetXml(columns, rows) },
    ];
    return new Blob([zipStore(files)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  };
})();

/* ===========================================================================
   Stock — "Download .xlsx": the filtered list as a real workbook. stock-api
   `export` takes the same filters as the screen (every page, at most 5 000
   rows; more is a 409 with a sentence written for the screen) and kitXlsx()
   (ui/xlsx.js) writes the file. No cost column: the rows carry none.
   ========================================================================= */
Object.assign(RU, {
  "Download .xlsx": "Скачать .xlsx",
  "Preparing the file…": "Готовим файл…",
  "Saved: {name}": "Сохранено: {name}",
  "Nothing to download: no piece matches these filters.": "Скачивать нечего: под фильтры не подходит ни одно изделие.",
  "Barcode": "Штрихкод",
  "Reference": "Артикул",
  "Model": "Модель",
  "Collection": "Коллекция",
  "Price, so'm": "Цена, сум",
});

function exportButton() {
  return el("button", { type: "button", class: "btn", id: "export-btn", onclick: exportList,
    disabled: S.exporting ? true : null, text: tr(S.exporting ? "Preparing the file…" : "Download .xlsx") });
}
function setExporting(on) {
  S.exporting = on;
  const b = $("#export-btn");
  if (!b) return;
  b.disabled = on;
  b.textContent = tr(on ? "Preparing the file…" : "Download .xlsx");
}

// "2026-11-16", the boutique's day.
function tashkentIsoDay(iso) {
  const t = blank(iso) ? null : tashkentDay(iso);
  return t ? t.y + "-" + String(t.m).padStart(2, "0") + "-" + String(t.d).padStart(2, "0") : "";
}
const exportColumns = () => [
  { title: tr("Serial"), key: "serial" },
  { title: tr("Barcode"), key: "barcode" },
  { title: tr("Brand"), key: "brand" },
  { title: tr("Reference"), key: "article" },
  { title: tr("Model"), key: "model_name" },
  { title: tr("Collection"), key: "collection" },
  { title: tr("Category"), key: "category_word" },
  { title: tr("Size"), key: "size" },
  { title: tr("State"), key: "state_word" },
  { title: tr("Since"), key: "since", type: "date" },
  { title: tr("Price, so'm"), key: "price_uzs", type: "number" },
];

async function exportList() {
  if (S.exporting) return;
  setExporting(true);
  try {
    const f = listFilters();
    delete f.page;
    const r = await api("export", { filters: f });
    if (S.locked) return;
    const rows = (r.rows || []).map((p) => Object.assign({}, p, {
      category_word: blank(p.category) ? "" : categoryWord(p.category),
      state_word: stateWord(p.state),
      since: tashkentIsoDay(p.state_since),
    }));
    if (!rows.length) { toast(tr("Nothing to download: no piece matches these filters.")); return; }
    const name = "Delardi_stock_" + tashkentIsoDay(new Date().toISOString()) + ".xlsx";
    const blob = kitXlsx(tr("Stock"), exportColumns(), rows);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    toast(tr("Saved: {name}", { name }));
  } catch (e) {
    if (!S.locked) toast(e.message, true);
  } finally {
    setExporting(false);
  }
}

/* -------------------------------------------------------------------- init */
function renderAll() {
  const app = $("#app");
  document.documentElement.lang = LANG;
  document.title = "Delardi " + tr("Stock");
  if (S.locked && !S.facets) return;               // nothing behind the gate before a passcode
  const r = route();
  kitCloseMenus();                                 // the header is redrawn: no open menu is left listening
  app.innerHTML = "";
  if (!S.locked) { app.classList.remove("gated"); app.setAttribute("aria-hidden", "false"); app.inert = false; }
  const main = el("main", { id: "main" });
  app.append(renderHeader(), main);
  ROUTES[r.name](main, r.arg);
  if (typeof renderPiece === "function") renderPiece();      // an open piece panel follows the language
}
function restoreSession() {
  try {
    const s = JSON.parse(sstore(SESSION_KEY) || "null");
    if (!s || !s.token || new Date(s.expires_at).getTime() <= Date.now()) return false;
    const last = Number(sstore(ACTIVE_KEY) || 0);
    if (touchDevice() && last && Date.now() - last >= IDLE_MIN * 60000) { sstore(SESSION_KEY, null); return false; }
    S.token = s.token; S.name = s.name; S.expires_at = s.expires_at; S.rights = s.rights || S.rights;
    return true;
  } catch (e) { return false; }
}

(async function boot() {
  document.documentElement.lang = LANG;
  if (restoreSession()) {
    try {
      const p = await api("ping");
      S.name = p.name; S.rights = p.rights; S.locked = false; activeNow();
      await loadFacets();
      loadReviews();
    } catch (e) {
      S.locked = true;
      if (e.status !== 401) { S.token = null; sstore(SESSION_KEY, null); S.gateMessage = e.raw || null; }
    }
  }
  if (S.locked) $("#app").innerHTML = "";          // nothing behind the gate
  renderAll();
  renderGate();
})();
</script>
