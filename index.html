/* ===========================================================================
   Delardi Weekly Board
   Brand: DELARDI brandbook (short) — two official navies #001A4A / #082966,
   Palatino Linotype as the accent face, Evolventa as the text face.
   The brand supplies one hue, so the four pillars are carried by a validated
   single-hue tonal ramp plus their names, and colour is reserved for status.
   ========================================================================= */
:root {
  --navy:        #001A4A;   /* brand primary   */
  --navy-2:      #082966;   /* brand secondary */
  --page:        #EEF1F7;
  --surface:     #FFFFFF;
  --surface-2:   #F5F7FB;
  --ink:         #001A4A;
  --ink-2:       #5B6478;
  --muted:       #8892A6;
  --grid:        #DCE3EF;
  --line:        #C6D0E2;
  --border:      rgba(0,26,74,0.12);
  --shadow:      0 1px 2px rgba(0,26,74,.05), 0 10px 28px rgba(0,26,74,.08);
  --header-bg:   #001A4A;
  --header-ink:  #FFFFFF;
  --header-ink-2:#B9C6DE;
  --header-line: rgba(255,255,255,0.16);

  --good:        #2F6F4F;
  --warning:     #B07A1E;
  --serious:     #C2612F;
  --critical:    #9B3B3B;
  --good-ink:    #2F6F4F;

  /* Pillar ramp — one hue, monotone lightness, validated for the light surface */
  --p-marketing: #001A4A;
  --p-retail:    #082966;
  --p-operations:#2E5490;
  --p-steering:  #7C97C4;

  --sans:  "Evolventa","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --serif: "Palatino Linotype","Book Antiqua",Palatino,"Times New Roman",Georgia,serif;
  --radius: 4px;
  color-scheme: light;
}
:root[data-theme="dark"], html[data-theme="auto"].sysdark {
  --page:        #000D22;
  --surface:     #00112F;
  --surface-2:   #041B3F;
  --ink:         #F2F5FA;
  --ink-2:       #B9C6DE;
  --muted:       #8892A6;
  --grid:        #0C2650;
  --line:        #1B3A69;
  --border:      rgba(255,255,255,0.13);
  --shadow:      0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.55);
  --header-bg:   #000B1C;
  --header-line: rgba(255,255,255,0.13);

  --good:        #4E9E72;
  --warning:     #D9A23C;
  --serious:     #E08B5C;
  --critical:    #E07C7C;
  --good-ink:    #4E9E72;

  /* Same ramp re-stepped for the dark surface, prominence order preserved */
  --p-marketing: #8FA8CC;
  --p-retail:    #6E8CB8;
  --p-operations:#4E6EA0;
  --p-steering:  #2E5490;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }

/* ------------------------------------------------------------------ header */
.top {
  position: sticky; top: 0; z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.top-row {
  display: flex; align-items: center; gap: 18px;
  padding: 15px 22px 14px;
  flex-wrap: wrap;
  background: var(--header-bg);
  color: var(--header-ink);
}
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand .mark { height: 36px; width: auto; display: block; }
.brand .rule { width: 1px; height: 34px; background: var(--header-line); flex: none; }
.brand .title {
  font-family: var(--serif); font-size: 17px; line-height: 1.25;
  letter-spacing: .015em; color: var(--header-ink);
}
.brand .sub {
  font-size: 11px; letter-spacing: .11em; text-transform: uppercase;
  color: var(--header-ink-2); margin-top: 3px;
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.brand .sub button {
  background: none; border: 0; padding: 1px 2px; margin: 0;
  font: inherit; letter-spacing: inherit; text-transform: inherit;
  color: var(--header-ink-2); cursor: pointer; border-radius: 3px;
}
.brand .sub button:hover { color: var(--header-ink); }
.brand .sub button[aria-pressed="true"] {
  color: var(--header-ink); font-weight: 700; text-decoration: underline;
  text-underline-offset: 3px;
}
.brand .sub .dash { color: var(--header-ink-2); opacity: .55; }
/* controls sitting on the navy band */
.top-row .btn, .top-row select {
  background: rgba(255,255,255,0.07); color: var(--header-ink);
  border-color: var(--header-line);
}
.top-row .btn:hover, .top-row select:hover { background: rgba(255,255,255,0.14); }
.top-row .btn.primary {
  background: var(--header-ink); color: var(--navy); border-color: var(--header-ink);
  font-weight: 600;
}
.top-row .btn.subtle { background: transparent; color: var(--header-ink-2); }
.top-row .btn.subtle:hover { background: rgba(255,255,255,0.12); color: var(--header-ink); }
.top-row .lock-state {
  background: rgba(255,255,255,0.08); border-color: var(--header-line);
  color: var(--header-ink);
}
.top-row .lock-state .btn.subtle { color: var(--header-ink-2); }
.top-row select option { color: #001A4A; background: #fff; }
.spacer { flex: 1 1 auto; }

.btn {
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; font-size: 13.5px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.primary:hover { opacity: .88; }
.btn.subtle { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.subtle:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 9px; font-size: 12.5px; }
.btn.danger { color: var(--critical); border-color: var(--border); }

.lock-state {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; color: var(--ink-2);
  padding: 6px 11px; border-radius: 8px; background: var(--surface-2);
  border: 1px solid var(--border);
}
.lock-state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }

/* -------------------------------------------------------------- scoreboard */
.scoreboard {
  display: grid; grid-template-columns: repeat(6, minmax(0,1fr));
  gap: 1px; background: var(--border);
  border-top: 1px solid var(--border);
}
.stat {
  background: var(--surface); padding: 11px 16px 13px;
  min-width: 0;
}
.stat .label {
  font-size: 11.5px; color: var(--muted); font-weight: 500;
  text-transform: uppercase; letter-spacing: .045em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stat .val {
  font-family: var(--serif);
  font-size: 27px; font-weight: 600; line-height: 1.12; margin-top: 4px;
  letter-spacing: -0.005em; color: var(--navy);
}
:root[data-theme="dark"] .stat .val, html[data-theme="auto"].sysdark .stat .val { color: var(--ink); }
.stat .sub {
  font-size: 11.5px; color: var(--muted); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stat .target { color: var(--ink-2); font-weight: 500; }
.stat.editable .val { cursor: text; }

/* -------------------------------------------------------------- task stats */
.task-stats {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 20px; border-top: 1px solid var(--border);
  background: var(--surface);
}
.task-stats .grp { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.task-stats .grp-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); font-weight: 600; margin-right: 2px;
}
.tstat {
  display: inline-flex; align-items: baseline; gap: 5px;
  font-size: 12.5px; color: var(--ink-2); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px 4px 9px;
}
button.tstat { cursor: pointer; }
button.tstat:hover { background: var(--border); }
button.tstat[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
button.tstat[aria-pressed="true"] b { color: var(--surface); }
.tstat b { font-family: var(--serif); font-size: 14.5px; color: var(--navy); font-weight: 700; }
:root[data-theme="dark"] .tstat b, html[data-theme="auto"].sysdark .tstat b { color: var(--ink); }
.task-stats.collapsed .grp { display: none; }
.tstat.zero { opacity: .45; }

/* ----------------------------------------------------------------- toolbar */
.filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filters-toggle { display: none; }
.toolbar select { max-width: 190px; }
.toolbar input[type=text] { width: 190px; }
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 11px 20px; border-top: 1px solid var(--border);
  background: var(--surface);
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  background: var(--surface); border: 0; padding: 7px 13px; font-size: 13.5px;
  color: var(--ink-2); border-right: 1px solid var(--border);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 550; }
select, input[type=text], input[type=date], textarea {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 9px; font-size: 13.5px;
  max-width: 100%;
}
textarea { resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--p1); outline-offset: -1px; }
.field-label {
  display: block; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: .045em; color: var(--muted); font-weight: 500; margin-bottom: 5px;
}

/* ------------------------------------------------------------------- board */
.board {
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 14px; padding: 16px 20px 60px; align-items: start;
}
.col { min-width: 0; }
.col-head {
  display: flex; align-items: center; gap: 8px;
  padding: 0 2px 9px; border-bottom: 2px solid var(--accent);
  margin-bottom: 11px;
}
.col-head .numeral {
  font-family: var(--serif); font-size: 12px; color: var(--muted);
  letter-spacing: .06em; flex: none;
}
.col-head .name {
  font-family: var(--serif); font-size: 15px; font-weight: 600;
  letter-spacing: .035em; color: var(--navy);
}
:root[data-theme="dark"] .col-head .name, html[data-theme="auto"].sysdark .col-head .name { color: var(--ink); }
.col-head .count {
  font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  margin-left: auto;
}
.col-head .swatch { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }

[data-pillar="marketing"]  { --accent: var(--p-marketing); }
[data-pillar="retail"]     { --accent: var(--p-retail); }
[data-pillar="operations"] { --accent: var(--p-operations); }
[data-pillar="steering"]   { --accent: var(--p-steering); }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius); padding: 11px 13px 10px;
  margin-bottom: 9px; cursor: pointer; text-align: left; width: 100%;
  display: block; box-shadow: 0 1px 1px rgba(11,11,11,.03);
}
.card:hover { box-shadow: var(--shadow); }
.card .title { font-size: 14.5px; font-weight: 600; line-height: 1.32; color: var(--ink); }
.card .owner { font-size: 12px; color: var(--ink-2); margin-top: 5px; }
.card .next { font-size: 12.5px; color: var(--ink-2); margin-top: 7px; line-height: 1.4; }
.card .row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
.card.is-done { opacity: .62; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; padding: 3px 8px 3px 7px;
  border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--ink-2);
  white-space: nowrap;
}
.chip .glyph { font-size: 10px; line-height: 1; }
.chip .shape {
  width: 9px; height: 9px; border-radius: 50%; flex: none;
  border: 1.5px solid currentColor; box-sizing: border-box;
}
.chip .shape.half { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.chip[data-tone="good"]     { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 40%, transparent); background: color-mix(in srgb, var(--good) 9%, var(--surface)); }
.chip[data-tone="warning"]  { color: var(--ink);      border-color: color-mix(in srgb, var(--warning) 55%, transparent); background: color-mix(in srgb, var(--warning) 16%, var(--surface)); }
.chip[data-tone="critical"] { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, transparent); background: color-mix(in srgb, var(--critical) 9%, var(--surface)); }
.chip[data-tone="serious"]  { color: var(--ink);      border-color: color-mix(in srgb, var(--serious) 55%, transparent); background: color-mix(in srgb, var(--serious) 15%, var(--surface)); }
.chip.age[data-tone="warning"], .chip.age[data-tone="serious"] { font-variant-numeric: tabular-nums; }
.chip.prio { border-style: dashed; }

.empty-col { font-size: 12.5px; color: var(--muted); padding: 10px 2px; font-style: italic; }
.hint { font-size: 12.5px; color: var(--muted); }

/* ------------------------------------------------------------------ drawer */
.scrim {
  position: fixed; inset: 0; background: rgba(11,11,11,.35);
  z-index: 60; opacity: 0; pointer-events: none; transition: opacity .16s;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%);
  background: var(--surface); z-index: 70; box-shadow: var(--shadow);
  transform: translateX(100%); transition: transform .2s ease;
  display: flex; flex-direction: column;
  border-left: 1px solid var(--border);
}
.drawer.open { transform: none; }
.drawer-head {
  padding: 16px 18px 13px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 12px;
}
.drawer-head h2 { margin: 7px 0 0; font-family: var(--serif); font-size: 21px; line-height: 1.28; font-weight: 600; }
.drawer-body { overflow-y: auto; padding: 16px 18px 40px; flex: 1; }
.drawer-section { margin-bottom: 22px; }
.drawer-section > h3 {
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); margin: 0 0 10px; font-weight: 600;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.pill-tag {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  font-weight: 600; color: var(--ink-2);
}
.pill-tag .swatch { width: 9px; height: 9px; border-radius: 2px; background: var(--accent); }

.drawer-body input[type=text], .drawer-body select, .drawer-body textarea { width: 100%; }
.drawer-body input[type=date] { width: auto; }

/* ------------------------------------------------------------ person field */
.person-field { display: flex; flex-direction: column; gap: 6px; }
.person-field input[type=text] { width: 100%; }
.check-field {
  display: flex; align-items: center; gap: 8px; font-size: 13.5px;
  cursor: pointer; color: var(--ink);
}
.check-field input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--navy); flex: none; }
.chip[data-tone="sensitive"] {
  color: var(--critical); border-color: color-mix(in srgb, var(--critical) 45%, transparent);
  background: color-mix(in srgb, var(--critical) 8%, var(--surface));
}

.log-entry {
  border-left: 2px solid var(--grid); padding: 0 0 15px 13px; position: relative;
}
.log-entry:last-child { padding-bottom: 2px; }
.log-entry .meta {
  font-size: 11.5px; color: var(--muted); display: flex; gap: 8px;
  align-items: center; flex-wrap: wrap;
}
.log-entry .meta strong { color: var(--ink-2); font-weight: 600; }
.log-entry .note { font-size: 13.5px; margin-top: 4px; white-space: pre-wrap; line-height: 1.5; }

/* -------------------------------------------------------------- meeting mode */
.meeting { padding: 24px 20px 80px; max-width: 900px; margin: 0 auto; }
.meeting .progress { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meeting h2 { font-family: var(--serif); font-size: 33px; line-height: 1.2; margin: 12px 0 14px; font-weight: 600; letter-spacing: 0; }
.meeting .detail { font-size: 15px; color: var(--ink-2); line-height: 1.55; }
.meeting .prev-note {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px; margin: 16px 0;
  font-size: 14px; line-height: 1.5;
}
.meeting textarea { width: 100%; min-height: 110px; font-size: 15px; }
.meeting-nav {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
  border-top: 1px solid var(--border); padding: 11px 20px;
  display: flex; gap: 10px; align-items: center; z-index: 30;
}
.status-picker { display: flex; gap: 7px; flex-wrap: wrap; }
.status-picker button {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 11px; font-size: 12.5px; color: var(--ink-2);
}
.status-picker button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; }
.finalized-note {
  display: flex; align-items: flex-start; gap: 10px; margin-top: 16px;
  padding: 12px 14px; border-radius: var(--radius);
  background: color-mix(in srgb, var(--good) 9%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--good) 35%, transparent);
}
.finalized-note .txt { flex: 1; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
.finalized-note .mk { color: var(--good-ink); font-weight: 700; flex: none; }
.meeting-summary-item {
  border-left: 2px solid var(--grid); padding: 3px 0 15px 13px; margin-bottom: 4px;
}
.meeting-summary-item h4 { margin: 0 0 3px; font-size: 14.5px; font-weight: 600; }
.meeting-summary-item .note { font-size: 13px; color: var(--ink-2); line-height: 1.5; white-space: pre-wrap; }
.meeting-summary-item .meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.meeting-skip-note { font-size: 12.5px; color: var(--muted); margin-top: 18px; }

/* ------------------------------------------------------------------- modal */
.modal {
  position: fixed; inset: 0; z-index: 90; display: none;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(11,11,11,.45);
}
.modal.open { display: flex; }
.modal-card {
  background: var(--surface); border-radius: 14px; padding: 22px;
  width: min(460px, 100%); box-shadow: var(--shadow); border: 1px solid var(--border);
  max-height: 90vh; overflow-y: auto;
}
.modal-card h2 { margin: 0 0 6px; font-family: var(--serif); font-size: 20px; font-weight: 600; }
.modal-card p.lead { margin: 0 0 16px; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.modal-card label { display: block; margin-bottom: 12px; }
.modal-card input, .modal-card select, .modal-card textarea { width: 100%; }
.modal-actions { display: flex; gap: 9px; justify-content: flex-end; margin-top: 6px; }
.err { color: var(--critical); font-size: 13px; margin: 0 0 12px; font-weight: 500; }
pre.minutes {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; font-size: 12px; line-height: 1.5; max-height: 46vh; overflow: auto;
  white-space: pre-wrap; font-family: ui-monospace, "SF Mono", Menlo, monospace;
}

/* ---------------------------------------------------------- drag and drop */
.card.draggable { cursor: grab; }
.card.draggable:active { cursor: grabbing; }
.card.dragging { opacity: .35; }
.col.drop-target { background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 6px; }
.card[data-drop="before"] { box-shadow: 0 -3px 0 -1px var(--accent); }
.card[data-drop="after"]  { box-shadow: 0  3px 0 -1px var(--accent); }
.col-drop-tail { height: 26px; border-radius: 6px; }
.col-drop-tail[data-drop="in"] { box-shadow: inset 0 3px 0 -1px var(--accent); }

/* ------------------------------------------------------------- suggestions */
.sug-wrap { padding: 16px 20px 70px; max-width: 1080px; margin: 0 auto; }
.sug-intro { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; margin: 0 0 16px; max-width: 70ch; }
.sug {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--accent); border-radius: var(--radius);
  padding: 14px 16px 13px; margin-bottom: 11px;
}
.sug-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 7px; }
.sug-kind {
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 3px; background: var(--navy); color: #fff;
}
.sug-kind[data-kind="update"] { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }
.sug h3 { margin: 0; font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.3; }
.sug .note { font-size: 13.5px; line-height: 1.55; color: var(--ink); margin: 7px 0 0; white-space: pre-wrap; }
.sug .meta { font-size: 12px; color: var(--ink-2); margin-top: 8px; line-height: 1.5; }
.sug .evidence {
  margin: 10px 0 0; padding: 8px 11px; border-left: 2px solid var(--line);
  background: var(--surface-2); font-size: 12.5px; color: var(--ink-2);
  font-style: italic; line-height: 1.5; border-radius: 0 4px 4px 0;
}
.sug .src { font-size: 11.5px; color: var(--muted); margin-top: 7px; }
.sug .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.seg .badge {
  display: inline-block; min-width: 17px; padding: 0 5px; margin-left: 7px;
  border-radius: 9px; background: var(--navy); color: #fff;
  font-size: 11px; font-weight: 700; line-height: 17px; text-align: center;
}
.seg button[aria-pressed="true"] .badge { background: var(--surface); color: var(--navy); }
.sug-empty { padding: 44px 10px; text-align: center; color: var(--muted); font-size: 14px; }

/* ------------------------------------------------------------------ mobile */
.pillar-chips { display: none; gap: 7px; padding: 10px 13px; overflow-x: auto; background: var(--surface); border-top: 1px solid var(--border); }
.pillar-chips button {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 7px 13px; font-size: 13.5px; white-space: nowrap;
}
.pillar-chips button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 600; }
.pillar-chips button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
.fab {
  display: none; position: fixed; right: 16px; bottom: 18px; z-index: 50;
  width: 54px; height: 54px; border-radius: 50%; border: 0;
  background: var(--navy); color: #fff; font-size: 27px; line-height: 1;
  box-shadow: 0 4px 16px rgba(0,26,74,.34);
}
@media (max-width: 720px) {
  .pillar-chips { display: flex; }
  .brand .sub, .brand .rule, .top-row .spacer { display: none; }
  .brand .mark { height: 28px; }
  .brand .title { font-size: 15px; }
  .top-row { gap: 10px; padding: 11px 13px 10px; }
  .top-row select { flex: 1 1 auto; min-width: 0; }
  .seg { overflow-x: auto; max-width: 100%; }
  .seg button { flex: none; padding: 7px 10px; font-size: 12.5px; }
  .filters { display: none; width: 100%; }
  .filters.open { display: flex; }
  .filters-toggle { display: inline-flex; }
  .m-hide { display: none; }
  .toolbar { padding: 9px 13px; }
  .fab.on { display: block; }
  .drawer { width: 100%; border-left: 0; }
  .drawer-head { padding: 14px 15px 12px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .drawer-head h2 { font-size: 18px; }
  .drawer-body { padding: 14px 15px 90px; }
  .toolbar { gap: 8px; }
  .toolbar select, .toolbar input[type=text] { flex: 1 1 44%; max-width: none; width: auto; }
  .board .col-head { position: sticky; top: 0; background: var(--page); z-index: 1; padding-top: 8px; }
  .card { padding: 13px 14px 12px; }
  .card .title { font-size: 15.5px; }
  .btn { padding: 9px 13px; }
  .sug-wrap { padding: 14px 13px 80px; }
}

/* -------------------------------------------------------------------- gate */
#app.gated { filter: blur(9px) saturate(.9); pointer-events: none; user-select: none; }
.gate {
  position: fixed; inset: 0; z-index: 85; display: flex;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(0,26,74,.34);
}
.gate-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  width: min(400px, 100%); box-shadow: var(--shadow); overflow: hidden;
}
.gate-mast { background: var(--navy); padding: 17px 22px; }
.gate-mast img { height: 34px; width: auto; display: block; }
.gate-card h2 { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 20px 22px 5px; }
.gate-card p.lead { margin: 0 22px 18px; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.gate-card label { display: block; margin: 0 22px 13px; }
.gate-card input { width: 100%; }
.gate-card .err { margin: 0 22px 12px; }
.gate-card .btn { margin: 5px 22px 0; width: calc(100% - 44px); justify-content: center; }
.gate-card .gate-foot { margin: 15px 22px 18px; font-size: 11.5px; color: var(--muted); line-height: 1.45; }

/* ------------------------------------------------------------------- toast */
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--page); padding: 10px 18px; border-radius: 999px;
  font-size: 13.5px; font-weight: 500; z-index: 100; opacity: 0;
  transition: opacity .18s, transform .18s; pointer-events: none;
  box-shadow: var(--shadow); max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%); }

.loading { padding: 60px 20px; text-align: center; color: var(--muted); }
.watermark {
  position: fixed; right: 22px; bottom: 16px; width: 34px; opacity: .10;
  pointer-events: none; z-index: 1;
}
@media (max-width: 720px) { .watermark { display: none; } }

@media (max-width: 1180px) {
  .scoreboard { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .board { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 720px) {
  /* One swipeable row rather than three stacked ones, so topics stay above the fold. */
  .scoreboard {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .scoreboard .stat { min-width: 168px; scroll-snap-align: start; }
  .board { grid-template-columns: 1fr; padding: 14px 13px 60px; }
  .top-row, .toolbar { padding-left: 13px; padding-right: 13px; }
  .brand h1 { font-size: 17px; }
  .meeting h2 { font-size: 24px; }
}
@media print {
  .top, .toolbar, .meeting-nav, .drawer, .scrim { display: none !important; }
  .board { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading the board…</div></div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Topic detail"></div>

  for (const kid of [].concat(kids)) if (kid) n.appendChild(kid);
  return n;
};
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// A fixed-roster select with a graceful escape hatch: legacy free-text values
// (e.g. "Olga & Alex", from before the roster existed) still show, editable
// via "Other…", rather than silently getting clobbered on the next save.
function personField(value) {
  const known = value && OWNERS.includes(value);
  const opts = [{ v: "", t: "— none —" }]
    .concat(OWNERS.map((o) => ({ v: o, t: o })))
    .concat([{ v: "__other__", t: "Other…" }]);
  const sel = el("select", {}, opts.map((o) => {
    const isOther = o.v === "__other__";
    const selected = isOther ? (!!value && !known) : value === o.v;
    return el("option", { value: o.v, selected: selected ? "selected" : null, text: o.t });
  }));
  const other = el("input", { type: "text", placeholder: "Name",
    value: (!known && value) ? value : "",
    style: (!known && value) ? "" : "display:none" });
  sel.addEventListener("change", () => {
    other.style.display = sel.value === "__other__" ? "" : "none";
    if (sel.value === "__other__") other.focus();
  });
  const wrap = el("div", { class: "person-field" }, [sel, other]);
  wrap.getValue = () => (sel.value === "__other__" ? other.value.trim() : sel.value);
  return wrap;
}

function sensitiveField(value) {
  const cb = el("input", { type: "checkbox" });
  cb.checked = !!value;
  const label = el("label", { class: "check-field" }, [
    cb, el("span", { text: "Sensitive — mark for restricted access once we set up access groups" })]);
  label.getValue = () => cb.checked;
  return label;
}

function mondayOf(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dow = x.getUTCDay();               // 0 Sun .. 6 Sat
  x.setUTCDate(x.getUTCDate() - ((dow + 6) % 7));
  return x.toISOString().slice(0, 10);
}
const thisMonday = () => mondayOf(new Date());

function weekLabel(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00Z");
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
}
function weeksBetween(isoA, isoB) {
  if (!isoA || !isoB) return null;
  const ms = new Date(isoB + "T00:00:00Z") - new Date(isoA + "T00:00:00Z");
  return Math.floor(ms / (7 * 864e5));
}
function ageOf(topic) {
  const ref = topic.last_discussed_week || topic.first_raised_week;
  if (!ref) return null;
  const w = weeksBetween(ref, S.week || thisMonday());
  return w === null || w < 0 ? 0 : w;
}
function staleTone(weeks) {
  if (weeks === null) return "";
  if (weeks >= STALE_SERIOUS) return "serious";
  if (weeks >= STALE_WARN) return "warning";
  return "";
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}
function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); }
  catch (e) { return null; }
}

/* --------------------------------------------------------------------- api */
async function call(action, payload = {}) {
  const body = { action, ...payload };
  if (S.session && action !== "unlock") body.token = S.session.token;
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) {
    if (res.status === 401 && action !== "unlock") lockDown();
    throw new Error(data.error || "Request failed (" + res.status + ")");
  }
  return data;
}

/* ------------------------------------------------------------------- load */
async function loadAll() {
  const snap = await call("snapshot");          // refused without a valid session
  S.pillars = snap.pillars || [];
  S.topics = snap.topics || [];
  S.updates = snap.updates || [];
  S.weeks = snap.weeks || [];
  S.scoreboard = snap.scoreboard || [];
  S.suggestions = snap.suggestions || [];
  const mon = thisMonday();
  if (!S.weeks.some((w) => w.week_start === mon)) S.weeks.unshift({ week_start: mon, label: null, synthetic: true });
  if (!S.week) S.week = mon;
}

}

const updatesFor = (topicId) => S.updates.filter((u) => u.topic_id === topicId);

function visibleTopics() {
  const f = S.filters;
  let list = S.topics.filter((t) => (f.archived ? true : !t.archived));
  if (S.view === "week" || S.view === "meeting") {
    // A Done/Parked topic stays visible for the week its status was set in,
    // then rolls off "This week" once a later week starts — status_week is
    // the source of truth; the update log is a fallback for older rows.
    const discussedThisWeek = new Set(updatesIn(S.week).map((u) => u.topic_id));
    list = list.filter((t) => !["done", "parked"].includes(t.status) ||
      t.status_week === S.week || discussedThisWeek.has(t.id));
  }
  if (f.pillar) list = list.filter((t) => String(t.pillar_id) === f.pillar);
  if (f.owner) list = list.filter((t) => (t.owner || "") === f.owner);
  if (f.status) list = list.filter((t) => t.status === f.status);
  if (f.sensitive) list = list.filter((t) => t.sensitive);
  if (f.q) {
    const q = f.q.toLowerCase();
    list = list.filter((t) =>
      [t.title, t.detail, t.owner, t.next_step].some((v) => (v || "").toLowerCase().includes(q)));
  }
  // Manual order leads — dragging is meant to be a real signal. Finished work
  // sinks to the bottom regardless, and status only breaks ties.
  const done = (t) => (["done", "parked"].includes(t.status) ? 1 : 0);
  const rank = (t) => STATUS_ORDER.indexOf(t.status);
  return list.sort((a, b) =>
    done(a) - done(b) || a.sort_order - b.sort_order || rank(a) - rank(b));
}

/* --------------------------------------------------------------- task stats */
// "This week" mirrors the board's own week filter; "Upcoming weeks" is the
// full open backlog regardless of when it was last touched — what's still on
// the plate, not just what's on today's agenda.
function computeTaskStats() {
  let list = S.topics.filter((t) => !t.archived);
  if (S.statScope === "week") {
    const discussedThisWeek = new Set(updatesIn(S.week).map((u) => u.topic_id));
    list = list.filter((t) => !["done", "parked"].includes(t.status) ||
      t.status_week === S.week || discussedThisWeek.has(t.id));
  } else {
    list = list.filter((t) => !["done", "parked"].includes(t.status));
  }
  const byStatus = {}; STATUS_ORDER.forEach((s) => (byStatus[s] = 0));
  const byPriority = { high: 0, medium: 0, low: 0 };
  for (const t of list) {
    byStatus[t.status] = (byStatus[t.status] || 0) + 1;
    byPriority[t.priority] = (byPriority[t.priority] || 0) + 1;
  }
  return { total: list.length, byStatus, byPriority };
}

function statusChip(status) {
  const s = STATUS[status] || STATUS.not_started;
  const mark = s.shape
    ? el("span", { class: "shape " + s.shape, "aria-hidden": "true" })
    : el("span", { class: "glyph", text: s.glyph, "aria-hidden": "true" });
  return el("span", { class: "chip", "data-tone": s.tone || null }, [
    mark,
    el("span", { text: s.label }),
  ]);
}
function ageChip(topic) {
  const w = ageOf(topic);
  if (w === null) return null;
  if (["done", "parked"].includes(topic.status)) return null;
  const tone = staleTone(w);
  if (!tone && w < 1) return null;
  const txt = w === 0 ? "this week" : w === 1 ? "1 wk" : w + " wks";
  return el("span", { class: "chip age", "data-tone": tone || null, title: "Last discussed " + txt },
    [el("span", { text: (tone ? "⚑ " : "") + txt })]);
}

/* ------------------------------------------------------------ drag and drop */
let dragId = null;
const canDrag = () => canEdit() && !window.matchMedia("(hover: none)").matches;

function clearDropMarks() {
  document.querySelectorAll("[data-drop]").forEach((n) => n.removeAttribute("data-drop"));
  document.querySelectorAll(".col.drop-target").forEach((n) => n.classList.remove("drop-target"));
}

function onColDragOver(e) {
  if (!dragId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  const col = e.currentTarget;
  clearDropMarks();
  col.classList.add("drop-target");
  const card = e.target.closest ? e.target.closest(".card") : null;
  if (card && card.dataset.topicId !== dragId) {
    const r = card.getBoundingClientRect();
    card.setAttribute("data-drop", e.clientY < r.top + r.height / 2 ? "before" : "after");
  } else if (!card) {
    const tail = col.querySelector(".col-drop-tail");
    if (tail) tail.setAttribute("data-drop", "in");
  }
}

async function onColDrop(e, pillarIdVal) {
  if (!dragId) return;
  e.preventDefault();
  const col = e.currentTarget;
  const movingId = dragId;
  const marked = col.querySelector(".card[data-drop]");
  const ids = [...col.querySelectorAll(".card")]
    .map((n) => n.dataset.topicId).filter((id) => id && id !== movingId);
  let index = ids.length;
  if (marked) {
    const at = ids.indexOf(marked.dataset.topicId);
    index = marked.getAttribute("data-drop") === "before" ? at : at + 1;
  }
  ids.splice(index, 0, movingId);
  clearDropMarks();
  dragId = null;
  await applyReorder(pillarIdVal, ids);
}

// Optimistic: move it on screen straight away, roll back if the server refuses.
async function applyReorder(pillarIdVal, ids) {
  const before = S.topics.map((t) => ({ id: t.id, pillar_id: t.pillar_id, sort_order: t.sort_order }));
  ids.forEach((id, i) => {
    const t = S.topics.find((x) => x.id === id);
    if (t) { t.pillar_id = pillarIdVal; t.sort_order = i + 1; }
  });
  renderBody();
  try {
    await call("reorder_topics", { pillar_id: pillarIdVal, ordered_ids: ids });
  } catch (err) {
    for (const b of before) {
      const t = S.topics.find((x) => x.id === b.id);
      if (t) { t.pillar_id = b.pillar_id; t.sort_order = b.sort_order; }
    }
    renderBody();
    toast(err.message);
  }
}

      if (canDrag()) {
        col.addEventListener("dragover", onColDragOver);
        col.addEventListener("drop", (e) => onColDrop(e, p.id));
        col.addEventListener("dragleave", (e) => {
          if (!col.contains(e.relatedTarget)) col.classList.remove("drop-target");
        });
      }
      return col;
    });
  return el("div", { class: "board" }, cols);
}

function topicCard(t) {
  const p = pillarOf(t.pillar_id);
  const row = [statusChip(t.status)];
  const age = ageChip(t);
  if (age) row.push(age);
  if (t.priority === "high") row.push(el("span", { class: "chip prio", text: "High" }));
  if (t.due_date) row.push(el("span", { class: "chip", text: "Due " + weekLabel(t.due_date) }));
  if (t.sensitive) row.push(el("span", { class: "chip", "data-tone": "sensitive", text: "🔒 Sensitive" }));
  if (t.archived) row.push(el("span", { class: "chip", text: "Archived" }));

  const kids = [el("div", { class: "title", text: t.title })];
  const who = [t.owner, t.supporting ? "+ " + t.supporting : ""].filter(Boolean).join(" ");
  if (who) kids.push(el("div", { class: "owner", text: who }));
  if (t.next_step) kids.push(el("div", { class: "next", text: "→ " + t.next_step }));
  kids.push(el("div", { class: "row" }, row));

  const card = el("button", {
    class: "card" + (["done", "parked"].includes(t.status) ? " is-done" : "") +
           (canDrag() ? " draggable" : ""),
    "data-pillar": p.slug,
    "data-topic-id": t.id,
    onclick: () => { if (!dragId) openDrawer(t.id); },
  }, kids);
  if (canDrag()) {
    card.draggable = true;
    card.addEventListener("dragstart", (e) => {
      dragId = t.id;
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", t.id); } catch (_) {}
      card.classList.add("dragging");
    });
    card.addEventListener("dragend", () => {
      dragId = null;
      card.classList.remove("dragging");
      clearDropMarks();
    });
  }
  return card;
}

/* ------------------------------------------------------------ suggestions */
function renderSuggestions() {
  const list = S.suggestions || [];
  const wrap = el("div", { class: "sug-wrap" });
  const introRow = el("div", { style: "display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap" }, [
    el("p", { class: "sug-intro", style: "flex:1;min-width:240px", text:
      "Drafted from your Zoom meetings. Each one carries the meeting it came from and the line that " +
      "prompted it, so you can see why before you take it. Accepting opens it pre-filled — nothing " +
      "reaches the board that you have not read. Accepting an update on an archived topic brings that " +
      "topic back onto the board." }),
  ]);
  if (list.length && canEdit()) {
    introRow.appendChild(el("button", { class: "btn danger sm", text: "Decline all", onclick: async (ev) => {
      if (!window.confirm("Decline all " + list.length + " pending suggestion" + (list.length === 1 ? "" : "s") +
        "? This can't be undone.")) return;
      ev.target.disabled = true;
      try { await call("dismiss_all_suggestions", {}); await refresh(); toast("Declined all."); }
      catch (e) { toast(e.message); ev.target.disabled = false; }
    } }));
  }
  wrap.appendChild(introRow);

  if (!list.length) {
    wrap.appendChild(el("div", { class: "sug-empty",
      text: "Nothing waiting. New suggestions appear here after a meeting has been read." }));
    return wrap;
  }
  for (const sg of list) wrap.appendChild(suggestionCard(sg));
  return wrap;
}

function suggestionCard(sg) {
  const isNew = sg.kind === "new";
  const topic = isNew ? null : S.topics.find((t) => t.id === sg.target_topic_id);
  const p = isNew ? pillarOf(sg.pillar_id) : (topic ? pillarOf(topic.pillar_id) : pillarOf(0));
  const heading = isNew ? sg.title : (topic ? topic.title : "(topic no longer exists)");

  const head = el("div", { class: "sug-head" }, [
    el("span", { class: "sug-kind", "data-kind": sg.kind, text: isNew ? "New topic" : "Update" }),
    el("span", { class: "pill-tag" }, [el("span", { class: "swatch" }), el("span", { text: p.name })]),
  ]);
  if (sg.status) head.appendChild(statusChip(sg.status));
  if (topic && topic.archived) {
    head.appendChild(el("span", { class: "chip", "data-tone": "warning",
      text: "archived — accepting restores it" }));
  }

  const card = el("div", { class: "sug", "data-pillar": p.slug }, [
    head,
    el("h3", { text: heading }),
    el("p", { class: "note", text: sg.note }),
  ]);

  const bits = [];
  if (sg.owner) bits.push("Owner: " + sg.owner);
  if (sg.supporting) bits.push("Supporting: " + sg.supporting);
  if (sg.next_step) bits.push("Next: " + sg.next_step);
  if (bits.length) card.appendChild(el("div", { class: "meta", text: bits.join(" · ") }));
  if (sg.evidence) card.appendChild(el("blockquote", { class: "evidence", text: "\u201c" + sg.evidence + "\u201d" }));
  card.appendChild(el("div", { class: "src",
    text: sg.source_meeting + (sg.source_date ? " · " + weekLabel(sg.source_date) : "") }));

  if (canEdit()) {
    card.appendChild(el("div", { class: "acts" }, [
      el("button", { class: "btn primary", text: "Review and accept", onclick: () => openAccept(sg) }),
      el("button", { class: "btn subtle", text: "Dismiss", onclick: async (ev) => {
        ev.target.disabled = true;
        try {
          await call("dismiss_suggestion", { id: sg.id });
          S.suggestions = S.suggestions.filter((x) => x.id !== sg.id);
          renderAll(); toast("Dismissed.");
        } catch (e) { toast(e.message); ev.target.disabled = false; }
      } }),
    ]));
  } else {
    card.appendChild(el("p", { class: "hint", style: "margin-top:11px",
      text: "Unlock to accept or dismiss." }));
  }
  return card;
}

function openAccept(sg) {
  const isNew = sg.kind === "new";
  const topic = isNew ? null : S.topics.find((t) => t.id === sg.target_topic_id);

  const title = el("input", { type: "text", value: sg.title || "" });
  const pillar = el("select", {}, S.pillars.map((p) =>
    el("option", { value: String(p.id), selected: sg.pillar_id === p.id ? "selected" : null, text: p.name })));
  const note = el("textarea", { rows: "7" }); note.value = sg.note || "";
  const owner = personField(sg.owner || "");
  const supporting = personField(sg.supporting || "");
  const next = el("input", { type: "text", value: sg.next_step || "" });
  const status = el("select", {}, STATUS_ORDER.map((k) =>
    el("option", { value: k, selected: sg.status === k ? "selected" : null, text: STATUS[k].label })));
  const err = el("p", { class: "err", style: "display:none" });

  const fields = [err];
  if (isNew) {
    fields.push(el("label", {}, [el("span", { class: "field-label", text: "Topic title" }), title]));
    fields.push(el("label", {}, [el("span", { class: "field-label", text: "Pillar" }), pillar]));
  } else {
    fields.push(el("p", { class: "lead", style: "margin:0 0 14px",
      text: "This will be logged against \u201c" + (topic ? topic.title : "?") + "\u201d" +
            (topic && topic.archived ? ", and will bring it back onto the board." : ".") }));
  }
  fields.push(el("label", {}, [el("span", { class: "field-label", text: "Weekly update" }), note]));
  fields.push(el("label", {}, [el("span", { class: "field-label", text: "Owner" }), owner]));
  fields.push(el("label", {}, [el("span", { class: "field-label", text: "Supporting" }), supporting]));
  fields.push(el("label", {}, [el("span", { class: "field-label", text: "Next step" }), next]));
  fields.push(el("label", {}, [el("span", { class: "field-label", text: "Status" }), status]));

  const save = async (ev) => {
    err.style.display = "none";
    if (!note.value.trim()) { err.textContent = "The update text is required."; err.style.display = "block"; return; }
    if (isNew && !title.value.trim()) { err.textContent = "A title is required."; err.style.display = "block"; return; }
    ev.target.disabled = true; ev.target.textContent = "Saving…";
    try {
      await call("accept_suggestion", {
        id: sg.id, week_start: S.week, note: note.value, owner: owner.getValue(),
        supporting: supporting.getValue(), next_step: next.value, status: status.value,
        title: isNew ? title.value : undefined,
        pillar_id: isNew ? Number(pillar.value) : undefined,
      });
      closeModal();
      await refresh();
      toast("Added to the board.");
    } catch (e) {
      err.textContent = e.message; err.style.display = "block";
      ev.target.disabled = false; ev.target.textContent = "Accept";
    }
  };

  showModal(isNew ? "Accept as a new topic" : "Accept as an update",
    "Drafted from " + sg.source_meeting + (sg.source_date ? ", " + weekLabel(sg.source_date) : "") +
    ". Edit anything before it lands.",
    fields, [el("button", { class: "btn primary", text: "Accept", onclick: save })]);
}

/* ----------------------------------------------------------------- drawer */
function openDrawer(topicId) {
  S.drawerTopic = topicId;
  renderDrawer();
  $("#drawer").classList.add("open");
  $("#scrim").classList.add("open");
}
function closeDrawer() {
  S.drawerTopic = null;
  $("#drawer").classList.remove("open");
  $("#scrim").classList.remove("open");
}

function renderDrawer() {
  const d = $("#drawer");
  d.innerHTML = "";
  const t = S.topics.find((x) => x.id === S.drawerTopic);
  if (!t) return;
  const p = pillarOf(t.pillar_id);

  d.appendChild(el("div", { class: "drawer-head", "data-pillar": p.slug }, [
    el("div", {}, [
      el("span", { class: "pill-tag" }, [el("span", { class: "swatch" }), el("span", { text: p.name })]),
      el("h2", { text: t.title }),
    ]),
    el("div", { class: "spacer" }),
    el("button", { class: "btn subtle", text: "✕", "aria-label": "Close", onclick: closeDrawer }),
  ]));

  const body = el("div", { class: "drawer-body" });

  if (t.detail) {
    body.appendChild(el("div", { class: "drawer-section" }, [
      el("h3", { text: "Background" }),
      el("div", { style: "font-size:13.5px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap", text: t.detail }),
    ]));
  }

  /* --- current position ------------------------------------------------- */
  const facts = el("div", { class: "drawer-section" }, [el("h3", { text: "Where it stands" })]);
  if (canEdit()) {
    const statusSel = el("select", {}, STATUS_ORDER.map((s) =>
      el("option", { value: s, selected: t.status === s ? "selected" : null, text: STATUS[s].label })));
    const prioSel = el("select", {}, Object.keys(PRIORITY).map((k) =>
      el("option", { value: k, selected: t.priority === k ? "selected" : null, text: PRIORITY[k] })));
    const ownerF = personField(t.owner);
    const supportingF = personField(t.supporting);
    const sensitiveF = sensitiveField(t.sensitive);
    const nextIn = el("input", { type: "text", value: t.next_step || "", placeholder: "The next concrete step" });
    const dueIn = el("input", { type: "date", value: t.due_date || "" });

    // Drag does not exist on touch or for keyboard users, so moving a topic
    // between pillars has to be possible here too.
    const pillarSel = el("select", {}, S.pillars.map((pp) =>
      el("option", { value: String(pp.id), selected: t.pillar_id === pp.id ? "selected" : null, text: pp.name })));
    facts.appendChild(el("div", { class: "grid2" }, [
      el("div", {}, [el("span", { class: "field-label", text: "Status" }), statusSel]),
      el("div", {}, [el("span", { class: "field-label", text: "Priority" }), prioSel]),
    ]));
    facts.appendChild(el("div", { style: "margin-top:11px" }, [
      el("span", { class: "field-label", text: "Section" }), pillarSel]));
    facts.appendChild(el("div", { class: "grid2", style: "margin-top:11px" }, [
      el("div", {}, [el("span", { class: "field-label", text: "Owner" }), ownerF]),
      el("div", {}, [el("span", { class: "field-label", text: "Supporting" }), supportingF]),
    ]));
    facts.appendChild(el("div", { style: "margin-top:11px" }, [el("span", { class: "field-label", text: "Next step" }), nextIn]));
    facts.appendChild(el("div", { style: "margin-top:11px;max-width:200px" }, [el("span", { class: "field-label", text: "Due" }), dueIn]));
    facts.appendChild(el("div", { style: "margin-top:13px" }, [sensitiveF]));
    facts.appendChild(el("div", { style: "margin-top:13px;display:flex;gap:9px;flex-wrap:wrap" }, [
      el("button", { class: "btn primary", text: "Save changes", onclick: async (ev) => {
        ev.target.disabled = true;
        try {
          await call("update_topic", { id: t.id, week_start: S.week, patch: {
            status: statusSel.value, priority: prioSel.value, owner: ownerF.getValue(),
            supporting: supportingF.getValue(), sensitive: sensitiveF.getValue(),
            next_step: nextIn.value, due_date: dueIn.value || null,
            pillar_id: Number(pillarSel.value) } });
          await refresh(); toast("Saved.");
        } catch (e) { toast(e.message); } finally { ev.target.disabled = false; }
      } }),
      el("button", { class: "btn", text: "Edit title / background", onclick: () => openTopicForm(t) }),
      el("button", { class: "btn danger", text: t.archived ? "Restore" : "Archive", onclick: async () => {
        try { await call("update_topic", { id: t.id, patch: { archived: !t.archived } });
          await refresh(); toast(t.archived ? "Restored." : "Archived."); closeDrawer(); }
        catch (e) { toast(e.message); }
      } }),
    ]));
  } else {
    const row = el("div", { style: "display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px" }, [statusChip(t.status)]);
    const a = ageChip(t); if (a) row.appendChild(a);
    if (t.sensitive) row.appendChild(el("span", { class: "chip", "data-tone": "sensitive", text: "🔒 Sensitive" }));
    facts.appendChild(row);
    if (t.owner) facts.appendChild(el("div", { style: "font-size:13.5px", text: "Owner: " + t.owner }));
    if (t.supporting) facts.appendChild(el("div", { style: "font-size:13.5px;margin-top:4px", text: "Supporting: " + t.supporting }));
    if (t.next_step) facts.appendChild(el("div", { style: "font-size:13.5px;margin-top:4px", text: "Next step: " + t.next_step }));
    if (t.due_date) facts.appendChild(el("div", { style: "font-size:13.5px;margin-top:4px", text: "Due: " + weekLabel(t.due_date) }));
  }
  body.appendChild(facts);

  /* --- log this week ---------------------------------------------------- */
  if (canEdit()) {
    const note = el("textarea", { rows: "4", placeholder: "What was said about this today?" });
    const stat = el("select", {}, [el("option", { value: "", text: "Leave status unchanged" })].concat(
      STATUS_ORDER.map((s) => el("option", { value: s, text: "→ " + STATUS[s].label }))));
    body.appendChild(el("div", { class: "drawer-section" }, [
      el("h3", { text: "Log an update · week of " + weekLabel(S.week) }),
      note,
      el("div", { style: "display:flex;gap:9px;margin-top:9px;flex-wrap:wrap" }, [
        stat,
        el("button", { class: "btn primary", text: "Add to the record", onclick: async (ev) => {
          if (!note.value.trim()) { toast("Write the update first."); return; }
          ev.target.disabled = true;
          try {
            await call("add_update", { topic_id: t.id, week_start: S.week, note: note.value, status_at: stat.value || null });
            note.value = ""; await refresh(); toast("Logged.");
          } catch (e) { toast(e.message); } finally { ev.target.disabled = false; }
        } }),
      ]),
    ]));
  }

  /* --- history ---------------------------------------------------------- */
  const log = updatesFor(t.id);
  const hist = el("div", { class: "drawer-section" }, [
    el("h3", { text: "Weekly record · " + log.length + (log.length === 1 ? " entry" : " entries") }),
  ]);
  if (!log.length) {
    hist.appendChild(el("div", { class: "hint", text: "Nothing logged yet. The first update starts the trail." }));
  } else {
    for (const u of log) {
      const meta = [
        el("strong", { text: "Week of " + weekLabel(u.week_start) }),
        el("span", { text: u.author }),
      ];
      if (u.status_at) meta.push(statusChip(u.status_at));
      const mine = S.session && u.author === S.session.name &&
        (Date.now() - new Date(u.created_at).getTime()) < 15 * 60000;
      if (mine) {
        meta.push(el("button", { class: "btn subtle sm", text: "remove", onclick: async () => {
          try { await call("delete_update", { id: u.id }); await refresh(); renderDrawer(); toast("Removed."); }
          catch (e) { toast(e.message); }
        } }));
      }
      hist.appendChild(el("div", { class: "log-entry" }, [
        el("div", { class: "meta" }, meta),
        el("div", { class: "note", text: u.note }),
      ]));
    }
  }
  body.appendChild(hist);
  d.appendChild(body);
}

/* ------------------------------------------------------------ meeting mode */
// Nothing here writes to the record as you go. Each topic's comment is staged
// in S.meetingDraft by "Finalize topic"; the extra step past the last topic is
// a summary of everything staged, and only "Finalize meeting" there commits it
// all in one batch and saves the minutes for the week.
function renderMeeting() {
  const list = visibleTopics();
  if (!list.length) return el("div", { class: "meeting" }, [el("p", { class: "hint", text: "No topics match the current filters." })]);
  if (S.meetingIdx > list.length) S.meetingIdx = list.length;
  if (S.meetingIdx === list.length) return renderMeetingSummary(list);

  const t = list[S.meetingIdx];
  const p = pillarOf(t.pillar_id);
  const log = updatesFor(t.id);
  const last = log[0];
  const draft = S.meetingDraft[t.id];
  const finalizedCount = Object.keys(S.meetingDraft).length;

  const wrap = el("div", { class: "meeting", "data-pillar": p.slug }, [
    el("div", { style: "display:flex;align-items:center;gap:12px;flex-wrap:wrap" }, [
      el("span", { class: "pill-tag" }, [el("span", { class: "swatch" }), el("span", { text: p.name })]),
      statusChip(t.status),
      ageChip(t) || el("span"),
      el("span", { class: "spacer", style: "flex:1" }),
      el("span", { class: "progress",
        text: (S.meetingIdx + 1) + " of " + list.length + (finalizedCount ? " · " + finalizedCount + " finalized" : "") }),
    ]),
    el("h2", { text: t.title }),
  ]);
  const who = [t.owner, t.supporting ? "+ " + t.supporting : ""].filter(Boolean).join(" ");
  if (who) wrap.appendChild(el("div", { class: "detail", text: "Owner: " + who }));
  if (t.next_step) wrap.appendChild(el("div", { class: "detail", style: "margin-top:4px", text: "Next step: " + t.next_step }));
  if (t.detail) wrap.appendChild(el("div", { class: "detail", style: "margin-top:12px", text: t.detail }));

  if (last) {
    wrap.appendChild(el("div", { class: "prev-note" }, [
      el("div", { style: "font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:5px",
                  text: "Last time · week of " + weekLabel(last.week_start) + " · " + last.author }),
      el("div", { style: "white-space:pre-wrap", text: last.note }),
    ]));
  }

  if (canEdit()) {
    const note = el("textarea", { placeholder: "This week…", rows: "4" });
    note.value = draft ? draft.note : "";
    let chosen = draft ? (draft.status_at || "") : "";
    const picker = el("div", { class: "status-picker", style: "margin-top:10px" },
      STATUS_ORDER.map((s) => el("button", { text: STATUS[s].label, "aria-pressed": String(chosen === s), onclick: (ev) => {
        chosen = chosen === s ? "" : s;
        [...picker.children].forEach((b) => b.setAttribute("aria-pressed", "false"));
        if (chosen) ev.target.setAttribute("aria-pressed", "true");
      } })));
    const finalizeBtn = el("button", { class: "btn primary", text: draft ? "Update finalized topic" : "Finalize topic",
      disabled: note.value.trim() ? null : "disabled" });
    note.addEventListener("input", () => { finalizeBtn.disabled = note.value.trim() ? null : true; });
    finalizeBtn.addEventListener("click", () => {
      if (!note.value.trim()) return;
      S.meetingDraft[t.id] = { note: note.value.trim(), status_at: chosen || null };
      toast("Finalized. Moving on…");
      step(1);
    });
    const actions = [finalizeBtn];
    if (draft) {
      actions.push(el("button", { class: "btn subtle", text: "Remove from meeting", onclick: () => {
        delete S.meetingDraft[t.id]; renderBody();
      } }));
    }
    wrap.appendChild(el("div", { style: "margin-top:16px" }, [
      el("span", { class: "field-label", text: "This week…" }), note, picker,
      el("div", { style: "margin-top:11px;display:flex;gap:9px;flex-wrap:wrap" }, actions),
    ]));
  } else {
    wrap.appendChild(el("p", { class: "hint", style: "margin-top:18px", text: "Unlock with the team passcode to log updates." }));
  }

  const nav = el("div", { class: "meeting-nav" }, [
    el("button", { class: "btn", text: "← Previous", onclick: () => step(-1), disabled: S.meetingIdx === 0 ? "disabled" : null }),
    el("button", { class: "btn", text: "Skip →", onclick: () => step(1) }),
    el("span", { class: "hint", text: "Week of " + weekLabel(S.week) }),
    el("div", { class: "spacer", style: "flex:1" }),
    el("button", { class: "btn subtle", text: "Leave meeting mode", onclick: () => setView("week") }),
  ]);
  return el("div", {}, [wrap, nav]);
}

function renderMeetingSummary(list) {
  const draftIds = Object.keys(S.meetingDraft);
  const wrap = el("div", { class: "meeting" }, [
    el("div", { style: "display:flex;align-items:center;gap:12px;flex-wrap:wrap" }, [
      el("span", { class: "spacer", style: "flex:1" }),
      el("span", { class: "progress", text: draftIds.length + " of " + list.length + " finalized" }),
    ]),
    el("h2", { text: "Meeting summary" }),
    el("div", { class: "detail",
      text: "Review what you finalized, then finalize the meeting to write it all to each topic's weekly record and save this week's minutes." }),
  ]);

  if (!draftIds.length) {
    wrap.appendChild(el("p", { class: "hint", style: "margin-top:16px", text: "Nothing finalized yet. Go back and finalize at least one topic." }));
  } else {
    const items = el("div", { style: "margin-top:18px" });
    for (const id of draftIds) {
      const t = S.topics.find((x) => x.id === id);
      if (!t) continue;
      const d = S.meetingDraft[id];
      const meta = ["Week of " + weekLabel(S.week)];
      if (d.status_at) meta.push("→ " + STATUS[d.status_at].label);
      items.appendChild(el("div", { class: "meeting-summary-item" }, [
        el("h4", { text: t.title }),
        el("div", { class: "note", text: d.note }),
        el("div", { class: "meta", text: meta.join(" · ") }),
      ]));
    }
    wrap.appendChild(items);
  }

  const skipped = list.filter((t) => !S.meetingDraft[t.id]);
  if (skipped.length) {
    wrap.appendChild(el("div", { class: "meeting-skip-note",
      text: "Not finalized: " + skipped.map((t) => t.title).join(", ") }));
  }

  if (canEdit()) {
    wrap.appendChild(el("div", { style: "margin-top:20px;display:flex;gap:9px;flex-wrap:wrap" }, [
      el("button", { class: "btn primary", text: "Finalize meeting", disabled: draftIds.length ? null : "disabled",
        onclick: async (ev) => { ev.target.disabled = true; ev.target.textContent = "Finalizing…"; await finalizeMeeting(); } }),
    ]));
  }

  const nav = el("div", { class: "meeting-nav" }, [
    el("button", { class: "btn", text: "← Previous", onclick: () => step(-1) }),
    el("span", { class: "hint", text: "Week of " + weekLabel(S.week) }),
    el("div", { class: "spacer", style: "flex:1" }),
    el("button", { class: "btn subtle", text: "Leave meeting mode", onclick: () => setView("week") }),
  ]);
  return el("div", {}, [wrap, nav]);
}

function step(n) {
  const total = visibleTopics().length;
  S.meetingIdx = Math.max(0, Math.min(total, S.meetingIdx + n));
  renderBody();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function finalizeMeeting() {
  const entries = Object.keys(S.meetingDraft).map((id) => ({
    topic_id: id, note: S.meetingDraft[id].note, status_at: S.meetingDraft[id].status_at || null,
  }));
  if (!entries.length) { toast("Finalize at least one topic first."); renderBody(); return; }
  const minutes = buildDraftMinutes();
  try {
    await call("finalize_meeting", { week_start: S.week, entries, minutes_md: minutes });
    S.meetingDraft = {};
    await refresh();
    setView("week");
    toast("Meeting finalized. Minutes saved for this week.");
  } catch (e) {
    toast(e.message);
    renderBody();
  }
}

/* ---------------------------------------------------------------- minutes */
function buildMinutes() {
  const ups = updatesIn(S.week);
  const lines = ["# Delardi Weekly Board — minutes", "", "Week of " + weekLabel(S.week), ""];
  let any = false;
  for (const p of S.pillars) {
    const rows = ups.filter((u) => {
      const t = S.topics.find((x) => x.id === u.topic_id);
      return t && t.pillar_id === p.id;
    });
    if (!rows.length) continue;
    any = true;
    lines.push("## " + p.name, "");
    for (const u of rows) {
      const t = S.topics.find((x) => x.id === u.topic_id);
      lines.push("**" + t.title + "**" + (t.owner ? " — " + t.owner : ""));
      lines.push("");
      lines.push(u.note.split("\n").map((l) => "> " + l).join("\n"));
      lines.push("");
      const bits = ["Status: " + (STATUS[t.status] || {}).label];
      if (t.next_step) bits.push("Next: " + t.next_step);
      if (t.due_date) bits.push("Due: " + weekLabel(t.due_date));
      lines.push("- " + bits.join(" · "));
      lines.push("");
    }
  }
  if (!any) lines.push("_Nothing was logged for this week yet._", "");

  const open = S.topics.filter((t) => !t.archived && !["done", "parked"].includes(t.status));
  const notTouched = open.filter((t) => !ups.some((u) => u.topic_id === t.id));
  if (notTouched.length) {
    lines.push("## Open, not discussed this week", "");
    for (const t of notTouched) {
      const w = ageOf(t);
      lines.push("- " + t.title + " (" + pillarOf(t.pillar_id).name + (t.owner ? ", " + t.owner : "") +
        (w >= STALE_WARN ? " — " + w + " weeks since last discussed" : "") + ")");
    }
    lines.push("");
  }
  const decisions = S.topics.filter((t) => t.status === "needs_decision" && !t.archived);
  if (decisions.length) {
    lines.push("## Waiting on a decision", "");
    for (const t of decisions) lines.push("- " + t.title + " (" + pillarOf(t.pillar_id).name + ")");
    lines.push("");
  }
  return lines.join("\n");
}

// A draft version of buildMinutes(), sourced from what has been finalized in
// this meeting session but not yet written anywhere — used to preview, and to
// hand to the server as the record when "Finalize meeting" is pressed.
function buildDraftMinutes() {
  const list = visibleTopics();
  const entries = Object.keys(S.meetingDraft).map((id) => ({ id, ...S.meetingDraft[id] }));
  const lines = ["# Delardi Weekly Board — minutes", "", "Week of " + weekLabel(S.week), ""];
  let any = false;
  for (const p of S.pillars) {
    const rows = entries.filter((e) => { const t = S.topics.find((x) => x.id === e.id); return t && t.pillar_id === p.id; });
    if (!rows.length) continue;
    any = true;
    lines.push("## " + p.name, "");
    for (const e of rows) {
      const t = S.topics.find((x) => x.id === e.id);
      lines.push("**" + t.title + "**" + (t.owner ? " — " + t.owner : ""));
      lines.push("");
      lines.push(e.note.split("\n").map((l) => "> " + l).join("\n"));
      lines.push("");
      const bits = ["Status: " + (STATUS[e.status_at || t.status] || {}).label];
      if (t.next_step) bits.push("Next: " + t.next_step);
      if (t.due_date) bits.push("Due: " + weekLabel(t.due_date));
      lines.push("- " + bits.join(" · "));
      lines.push("");
    }
  }
  if (!any) lines.push("_Nothing was finalized for this week yet._", "");

  const finalizedIds = new Set(entries.map((e) => e.id));
  const notTouched = list.filter((t) => !finalizedIds.has(t.id) && !["done", "parked"].includes(t.status));
  if (notTouched.length) {
    lines.push("## Open, not discussed this week", "");
    for (const t of notTouched) {
      const w = ageOf(t);
      lines.push("- " + t.title + " (" + pillarOf(t.pillar_id).name + (t.owner ? ", " + t.owner : "") +
        (w >= STALE_WARN ? " — " + w + " weeks since last discussed" : "") + ")");
    }
    lines.push("");
  }
  const decisions = S.topics.filter((t) => t.status === "needs_decision" && !t.archived);
  if (decisions.length) {
    lines.push("## Waiting on a decision", "");
    for (const t of decisions) lines.push("- " + t.title + " (" + pillarOf(t.pillar_id).name + ")");
    lines.push("");
  }
  return lines.join("\n");
}

const currentWeekRow = () => S.weeks.find((w) => w.week_start === S.week) || null;

function openMinutes() {
  const wk = currentWeekRow();
  const finalized = !!(wk && wk.minutes_md);
  const md = finalized ? wk.minutes_md : buildMinutes();
  const lead = finalized
    ? "Finalized by " + wk.finalized_by + ", " +
      new Date(wk.finalized_at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + "."
    : "Grouped by pillar, with what was left untouched and what is waiting on a decision. " +
      "Not finalized yet — this is a live preview and will change as updates are logged.";
  showModal("Minutes · week of " + weekLabel(S.week), lead,
    [el("pre", { class: "minutes", text: md })],
    [
      el("button", { class: "btn", text: "Download .md", onclick: () => {
        const blob = new Blob([md], { type: "text/markdown" });
        const a = el("a", { href: URL.createObjectURL(blob), download: "delardi-board-" + S.week + ".md" });
        document.body.appendChild(a); a.click(); a.remove();
      } }),
      el("button", { class: "btn primary", text: "Copy", onclick: async () => {
        try { await navigator.clipboard.writeText(md); toast("Copied."); }
        catch (e) {
          const ta = el("textarea", { style: "position:fixed;opacity:0" }); ta.value = md;
          document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
          toast("Copied.");
        }
      } }),
    ]);
}

/* ----------------------------------------------------------------- modals */
function showModal(title, lead, bodyKids, actionKids) {
  const m = $("#modal");
  m.innerHTML = "";
  const card = el("div", { class: "modal-card" }, [el("h2", { text: title })]);
  if (lead) card.appendChild(el("p", { class: "lead", text: lead }));
  for (const k of bodyKids) card.appendChild(k);
  card.appendChild(el("div", { class: "modal-actions" },
    [el("button", { class: "btn subtle", text: "Close", onclick: closeModal })].concat(actionKids || [])));
  m.appendChild(card);
  m.classList.add("open");
  return card;
}
function closeModal() { $("#modal").classList.remove("open"); $("#modal").innerHTML = ""; }

/* The locked state. The card sits over a blurred placeholder board; the real
   rows are requested only after the passcode has been checked server-side. */
function renderGate() {
  const existing = $("#gate");
  if (!S.locked) { if (existing) existing.remove(); return; }
  if (existing) return;

  const name = el("input", { type: "text", placeholder: "e.g. Alex", value: store("board_name") || "" });
  const pass = el("input", { type: "password", placeholder: "Team passcode" });
  const err  = el("p", { class: "err", style: "display:none" });
  const btn  = el("button", { class: "btn primary", text: "Open the board" });

  const go = async () => {
    err.style.display = "none";
    if (!name.value.trim()) {
      err.textContent = "Your name, so updates are attributed."; err.style.display = "block"; return;
    }
    btn.disabled = true; btn.textContent = "Checking…";
    try {
      const r = await call("unlock", { name: name.value.trim(), passcode: pass.value });
      S.session = { token: r.token, name: r.name, expires_at: r.expires_at };
      store("board_session", JSON.stringify(S.session));
      store("board_name", r.name);
      await loadAll();
      S.locked = false;
      renderAll();
      toast("Open until " + new Date(r.expires_at)
        .toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }));
    } catch (e) {
      err.textContent = e.message; err.style.display = "block";
      btn.disabled = false; btn.textContent = "Open the board";
      pass.value = ""; pass.focus();
    }
  };
  btn.addEventListener("click", go);
  for (const f of [name, pass]) f.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });

  const card = el("div", { class: "gate-card" }, [
    el("div", { class: "gate-mast" }, [el("img", { src: LOGO_WORDMARK, alt: "Delardi" })]),
    el("h2", { text: "Weekly Board" }),
    el("p", { class: "lead", text: "This board is private. Enter the team passcode to open it." }),
    err,
    el("label", {}, [el("span", { class: "field-label", text: "Your name" }), name]),
    el("label", {}, [el("span", { class: "field-label", text: "Team passcode" }), pass]),
    btn,
    el("p", { class: "gate-foot",
      text: "Nothing behind this card is real. The board loads no data until the passcode is accepted." }),
  ]);

  document.body.appendChild(el("div", { class: "gate", id: "gate" }, [card]));
  setTimeout(() => (name.value ? pass : name).focus(), 80);
}

function lockNow() { lockDown(); toast("Locked."); }

function openTopicForm(existing) {
  const title = el("input", { type: "text", value: existing ? existing.title : "", placeholder: "What is the topic?" });
  const detail = el("textarea", { rows: "4", placeholder: "Background — why this is on the board" });
  if (existing && existing.detail) detail.value = existing.detail;
  const pillar = el("select", {}, S.pillars.map((p) =>
    el("option", { value: String(p.id), selected: existing && existing.pillar_id === p.id ? "selected" : null, text: p.name })));
  const owner = personField(existing ? existing.owner : "");
  const supporting = personField(existing ? existing.supporting : "");
  const sensitive = sensitiveField(existing ? existing.sensitive : false);
  const next = el("input", { type: "text", value: existing ? existing.next_step || "" : "", placeholder: "The next concrete step" });
  const prio = el("select", {}, Object.keys(PRIORITY).map((k) =>
    el("option", { value: k, selected: (existing ? existing.priority : "medium") === k ? "selected" : null, text: PRIORITY[k] })));
  const err = el("p", { class: "err", style: "display:none" });

  const save = async (ev) => {
    if (!title.value.trim()) { err.textContent = "A title is needed."; err.style.display = "block"; return; }
    ev.target.disabled = true;
    try {
      if (existing) {
        await call("update_topic", { id: existing.id, week_start: S.week, patch: {
          title: title.value, detail: detail.value, pillar_id: Number(pillar.value),
          owner: owner.getValue(), supporting: supporting.getValue(), sensitive: sensitive.getValue(),
          next_step: next.value, priority: prio.value } });
      } else {
        await call("add_topic", { pillar_id: Number(pillar.value), title: title.value, detail: detail.value,
          owner: owner.getValue(), supporting: supporting.getValue(), sensitive: sensitive.getValue(),
          next_step: next.value, priority: prio.value, week_start: S.week });
      }
      closeModal(); await refresh(); if (S.drawerTopic) renderDrawer(); toast("Saved.");
    } catch (e) { err.textContent = e.message; err.style.display = "block"; ev.target.disabled = false; }
  };

  showModal(existing ? "Edit topic" : "New topic", null,
    [err,
     el("label", {}, [el("span", { class: "field-label", text: "Title" }), title]),
     el("label", {}, [el("span", { class: "field-label", text: "Pillar" }), pillar]),
     el("label", {}, [el("span", { class: "field-label", text: "Background" }), detail]),
     el("label", {}, [el("span", { class: "field-label", text: "Owner" }), owner]),
     el("label", {}, [el("span", { class: "field-label", text: "Supporting" }), supporting]),
     el("label", {}, [el("span", { class: "field-label", text: "Next step" }), next]),
     el("label", {}, [el("span", { class: "field-label", text: "Priority" }), prio]),
     el("label", {}, [sensitive])],
    [el("button", { class: "btn primary", text: "Save", onclick: save })]);
  setTimeout(() => title.focus(), 60);
}

function editMetric(m) {
  const v = el("input", { type: "text", value: m.current_val || "" });
  showModal("Update: " + m.metric, m.note || null,
    [el("label", {}, [el("span", { class: "field-label", text: "Current value" }), v])],
    [el("button", { class: "btn primary", text: "Save", onclick: async (ev) => {
      ev.target.disabled = true;
      try { await call("set_scoreboard", { id: m.id, current_val: v.value }); closeModal(); await refresh(); toast("Saved."); }
      catch (e) { toast(e.message); ev.target.disabled = false; }
    } })]);
  setTimeout(() => v.focus(), 60);
}

/* ------------------------------------------------------------------- theme */
function applyTheme() {
  let mode;
  try { mode = localStorage.getItem("board_theme") || "auto"; } catch (e) { mode = "auto"; }
  document.documentElement.setAttribute("data-theme", mode);
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.classList.toggle("sysdark", mode === "auto" && sysDark);
}
function toggleTheme() {
  let mode;
  try { mode = localStorage.getItem("board_theme") || "auto"; } catch (e) { mode = "auto"; }
  const nextMode = mode === "auto" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark")
                                   : mode === "dark" ? "light" : "dark";
  try { localStorage.setItem("board_theme", nextMode); } catch (e) {}
  applyTheme();
}

/* -------------------------------------------------------------------- init */
function renderBody() {
  const host = $("#body-host");
  if (!host) return;
  host.innerHTML = "";
  host.appendChild(
    S.view === "meeting" ? renderMeeting() :
    S.view === "suggestions" ? renderSuggestions() : renderBoard());
  const fab = $("#fab");
  if (fab) fab.className = "fab" + (canEdit() && !S.locked && S.view !== "meeting" ? " on" : "");
}
function renderAll() {
  const app = $("#app");
  app.innerHTML = "";
  app.className = S.locked ? "gated" : "";
  app.setAttribute("aria-hidden", S.locked ? "true" : "false");
  app.appendChild(renderHeader());
  app.appendChild(el("div", { id: "body-host" }));
  renderBody();
  if (S.drawerTopic) renderDrawer();
  renderGate();
}
async function refresh() {
  await loadAll();
  renderAll();
}

function restoreSession() {
  try {
    const raw = store("board_session");
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && s.token && new Date(s.expires_at).getTime() > Date.now()) S.session = s;
  } catch (e) { /* ignore */ }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); closeDrawer(); return; }
  if (S.view !== "meeting") return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (typing && !(e.ctrlKey || e.metaKey)) return;
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
});
$("#scrim").addEventListener("click", closeDrawer);
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
$("#fab").addEventListener("click", () => openTopicForm(null));

(async function boot() {
  applyTheme();
  restoreSession();
  if (S.session) {
    try { await loadAll(); S.locked = false; }
    catch (e) { S.session = null; store("board_session", ""); }
  }
  if (S.locked) Object.assign(S, skeletonState());
  renderAll();
})();
</script>
