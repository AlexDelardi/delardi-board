  host.innerHTML = "";
  host.appendChild(el("div", { class: "add-scrim", onclick: () => closeExport() }));
  const scope = e.title || describeFilters().replace(/^·\s*/, "") || tr("Everything on file");
  host.appendChild(el("section", { class: "addbox expbox", role: "dialog", "aria-modal": "true", "aria-labelledby": "exp-title" }, [
    el("div", { class: "sheet-head" }, [
      el("h3", { id: "exp-title", text: tr("Download .xlsx") }),
      el("button", { class: "btn subtle close", type: "button", "aria-label": tr("Close"), disabled: e.busy ? true : null,
        onclick: () => closeExport(), text: "×" }),
    ]),
    el("form", { class: "editor exp-form", onsubmit: (ev) => { ev.preventDefault(); runExport(); } }, [
      el("p", { class: "exp-scope" }, [el("b", { text: scope })]),
      e.count === null ? null : el("p", { class: "exp-count", text: tr("{n} records will be downloaded", { n: e.count }) }),
      el("label", { class: "opt exp-phones" }, [
        el("input", { type: "checkbox", class: "exp-first", checked: e.phones ? true : null, disabled: e.busy ? true : null,
          onchange: (ev) => { e.phones = ev.target.checked; } }),
        el("span", { text: tr("Include phone numbers") }),
      ]),
      el("p", { class: "hint", text: tr("Leave the numbers out when the file is going to a brand, an agency or a meeting.") }),
      el("p", { class: "hint", text: tr("The file carries your name and today's date, and the download is logged.") }),
      e.err ? el("p", { class: "form-err", role: "alert", text: e.err }) : null,
      el("div", { class: "form-actions" }, [
        el("button", { class: "btn primary", type: "submit", disabled: e.busy ? true : null,
          text: e.busy ? tr("Preparing the file…") : tr("Download") }),
        el("button", { class: "btn subtle", type: "button", disabled: e.busy ? true : null,
          onclick: () => closeExport(), text: tr("Cancel") }),
      ]),
    ]),
  ]));
}
// Escape closes it, like every other overlay, unless a file is being made.
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && S.exp && !S.exp.busy) { ev.stopPropagation(); closeExport(); }
}, true);

function exportButton(compact) {
  if (!canExport()) return null;
  return el("button", {
    class: "btn export-btn" + (compact ? " sm" : ""), type: "button", "data-act": "export",
    title: tr("Download the list"), onclick: () => openExport(),
    text: compact ? "⤓" : tr("Download .xlsx"),
  });
}

/* -------------------------------------------------------------------- init */
function renderAll(gateMessage) {
  if (S.add) renderAddClient();                    // the add form follows the language
  if (S.exp) renderExport();                       // and so does the download dialog
  const app = $("#app");
  document.documentElement.lang = LANG;
  document.title = "Delardi CRM";
  app.innerHTML = "";
  app.className = S.locked ? "gated" : "";
  app.setAttribute("aria-hidden", S.locked ? "true" : "false");
  const phone = isPhone();
  // On a phone the views live in the ☰ menu; elsewhere they are tabs.
  const header = (extra) => el("header", { class: "top" }, [renderHeader(), phone ? null : renderViews(), ...(extra || [])]);
  if (S.view === "insights" && !S.locked) {
    app.append(header(), el("main", {}, [el("div", { class: "ins", id: "ins-host" })]));
    renderInsights();
    if (!S.ins && !S.insLoading) loadInsights();
  } else if (S.view === "cockpit" && !S.locked) {
    app.append(header(), el("main", {}, [el("div", { class: "ins ck", id: "cockpit-host" })]));
    renderCockpit();
    if (!S.ck) loadCockpit();
  } else if (phone) {
    app.append(
      header(),
      el("main", {}, [
        renderToolbar(),
        el("div", { class: "quick", id: "quick-host" }),
        el("div", { class: "counts", id: "counts-host" }),
        el("div", { class: "list-wrap", id: "list-host" }),
      ]),
    );
    renderQuick();
    renderCounts();
    renderListHost();
  } else if (isTouch()) {
    // iPad: the counts scroll with the page, so the pinned header stays small.
    app.append(
      header(),
      el("main", {}, [el("div", { class: "scoreboard in-main", id: "scoreboard" }), el("div", { class: "progress", id: "progress" }), renderToolbar(),
        el("div", { class: "quick", id: "quick-host" }), el("div", { class: "list-wrap", id: "list-host" })]),
    );
    renderScoreboard();
    renderProgress();
    renderQuick();
    renderPills();
    renderListHost();
    syncSticky();
  } else {
    app.append(
      header([el("div", { class: "scoreboard", id: "scoreboard" })]),
      el("main", {}, [el("div", { class: "progress", id: "progress" }), renderToolbar(),
        el("div", { class: "quick", id: "quick-host" }), el("div", { class: "list-wrap", id: "list-host" })]),
    );
    renderScoreboard();
    renderProgress();
    renderQuick();
    renderPills();
    renderListHost();
    syncSticky();
  }
  if (S.navOpen) renderNav();
  syncSplit();
  renderGate(gateMessage);
}
function restoreSession() {
  kitHubAdopt("crm", SESSION_KEY, { local: true, idleKey: IDLE_KEY, active: activeNow });   // the home page's sign-in, taken as this tool's own (ui/hub.js)
  try {
    const raw = store(SESSION_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && s.token && new Date(s.expires_at).getTime() > Date.now()) S.session = s;
  } catch (e) { /* ignore */ }
}
$("#scrim").addEventListener("click", () => { if (!S.busy) closeCard(); });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

(async function boot() {
  applyTheme();
  document.documentElement.lang = LANG;
  S.view = viewFromUrl();
  restoreSession();
  // A phone or iPad left unused past the idle lock asks for the passcode again,
  // even if the page was closed in between.
  let gateMsg;
  if (S.session && idleExpiredOnOpen()) { S.session = null; store(SESSION_KEY, ""); pref(IDLE_KEY, null); gateMsg = tr("Locked after {n} minutes without use.", { n: IDLE_MIN }); }
  if (S.session) {
    S.booting = true;
    try { await loadAll(); S.locked = false; }
    catch (e) {
      // Refused: sign in again. No connection: keep the session and try again when it is back.
      if (e.status || !S.offline) { S.session = null; store(SESSION_KEY, ""); }
    }
    S.booting = false;
  }
  if (S.locked) S.rows = skeleton();
  renderAll(gateMsg);
  renderNet();
  if (!S.locked) activeNow();
  openFromHash();
})();

</script>
</body>
