/* -------------------------------------------------------- card: duplicates */
function mergeForm(c, other) {
  const e = S.edit;
  if (!e.keep) e.keep = Number(other.lifetime_spend_uzs || 0) > Number(c.lifetime_spend_uzs || 0) ? "other" : "this";
  const keepId = e.keep === "this" ? c.client_id : other.client_id;
  const dropId = e.keep === "this" ? other.client_id : c.client_id;
  const reason = el("input", { type: "text", id: "merge-reason", maxlength: "300", value: e.reason || "",
    oninput: (ev) => { e.reason = ev.target.value; } });
  const pick = (v) => { e.keep = v; e.confirming = false; renderDrawer(); };
  // A merge cannot be undone from the page, so it asks twice: the second time
  // in plain words, naming what closes and where the purchases go.
  const confirmBox = e.confirming ? el("div", { class: "confirm-box", role: "alert" }, [
    el("p", { text: tr("{drop} will be closed and its purchases moved to {keep}. This cannot be undone here.", { keep: keepId, drop: dropId }) }),
    el("div", { class: "form-actions" }, [
      el("button", { class: "btn danger", type: "submit", id: "merge-yes", disabled: S.busy ? true : null, text: S.busy ? tr("Saving…") : tr("Yes, merge") }),
      el("button", { class: "btn subtle", type: "button", disabled: S.busy ? true : null, onclick: () => { e.confirming = false; renderDrawer(); }, text: tr("Back") }),
    ]),
  ]) : null;
  return el("form", { class: "editor merge", onsubmit: (ev) => { ev.preventDefault();
    if (!e.confirming) { e.confirming = true; renderDrawer(); const y = $("#merge-yes"); if (y) y.focus(); return; }
    act("merge", { keep: keepId, drop: dropId, reason: e.reason }, tr("Merged. {id} now holds both records.", { id: keepId })); } }, [
    sheetMode() ? null : el("h4", { text: tr("Merge two records") }),
    el("fieldset", {}, [el("legend", { text: tr("Which record should stay?") }),
      radio("merge-keep", "this", e.keep === "this", tr("This one ({id})", { id: c.client_id }), pick,
        el("span", { class: "muted", text: " · " + fmtUZS(c.lifetime_spend_uzs) })),
      radio("merge-keep", "other", e.keep === "other", tr("The other one ({id})", { id: other.client_id }), pick,
        el("span", { class: "muted", text: " · " + (other.display_name || "") + " · " + fmtUZS(other.lifetime_spend_uzs) })),
    ]),
    el("label", { for: "merge-reason", class: "lbl", text: tr("Note (optional)") }), reason,
    el("p", { class: "hint", text: tr("The kept record takes the other's purchases and fills its blanks from it. The other record is closed and points to the kept one. This cannot be undone here — ask Alex if a merge was wrong.") }),
    formError(),
    confirmBox || formButtons(tr("Merge…"), null, true),
  ]);
}

function lookupForm(c, e) {
  const input = el("input", { type: "text", id: "lookup-ref", placeholder: "DLD-0000", value: e.ref || "", maxlength: "8",

  if (c.added_by_hand) {

      el("dl", { class: "kv" }, [

      ]),
      el("p", { class: "note", text: tr("Not in the questionnaire. This record was added by the team at the counter.") }),
    ]);
  }
  if (!c.in_marketing) {
    return el("section", { class: "drawer-section" }, [
      el("h3", { text: tr("Questionnaire") }),
      el("p", { class: "muted", text: tr(c.in_colibri ? "Not in the questionnaire. Everything above comes from Colibri alone." : "Not in the questionnaire.") }),
    ]);
  }
  const mappedKV = (label, col) => {
    const raw = c[col];
    if (blank(raw)) return kv(label, "");

  };
  const channel = mappedValue("contact_channel", c.channel_raw);
  const consent = channel && !blank(channel.extra) ? tr(channel.extra) : (blank(c.channel_raw) ? "" : tr("Not stated"));
  return el("section", { class: "drawer-section" }, [

    el("dl", { class: "kv" }, [

      mappedKV(tr("Preferred channel"), "channel_raw"),
      kv(tr("Marketing consent"), consent),
      mappedKV(tr("Buying for"), "purchase_for_raw"),
      mappedKV(tr("How they heard of us"), "awareness_source_raw"),
      mappedKV(tr("Would buy online"), "online_interest_raw"),
      mappedKV(tr("Brand preference"), "brand_preference_raw"),
      kv(tr("Duplicate form"), c.form_duplicate ? tr("Yes — submitted more than once") : tr("No")),

/* ------------------------------------------------------------- card: notes */
function eventText(e) {
  const tg = tgEventText(e) || personalEventText(e);
  if (tg) return tg;
  const f = e.field && FIELD_LABEL[e.field] ? tr(FIELD_LABEL[e.field]) : e.field;
  switch (e.action) {
    case "field_resolved": {
      const [basis, source] = String(e.note || "").split(":");
      const how = [basis === "client" ? tr("the client confirmed it") : basis === "delardi" ? tr("from our own records") : "",
        source === "colibri" ? tr("from Colibri") : source === "marketing" ? tr("from the questionnaire") : source === "telegram" ? tr("from Telegram")
          : source === "value" ? tr("typed in") : ""]
        .filter(Boolean).join(", ");
      const val = e.field === "gender" ? fmtGender(e.new_value) : e.field === "dob" ? fmtDate(e.new_value)
        : e.field === "phone" ? (phoneParts(e.new_value) ? fmtPhone(e.new_value) : "") : e.new_value;
      return [el("b", { text: tr("{field} confirmed", { field: f }) + (val ? ": " : ". ") }), val ? "“" + val + "”. " : "", how ? sentence(how) + "." : ""];
    }
    case "field_reset": return [el("b", { text: tr("{field} handed back to the automatic comparison", { field: f }) + "." })];
    case "single_source_accepted":
      return [el("b", { text: tr("Accepted as held by one source") + ": " }),
        String(e.new_value || "").split(",").filter(Boolean).map((x) => tr(FIELD_LABEL[x] || x)).join(", ") + "."];
    case "state_changed": {
      const m = { confirmed: "Marked as checked.", parked: "Set aside.", deleted: "Deleted.",
        open: e.old_value === "deleted" ? "Restored." : "Reopened." };
      return [el("b", { text: tr(m[e.new_value] || e.new_value) + (e.note ? " " : "") }), e.note || ""];
    }
    case "owner_assigned":
      return [el("b", { text: tr("Owner assigned") + ". " }),
        (e.old_value || e.new_value) ? el("span", { class: "move", text: (who(e.old_value) || "—") + " → " + (who(e.new_value) || "—") + ". " }) : null,
        e.note || ""];
    case "do_not_contact_set":
      return [el("b", { text: tr(e.new_value === "true" ? "Do not contact: on" : "Do not contact: off") + (e.note ? ". " : ".") }), e.note || ""];
    case "contact_note_set": return [el("b", { text: tr("Contact note changed") + (e.new_value ? ": " : ".") }), e.new_value || ""];
    case "referred_by_set": return [el("b", { text: tr("Referred by changed") + (e.new_value ? ": " : ".") }), e.new_value || ""];
    case "note": return [el("b", { text: tr("Note") + ". " }), e.note || ""];
    case "created_by_hand":
      return [el("b", { text: tr("Added to the file by hand") + ". " }),
        e.note ? tr("How we met") + ": " + tr(e.note) + "." : ""];
    case "duplicate_cleared": return [el("b", { text: tr("Not the same person as {id}", { id: e.new_value }) + "." })];
    case "merged_into": return [el("b", { text: tr("Merged into {id}", { id: e.new_value }) + ". " }), e.note && !/^Same person as/.test(e.note) ? e.note : ""];
    case "merged_from": return [el("b", { text: tr("Merged {id} into this record", { id: e.new_value }) + ". " }), e.note || ""];
    case "duplicate_suspect": return [el("b", { text: tr("Possible duplicate") + ". " }), e.note || ""];
    case "name_carries_note": return [el("b", { text: tr("Name field carries a note") + ". " }), e.note || ""];
    case "related_party_set": return [el("b", { text: tr("Marked as related party") + ". " }), e.note || ""];
    case "class_changed": {
      const k = e.field === "abc_class" ? "ABC class {a} → {b}" : e.field === "lifecycle_status" ? "Lifecycle {a} → {b}" : "Segment {a} → {b}";
      return [el("b", { text: tr(k, { a: trv(e.old_value), b: trv(e.new_value) }) + ". " }),
        /^Retail re-cut/.test(e.note || "") ? tr("Retail re-cut: ABC is now calculated without the related parties.") : ""];
    }
    // Phase 4: the monthly Colibri refresh.
    case "created_by_import": return [el("b", { text: tr("Created by the Colibri refresh") + ". " }), refreshPeriod(e.note)];
    case "purchases_imported":
      return [el("b", { text: tr("Purchase lines added by the Colibri refresh: {n}", { n: e.new_value || "—" }) + ". " }), refreshPeriod(e.note)];
    case "became_client": return [el("b", { text: tr("First purchase in Colibri: now a client") + ". " }), refreshPeriod(e.note)];
    case "colibri_changed": {
      if (e.field === "phone") return [el("b", { text: tr("Phone number changed in Colibri") + ". " }),
        phoneParts(e.old_value) || phoneParts(e.new_value) ? el("span", { class: "move", text: (fmtPhone(e.old_value) || "—") + " → " + (fmtPhone(e.new_value) || "—") + ". " }) : null,
        refreshPeriod(e.note)];
      const v = (x) => e.field === "gender" ? fmtGender(x) : e.field === "dob" ? fmtDate(x) : (blank(x) ? "—" : x);
      return [el("b", { text: tr("{field} changed in Colibri", { field: e.field === "patronymic" ? tr("Patronymic") : f }) + ": " }),
        el("span", { class: "move", text: v(e.old_value) + " → " + v(e.new_value) + ". " }), refreshPeriod(e.note)];
    }
    case "import_undone": return [el("b", { text: tr("A Colibri refresh was undone; this record is back as it was") + "." })];
    default: return [el("b", { text: e.action + ". " }), e.note || ""];
  }
}
// "Colibri refresh, 01.01.2026–02.09.2026." → the period, in the page's language.
function refreshPeriod(note) {
  const m = /(\d\d)\.(\d\d)\.(\d{4})–(\d\d)\.(\d\d)\.(\d{4})/.exec(String(note || ""));
  if (!m) return "";
  return tr("Exports for {a} – {b}.", { a: fmtDate(m[3] + "-" + m[2] + "-" + m[1]), b: fmtDate(m[6] + "-" + m[5] + "-" + m[4]) });
}

}

function renderDrawer() {

/* Delardi tools — the single sign-in, shared by the home page and every tool (ui/hub.js).
   One passcode on the home page gives one session (hub-api) that every tool's API accepts. It is kept in localStorage,
   so every tab on the device shares it; Lock, 8 hours, or 15 idle minutes on a touch device end it everywhere.
   A tool calls two things:
     kitHubAdopt(tool, key, opts)  at start: take the shared session as the tool's own, or go to the home page to sign in;
     kitHubGate(tool)              where it would draw its own passcode card: go to the home page instead.
   window.__HUB_OFF = true (tests only) switches both off, and the tool falls back to its own passcode card. */
const KIT_HUB_API = 'https://hugduzqwyqwryicfzipu.supabase.co/functions/v1/hub-api';
const KIT_HUB_KEY = 'delardi_session';        // localStorage: { token, name, expires_at, tools }
const KIT_HUB_ACTIVE = 'delardi_last_active'; // localStorage: last touch on any page, for the idle lock
const KIT_HUB_IDLE_MIN = 15;                  // touch devices only, as in every tool
let kitHubLeaving = false;

function kitHubOn() { return window.__HUB_OFF !== true; }
function kitHubTouch() { return window.matchMedia('(pointer: coarse)').matches; }
function kitHubGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function kitHubSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
function kitHubClear() { kitHubSet(KIT_HUB_KEY, null); kitHubSet(KIT_HUB_ACTIVE, null); }
function kitHubWrite(s) {
  kitHubSet(KIT_HUB_KEY, JSON.stringify({ token: s.token, name: s.name, expires_at: s.expires_at, tools: s.tools || {} }));
}
function kitHubIdle() {
  const last = Number(kitHubGet(KIT_HUB_ACTIVE) || 0);
  return kitHubTouch() && last > 0 && Date.now() - last >= KIT_HUB_IDLE_MIN * 60000;
}
// The shared session, or null: none, past its 8 hours, or left idle on a touch device (then it is dropped here).
function kitHubRead() {
  let s = null;
  try { s = JSON.parse(kitHubGet(KIT_HUB_KEY) || 'null'); } catch (e) { s = null; }
  if (!s || !s.token || !(new Date(s.expires_at).getTime() > Date.now())) return null;
  if (kitHubIdle()) { kitHubCall('lock', { token: s.token }); kitHubClear(); return null; }
  return s;
}
// May the signed-in person open this tool? Unknown (no shared session) counts as yes: the tool's API decides anyway.
function kitHubAllowed(tool) {
  if (!kitHubOn()) return true;
  let s = null;
  try { s = JSON.parse(kitHubGet(KIT_HUB_KEY) || 'null'); } catch (e) { s = null; }
  return !s || !s.tools || s.tools[tool] !== false;
}
// → { status, data }; status 0 when there was no answer. Never throws.
async function kitHubCall(action, body) {
  try {
    const res = await fetch(KIT_HUB_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
      body: JSON.stringify(Object.assign({ action: action }, body || {})) });
    let data = {};
    try { data = await res.json(); } catch (e) { /* empty body */ }
    return { status: res.status, data: data };
  } catch (e) { return { status: 0, data: {} }; }
}
let kitHubTick = 0;
function kitHubActive() {
  const now = Date.now();
  if (now - kitHubTick < 10000) return;
  kitHubTick = now;
  if (kitHubGet(KIT_HUB_KEY)) kitHubSet(KIT_HUB_ACTIVE, String(now));
}
// A tool sits one folder under the home page.
function kitHubHome(query) {
  if (kitHubLeaving) return;
  kitHubLeaving = true;
  location.replace('../' + (query ? '?' + query : ''));
}
// Nothing of the tool stays readable or usable while the page is on its way to the home page.
function kitHubCover() {
  if (document.getElementById('hub-cover')) return;
  const c = document.createElement('div');
  c.id = 'hub-cover';
  c.setAttribute('style', 'position:fixed;inset:0;z-index:2147483000;background:var(--bg,#EEF1F7);');
  (document.body || document.documentElement).appendChild(c);
  const app = document.getElementById('app');
  if (app) app.inert = true;
}
// Take the shared session as this tool's own. → true when the tool may start with it. With none, the page goes to
// the home page to sign in and comes back. opts.local: the tool keeps its session in localStorage, not sessionStorage.
// opts.crmKey: the tool also keeps a CRM session under this sessionStorage key (the till's client panel).
// opts.idleKey: where the tool keeps its own last-touch time for its idle lock (opts.local says which storage). The
//   shared session was just read as not idle, so arriving here is a touch: an old time left in the tab must not lock a
//   session signed in a moment ago.
// opts.active(): the tool's own "touched now". Called when another tab is being used, so a tool left open beside it
//   does not lock everyone out for being idle itself.
// opts.leaving(): called before this tab is sent to the home page because another tab locked or signed in afresh.
function kitHubAdopt(tool, key, opts) {
  if (!kitHubOn()) return false;
  const h = kitHubRead();
  if (!h) { kitHubCover(); kitHubHome('next=' + tool); return false; }
  const tools = h.tools || {};
  try {
    const st = opts && opts.local ? localStorage : sessionStorage;
    let cur = null;
    try { cur = JSON.parse(st.getItem(key) || 'null'); } catch (e) { cur = null; }
    if (!cur || cur.token !== h.token) {
      st.setItem(key, JSON.stringify({ token: h.token, name: h.name, expires_at: h.expires_at, can_edit: !!tools.crm_edit, can_manage: !!tools.catalogue_manage }));
    }
    if (opts && opts.idleKey) st.setItem(opts.idleKey, String(Date.now()));
    if (opts && opts.crmKey) {
      if (tools.crm) sessionStorage.setItem(opts.crmKey, JSON.stringify({ token: h.token, can_edit: !!tools.crm_edit, name: h.name, expires_at: h.expires_at }));
      else sessionStorage.removeItem(opts.crmKey);
    }
  } catch (e) { /* storage refused: the tool will ask the home page again */ }
  kitHubActive();
  kitHubCall('open', { token: h.token, tool: tool });            // the login log's line
  // Locked or signed in as someone else in another tab: this tab follows.
  window.addEventListener('storage', function (e) {
    if (e.key === KIT_HUB_ACTIVE) { if (e.newValue && opts && opts.active) { try { opts.active(); } catch (err) { /* the tool's own business */ } } return; }
    if (e.key !== KIT_HUB_KEY) return;
    const now = kitHubRead();
    if (!now || now.token !== h.token) {
      if (opts && opts.leaving) { try { opts.leaving(); } catch (err) { /* leave anyway */ } }
      kitHubCover(); kitHubHome(now ? '' : 'next=' + tool);
    }
  });
  return true;
}
// The tool has locked itself and would draw its passcode card. → true: the home page takes over (the tool draws
// nothing). The home page's API says which case it is: the person has no access to this tool (they stay signed in and
// are told so), or the session is over or was locked (signed out everywhere, sign in again and come back).
function kitHubGate(tool) {
  if (!kitHubOn()) return false;
  kitHubCover();
  if (kitHubLeaving) return true;
  const h = kitHubRead();
  if (!h) { kitHubClear(); kitHubHome('next=' + tool); return true; }
  kitHubCall('me', { token: h.token }).then(function (r) {
    if (r.status === 0) { kitHubHome(''); return; }              // no connection: the home page says so
    if (r.status === 200 && r.data.tools && !r.data.tools[tool]) {
      kitHubWrite({ token: h.token, name: r.data.name, expires_at: r.data.expires_at, tools: r.data.tools });
      kitHubHome('denied=' + tool);
      return;
    }
    const done = function () { kitHubClear(); kitHubHome('next=' + tool); };
    if (r.status === 200) kitHubCall('lock', { token: h.token }).then(done); else done();
  });
  return true;
}
if (kitHubOn()) {
  document.addEventListener('pointerdown', kitHubActive, true);
  document.addEventListener('keydown', kitHubActive, true);
}

// Delardi UI kit: tool switcher. No dependencies. Inlined ahead of each tool's own modules.
const KIT_TOOLS = [
  { id: 'sales', href: '../sales/', en: 'Sales', ru: 'Продажи' },
  { id: 'stock', href: '../stock/', en: 'Stock', ru: 'Склад' },
  { id: 'crm', href: '../crm/', en: 'Clients', ru: 'Клиенты' },
  { id: 'catalogue', href: '../catalogue/', en: 'Catalogue', ru: 'Каталог' },
  { id: 'tasks', href: '../tasks/', en: 'Tasks', ru: 'Задачи' },
  { id: 'perf', href: '../perf/', en: 'Performance', ru: 'Показатели' },
];

// Close functions of the menus that are open right now.
const kitOpenMenus = [];

// A tool calls this on lock: closes every open kit menu and detaches its listeners.
function kitCloseMenus() {
  for (const close of kitOpenMenus.slice()) close();
}

// A link that leaves the page can ask first. beforeLeave(href) returns a Promise:
// true follows the link, false stays. A modified click (new tab) is left alone.
function kitGuardLink(a, beforeLeave) {
  if (typeof beforeLeave !== 'function') return a;
  a.addEventListener('click', e => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    const href = a.href;
    Promise.resolve(beforeLeave(href)).then(go => { if (go) window.location.assign(href); });
  });
  return a;
}

// opts.beforeLeave: see kitGuardLink; asked before any tool link is followed.
function kitToolsMenu(currentId, lang, opts) {
  const beforeLeave = opts && opts.beforeLeave;
  const ru = lang === 'ru';
  const wrap = document.createElement('span');
  wrap.className = 'kit-tool-wrap';
  wrap.setAttribute('data-kit-menu', '');
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'kit-hbtn';
  btn.textContent = ru ? 'Инструменты' : 'Tools';
  btn.setAttribute('aria-expanded', 'false');
  const list = document.createElement('ul');
  list.className = 'kit-menu';
  list.hidden = true;
  for (const t of KIT_TOOLS) {
    const li = document.createElement('li');
    let item;
    if (t.id === currentId) {
      item = document.createElement('span');
      item.setAttribute('aria-current', 'page');
    } else if (typeof kitHubAllowed === 'function' && !kitHubAllowed(t.id)) {
      // signed in on the home page without access to this tool (ui/hub.js): listed, greyed, not a link
      item = document.createElement('span');
      item.setAttribute('aria-disabled', 'true');
      item.title = ru ? 'Нет доступа' : 'No access';
    } else {
      item = document.createElement('a');
      item.setAttribute('href', t.href);
      kitGuardLink(item, beforeLeave);
    }
    item.textContent = ru ? t.ru : t.en;
    li.appendChild(item);
    list.appendChild(li);
  }
  function close(refocus) {
    list.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('click', onDoc);
    const i = kitOpenMenus.indexOf(close);
    if (i >= 0) kitOpenMenus.splice(i, 1);
    if (refocus === true && btn.isConnected) btn.focus();
  }
  function open() {
    list.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    document.addEventListener('keydown', onKey);
    document.addEventListener('click', onDoc);
    kitOpenMenus.push(close);
  }
  function onKey(e) { if (e.key === 'Escape') close(true); }
  function onDoc(e) { if (!wrap.contains(e.target)) close(); }
  btn.addEventListener('click', e => { e.stopPropagation(); if (list.hidden) open(); else close(); });
  list.addEventListener('click', e => { if (e.target.closest && e.target.closest('a')) close(); });
  wrap.addEventListener('focusout', e => {
    if (!list.hidden && e.relatedTarget && !wrap.contains(e.relatedTarget)) close();
  });
  wrap.appendChild(btn);
  wrap.appendChild(list);
  return wrap;
}

// The phone menu: a panel that slides in from the right over a dimmed page, so the header and the tabs under it do not
// move. items: the tool's own controls, in order (the person, kitToolsMenu(...), the language switch, Lock ...).
// onClose: called for the close button and for a tap beside the panel; the tool closes the menu and redraws its header.
function kitPhoneMenu(items, lang, onClose) {

  const panel = document.createElement('div');
  panel.className = 'head-panel';
  const close = document.createElement('button');
  close.type = 'button';
  close.className = 'kit-hbtn head-close';
  close.id = 'head-close';
  close.setAttribute('aria-label', ru ? 'Закрыть меню' : 'Close the menu');
  close.textContent = '\u00D7';
  close.addEventListener('click', e => { e.stopPropagation(); onClose(); });
  panel.appendChild(close);
  const add = kid => {
    if (kid === null || kid === undefined || kid === false) return;

  };

/* Delardi tools — the Christmas season, shared by every tool (see brand/christmas/README.md).
   From 20 November to 14 January, by itself:
     · a band of snowflakes across the top of every page of every tool;
     · the tree beside the passcode card on a lock screen, and on the tools hub;
     · where a tool asks for one, a mark beside a screen's title (seasonMarkEl): a fir sprig on a dashboard, a
       snowflake pair on a working screen, nothing on a form.
   All of it is decoration only: drawn in CSS or with empty alt text, hidden from screen readers, never clickable,
   never printed. The address can force it for a preview (?season=christmas) or switch it off (?season=off).

function seasonFor(d) {
  const m = d.getMonth(), day = d.getDate();
  return (m === 10 && day >= 20) || m === 11 || (m === 0 && day <= 14) ? "christmas" : null;
}
const SEASON = (() => {
  const q = new URLSearchParams(location.search).get("season");
  return q === "off" ? null : q === "christmas" ? "christmas" : seasonFor(new Date());
})();
// The page-wide part, written once into the page as a style sheet so it holds however a tool redraws itself.
(function seasonDress() {
  if (SEASON !== "christmas" || document.querySelector("style[data-season]")) return;
  document.documentElement.classList.add("season-christmas");
  const st = document.createElement("style");
  st.setAttribute("data-season", "christmas");
  st.textContent = [
    // the band: its own strip above the header, so it never sits on a control or a figure
    "html.season-christmas body::before { content: \"\"; display: block; height: 36px; flex: 0 0 36px; background: #EEF1F7 url(" + SEASON_ART.band[0] + ") left center / 208px 36px repeat-x; border-bottom: 1px solid #D3DCE9; pointer-events: none; }",

    "html.season-christmas #gate::after { content: \"\"; position: absolute; right: max(32px, 9vw); bottom: max(32px, 10vh); width: 120px; height: 160px; background: url(" + SEASON_ART.tree[0] + ") center / contain no-repeat; pointer-events: none; }",
    "@media (max-width: 899px), (max-height: 619px) { html.season-christmas #gate::after { display: none; } }",

    "html.season-christmas body.hub main::after { content: \"\"; position: absolute; top: 0; right: 0; width: 120px; height: 160px; background: url(" + SEASON_ART.tree[0] + ") center / contain no-repeat; pointer-events: none; }",

function seasonMarkEl(kind) {

const VIEWS = ["clients", "cockpit", "insights"];
function viewFromUrl() {
  try { const v = new URLSearchParams(location.search).get("view"); return VIEWS.includes(v) ? v : "clients"; }
  catch (e) { return "clients"; }
}
function syncViewUrl() {
  const q = S.view === "clients" ? "" : "?view=" + S.view;
  const url = location.pathname + q + location.hash;
  if (url !== location.pathname + location.search + location.hash) history.replaceState(history.state, "", url);
}
function setView(v) {
  if (S.view === v) return;
  S.view = v;
  syncViewUrl();
  hideTip();
  renderAll();
  window.scrollTo(0, 0);
  const tab = document.querySelector('.view-tab[data-view="' + v + '"]');
  if (tab) tab.focus();
}
function renderViews() {
  const tab = (v, label) => el("button", { class: "view-tab", type: "button", "data-view": v,
    "aria-current": S.view === v ? "page" : null, onclick: () => setView(v), text: label });
  return el("nav", { class: "views", "aria-label": tr("Views") },
    [tab("clients", tr("All clients")), tab("cockpit", tr(S.ref && S.ref.my_rep ? "My clients" : "Cockpit")), tab("insights", tr("Insights")),

// Open the client list filtered to the people behind a figure. Filters the
// toolbar knows go into the toolbar; the rest ride along as a labelled chip.
function drill(patch, label, type) {
  const f = blankFilters();
  f.type = type !== undefined ? type : S.insBasis === "all" ? "client" : "retail";
  const params = {};
  for (const [k, v] of Object.entries(patch)) {
    if (k in f && k !== "drill") f[k] = v; else params[k] = v;
  }
  f.drill = Object.keys(params).length || label ? { label: label || "", params } : null;
  S.f = f;
  S.view = "clients";
  syncViewUrl();
  hideTip();
  renderAll();
  window.scrollTo(0, 0);
  loadList();
  const host = $("#list-host");
  if (host) { host.setAttribute("tabindex", "-1"); host.focus({ preventScroll: true }); }
}
const ownerPatch = (o) => o.kind === "shared" ? { owner: "__unassigned" }
  : o.kind === "left" ? { owner: "__orphaned" } : { owner: o.owner };

/* ------------------------------------------------------------------ loading */
let insSeq = 0;
async function loadInsights() {
  const seq = ++insSeq;
  S.insLoading = true;
  renderInsights();
  try {
    const d = await call("insights", S.insBasis === "all" ? { include_related: true } : {});
    if (seq !== insSeq) return;
    S.ins = d; S.insError = null;
  } catch (e) {
    if (seq !== insSeq) return;
    S.insError = e.message;
  }
  S.insLoading = false;
  renderInsights();
}

/* ----------------------------------------------------------------- tooltip */
// One tooltip for every mark. Values lead, labels follow; the same readout
// appears on keyboard focus. Text only — never markup from the data.
function tipEl() {
  let t = $("#viztip");
  if (!t) { t = el("div", { id: "viztip", class: "viztip", role: "tooltip", "aria-hidden": "true" }); document.body.appendChild(t); }
  return t;
}
function showTip(target, x, y) {
  const t = tipEl();
  t.innerHTML = "";
  const lines = String(target.dataset.tipV || "").split("\n");
  t.append(el("b", { text: lines[0] }));
  for (const extra of lines.slice(1)) t.append(el("span", { class: "extra", text: extra }));
  if (target.dataset.tipL) t.append(el("span", { text: target.dataset.tipL }));
  t.classList.add("show");
  const r = t.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 12;
  if (left + r.width > window.innerWidth - 8) left = Math.max(8, x - r.width - 14);
  if (top < 8) top = y + 18;
  t.style.left = left + "px"; t.style.top = top + "px";
}
function hideTip() { const t = $("#viztip"); if (t) t.classList.remove("show"); }
document.addEventListener("pointermove", (e) => {
  const m = e.target.closest && e.target.closest("[data-tip-v]");
  if (m) showTip(m, e.clientX, e.clientY); else hideTip();
});
document.addEventListener("focusin", (e) => {
  const m = e.target.closest && e.target.closest("[data-tip-v]");
  if (m) { const r = m.getBoundingClientRect(); showTip(m, r.left + r.width / 2, r.top); } else hideTip();
});
document.addEventListener("focusout", hideTip);
// On a touch screen there is no hover: a tap on a mark that is not itself a
// link or button shows its readout.
document.addEventListener("click", (e) => {
  const m = e.target.closest && e.target.closest("[data-tip-v]");
  if (!m || m.matches("button, a")) return;
  const r = m.getBoundingClientRect();
  showTip(m, r.left + r.width / 2, r.top);
});
window.addEventListener("scroll", hideTip, { passive: true });

/* ------------------------------------------------------------------ charts */
// Vertical columns, one series. Value on the cap; the column is the hit target.
function columnChart(items, opts = {}) {
  const max = Math.max(1, ...items.map((i) => i.value));
  return el("div", { class: "cols", style: "--n:" + items.length }, [
    el("div", { class: "plot" }, items.map((it) => {
      const h = Math.max(it.value ? 2 : 0, (it.value / max) * 100);
      const props = { class: "col" + (it.em ? " em" : ""), style: "--h:" + h + "%", ...tipAttrs(it.tip, it.tipLabel),
        "aria-label": it.aria };
      const kids = [el("span", { class: "cap", text: it.cap }), el("span", { class: "bar" })];
      return it.onclick ? el("button", { type: "button", ...props, onclick: it.onclick }, kids)
        : el("span", { tabindex: "0", role: "img", ...props }, kids);
    })),
    el("div", { class: "xaxis" }, items.map((it) => el("span", { class: it.em ? "em" : null, text: it.label }))),
  ]);
}
// Stacked columns, two series. Total on the cap, a 2px surface gap between parts.
function stackedColumns(items, series) {
  const max = Math.max(1, ...items.map((i) => i.parts.reduce((a, b) => a + b, 0)));
  return el("div", { class: "cols stacked", style: "--n:" + items.length }, [
    el("div", { class: "plot" }, items.map((it) => {
      const total = it.parts.reduce((a, b) => a + b, 0);
      return el("span", { class: "col", style: "--h:" + (total / max) * 100 + "%", tabindex: "0", role: "img",
        "aria-label": it.aria, ...tipAttrs(it.tip, it.tipLabel) }, [
        el("span", { class: "cap", text: it.cap }),
        el("span", { class: "stack" }, it.parts.map((p, i) => p > 0
          ? el("span", { class: "part s" + (i + 1), style: "flex-grow:" + p }) : null).reverse()),
      ]);
    })),
    el("div", { class: "xaxis" }, items.map((it) => el("span", { text: it.label }))),
    el("div", { class: "legend" }, series.map((s, i) => el("span", {}, [el("i", { class: "sw s" + (i + 1), "aria-hidden": "true" }), s]))),
  ]);
}
// Horizontal bars, one series. Value at the tip, outside the bar.
function barList(items) {
  const max = Math.max(1, ...items.map((i) => i.value));
  return el("div", { class: "hbars" }, items.map((it) => {
    const props = { class: "hbar" + (it.muted ? " muted-bar" : ""), ...tipAttrs(it.tip, it.tipLabel), "aria-label": it.aria };
    const kids = [
      el("span", { class: "hl", text: it.label }),
      el("span", { class: "track" }, [el("span", { class: "fill", style: "width:" + Math.max(0.6, (it.value / max) * 100) + "%" })]),
      el("span", { class: "hv", text: it.valueText }),

  const lastFull = years.filter((y) => y.year < thisYear).slice(-1)[0];

  if (!d) { host.append(el("p", { class: "empty-line", text: tr("Loading the cockpit…") })); return; }
  const head = el("div", { class: "ck-head" }, [
    el("h2", { class: "ins-h2", id: "ck-title", text: d.rep ? tr(own ? "{rep} · my clients" : "{rep} · clients", { rep: who(d.rep) }) : tr("Cockpit") }),
    pick ? ckPicker(d) : null]);
  if (!d.rep) {
    host.append(head, el("p", { class: "lede", id: "ck-none", text: tr(pick ? "Choose a sales rep to see their dates, who to contact and follow-ups."
      : "The cockpit is for sales reps and their managers. This login has no clients of its own.") }));
    return;
  }
  host.setAttribute("aria-busy", k.loading ? "true" : "false");
  host.append(head, ckKpis(d, own), el("div", { class: "ck-grid" }, [ckDates(d), ckContact(d), ckFollow(d), ckMissed(d), ckClients(d, own)]));

const MQ_PHONE = window.matchMedia("(max-width: 720px)");
const MQ_TOUCH = window.matchMedia("(pointer: coarse)");
const MQ_SPLIT = window.matchMedia("(min-width: 1000px) and (pointer: coarse)");
const isPhone = () => MQ_PHONE.matches;
const isTouch = () => MQ_TOUCH.matches;
const isSplit = () => MQ_SPLIT.matches;
// Per-device conveniences only; the page works the same if storage is blocked.
function pref(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, String(val));
  } catch (e) { /* storage blocked: keep the in-memory value */ }
  return null;
}
const REF_RE = /^(DLD|PRS)-\d{3,4}$/;
Object.assign(S, {
  navOpen: false,
  ov: [],                 // overlays that own a step in the browser history, oldest first
  afterPop: null,         // run once the history has caught up with a close
  discreet: pref("crm_discreet") === "1",
  countsOpen: pref("crm_counts") === "1",
  cardTab: null, purBrand: "", purView: "brand",
  recent: (() => {
    try { const r = JSON.parse(pref("crm_recent") || "[]"); return Array.isArray(r) ? r.filter((x) => REF_RE.test(x)).slice(0, 8) : []; }
    catch (e) { return []; }
  })(),
  recentRows: null,
});

/* ------------------------------------------------------------------ history */
// Each overlay (card, edit form, menu) pushes one history step. Closing it
// from the page steps back; the back button steps back and the page follows.
const baseUrl = () => location.pathname + location.search;
function pushOverlay(name, url) {
  S.ov.push(name);
  try { history.pushState({ crm: name, depth: S.ov.length }, "", url || location.href); } catch (e) { /* ignore */ }
}
// Close `name` and everything opened after it. `then` runs once the history
// has moved (or at once if there was nothing to step back over).
function popOverlay(name, then) {
  const i = S.ov.indexOf(name);
  if (i < 0) { if (then) then(); return false; }
  const n = S.ov.length - i;
  S.ov.length = i;
  S.afterPop = then || null;
  history.go(-n);
  return true;
}
function syncFromHistory() {
  if (S.locked) { S.ov = []; return; }
  const depth = (history.state && history.state.depth) || 0;
  const closing = S.ov.slice(depth);
  if (S.ov.length > depth) S.ov.length = depth;
  if (closing.includes("add") && S.add) closeAddClient(true);
  if (closing.includes("export") && S.exp) closeExport(true);
  if (closing.includes("edit") && S.edit) { S.edit = null; S.formError = null; if (S.cardId) renderDrawer(); }
  if (closing.includes("menu") && S.navOpen) closeNav(true);
  // A close the page asked for may have more to do once history has moved
  // (switch view, rename the card's address after a merge) — before the
  // address is read below.
  if (S.afterPop) { const f = S.afterPop; S.afterPop = null; f(); }
  const m = /^#((?:DLD|PRS)-\d{3,4})$/.exec(location.hash);
  if (m && m[1] !== S.cardId) openCard(m[1], "none");
  else if (!m && S.cardId) closeCard(true);
}
window.addEventListener("popstate", syncFromHistory);
window.addEventListener("hashchange", () => { if (!S.locked) syncFromHistory(); });
// Links to another card (duplicates, merges, the refresh review) open it as a
// new step, so back returns to the card before.
document.addEventListener("click", (e) => {
  const a = e.target.closest && e.target.closest('a[href^="#DLD-"], a[href^="#PRS-"]');
  if (!a || S.locked || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const id = a.getAttribute("href").slice(1);
  if (!REF_RE.test(id)) return;
  e.preventDefault();
  if (id !== S.cardId) openCard(id, "push");
});
// Deep link (…/crm/#DLD-0003): the card opens on top of the list, so back
// closes it rather than leaving the page.
function openFromHash() {
  const m = /^#((?:DLD|PRS)-\d{3,4})$/.exec(location.hash);
  if (!m || S.locked || m[1] === S.cardId) return;
  try { history.replaceState(null, "", baseUrl()); } catch (e) { /* ignore */ }
  openCard(m[1], "push");
}

// A swipe in from the left edge opens the menu, a swipe left closes it. The
// ☰ button is always there too: a gesture is never the only way in.
(function edgeSwipe() {
  const EDGE = 24, MIN = 60, DRIFT = 60;
  let x0 = null, y0 = null, mode = null;
  document.addEventListener("touchstart", (e) => {
    if (!isPhone() || S.locked || S.cardId || e.touches.length !== 1) { mode = null; return; }
    const t = e.touches[0];
    if (S.navOpen) { x0 = t.clientX; y0 = t.clientY; mode = "close"; }
    else if (t.clientX <= EDGE) { x0 = t.clientX; y0 = t.clientY; mode = "open"; }
    else mode = null;
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (!mode || x0 === null) { mode = null; return; }
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = Math.abs(t.clientY - y0);
    if (dy < DRIFT) {
      if (mode === "open" && dx > MIN) openNav();
      if (mode === "close" && dx < -MIN) closeNav();
    }
    mode = null; x0 = null;
  }, { passive: true });
})();

function nextBirthday(iso) {
  if (!iso) return null;
  const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number);
  if (!m || !d) return null;
  const now = new Date(), today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  let yr = now.getFullYear();
  const at = (yy) => { const leap = (yy % 4 === 0 && yy % 100 !== 0) || yy % 400 === 0; return Date.UTC(yy, m - 1, m === 2 && d === 29 && !leap ? 28 : d); };
  let t = at(yr);
  if (t < today) t = at(++yr);
  return Math.round((t - today) / 86400000);
}

/* ===================================================== step 4: the clean-up */

const SHEET_KINDS = ["field", "park", "delete", "merge", "lookup", "owner", "contact", "note"];
const FULL_KINDS = ["delete", "merge", "lookup"];
function sheetMode() { return !!(S.edit && SHEET_KINDS.includes(S.edit.kind) && isPhone()); }

// Walking the list from the card. The position is the card's place in the
// list as it is filtered and sorted now; when a save takes the record out of
// the list (it no longer needs a decision), the next one has slid into its
// place, so Next opens that one.
Object.assign(S, { walkIdx: null, walkId: null });
function walkInfo() {
  if (!S.cardId || !S.rows || (!S.rows.length && !S.total)) return null;
  const i = S.rows.findIndex((r) => r.client_id === S.cardId);
  if (i >= 0) { S.walkIdx = S.f.offset + i; S.walkId = S.cardId; return { idx: S.walkIdx, here: true }; }
  if (S.walkId === S.cardId && S.walkIdx !== null) {
    // Not on the page shown: if its place is on another page it is still in
    // the list (the pager moved); if its place is on this page, it has left.
    const onPage = S.walkIdx >= S.f.offset && S.walkIdx < S.f.offset + S.rows.length;
    return { idx: S.walkIdx, here: !onPage };
  }
  return null;
}
function walkTargets(w) {
  return { prev: w.idx - 1, next: w.here ? w.idx + 1 : w.idx };
}
async function walkTo(dir) {
  if (S.busy || S.edit) return;
  const w = walkInfo(); if (!w) return;
  const t = dir < 0 ? walkTargets(w).prev : walkTargets(w).next;
  if (t < 0 || t >= S.total) return;
  if (t < S.f.offset || t >= S.f.offset + S.rows.length) {     // the next page of the list
    S.f.offset = Math.floor(t / PAGE) * PAGE;
    await loadList();
  }
  const r = S.rows[t - S.f.offset];
  if (!r) return;
  S.walkIdx = t; S.walkId = r.client_id;
  await openCard(r.client_id, "replace");
  // Keep the thumb (and keyboard focus) where it was: on Next, or on Previous.
  const same = $(dir > 0 ? "#drawer .walk-next" : "#drawer .walk-prev");
  const other = $(dir > 0 ? "#drawer .walk-prev" : "#drawer .walk-next");
  const f = same && !same.disabled ? same : other && !other.disabled ? other : null;
  if (f) f.focus();
}
function walkEyebrow() {
  if (S.cardTab !== "cleanup") return "";
  const w = walkInfo();
  return w && w.here ? " · " + tr("{n} of {total}", { n: w.idx + 1, total: S.total }) : "";
}
function eyebrowText(c) {
  return S.cardId + (c ? " · " + (c.record_type === "prospect" ? tr("Prospect") : tr("Client")) : "") + walkEyebrow();
}
// The list reloads behind the card after every save; the foot and the
// position follow it without redrawing the card.
function refreshWalk() {
  const d = $("#drawer");
  if (!d || !S.cardId || !S.card || S.edit) return;
  const old = d.querySelector(".drawer-foot");
  const focusCls = old && old.contains(document.activeElement) ? [...document.activeElement.classList].find((k) => k.startsWith("walk-") || k === "add-note") : null;
  const nf = cardFoot(S.card);
  if (old && nf) old.replaceWith(nf); else if (old) old.remove();
  else if (nf) { const body = d.querySelector(".drawer-body"); if (body) body.after(nf); }
  const eb = d.querySelector(".drawer-head .eyebrow"); if (eb) eb.textContent = eyebrowText(S.card.client);
  if (focusCls) { const f = d.querySelector(".drawer-foot ." + focusCls + ":not([disabled])") || d.querySelector(".drawer-foot .walk-next:not([disabled])"); if (f) f.focus(); }
}
const chev = (d) => el("span", { "aria-hidden": "true", class: "chev", text: d < 0 ? "‹" : "›" });
function cardFoot(data) {
  const c = data.client;
  if (S.edit) return null;                          // one action at a time: an open form hides the foot
  const w = S.cardTab === "cleanup" ? walkInfo() : null;
  if (w) {
    const t = walkTargets(w);
    const nConf = ["name", "phone", "gender", "dob"].filter((f) => c[f + "_flag"] === "conflict").length;
    const canCheck = isTouch() && editable(c) && c.record_state === "open" && nConf === 0;
    const pos = w.here ? tr("{n} of {total}", { n: w.idx + 1, total: S.total }) : tr("Done · {n} left", { n: S.total });
    const noNext = t.next >= S.total;
    return el("div", { class: "drawer-foot walk" }, [
      el("button", { class: "btn subtle walk-prev", type: "button", "aria-label": tr("Previous record"), title: tr("Previous record") + " (K)",
        disabled: S.busy || t.prev < 0 ? true : null, onclick: () => walkTo(-1) }, [chev(-1)]),
      canCheck
        ? el("button", { class: "btn primary walk-check", type: "button", disabled: S.busy ? true : null,
            onclick: () => act("set_state", { state: "confirmed" }, tr("Marked as checked.")) }, [el("span", { "aria-hidden": "true", text: "✓ " }), tr("Mark checked")])
        : el("span", { class: "walk-pos", "aria-live": "polite", text: noNext && w.here ? pos + " · " + tr("Last in this list") : pos }),
      el("button", { class: "btn walk-next" + (canCheck ? "" : " primary"), type: "button", "aria-label": tr("Next record"), title: tr("Next record") + " (J)",
        disabled: S.busy || noNext ? true : null, onclick: () => walkTo(1) }, [el("span", { class: "wl", text: tr("Next") }), chev(1)]),
    ]);
  }
  const canNote = editable(c) || (canEdit() && c.record_state !== "merged");
  if (!canNote) return null;
  return el("div", { class: "drawer-foot" }, [
    editable(c) ? el("button", { class: "btn log-contact", type: "button", disabled: S.busy ? true : null, onclick: logContactFromFoot }, [
      el("span", { "aria-hidden": "true", text: "+" }), tr("Log contact")]) : null,
    el("button", { class: "btn primary add-note", type: "button", disabled: S.busy ? true : null, onclick: addNoteFromFoot }, [
      el("span", { "aria-hidden": "true", text: "+" }), tr("Add note")]),
  ]);
}
// On a desktop the same walk is on the keyboard, as in a mail reader: J for
// the next record, K for the previous (not Alt+arrows: those are the browser's
// own back and forward).
document.addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey || !S.cardId || S.edit || S.cardTab !== "cleanup") return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  if (e.key === "j" || e.key === "J" || e.key === "о" || e.key === "О") { e.preventDefault(); walkTo(1); }
  else if (e.key === "k" || e.key === "K" || e.key === "л" || e.key === "Л") { e.preventDefault(); walkTo(-1); }
});

// iPhone keyboards cover a fixed panel rather than resizing the page, so the
// panel is lifted by the keyboard's height. (Android resizes the page itself:
// see interactive-widget in the viewport tag.)
(function keyboardLift() {
  const vv = window.visualViewport;
  if (!vv) return;
  const set = () => {
    const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    document.documentElement.style.setProperty("--kb", kb + "px");
  };
  vv.addEventListener("resize", set); vv.addEventListener("scroll", set);
})();

/* ========================================= step 5: Insights and Data, phone */
// A table of four columns or more becomes, on a phone, one small card per row:
// the row's name on top, each figure labelled underneath. The page builds the
// same table for every screen; this only adds the labels and the roles (a
// table laid out as blocks loses its table semantics otherwise). Two- and
// three-column tables stay tables: they fit.
function stackTables(root) {
  if (!root) return;
  root.querySelectorAll(".tbl-scroll > table").forEach((t) => {
    // The heat grid is a matrix, and the priority lists have their own phone layout.
    if (t.classList.contains("heatgrid") || t.classList.contains("plays") || t.classList.contains("stack")) return;
    const head = t.tHead && t.tHead.rows[0];
    if (!head || head.cells.length < 4) return;
    const labels = [...head.cells].map((c) => c.textContent.trim());
    // The row's name: the client in the birthday list, the first column elsewhere.
    const titleCol = t.classList.contains("bdays") ? 1 : 0;
    t.classList.add("stack");
    t.parentElement.classList.add("stacked");
    t.setAttribute("role", "table");
    t.querySelectorAll("thead, tbody, tfoot").forEach((g) => g.setAttribute("role", "rowgroup"));
    [...t.rows].forEach((r) => {
      r.setAttribute("role", "row");
      const inHead = r.parentElement.tagName === "THEAD";
      [...r.cells].forEach((c, i) => {
        if (inHead) { c.setAttribute("role", "columnheader"); return; }
        c.setAttribute("role", c.tagName === "TH" ? "rowheader" : "cell");
        if (i === titleCol) c.classList.add("st-title");
        else c.dataset.label = labels[i] || "";
      });
    });
  });
}

/* =========================================== step 6: home screen, idle lock */
// Idle lock on phones and iPads (Alex, 22 Sept: 15 minutes, passcode again;
// the session itself stays at 8 hours). Time in the background counts as
// idle: a phone put down on the counter locks. The moment of last use is kept
// on the device so that an app closed and reopened later asks again too; it
// is a time, nothing about any client. The desktop is unchanged.
const IDLE_MIN = 15;
const IDLE_KEY = "crm_last_active";
const idleApplies = () => isTouch();
let lastActive = Date.now(), lastSaved = 0;
function markActive() {
  lastActive = Date.now();
  if (!S.locked && lastActive - lastSaved > 20000) { lastSaved = lastActive; pref(IDLE_KEY, String(lastActive)); }
}
function activeNow() { lastActive = lastSaved = Date.now(); pref(IDLE_KEY, String(lastActive)); }
["pointerdown", "keydown", "touchstart", "wheel", "input"].forEach((ev) =>
  window.addEventListener(ev, markActive, { passive: true, capture: true }));
function idleLock() {
  pref(IDLE_KEY, null);
  lockDown(tr("Locked after {n} minutes without use.", { n: IDLE_MIN }));
}
function idleCheck() {
  if (S.locked || !S.session || !idleApplies()) return;
  if (Date.now() - lastActive >= IDLE_MIN * 60000) idleLock();
}
setInterval(idleCheck, 30000);
// Called by boot before a stored session is used.
function idleExpiredOnOpen() {
  if (!idleApplies()) return false;
  const t = Number(pref(IDLE_KEY) || 0);
  return !!t && Date.now() - t >= IDLE_MIN * 60000;
}

// Back from the background: lock if it was long enough; otherwise, after five
// minutes away, refresh quietly so what is on screen is current.
let hiddenAt = null;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { hiddenAt = Date.now(); if (!S.locked) pref(IDLE_KEY, String(lastActive)); return; }
  const away = hiddenAt ? Date.now() - hiddenAt : 0;
  hiddenAt = null;
  idleCheck();
  if (!S.locked && away >= 5 * 60000) quietRefresh();
});
window.addEventListener("pageshow", (e) => { if (e.persisted) idleCheck(); });

// Everything the screen shows, fetched again; the open card too unless a form
// is open on it.
async function quietRefresh() {
  if (S.locked || !S.session) return;
  refreshBehind();
  if (S.cardId && !S.edit && !S.busy) {
    const id = S.cardId;
    try { const data = await call("client", { id }); if (S.cardId === id && !S.edit) { S.card = data; renderDrawer(); } } catch (e) { /* the banner says why */ }
  }
}

// No connection: the page says so, rather than passing old figures off as
// current. Nothing is cached for offline use; when the connection is back the
// screen reloads what it shows.
Object.assign(S, { offline: false });
function renderNet() {
  let n = $("#net");
  if (!n) { n = el("div", { id: "net", class: "net-banner", role: "status", "aria-live": "polite" }); document.body.prepend(n); }
  n.textContent = S.offline ? tr("No connection — what you see may be out of date.") : "";
  document.body.classList.toggle("offline", S.offline);
}
function netDown() { if (!S.offline) { S.offline = true; renderNet(); } }
function netUp() {
  if (!S.offline) return;
  S.offline = false; renderNet();
  toast(tr("Connection is back."));
  if (S.locked && S.session) { if (!S.booting) resumeSession(); return; }
  quietRefresh();
}

// A session kept on the device while the connection was down at start.
async function resumeSession() {
  try { await loadAll(); S.locked = false; activeNow(); renderAll(); openFromHash(); }
  catch (e) { if (e.status) { S.session = null; store(SESSION_KEY, ""); renderAll(); } }
}

/* -------------------------------------------------------------- vocabulary */
const MISSED_KIND = {
  not_carried: "Asked for a brand we don't carry",
  not_in_stock: "Not in stock",
  awaiting: "Waiting for a delivery",
  order_request: "Asked to order",
  late_reply: "Reply took more than a day",
};
const MISSED_STATUS = {
  open: { label: "Open", glyph: "•", tone: "warning" },
  followed_up: { label: "Followed up", glyph: "✓", tone: "good" },
  closed: { label: "Closed", glyph: "–", tone: "" },
};
const MISSED_KIND_SHORT = { ...MISSED_KIND, not_carried: "Brand we don't carry" };
const missedKindLabel = (m) => m.kind === "late_reply" && m.answered === false ? tr("Not answered") : tr(MISSED_KIND[m.kind] || m.kind);

/* ------------------------------------------------------------------ helpers */
const tgData = (data) => (data && data.telegram) || { chats: [], suggested: [], missed: [] };
const tgChat = (data) => tgData(data).chats[0] || null;
const isTgLead = (data) => !!(data && data.queue && data.queue.review_status === "lead");
const openMissed = (data) => tgData(data).missed.filter((m) => m.status === "open");
function sourceLineTg(r) {
  if (!r.in_telegram) return null;
  return r.in_colibri || r.in_marketing ? "Telegram" : tr("Telegram only");   // a chat exists; the other sources are no longer named
}
function replyTime(min) {
  const m = Number(min);
  if (!Number.isFinite(m)) return "";
  if (m < 60) return tr("{n} min", { n: Math.max(1, Math.round(m)) });
  if (m < 2880) return tr("{n} h", { n: Math.round(m / 60) });
  return tr("{n} days", { n: Math.round(m / 1440) });
}
const tgName = (ch) => blank(ch.display_name) || ch.display_name === "(no name)" ? tr("Unnamed chat") : ch.display_name;

/* ------------------------------------------------------ card: at a glance */
// Facts for the glance: in Telegram, when they last wrote, open missed requests.
function tgGlanceFacts(data) {
  const out = [];
  const ch = tgChat(data);
  if (ch) {
    const last = ch.last_client_message || ch.last_contact;
    out.push(fact(tr("Telegram"), "✓ " + (last ? tr("Client last wrote {d}", { d: fmtDate(last) }) : tr("In Telegram")),
      ch.last_contact ? tr("chat last active {d}", { d: fmtDate(ch.last_contact) }) : null));
  }
  const open = openMissed(data);
  if (open.length) {
    out.push(el("div", { class: "fact" }, [el("dt", { text: tr("Missed requests") }), el("dd", {}, [
      el("span", { text: tr("{n} open", { n: open.length }) + " " }),
      el("button", { type: "button", class: "linkish", onclick: () => setCardTab("purchases"), text: tr("Show") })])]));
  }
  return out;
}
function tgGlanceNote(data) {
  if (!isTgLead(data)) return null;
  const ch = tgChat(data);
  return el("p", { class: "muted glance-note", text: tr("A lead from the boutique's Telegram: in neither Colibri nor the questionnaire yet.") +
    (ch && ch.purchase_signal ? " " + tr("The chat suggests they have bought before, but no purchase matches in Colibri.") : "") });
}

/* ---------------------------------------------------- card: overview block */
function sectionTelegram(data) {
  const t = tgData(data), ch = t.chats[0], c = data.client;
  if (!ch) {
    if (t.suggested.length && !recordClosed(c)) {
      return el("section", { class: "drawer-section" }, [el("h3", { text: tr("Telegram") }),
        el("p", { class: "note" }, [tr("A Telegram chat may belong to this client. See Clean-up.") + " ",
          el("button", { type: "button", class: "linkish", onclick: () => setCardTab("cleanup"), text: tr("Clean-up") })])]);
    }
    return null;
  }
  const n = (v) => Number(v || 0);
  const how = ch.link_status === "phone" ? tr("Linked by the phone number.")
    : ch.link_status === "lead" ? tr("Created from this chat.")
    : ch.link_status === "confirmed" ? tr("Confirmed by {by}, {d}.", { by: who(ch.decided_by) || "—", d: fmtDate(ch.decided_at) }) : "";
  const msgs = tr("{c} from the client · {b} from the boutique", { c: n(ch.messages_from_client), b: n(ch.messages_from_boutique) });
  const q = [String(n(ch.inquiries)),
    n(ch.replies_over_24h) ? tr("{n} answered after more than a day", { n: n(ch.replies_over_24h) }) : null,
    n(ch.never_answered) ? tr("{n} never answered", { n: n(ch.never_answered) }) : null].filter(Boolean).join(" · ");
  const kids = [
    el("h3", {}, [tr("Telegram"), el("span", { class: "aside", text: tr("summary of {d}", { d: fmtDate(ch.as_of) }) })]),
    el("dl", { class: "kv" }, [
      kv(tr("Segment in the chat summary"), blank(ch.segment) ? null : tr(ch.segment)),
      kv(tr("Language"), blank(ch.language) ? null : tr(ch.language)),
      kv(tr("First contact"), ch.first_contact ? fmtDate(ch.first_contact) : null),
      kv(tr("Client last wrote"), ch.last_client_message ? fmtDate(ch.last_client_message) : null),
      kv(tr("Last message in the chat"), ch.last_contact ? fmtDate(ch.last_contact) : null),
      kv(tr("Messages"), msgs),
      kv(tr("Questions asked"), q),
      kv(tr("Mailings received"), String(n(ch.broadcasts_received))),
      (ch.interest_brands || []).length ? kv(tr("Brands mentioned"), ch.interest_brands.join(", ")) : null,
      ch.max_discount_pct ? kv(tr("Largest discount offered"), Math.round(Number(ch.max_discount_pct) * 10) / 10 + "%") : null,
      (ch.flags || []).length ? kv(tr("Noted in the chat"), ch.flags.map((f) => tr(f)).join(", ")) : null,
      ch.phone ? kv(tr("Phone in the chat"), fmtPhone(ch.phone)) : null,
    ]),
  ];
  if (!blank(ch.last_client_excerpt)) {
    kids.push(el("div", { class: "tg-quote" }, [el("span", { class: "muted", text: tr("Last message from the client") + ": " }),
      el("q", { text: ch.last_client_excerpt })]));
  }
  if (how) kids.push(el("p", { class: "note", text: how }));
  return el("section", { class: "drawer-section tg" }, kids);
}

/* ---------------------------------------------- card: clean-up suggestion */
function tgBasisText(s) {
  if (s.match_basis === "phone_shared") {
    return (s.also_suggested_for || []).length ? tr("Same phone number as this record and as {ids}.", { ids: s.also_suggested_for.join(", ") })
      : tr("Same phone number as this record.");
  }
  if (s.match_basis === "pos_name") return tr("Same name as a buyer at the till.");
  return tr("A similar name in Telegram.");
}
function sectionTgSuggest(data) {
  const c = data.client, sugg = tgData(data).suggested;
  if (!sugg.length || recordClosed(c)) return null;
  const hasPhone = c.phone_flag && c.phone_flag !== "none" || c.phone_in_telegram;
  const kids = [el("h3", { text: tr("Telegram chat to confirm") }),
    el("p", { class: "hint", text: tr("The boutique's Telegram has a chat that may be this client. Link it only if you are sure: the chat's details and requests then join this record.") })];
  for (const s of sugg) {
    const n = (v) => Number(v || 0);
    const lines = [
      [s.segment ? tr(s.segment) : null, s.last_client_message ? tr("Client last wrote {d}", { d: fmtDate(s.last_client_message) }) : null,
        tr("{c} from the client · {b} from the boutique", { c: n(s.messages_from_client), b: n(s.messages_from_boutique) })].filter(Boolean).join(" · "),
      s.pos_items ? tr("Till: {n} items, last {d}", { n: s.pos_items, d: fmtDate(s.last_pos_purchase) }) +
        ((s.pos_brands || []).length ? " · " + s.pos_brands.join(", ") : "") + (s.pos_revenue_uzs ? " · " + fmtUZS(s.pos_revenue_uzs) : "") : null,
      s.missed_requests ? tr("{n} would move to this record.", { n: pl(s.missed_requests, "request") }) : null,
      s.phone && !hasPhone ? tr("Brings a phone number: {p}.", { p: fmtPhone(s.phone) }) : s.phone ? tr("Phone number in the chat: {p}", { p: fmtPhone(s.phone) }) : null,
    ].filter(Boolean);
    const confirming = S.tgConfirm === s.ref;
    kids.push(el("div", { class: "dup", "data-chat": String(s.ref) }, [
      el("p", { class: "hint", text: tgBasisText(s) }),
      el("div", { class: "dup-card" }, [
        el("div", {}, [el("b", { text: tgName(s) }), " · Telegram"]),
        ...lines.map((l) => el("div", { class: "muted", text: l })),
        !blank(s.last_client_excerpt) ? el("div", { class: "tg-quote" }, [el("q", { text: s.last_client_excerpt })]) : null,
      ]),
      !editable(c) ? null : confirming
        ? el("div", { class: "actions confirm-row" }, [
            el("span", { text: tr("Link this chat to {id}?", { id: c.client_id }) }),
            el("button", { class: "btn sm", type: "button", disabled: S.busy ? true : null, "data-act": "tg-yes",
              onclick: () => { S.tgConfirm = null; act("telegram_link", { chat: s.ref }, tr("Telegram chat linked.")); }, text: tr("Yes, link") }),
            el("button", { class: "btn sm subtle", type: "button", disabled: S.busy ? true : null,
              onclick: () => { S.tgConfirm = null; renderDrawer(); }, text: tr("Cancel") }),
          ])
        : el("div", { class: "actions" }, [
            el("button", { class: "btn sm", type: "button", disabled: S.busy ? true : null, "data-act": "tg-link",
              onclick: () => { S.tgConfirm = s.ref; renderDrawer(); const y = $('#drawer [data-act="tg-yes"]'); if (y) y.focus(); }, text: tr("Same client — link") }),
            el("button", { class: "btn sm subtle", type: "button", disabled: S.busy ? true : null, "data-act": "tg-reject",
              onclick: () => act("telegram_reject", { chat: s.ref }, tr("Marked as not this client.")), text: tr("Not this client") }),
          ]),
    ]));
  }
  return el("section", { class: "drawer-section dups flagged tg-sugg" }, kids);
}

function sectionMissed(data) {
  const c = data.client, list = tgData(data).missed;
  if (!list.length) return null;
  const open = list.filter((m) => m.status === "open").length;
  const asOf = (tgChat(data) || {}).as_of || "2026-08-14";
  const can = editable(c);
  const setBtn = (m, status, label, subtle) => el("button", { class: "btn sm" + (subtle ? " subtle" : ""), type: "button",
    disabled: S.busy ? true : null, "data-status": status,
    onclick: () => act("missed_status", { missed: m.id, status }, tr("Saved.")), text: tr(label) });
  return el("section", { class: "drawer-section missed" }, [
    el("h3", {}, [tr("Missed requests"), el("span", { class: "aside", text: tr("{n} open", { n: open }) })]),
    el("p", { class: "note", text: tr("What the client asked for that the boutique could not offer at the time, in the client's own words. From the Telegram summary of {d}.", { d: fmtDate(asOf) }) }),
    el("ul", { class: "lines missed-list" }, list.map((m) => {
      const st = MISSED_STATUS[m.status] || MISSED_STATUS.open;

function tgEventText(e) {
  switch (e.action) {
    case "telegram_linked":
      if (e.new_value === "confirmed") {
        return [el("b", { text: tr("Telegram chat confirmed as this client.") + " " }),
          e.note === "phone_added" ? tr("A phone number from the chat is now on file.") : ""];
      }
      return [el("b", { text: tr("Linked to a Telegram chat by phone number.") })];
    case "telegram_rejected": return [el("b", { text: tr("Suggested Telegram chat: not this client.") })];
    case "created_from_telegram":
      return [el("b", { text: tr("Created from the Telegram chats") + " — " + tr(e.new_value === "chat_buyer" ? "the chat suggests a purchase" : "a lead") + ". " }),
        /^\d{4}-\d\d-\d\d$/.test(String(e.note || "")) ? tr("Client last wrote {d}.", { d: fmtDate(e.note) }) : ""];
    case "missed_demand_set": {
      const [kind, brand] = String(e.note || "").split(":");
      const lab = (s) => tr((MISSED_STATUS[s] || { label: s || "—" }).label);
      return [el("b", { text: tr("Missed request: {a} → {b}", { a: lab(e.old_value), b: lab(e.new_value) }) + ". " }),
        tr(MISSED_KIND[kind] || kind || "") + (brand ? " · " + brand : "")];
    }
    default: return null;
  }
}

/* ------------------------------------------------------------------- phones */
// Numbers arrive as +digits. Nine digits are a local Uzbek number.
function phoneParts(raw) {
  const d = String(raw || "").replace(/\D/g, "");
  if (d.length < 7) return null;
  const digits = d.length === 9 ? "998" + d : d;
  let text = "+" + digits;
  if (/^998\d{9}$/.test(digits)) text = `+998 ${digits.slice(3, 5)} ${digits.slice(5, 8)} ${digits.slice(8, 10)} ${digits.slice(10)}`;
  else if (/^7\d{10}$/.test(digits)) text = `+7 ${digits.slice(1, 4)} ${digits.slice(4, 7)} ${digits.slice(7, 9)} ${digits.slice(9)}`;
  return { digits, e164: "+" + digits, text, callable: digits.length <= 15 };
}
// Discreet mode hides the middle of a number the way it hides amounts.
function phoneShown(p) {
  if (!p) return "";
  if (!S.discreet) return p.text;
  const parts = p.text.split(" ");
  if (parts.length >= 4) return parts.map((x, i) => (i < 2 || i === parts.length - 1 ? x : x.replace(/\d/g, "•"))).join(" ");
  return p.text.slice(0, 4) + p.text.slice(4, -2).replace(/\d/g, "•") + p.text.slice(-2);
}
const fmtPhone = (raw) => { const p = phoneParts(raw); return p ? phoneShown(p) : (blank(raw) ? "" : String(raw)); };
const colibriPhones = (c) => String(c.phone_colibri || "").split(";").map((x) => x.trim()).filter(Boolean);
// Every number the record holds, once each, with where it came from.
function cardPhones(data) {
  const c = data.client, out = [];
  const add = (raw, src) => {
    const p = phoneParts(raw);
    if (!p) return;
    const had = out.find((x) => x.p.digits === p.digits);
    if (had) { if (!had.src.includes(src)) had.src.push(src); } else out.push({ p, src: [src] });
  };
  if (c.phone_confirmed) add(c.phone_confirmed, "confirmed");
  colibriPhones(c).forEach((x) => add(x, "colibri"));
  // v12: on a hand-added record the "questionnaire" side is what the team typed.
  if (c.phone_marketing) add(c.phone_marketing, c.added_by_hand ? "typed" : "marketing");
  if (c.phone_telegram) add(c.phone_telegram, "telegram");
  const ch = tgChat(data);
  if (ch && ch.phone) add(ch.phone, "chat");
  return out;
}
const PHONE_SRC = { confirmed: "confirmed", colibri: "Colibri", marketing: "questionnaire", typed: "typed in by the team", telegram: "Telegram", chat: "Telegram chat" };
function phoneActions(p) {
  if (!p.callable) return null;
  const shown = phoneShown(p);
  return el("div", { class: "ph-acts" }, [
    el("a", { class: "btn sm", href: "tel:" + p.e164, "aria-label": tr("Call {p}", { p: shown }) }, [tr("Call")]),
    el("a", { class: "btn sm subtle", href: "https://t.me/" + p.e164, target: "_blank", rel: "noopener",
      "aria-label": tr("Write to {p} in Telegram", { p: shown }) }, ["Telegram"]),
    el("a", { class: "btn sm subtle", href: "https://wa.me/" + p.digits, target: "_blank", rel: "noopener",
      "aria-label": tr("Write to {p} in WhatsApp", { p: shown }) }, ["WhatsApp"]),
  ]);
}

  const list = cardPhones(data).slice(0, 4);

  return el("div", { class: "fact wide phones" }, [el("dt", { text: tr("Phone") }), el("dd", {}, list.map(({ p, src }, i) =>
    el("div", { class: "ph-row" + (i ? " more" : ""), "data-phone": p.digits }, [

// STORE only: no compression, so no deflate to write or to get wrong.
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
function dosTime(d) {
  const t = ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() / 2) & 31);
  const dt = (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);
  return { t, dt };
}
// files: [{ name, text }] — the parts of the workbook, in the order they go in.
function zipStore(files) {
  const enc = new TextEncoder();
  const now = new Date();
  const { t, dt } = dosTime(now);
  const parts = files.map((f) => {
    const name = enc.encode(f.name);
    const data = enc.encode(f.text);
    return { name, data, crc: crc32(data) };
  });
  let size = 0;
  for (const p of parts) size += 30 + p.name.length + p.data.length + 46 + p.name.length;
  size += 22;
  const out = new Uint8Array(size);
  const view = new DataView(out.buffer);
  let off = 0;
  const offsets = [];
  for (const p of parts) {
    offsets.push(off);
    view.setUint32(off, 0x04034b50, true);
    view.setUint16(off + 4, 20, true);
    view.setUint16(off + 6, 0x0800, true);       // names are UTF-8
    view.setUint16(off + 8, 0, true);            // stored
    view.setUint16(off + 10, t, true);
    view.setUint16(off + 12, dt, true);
    view.setUint32(off + 14, p.crc, true);
    view.setUint32(off + 18, p.data.length, true);
    view.setUint32(off + 22, p.data.length, true);
    view.setUint16(off + 26, p.name.length, true);
    view.setUint16(off + 28, 0, true);
    out.set(p.name, off + 30);
    out.set(p.data, off + 30 + p.name.length);
    off += 30 + p.name.length + p.data.length;
  }
  const dirStart = off;
  parts.forEach((p, i) => {
    view.setUint32(off, 0x02014b50, true);
    view.setUint16(off + 4, 20, true);
    view.setUint16(off + 6, 20, true);
    view.setUint16(off + 8, 0x0800, true);
    view.setUint16(off + 10, 0, true);
    view.setUint16(off + 12, t, true);
    view.setUint16(off + 14, dt, true);
    view.setUint32(off + 16, p.crc, true);
    view.setUint32(off + 20, p.data.length, true);
    view.setUint32(off + 24, p.data.length, true);
    view.setUint16(off + 28, p.name.length, true);
    view.setUint16(off + 30, 0, true);
    view.setUint16(off + 32, 0, true);
    view.setUint16(off + 34, 0, true);
    view.setUint16(off + 36, 0, true);
    view.setUint32(off + 38, 0, true);
    view.setUint32(off + 42, offsets[i], true);
    out.set(p.name, off + 46);
    off += 46 + p.name.length;
  });
  view.setUint32(off, 0x06054b50, true);
  view.setUint16(off + 4, 0, true);
  view.setUint16(off + 6, 0, true);
  view.setUint16(off + 8, parts.length, true);
  view.setUint16(off + 10, parts.length, true);
  view.setUint32(off + 12, dirStart ? off - dirStart : 0, true);
  view.setUint32(off + 16, dirStart, true);
  view.setUint16(off + 20, 0, true);
  return out;
}

/* -------------------------------------------------------------- a workbook */
const xmlEsc = (v) => String(v == null ? "" : v)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/\u0000-\u0008|\u000b|\u000c|\u000e-\u001f/g, "");
// 1 → A, 27 → AA
function colRef(n) {
  let s = "";
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; }
  return s;
}
// Excel counts days from 30 December 1899.
const XL_EPOCH = Date.UTC(1899, 11, 30);
function xlDate(v) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v || ""));
  if (!m) return null;
  return (Date.UTC(+m[1], +m[2] - 1, +m[3]) - XL_EPOCH) / 86400000;
}
// A column: { label, width, type } where type is text (default), num or date.
function sheetXml(cols, rows, opts) {
  const o = opts || {};
  const last = colRef(cols.length);
  const lines = [];
  lines.push('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>');
  lines.push('<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">');
  lines.push(`<dimension ref="A1:${last}${Math.max(rows.length + 1, 1)}"/>`);
  lines.push('<sheetViews><sheetView workbookViewId="0">' +
    (o.freeze === false ? "" : '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>') +
    "</sheetView></sheetViews>");
  lines.push('<sheetFormatPr defaultRowHeight="15"/>');
  lines.push("<cols>" + cols.map((c, i) =>
    `<col min="${i + 1}" max="${i + 1}" width="${c.width || 14}" customWidth="1"/>`).join("") + "</cols>");
  lines.push("<sheetData>");
  // the heading row
  lines.push('<row r="1">' + cols.map((c, i) =>
    `<c r="${colRef(i + 1)}1" t="inlineStr" s="1"><is><t xml:space="preserve">${xmlEsc(c.label)}</t></is></c>`).join("") + "</row>");
  rows.forEach((row, ri) => {
    const r = ri + 2;
    const cells = [];
    row.forEach((v, ci) => {
      if (v === null || v === undefined || v === "") return;
      const ref = colRef(ci + 1) + r;
      const type = cols[ci] ? cols[ci].type : "text";
      if (type === "num" && typeof v === "number" && isFinite(v)) cells.push(`<c r="${ref}" s="3"><v>${v}</v></c>`);
      else if (type === "date") {
        const d = xlDate(v);
        if (d === null) cells.push(`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`);
        else cells.push(`<c r="${ref}" s="2"><v>${d}</v></c>`);
      } else cells.push(`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`);
    });
    lines.push(`<row r="${r}">` + cells.join("") + "</row>");
  });
  lines.push("</sheetData>");
  if (o.filter !== false && rows.length) lines.push(`<autoFilter ref="A1:${last}${rows.length + 1}"/>`);
  lines.push("</worksheet>");
  return lines.join("");
}
const STYLES_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
  '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +

  '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +

  '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
  '<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +

// sheets: [{ name, cols, rows, freeze, filter }]
function workbookBytes(sheets) {
  const files = [
    { name: "[Content_Types].xml", text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ` +
        'ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("") +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      "</Types>" },
    { name: "_rels/.rels", text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      "</Relationships>" },
    { name: "xl/workbook.xml", text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      sheets.map((s, i) => `<sheet name="${xmlEsc(String(s.name).slice(0, 31).replace(/[\\/?*\[\]:]/g, " "))}" ` +
        `sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("") +
      "</sheets></workbook>" },
    { name: "xl/_rels/workbook.xml.rels", text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map((s, i) => `<Relationship Id="rId${i + 1}" ` +
        'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" ' +
        `Target="worksheets/sheet${i + 1}.xml"/>`).join("") +
      `<Relationship Id="rId${sheets.length + 1}" ` +
      'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      "</Relationships>" },
    { name: "xl/styles.xml", text: STYLES_XML },
  ];
  sheets.forEach((s, i) => files.push({
    name: `xl/worksheets/sheet${i + 1}.xml`,
    text: sheetXml(s.cols, s.rows, { freeze: s.freeze, filter: s.filter }),
  }));
  return zipStore(files);
}
// Hand the file to the browser. Safari on an iPhone opens it in its own viewer
// rather than saving it quietly; that is the browser's business, not ours.
function saveWorkbook(bytes, filename) {
  const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
}

// What the file is called. "Delardi_clients_cannot-lose_2026-10-15.xlsx"
function exportFilename(meta) {
  const today = (meta && meta.exported_at ? new Date(meta.exported_at) : new Date());
  const day = [today.getFullYear(), String(today.getMonth() + 1).padStart(2, "0"),
    String(today.getDate()).padStart(2, "0")].join("-");
  const slug = String(S.exp && S.exp.name ? S.exp.name : describeFilters().replace(/^·\s*/, ""))
    .toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, "").slice(0, 40);

async function runExport() {
  if (!S.exp || S.exp.busy) return;
  S.exp.busy = true; S.exp.err = null; renderExport();
  try {
    const base = S.exp.params ? { ...S.exp.params } : listParams();
    delete base.limit; delete base.offset;
    const data = await call("export", { ...base, kind: S.exp.kind, phones: S.exp.phones });
    const cols = EXPORT_COLS().filter((c) => (S.exp.phones ? true : !c.phone));
    const rows = (data.rows || []).map((r) => cols.map((c) => c.get(r)));
    const scope = S.exp.title || describeFilters().replace(/^·\s*/, "");
    const bytes = workbookBytes([
      { name: tr("Clients"), cols, rows },
      aboutSheet(data, scope),
    ]);
    const filename = exportFilename(data);
    saveWorkbook(bytes, filename);
    S.exp.busy = false;
    closeExport(false, () => toast(tr("Saved: {name}", { name: filename })));
  } catch (e) {
    S.exp.busy = false;
    S.exp.err = e && e.message ? e.message : tr("The file could not be made.");
    renderExport();
  }
}
